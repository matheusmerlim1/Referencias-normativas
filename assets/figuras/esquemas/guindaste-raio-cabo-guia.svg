<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Guindaste — raio de carga, ângulo da lança e cabo-guia">
<title>Guindaste — raio de carga, ângulo da lança e cabo-guia (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Guindaste — raio de carga, ângulo da lança e cabo-guia</text>
<text class="b" x="30" y="62">Guindaste — raio de carga, ângulo da lança e cabo-guia</text>
<rect class="s" x="120" y="380" width="120" height="120"/>
<rect class="w" x="140" y="330" width="80" height="50"/>
<line class="g" x1="200" y1="350" x2="600" y2="140" stroke-width="10"/>
<line class="d" x1="600" y1="140" x2="600" y2="360"/>
<rect class="r" x="560" y="360" width="80" height="60"/>
<path class="h" d="M640,410 Q700,450 760,470"/>
<text class="n" x="770" y="470">cabo-guia</text>
<g id="cota-cabo-guia" class="cota"><line class="e" x1="640" y1="470" x2="640" y2="516"/><line class="e" x1="760" y1="470" x2="760" y2="516"/><line class="d" x1="640" y1="510" x2="760" y2="510" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="700" y="530">comprimento</text></g>
<line class="c" x1="180" y1="300" x2="180" y2="520"/>
<g id="cota-raio" class="cota"><line class="e" x1="180" y1="520" x2="180" y2="566"/><line class="e" x1="600" y1="520" x2="600" y2="566"/><line class="d" x1="180" y1="560" x2="600" y2="560" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="390.0" y="553">raio de carga</text></g>
<line class="e" x1="200" y1="350" x2="330" y2="350"/>
<g id="cota-angulo-lanca" class="cota"><path class="d" d="M310,350 A110,110 0 0,0 297,299" marker-start="url(#a)" marker-end="url(#a)"/><text x="330" y="330">ângulo da lança</text></g>
<rect class="s" x="60" y="500" width="40" height="10"/><rect class="s" x="260" y="500" width="40" height="10"/>
<text class="n" x="50" y="490">patola + mat</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
