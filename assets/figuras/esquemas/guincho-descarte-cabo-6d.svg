<text class="b" x="30.0" y="220.0" text-anchor="start" font-size="13px">Cabo de trabalho: 6 arames rompidos distribuídos em 6 diâmetros, ou 3 numa perna em 6 diâmetros.</text>
<text class="b" x="30.0" y="241.0" text-anchor="start" font-size="13px">Cabo antigiratório: 2 em 6 diâmetros e 4 em 30 diâmetros.</text>
<text x="30.0" y="262.0" text-anchor="start" font-size="13px">• 1 arame externo rompido no contato com a alma que saiu da estrutura;</text>
<text x="30.0" y="283.0" text-anchor="start" font-size="13px">• redução do Ø nominal &gt; 5 %; protrusão da alma; dobra, amassamento, gaiola de passarinho; dano por calor.</text>
<text class="n" x="790" y="352" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
