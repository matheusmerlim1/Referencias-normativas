<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Ensaio de queda (impacto vertical) e estabilidade antes do içamento">
<title>Ensaio de queda (impacto vertical) e estabilidade antes do içamento (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Ensaio de queda (impacto vertical) e estabilidade antes do içamento</text>
<rect x="60" y="330" width="470" height="14" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<g transform="rotate(-8 190 290)"><rect class="sl" x="190" y="180" width="260" height="110"/></g>
<line class="h" x1="190" y1="290" x2="510" y2="290"/>
<g id="cota-inclinacao" class="cota"><path class="d" d="M487.1,248.2 A300,300 0 0,1 490,290" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="534.2" y="270.9">inclinação</text></g>
<g id="cota-desnivel" class="cota"><line class="e" x1="450.5" y1="253.8" x2="481.5" y2="253.8"/><line class="e" x1="450.5" y1="290" x2="481.5" y2="290"/><line class="d" x1="475.5" y1="227.8" x2="475.5" y2="253.8" marker-end="url(#a)"/><line class="d" x1="475.5" y1="316" x2="475.5" y2="290" marker-end="url(#a)"/><line class="d" x1="475.5" y1="253.8" x2="475.5" y2="290"/><text x="487.5" y="228">desnível dos cantos</text></g>
<g id="cota-queda" class="cota"><line class="e" x1="187" y1="290" x2="144" y2="290"/><line class="e" x1="187" y1="330" x2="144" y2="330"/><line class="d" x1="150" y1="264" x2="150" y2="290" marker-end="url(#a)"/><line class="d" x1="150" y1="356" x2="150" y2="330" marker-end="url(#a)"/><line class="d" x1="150" y1="290" x2="150" y2="330"/><text class="en" x="143" y="315">altura de queda</text></g>
<text class="n m" x="300" y="380">o canto mais baixo cai livremente sobre o piso</text>
<g transform="rotate(-20 730 340)"><rect x="610" y="340" width="300" height="12" fill="url(#hach)" stroke="#666" stroke-width="1"/><rect class="sl" x="670" y="220" width="150" height="120"/></g>
<line class="h" x1="590" y1="340" x2="950" y2="340"/>
<g id="cota-tombamento" class="cota"><path class="d" d="M917.9,271.6 A200,200 0 0,1 930,340" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="877.7" y="319">ângulo de tombamento</text></g>
<text class="n m" x="770" y="400">a unidade não pode tombar até esse ângulo</text>
<text class="n" x="20" y="418">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
