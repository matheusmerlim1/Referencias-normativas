<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Torre de resfriamento de tiragem mecânica — célula em corte">
<!--P7A-->
<title>Torre de resfriamento de tiragem mecânica — célula em corte (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Torre de resfriamento de tiragem mecânica — célula em corte</text>
<rect x="150" y="180" width="420" height="300" rx="0" fill="#666" fill-opacity="0.05" stroke="#666" stroke-width="2"/>
<rect x="150" y="480" width="420" height="70" rx="0" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="360" y="520" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bacia de água fria</text>
<rect x="190" y="300" width="340" height="120" rx="0" fill="#666" fill-opacity="0.18" stroke="#666" stroke-width="1.5"/>
<text x="360" y="365" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">enchimento (respingo ou filme)</text>
<line x1="170" y1="260" x2="550" y2="260" stroke="#666" stroke-width="3"/>
<text x="360" y="250" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">distribuição de água quente</text>
<rect x="170" y="200" width="380" height="14" rx="0" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="360" y="195" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eliminador de gotas</text>
<rect x="120" y="150" width="480" height="30" rx="0" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<path d="M290,150 v-60 h140 v60" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/>
<text x="360" y="80" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">difusor (cilindro do ventilador)</text>
<line x1="300" y1="130" x2="420" y2="130" stroke="#666" stroke-width="5"/>
<circle cx="360" cy="130" r="8" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="150" y="450" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">venezianas</text>
<g id="cota-ventilador" class="cota"><line x1="300" y1="110" x2="420" y2="110" stroke="#666" stroke-width="1.2"/><polygon points="300.0,110.0 309.0,113.5 309.0,106.5" fill="#666"/><polygon points="420.0,110.0 411.0,106.5 411.0,113.5" fill="#666"/><text x="360.0" y="104.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø do ventilador</text></g>
<g id="cota-folga-pa" class="cota"><line x1="420" y1="130" x2="430" y2="130" stroke="#666" stroke-width="1.2"/><polygon points="420.0,130.0 429.0,133.5 429.0,126.5" fill="#666"/><polygon points="430.0,130.0 421.0,126.5 421.0,133.5" fill="#666"/><text x="440" y="118" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">folga pá-difusor</text></g>
<g id="cota-altura-enchimento" class="cota"><line x1="140" y1="300" x2="140" y2="420" stroke="#666" stroke-width="1.2"/><polygon points="140.0,300.0 136.5,309.0 143.5,309.0" fill="#666"/><polygon points="140.0,420.0 143.5,411.0 136.5,411.0" fill="#666"/><text x="136" y="290" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura do enchimento</text></g>
<g id="cota-bacia" class="cota"><line x1="600" y1="480" x2="600" y2="550" stroke="#666" stroke-width="1.2"/><polygon points="600.0,480.0 596.5,489.0 603.5,489.0" fill="#666"/><polygon points="600.0,550.0 603.5,541.0 596.5,541.0" fill="#666"/><text x="608" y="520" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">profundidade da bacia</text></g>
<g id="cota-plataforma" class="cota"><line x1="660" y1="150" x2="660" y2="550" stroke="#666" stroke-width="1.2"/><polygon points="660.0,150.0 656.5,159.0 663.5,159.0" fill="#666"/><polygon points="660.0,550.0 663.5,541.0 656.5,541.0" fill="#666"/><text x="668" y="360" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura até a plataforma</text></g>
<g id="cota-entrada-agua" class="cota"><line x1="720" y1="260" x2="720" y2="550" stroke="#666" stroke-width="1.2"/><polygon points="720.0,260.0 716.5,269.0 723.5,269.0" fill="#666"/><polygon points="720.0,550.0 723.5,541.0 716.5,541.0" fill="#666"/><text x="728" y="420" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura da entrada de água quente</text></g>
<line x1="570" y1="260" x2="720" y2="260" stroke="#666" stroke-width="0.8" stroke-dasharray="3 2"/><line x1="570" y1="550" x2="720" y2="550" stroke="#666" stroke-width="0.8" stroke-dasharray="3 2"/><line x1="600" y1="150" x2="660" y2="150" stroke="#666" stroke-width="0.8" stroke-dasharray="3 2"/>
<g id="cota-celula" class="cota"><line x1="150" y1="550" x2="150" y2="580" stroke="#666" stroke-width="1"/><line x1="570" y1="550" x2="570" y2="580" stroke="#666" stroke-width="1"/><line x1="150" y1="580" x2="570" y2="580" stroke="#666" stroke-width="1.2"/><polygon points="150.0,580.0 159.0,583.5 159.0,576.5" fill="#666"/><polygon points="570.0,580.0 561.0,576.5 561.0,583.5" fill="#666"/><text x="360.0" y="574.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">largura da célula</text></g>
<text x="840" y="300" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">contra-fluxo ou fluxo cruzado</text>
<text x="840" y="318" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tiragem forçada ou induzida</text>
<text x="12" y="612" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
