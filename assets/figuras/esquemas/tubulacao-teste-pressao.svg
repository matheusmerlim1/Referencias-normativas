<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-label="Teste de pressão de tubulação — manômetro, patamares e área de exclusão">
<title>Teste de pressão de tubulação — manômetro, patamares e área de exclusão (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Teste de pressão de tubulação — manômetro, patamares e área de exclusão</text>
<text class="b" x="20" y="62">(a) Sistema em teste hidrostático</text>
<path class="p" d="M60,260 L60,140 L300,140 L300,200 L420,200"/>
<rect class="sl" x="420" y="170" width="60" height="90"/>
<text class="n" x="424" y="280">equipamento</text>
<text class="n" x="122" y="112">suspiro no ponto alto</text>
<line class="g" x1="110" y1="140" x2="110" y2="112"/>
<rect class="w" x="104" y="106" width="12" height="8"/>
<line class="g" x1="60" y1="260" x2="60" y2="290"/>
<rect class="w" x="54" y="290" width="12" height="8"/>
<text class="n" x="74" y="300">dreno no ponto baixo</text>
<circle class="s" cx="140" cy="330" r="22"/>
<text class="n" x="118" y="370">bomba de teste</text>
<path class="g" d="M162,330 L250,330 L250,140"/>
<circle class="w" cx="370" cy="100" r="30"/>
<line class="g" x1="370" y1="130" x2="370" y2="140"/>
<line class="g" x1="300" y1="140" x2="370" y2="140"/>
<line class="v" x1="370" y1="100" x2="388" y2="84"/>
<g id="cota-manometro" class="cota"><line class="d" x1="340" y1="58" x2="400" y2="58" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="340" y1="62" x2="340" y2="100"/><line class="e" x1="400" y1="62" x2="400" y2="100"/><text x="408" y="64">Ø do mostrador</text></g>
<text class="n" x="408" y="110">manômetro</text>
<text class="b" x="540" y="62">(b) Patamares de pressão (sem escala)</text>
<line class="g" x1="560" y1="300" x2="560" y2="90" marker-end="url(#a)"/>
<line class="g" x1="560" y1="300" x2="920" y2="300" marker-end="url(#a)"/>
<text class="n" x="860" y="322">tempo</text>
<text class="n" x="550" y="84">pressão</text>
<path class="v" d="M560,300 L600,220 L650,220 L690,140 L770,140 L800,190 L860,190 L900,300"/>
<text class="n" x="608" y="212">inspeção preliminar</text>
<text class="n" x="680" y="130">pressão de teste (pessoal afastado)</text>
<text class="n" x="770" y="182">pressão de projeto: inspeção</text>
<text class="b" x="20" y="410">(c) Área de exclusão no teste pneumático</text>
<circle class="h" cx="260" cy="520" r="90"/>
<path class="p" d="M200,520 L300,520 L300,490"/>
<rect class="sl" x="290" y="474" width="20" height="16"/>
<g id="cota-raio-exclusao" class="cota"><line class="d" x1="260" y1="520" x2="323.63" y2="583.63" marker-end="url(#a)"/><text x="330" y="590">raio mínimo da área de exclusão</text></g>
<text class="n" x="360" y="460">limite da área isolada</text>
<text class="n" x="20" y="638">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
