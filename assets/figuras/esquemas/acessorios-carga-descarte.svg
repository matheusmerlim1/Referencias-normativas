<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Acessórios de movimentação de carga — medidas de descarte">
<title>Acessórios de movimentação de carga — medidas de descarte (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Acessórios de movimentação de carga — medidas de descarte</text>
<text class="b" x="30" y="62">(a) Gancho</text>
<path class="s" d="M150,120 L150,180 Q150,220 120,240 Q60,280 80,340 Q110,400 180,390 Q240,375 240,320 L220,320 Q215,360 180,365 Q130,370 115,330 Q105,290 160,260 Q190,240 190,200 L190,120 z"/>
<circle class="w" cx="170" cy="100" r="22"/><path class="s" d="M150,100 a20,20 0 0,1 40,0 L190,120 L150,120 z" fill-opacity=".2"/>
<g id="cota-gancho-abertura" class="cota"><line class="e" x1="190" y1="310" x2="190" y2="294"/><line class="e" x1="240" y1="310" x2="240" y2="294"/><line class="d" x1="190" y1="300" x2="240" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text x="260" y="296">abertura d</text></g>
<g id="cota-gancho-e" class="cota"><line class="e" x1="80" y1="300" x2="54" y2="300"/><line class="e" x1="80" y1="345" x2="54" y2="345"/><line class="d" x1="60" y1="300" x2="60" y2="345" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="52" y="328">e</text></g>
<g id="cota-gancho-olhal" class="cota"><line class="e" x1="148" y1="80" x2="148" y2="54"/><line class="e" x1="192" y1="80" x2="192" y2="54"/><line class="d" x1="148" y1="60" x2="192" y2="60" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="170.0" y="53">Ø do olhal</text></g>
<g id="cota-gancho-torcao" class="cota"><path class="d" d="M120,420 A60,20 0 0,0 230,420" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="175" y="455">torção</text></g>
<text class="b" x="330" y="62">(b) Manilha</text>
<path class="g" d="M360,140 L360,250 Q360,320 420,320 Q480,320 480,250 L480,140" stroke-width="18"/>
<rect class="s" x="340" y="122" width="160" height="16" rx="8"/>
<g id="cota-manilha-diametro" class="cota"><line class="e" x1="500" y1="122" x2="526" y2="122"/><line class="e" x1="500" y1="138" x2="526" y2="138"/><line class="d" x1="520" y1="122" x2="520" y2="138" marker-start="url(#a)" marker-end="url(#a)"/><text x="528" y="135">Ø pino / corpo</text></g>
<text class="b" x="620" y="62">(c) Soquete e olhal</text>
<path class="s" d="M640,120 L700,120 L690,200 L650,200 z"/><circle class="w" cx="670" cy="140" r="9"/>
<line class="g" x1="670" y1="200" x2="670" y2="380" stroke-width="6"/>
<g id="cota-soquete-pino" class="cota"><line class="e" x1="679" y1="131" x2="721" y2="131"/><line class="e" x1="679" y1="149" x2="721" y2="149"/><line class="d" x1="715" y1="131" x2="715" y2="149" marker-start="url(#a)" marker-end="url(#a)"/><text x="723" y="145">Ø pino</text></g>
<line class="h" x1="640" y1="300" x2="700" y2="300"/>
<g id="cota-soquete-reposicao" class="cota"><line class="e" x1="650" y1="200" x2="624" y2="200"/><line class="e" x1="650" y1="300" x2="624" y2="300"/><line class="d" x1="630" y1="200" x2="630" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="622" y="255">reposição</text></g>
<circle class="g" cx="800" cy="300" r="28" stroke-width="10"/><rect class="s" x="790" y="328" width="20" height="70"/>
<g id="cota-olhal-corpo" class="cota"><line class="e" x1="790" y1="398" x2="790" y2="426"/><line class="e" x1="810" y1="398" x2="810" y2="426"/><line class="d" x1="790" y1="420" x2="810" y2="420" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="800.0" y="413">Ø corpo</text></g>
<text class="n" x="30" y="520">Descarte por desgaste, abertura ou torção além do limite; acessório forjado/fundido não é soldado nem recuperado.</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
