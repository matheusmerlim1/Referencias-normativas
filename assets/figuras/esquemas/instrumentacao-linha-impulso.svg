<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Instrumentação — tomada de impulso, válvula raiz e tubo DE">
<title>Instrumentação — tomada de impulso, válvula raiz e tubo DE (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Instrumentação — tomada de impulso, válvula raiz e tubo DE</text>
<text class="b" x="20" y="62">Tomada, válvula raiz e linha de impulso</text>
<rect class="sl" x="40" y="100" width="120" height="360"/>
<text class="n" x="50" y="480">linha de processo</text>
<rect class="s" x="160" y="250" width="40" height="24"/>
<text class="n" x="150" y="240">tomada de impulso</text>
<polygon class="w" points="200,250 200,274 224,262"/>
<polygon class="w" points="248,250 248,274 224,262"/>
<text class="n" x="196" y="300">válvula raiz</text>
<g id="cota-linha-impulso" class="cota"><path class="p" d="M248,262 L420,262 L420,180 L560,180"/><line class="d" x1="248" y1="330" x2="560" y2="330" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="560" y1="190" x2="560" y2="336"/><line class="e" x1="248" y1="276" x2="248" y2="336"/><text class="n b" x="330" y="352">linha de impulso (tubo DE)</text></g>
<rect class="wd" x="324" y="254" width="12" height="16"/>
<rect class="wd" x="414" y="214" width="12" height="16"/>
<rect class="wd" x="484" y="172" width="12" height="16"/>
<text class="n" x="300" y="240">conexões de compressão (anilha dupla)</text>
<rect class="s" x="560" y="160" width="60" height="40"/>
<text class="n" x="566" y="150">manifold</text>
<rect class="sl" x="640" y="140" width="90" height="80"/>
<text class="n" x="648" y="240">transmissor</text>
<line class="p" x1="620" y1="180" x2="640" y2="180"/>
<text class="n" x="40" y="420"></text>
<circle class="s" cx="800" cy="330" r="40"/>
<circle class="w" cx="800" cy="330" r="28"/>
<g id="cota-tubo-de" class="cota"><line class="d" x1="760" y1="390" x2="840" y2="390" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="760" y1="330" x2="760" y2="396"/><line class="e" x1="840" y1="330" x2="840" y2="396"/><text class="n b" x="740" y="412">Ø externo do tubo DE</text><line class="d" x1="828" y1="330" x2="840" y2="330" marker-end="url(#a)"/><text class="n" x="846" y="334">espessura</text></g>
<text class="n" x="20" y="508">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
