<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Munhão (trunnion) — largura de apoio da lingada (DNV-OS-H205 5.1.4.7)">
<title>Munhão (trunnion) — largura de apoio da lingada (DNV-OS-H205 5.1.4.7)</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Munhão (trunnion) — largura de apoio da lingada (DNV-OS-H205 5.1.4.7)</text>
<rect class="h" x="60" y="70" width="30" height="250" />
<rect class="f" x="90" y="150" width="170" height="80" />
<rect class="f" x="260" y="110" width="18" height="160" />
<line class="c" x1="70.0" y1="190.0" x2="300.0" y2="190.0" />
<path class="k" d="M120,150 L120,64 M220,150 L220,64" />
<rect class="h" x="120" y="132" width="100" height="18" />
<text class="s" x="170.0" y="90.0" text-anchor="middle">lingada / grommet</text>
<g id="cota-D" class="cota"><line class="t" x1="120.0" y1="64.0" x2="120.0" y2="46.0" /><line class="t" x1="220.0" y1="64.0" x2="220.0" y2="46.0" /><line class="dim" x1="120.0" y1="54.0" x2="220.0" y2="54.0" /><text x="170.0" y="47.0" text-anchor="middle" font-size="13px">D</text></g>
<g id="cota-largura-apoio" class="cota"><line class="t" x1="90.0" y1="230.0" x2="90.0" y2="300.0" /><line class="t" x1="260.0" y1="270.0" x2="260.0" y2="300.0" /><line class="dim" x1="90.0" y1="292.0" x2="260.0" y2="292.0" /><text x="175.0" y="285.0" text-anchor="middle" font-size="13px">largura de apoio</text></g>
<text class="s" x="75.0" y="340.0" text-anchor="middle">estrutura</text>
<text class="s" x="282.0" y="262.0" text-anchor="start">batente</text>
<text class="b" x="330.0" y="120.0" text-anchor="start" font-size="13px">Largura do munhão para a lingada:</text>
<text x="330.0" y="141.0" text-anchor="start" font-size="13px">≥ 1,3 × D  (limitado a 1,25D + 25 mm)</text>
<text x="330.0" y="162.0" text-anchor="start" font-size="13px">D = diâmetro nominal da lingada/grommet</text>
<text x="330.0" y="183.0" text-anchor="start" font-size="13px"></text>
<text class="b" x="330.0" y="204.0" text-anchor="start" font-size="13px">Superfície de contato curva:</text>
<text x="330.0" y="225.0" text-anchor="start" font-size="13px">tipicamente 1,15 × D</text>
<text x="330.0" y="246.0" text-anchor="start" font-size="13px"></text>
<text x="330.0" y="267.0" text-anchor="start" font-size="13px">Considera a ovalização da lingada sob</text>
<text x="330.0" y="288.0" text-anchor="start" font-size="13px">carga (guidance note).</text>
<text class="n" x="750" y="372" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
