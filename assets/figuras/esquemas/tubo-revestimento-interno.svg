<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Revestimento interno de tubos — colarinho, espessura e pontos de medição">
<title>Revestimento interno de tubos — colarinho, espessura e pontos de medição (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Revestimento interno de tubos — colarinho, espessura e pontos de medição</text>
<text x="300" y="48" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) extremidade do tubo (corte longitudinal)</text>
<path d="M40,110 L520,110 L540,130 L40,130 Z" fill="#888" fill-opacity="0.5" stroke="#888" stroke-width="1.5"/>
<path d="M40,290 L520,290 L540,270 L40,270 Z" fill="#888" fill-opacity="0.5" stroke="#888" stroke-width="1.5"/>
<rect x="40" y="130" width="400" height="10" fill="#c63" fill-opacity="0.6" stroke="#c63" stroke-width="1"/>
<rect x="40" y="260" width="400" height="10" fill="#c63" fill-opacity="0.6" stroke="#c63" stroke-width="1"/>
<text x="240" y="200" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">interior do tubo</text>
<text x="250" y="124" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">parede</text>
<text x="530" y="104" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bisel</text>
<text x="240" y="158" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">revestimento interno (epóxi novolac)</text>
<g id="cota-colarinho" class="cota"><line x1="440" y1="290" x2="440" y2="329" stroke="#666" stroke-width="1"/><line x1="540" y1="280" x2="540" y2="329" stroke="#666" stroke-width="1"/><line x1="440" y1="325" x2="540" y2="325" stroke="#666" stroke-width="1.2"/><polygon points="440,325 449,328.5 449,321.5" fill="#666"/><polygon points="540,325 531,321.5 531,328.5" fill="#666"/><text x="490.0" y="341" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">colarinho sem revestimento</text></g>
<g id="cota-espessura-interna" class="cota"><line x1="440" y1="260" x2="459" y2="260" stroke="#666" stroke-width="1"/><line x1="440" y1="270" x2="459" y2="270" stroke="#666" stroke-width="1"/><line x1="455" y1="260" x2="455" y2="270" stroke="#666" stroke-width="1.2"/><polygon points="455,260 458.5,269 451.5,269" fill="#666"/><polygon points="455,270 451.5,261 458.5,261" fill="#666"/><text x="461" y="252" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espessura seca</text></g>
<g id="cota-diametro-tubo" class="cota"><line x1="545" y1="110" x2="604" y2="110" stroke="#666" stroke-width="1"/><line x1="545" y1="290" x2="604" y2="290" stroke="#666" stroke-width="1"/><line x1="600" y1="110" x2="600" y2="290" stroke="#666" stroke-width="1.2"/><polygon points="600,110 603.5,119 596.5,119" fill="#666"/><polygon points="600,290 596.5,281 603.5,281" fill="#666"/><text x="606" y="204.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø do tubo</text></g>
<text x="800" y="48" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) medições na extremidade (seção)</text>
<circle cx="800" cy="220" r="110" fill="#888" fill-opacity="0.5" stroke="#888" stroke-width="1.5"/>
<circle cx="800" cy="220" r="92" fill="#c63" fill-opacity="0.5" stroke="#c63" stroke-width="1.5"/>
<circle cx="800" cy="220" r="84" fill="#fff" fill-opacity="1.0" stroke="#fff" stroke-width="1.5"/>
<circle cx="800.0" cy="136.0" r="6" fill="#36c" fill-opacity="0.8" stroke="#36c" stroke-width="1"/>
<circle cx="872.7" cy="262.0" r="6" fill="#36c" fill-opacity="0.8" stroke="#36c" stroke-width="1"/>
<circle cx="727.3" cy="262.0" r="6" fill="#36c" fill-opacity="0.8" stroke="#36c" stroke-width="1"/>
<g id="cota-posicoes-medicao" class="cota"><line x1="930" y1="360" x2="875" y2="268" stroke="#666" stroke-width="1.2"/><polygon points="875.0,268.0 876.6,277.5 882.6,273.9" fill="#666"/><text x="990" y="372" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pontos defasados igualmente</text></g>
<text x="800" y="224" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">perfil / Rq medidos</text>
<text x="12" y="412" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
