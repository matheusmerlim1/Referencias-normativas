<path d="M380,260 L380,150 L396,190 L412,150 L428,190 L444,150 L460,190 L476,150 L492,190 L508,150 L524,190 L540,150 L556,190 L572,150 L588,190 L604,150 L604,260 Z" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
