<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Preparo de superfície — jateamento, perfil de rugosidade e áreas de avaliação">
<title>Preparo de superfície — jateamento, perfil de rugosidade e áreas de avaliação (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Preparo de superfície — jateamento, perfil de rugosidade e áreas de avaliação</text>
<text x="170" y="52" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) jateamento abrasivo</text>
<path d="M90,90 L150,150 L162,138 L102,78 Z" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<path d="M162,150 L200,250 M156,156 L170,252 M168,144 L230,246" fill="none" stroke="#a74" stroke-width="1.2" stroke-dasharray="3 3"/>
