<g id="cota-face-a-face" class="cota"><line class="e" x1="120" y1="278" x2="120" y2="321"/><line class="e" x1="400" y1="278" x2="400" y2="321"/><line class="d" x1="120" y1="315" x2="400" y2="315" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="260" y="337">face a face</text></g>
<text class="n" x="120" y="372">DN = tamanho nominal (NPS)</text>
