<g id="cota-face-centro" class="cota"><line class="e" x1="740" y1="172" x2="740" y2="106"/><line class="e" x1="896" y1="172" x2="896" y2="106"/><line class="d" x1="740" y1="100" x2="896" y2="100" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="818" y="90">face à linha de centro</text></g>
<text class="n" x="20" y="398">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
