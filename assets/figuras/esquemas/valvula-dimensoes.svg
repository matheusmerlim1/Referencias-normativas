<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 410" width="1050" height="410" role="img" aria-label="Válvulas — tamanho nominal, face a face e face à linha de centro">
<title>Válvulas — tamanho nominal, face a face e face à linha de centro (esquema ilustrativo)</title>
<style>
