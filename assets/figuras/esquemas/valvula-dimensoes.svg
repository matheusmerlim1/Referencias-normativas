<rect class="s" x="120" y="165" width="16" height="110"/><rect class="s" x="384" y="165" width="16" height="110"/>
<path class="s" d="M136,195 L190,195 Q200,165 260,165 Q320,165 330,195 L384,195 L384,245 L330,245 Q320,275 260,275 Q200,275 190,245 L136,245 Z"/>
<rect class="s" x="240" y="120" width="40" height="45"/><line class="g" x1="260" y1="120" x2="260" y2="92"/><line class="g" x1="215" y1="92" x2="305" y2="92"/>
<text class="n" x="312" y="96">volante</text>
<line class="h" x1="100" y1="200" x2="136" y2="200"/><line class="h" x1="100" y1="240" x2="136" y2="240"/>
