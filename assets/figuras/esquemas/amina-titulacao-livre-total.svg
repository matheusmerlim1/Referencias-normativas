<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Aminas (MEA, DEA, MDEA) — amina livre, total e fixa por titulação">
<!--P7C-->
<title>Aminas (MEA, DEA, MDEA) — amina livre, total e fixa por titulação (esquema ilustrativo)</title>
<rect x="0" y="0" width="1000" height="520" fill="#fff"/>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Aminas (MEA, DEA, MDEA) — amina livre, total e fixa por titulação</text>
<text x="150" y="52" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) remoção de sólidos</text>
<circle cx="150" cy="150" r="60" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1.5"/>
<rect x="174.8892417275068" y="146.9707050163984" width="16" height="30" rx="4" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1"/>
<rect x="115.18844449083578" y="157.49756633902888" width="16" height="30" rx="4" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1"/>
<rect x="135.92231378165744" y="100.53172864457272" width="16" height="30" rx="4" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1"/>
<text x="150" y="232" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">centrífuga (rotação e tempo fixados)</text>
<text x="150" y="246" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ou papel de filtro rápido</text>
<text x="150" y="280" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cor da solução (inspeção visual)</text>
<rect x="60" y="295" width="26" height="26" rx="3" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1"/>
<text x="95" y="307" text-anchor="start" font-size="10" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">amarelo claro</text>
<text x="95" y="319" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">normal</text>
<rect x="60" y="329" width="26" height="26" rx="3" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1"/>
<text x="95" y="341" text-anchor="start" font-size="10" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">amarelo escuro</text>
<text x="95" y="353" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sais de ferro</text>
<rect x="60" y="363" width="26" height="26" rx="3" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1"/>
<text x="95" y="375" text-anchor="start" font-size="10" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">verde / azul</text>
<text x="95" y="387" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cobre / níquel</text>
<rect x="60" y="397" width="26" height="26" rx="3" fill="#666" fill-opacity="0.5499999999999999" stroke="#666" stroke-width="1"/>
<text x="95" y="409" text-anchor="start" font-size="10" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">marrom</text>
<text x="95" y="421" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">oxidação (O2)</text>
<rect x="60" y="431" width="26" height="26" rx="3" fill="#666" fill-opacity="0.7" stroke="#666" stroke-width="1"/>
<text x="95" y="443" text-anchor="start" font-size="10" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">violeta</text>
<text x="95" y="455" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">degradação forte</text>
<rect x="60" y="465" width="26" height="26" rx="3" fill="#666" fill-opacity="0.85" stroke="#666" stroke-width="1"/>
<text x="95" y="477" text-anchor="start" font-size="10" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">preta</text>
<text x="95" y="489" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">corrosão intensa</text>
<text x="500" y="52" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) titulação potenciométrica</text>
<line x1="420" y1="70" x2="420" y2="170" stroke="#666" stroke-width="6"/>
<text x="430" y="82" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bureta HCl / NaOH</text>
<path d="M380,190 h90 v70 h-90 z" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1.5"/>
<line x1="445" y1="140" x2="445" y2="240" stroke="#666" stroke-width="3"/>
<text x="440" y="135" text-anchor="end" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eletrodo de pH</text>
<rect x="370" y="262" width="110" height="18" rx="0" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1"/>
<text x="425" y="296" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">agitador magnético</text>
<line x1="520" y1="100" x2="520" y2="280" stroke="#666" stroke-width="1.2"/><line x1="520" y1="280" x2="720" y2="280" stroke="#666" stroke-width="1.2"/>
<text x="514" y="105" text-anchor="end" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pH</text>
<text x="720" y="296" text-anchor="end" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">volume</text>
<path d="M520,130 C560,140 570,210 590,220" fill="#666" fill-opacity="0" stroke="#666" stroke-width="1.6"/>
<line x1="520" y1="220" x2="720" y2="220" stroke="#666" stroke-width="0.8" stroke-dasharray="4,2"/>
<text x="720" y="216" text-anchor="end" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pH 7,0 → VA (amina livre)</text>
<line x1="520" y1="160" x2="720" y2="160" stroke="#666" stroke-width="0.8" stroke-dasharray="4,2"/>
<text x="720" y="156" text-anchor="end" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pH 10,5 (NaOH + excesso → VB; volta HCl → VC)</text>
<text x="500" y="330" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">total − livre = amina fixa (sais estáveis ao calor)</text>
<text x="840" y="52" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) titulação com indicador</text>
<line x1="800" y1="70" x2="800" y2="170" stroke="#666" stroke-width="6"/>
<text x="810" y="82" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bureta H2SO4</text>
<path d="M760,190 h90 v70 h-90 z" fill="#666" fill-opacity="0.18" stroke="#666" stroke-width="1.5"/>
<text x="805" y="230" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">vermelho de metila</text>
<rect x="750" y="262" width="110" height="18" rx="0" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1"/>
<text x="805" y="296" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">chapa de aquecimento</text>
<text x="840" y="330" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">rósea persistente → ferver → se amarelar,</text>
<text x="840" y="343" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">esfriar e titular de novo → VL (amina total)</text>
<text x="620" y="420" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Resultado em % massa = F × P × volume ÷ (d × V)</text>
<text x="620" y="440" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">F = fator da amina (MEA, DEA ou MDEA) · P = padronização · d × V = massa da amostra</text>
<text x="620" y="470" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Capela com exaustão (H2S) · amostra refrigerada em frasco de vidro</text>
<text x="12" y="512" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
