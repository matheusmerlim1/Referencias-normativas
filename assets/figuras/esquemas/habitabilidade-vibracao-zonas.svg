<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Vibração de corpo inteiro — zona de precaução à saúde (esquema qualitativo)">
<title>Vibração de corpo inteiro — zona de precaução à saúde (esquema qualitativo)</title>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Vibração de corpo inteiro — zona de precaução à saúde (esquema qualitativo)</text>
<line x1="90" y1="400" x2="700" y2="400" stroke="#666" stroke-width="2" stroke-linecap="round"/>
<line x1="90" y1="400" x2="90" y2="60" stroke="#666" stroke-width="2" stroke-linecap="round"/>
<text x="400" y="435" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">duração da exposição →</text>
<text transform="rotate(-90 30 230)" x="30" y="230" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">aceleração ponderada →</text>
<path d="M110,110 C250,190 450,250 690,280" stroke="#666" stroke-width="2" fill="none"/>
<path d="M110,190 C250,260 450,310 690,340" stroke="#666" stroke-width="2" fill="none"/>
<text x="400" y="160" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">risco provável à saúde</text>
<text x="420" y="262" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">zona de precaução</text>
<text x="300" y="370" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">efeitos não documentados</text>
<text x="12" y="452" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo, sem escala — não é desenho da norma.</text>
