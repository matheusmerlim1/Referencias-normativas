<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Instalações sanitárias — cabine de vaso, mictório e chuveiro">
<title>Instalações sanitárias — cabine de vaso, mictório e chuveiro</title>
<defs><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Instalações sanitárias — cabine de vaso, mictório e chuveiro</text>
<rect x="50" y="80" width="160" height="230" rx="0" stroke="#666" stroke-width="1.2" fill="none"/>
<rect x="105" y="90" width="50" height="70" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<text x="130" y="130" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">vaso</text>
<rect x="90" y="170" width="80" height="60" rx="0" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="6 4"/>
<line x1="90" y1="250" x2="170" y2="250" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="170.0,250.0 161.0,253.5 161.0,246.5" fill="#666"/>
<polygon points="90.0,250.0 99.0,246.5 99.0,253.5" fill="#666"/>
<text x="130.0" y="266" text-anchor="middle" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">0,80 m</text>
<line x1="190" y1="170" x2="190" y2="230" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="190.0,230.0 186.5,221.0 193.5,221.0" fill="#666"/>
<polygon points="190.0,170.0 193.5,179.0 186.5,179.0" fill="#666"/>
<text x="216" y="204.0" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">0,60 m</text>
<text x="130" y="330" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">planta da cabine</text>
<rect x="300" y="400" width="180" height="10" rx="0" fill="url(#hz)" stroke="#666" stroke-width="1.2"/>
<line x1="300" y1="400" x2="480" y2="400" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="320" y="172" width="12" height="210" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<line x1="310" y1="400" x2="310" y2="172" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="310.0,172.0 313.5,181.0 306.5,181.0" fill="#666"/>
<polygon points="310.0,400.0 306.5,391.0 313.5,391.0" fill="#666"/>
<text x="304" y="290.0" text-anchor="end" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">≥ 1,90 m</text>
<line x1="332" y1="400" x2="356" y2="400" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="332" y1="382" x2="356" y2="382" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="350" y1="400" x2="350" y2="382" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="350.0,382.0 353.5,391.0 346.5,391.0" fill="#666"/>
<polygon points="350.0,400.0 346.5,391.0 353.5,391.0" fill="#666"/>
<text x="362" y="380.0" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">≤ 0,15 m</text>
<text x="326" y="425" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">divisória</text>
<text x="520" y="60" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Vaso sanitário (NR-37):</text>
<text x="520" y="78" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">área ≥ 1,00 m² por vaso</text>
<text x="520" y="96" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espaço frontal livre ≥ 0,80 m (largura) ×</text>
<text x="520" y="114" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      0,60 m (profundidade)</text>
<text x="520" y="132" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">divisórias: altura ≥ 1,90 m; bordo inferior</text>
<text x="520" y="150" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      a ≤ 0,15 m do piso</text>
<text x="520" y="168" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NR-24: área livre de Ø 0,60 m entre a borda</text>
<text x="520" y="186" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      da bacia e a porta fechada</text>
<text x="520" y="204" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Mictório: compartimentos com divisórias,</text>
<text x="520" y="222" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      espaçamento 0,60 m (NR-37); calha NR-24:</text>
<text x="520" y="240" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      0,60 m por unidade (0,80 m sem anteparo)</text>
<text x="520" y="258" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Lavatório calha (NR-24): 0,60 m por unidade</text>
<text x="520" y="276" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Chuveiro (NR-37): rebaixo ≥ 0,05 m;</text>
<text x="520" y="294" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      crivo a ≥ 2 m do piso</text>
<text x="520" y="312" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      NR-24: box ≥ 0,80 m × 0,80 m</text>
<text x="12" y="512" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo, sem escala — não é desenho da norma. Valores transcritos dos requisitos da ficha.</text>
</svg>