<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="Fundação de máquina — bloco, centro de gravidade, proporções e fundação vizinha">
<title>Fundação de máquina — bloco, centro de gravidade, proporções e fundação vizinha (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Fundação de máquina — bloco, centro de gravidade, proporções e fundação vizinha</text>
<line x1="20" y1="300" x2="980" y2="300" stroke="#666" stroke-width="2"/>
<text x="30" y="292" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">terreno</text>
<rect x="120" y="300" width="420" height="170" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="330" y="400" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bloco de fundação</text>
<rect x="200" y="200" width="260" height="100" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="330" y="190" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">máquina (skid)</text>
<line x1="200" y1="250" x2="460" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="10 4 2 4"/>
