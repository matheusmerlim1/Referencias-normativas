<circle cx="345" cy="380" r="7" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="2"/>
<text x="357" y="375" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">CG fundação + máquina</text>
<line x1="330" y1="300" x2="330" y2="480" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
