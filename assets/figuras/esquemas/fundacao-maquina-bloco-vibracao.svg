<g id="cota-afastamento" class="cota"><line x1="540" y1="470" x2="540" y2="600" stroke="#666" stroke-width="1"/><line x1="760" y1="360" x2="760" y2="600" stroke="#666" stroke-width="1"/><line x1="540" y1="600" x2="760" y2="600" stroke="#666" stroke-width="1.2"/><polygon points="540.0,600.0 549.0,603.5 549.0,596.5" fill="#666"/><polygon points="760.0,600.0 751.0,596.5 751.0,603.5" fill="#666"/><text x="650.0" y="594" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">afastamento horizontal</text></g>
<g id="cota-desnivel" class="cota"><line x1="760" y1="360" x2="790" y2="360" stroke="#666" stroke-width="1"/><line x1="790" y1="360" x2="790" y2="470" stroke="#666" stroke-width="1.2"/><polygon points="790.0,360.0 786.5,369.0 793.5,369.0" fill="#666"/><polygon points="790.0,470.0 793.5,461.0 786.5,461.0" fill="#666"/><text x="796" y="419.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">desnível</text></g>
<line x1="540" y1="470" x2="800" y2="470" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
<text x="12" y="682" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
