<text class="ti" x="12.0" y="24.0" text-anchor="start">Lingada de 4 pernas — ângulo com a vertical, elo mestre e alcance (DNV-ST-E273 7.3.1)</text>
<rect class="f" x="80" y="330" width="320" height="100" />
<path class="o" d="M88,330 A12,12 0 0,1 112,330" />
<path class="o" d="M368,330 A12,12 0 0,1 392,330" />
<line class="c" x1="240.0" y1="70.0" x2="240.0" y2="445.0" />
