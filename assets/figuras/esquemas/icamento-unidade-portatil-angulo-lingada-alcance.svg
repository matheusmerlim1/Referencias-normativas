<line class="k" x1="240.0" y1="118.0" x2="100.0" y2="322.0" />
<line class="k" x1="240.0" y1="118.0" x2="380.0" y2="322.0" />
<line class="x" x1="240.0" y1="118.0" x2="175.0" y2="300.0" />
<line class="x" x1="240.0" y1="118.0" x2="305.0" y2="300.0" />
