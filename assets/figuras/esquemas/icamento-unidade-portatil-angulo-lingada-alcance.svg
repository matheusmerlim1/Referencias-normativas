<text class="s" x="262.0" y="84.0" text-anchor="start">elo mestre: interno ≥ 270 × 140 mm (recomendado)</text>
<text class="b" x="240.0" y="468.0" text-anchor="middle">Içamento</text>
<rect class="f" x="500" y="260" width="220" height="170" />
<line class="o" x1="470.0" y1="430.0" x2="760.0" y2="430.0" />
<path class="k" d="M515,260 L560,330 L598,352" />
<path class="k" d="M705,260 L650,330 L606,352" />
<ellipse class="o" cx="602" cy="370" rx="11" ry="18"/>
<g id="cota-alcance" class="cota"><line class="t" x1="614.0" y1="355.0" x2="778.0" y2="355.0" /><line class="dim" x1="770.0" y1="430.0" x2="770.0" y2="355.0" /><text x="764.0" y="400.0" text-anchor="end" font-size="13px">alcance</text></g>
<text class="b" x="610.0" y="468.0" text-anchor="middle">Lingada deitada sobre o lado longo:</text>
<text x="610.0" y="486.0" text-anchor="middle">elo mestre ao alcance a partir do fundo</text>
<text class="b" x="30.0" y="520.0" text-anchor="start" font-size="12.5px">Ângulo da perna com a vertical: POU (E273 7.3.1) normalmente 30° a 45°; container (E271 8.3)</text>
<text x="30.0" y="541.0" text-anchor="start" font-size="12.5px">  normalmente 45°, nunca maior que 45°; NORSOK (F.7.2.1) entre 15° e 45° — abaixo de 15°, toda a carga em uma perna.</text>
<text class="b" x="30.0" y="562.0" text-anchor="start" font-size="12.5px">Alcance (E273 7.3.1): elo superior/mestre a ≤ 1,3 m acima do fundo da unidade (NORSOK F.7.2.1: ≤ 1,3 m acima do convés).</text>
<text class="n" x="790" y="612" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
