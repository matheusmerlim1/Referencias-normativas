<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" width="920" height="740" role="img" aria-label="Aquecimento externo com vapor (tracing) — ramais e troncos">
<title>Aquecimento externo com vapor (tracing) — ramais e troncos (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Aquecimento externo com vapor (tracing) — ramais e troncos</text>
<text class="b" x="20" y="62">(a) Corte: linha aquecida e ramal</text>
<circle class="bl" cx="130" cy="160" r="70"/>
<circle class="s" cx="130" cy="160" r="44"/>
<circle class="r" cx="130" cy="212" r="8"/>
<text class="n" x="205" y="100">isolamento térmico</text>
<g id="cota-linha-aquecida" class="cota"><line class="d" x1="86" y1="160" x2="174" y2="160" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="90" y="152">Ø da linha</text></g>
<g id="cota-ramal" class="cota"><line class="e" x1="138" y1="212" x2="190" y2="250"/><text x="170" y="268">Ø do ramal (geratriz inferior)</text></g>
<text class="b" x="400" y="62">(b) Ramal reto fixado à linha</text>
<rect class="s" x="420" y="110" width="460" height="40"/>
<line class="r" x1="420" y1="156" x2="880" y2="156"/>
<rect class="wd" x="467" y="106" width="6" height="54"/>
<rect class="wd" x="557" y="106" width="6" height="54"/>
<rect class="wd" x="647" y="106" width="6" height="54"/>
<rect class="wd" x="737" y="106" width="6" height="54"/>
<rect class="wd" x="827" y="106" width="6" height="54"/>
<g id="cota-fixacao" class="cota"><line class="e" x1="560" y1="162" x2="560" y2="190"/><line class="e" x1="650" y1="162" x2="650" y2="190"/><line class="d" x1="560" y1="182" x2="650" y2="182" marker-start="url(#a)" marker-end="url(#a)"/><text x="560" y="206">intervalo das fitas</text></g>
<g id="cota-comprimento-ramal" class="cota"><line class="e" x1="420" y1="160" x2="420" y2="236"/><line class="e" x1="880" y1="160" x2="880" y2="236"/><line class="d" x1="420" y1="228" x2="880" y2="228" marker-start="url(#a)" marker-end="url(#a)"/><text x="560" y="252">comprimento contínuo do ramal</text></g>
<text class="n" x="760" y="96">fita de aço</text>
<text class="b" x="20" y="310">(c) Ramal helicoidal</text>
<rect class="s" x="40" y="350" width="320" height="50"/>
<path class="v" d="M40,404 Q60,340 80,376 Q100,410 120,376 Q140,340 160,376 Q180,410 200,376 Q220,340 240,376 Q260,410 280,376 Q300,340 320,376 Q340,410 360,376"/>
<g id="cota-passo-helice" class="cota"><line class="e" x1="80" y1="410" x2="80" y2="440"/><line class="e" x1="160" y1="410" x2="160" y2="440"/><line class="d" x1="80" y1="432" x2="160" y2="432" marker-start="url(#a)" marker-end="url(#a)"/><text x="70" y="456">passo da hélice</text></g>
<text class="b" x="420" y="310">(d) Curvamento do tubo do ramal</text>
<path class="v" d="M440,440 L540,440 A80,80 0 0,0 620,360 L620,330"/>
<g id="cota-raio-curva" class="cota"><line class="e" x1="540" y1="360" x2="540" y2="440"/><line class="e" x1="540" y1="360" x2="620" y2="360"/><line class="d" x1="540" y1="360" x2="596" y2="416" marker-end="url(#a)"/><text x="480" y="350">raio de curvatura</text></g>
<text class="b" x="680" y="310">(e) Bolsa no ramal</text>
<path class="v" d="M680,370 L740,370 L740,430 L820,430 L820,370 L900,370"/>
<rect class="sl" x="760" y="350" width="40" height="60"/>
<text class="n" x="762" y="344">obstáculo</text>
<g id="cota-bolsa" class="cota"><line class="e" x1="718" y1="430" x2="740" y2="430"/><line class="d" x1="724" y1="370" x2="724" y2="430" marker-start="url(#a)" marker-end="url(#a)"/><text x="684" y="456">profundidade da bolsa</text></g>
<text class="b" x="20" y="510">(f) Troncos de suprimento de vapor e de recolhimento de condensado</text>
<rect class="bl" x="40" y="540" width="380" height="20"/>
<text class="n" x="430" y="556">tronco de vapor</text>
<line class="r" x1="80" y1="560" x2="80" y2="600"/>
<rect class="wd" x="74" y="572" width="12" height="10"/>
<line class="r" x1="150" y1="560" x2="150" y2="600"/>
<rect class="wd" x="144" y="572" width="12" height="10"/>
<line class="r" x1="220" y1="560" x2="220" y2="600"/>
<rect class="wd" x="214" y="572" width="12" height="10"/>
<line class="r" x1="290" y1="560" x2="290" y2="600"/>
<rect class="wd" x="284" y="572" width="12" height="10"/>
<line class="r" x1="360" y1="560" x2="360" y2="600"/>
<rect class="wd" x="354" y="572" width="12" height="10"/>
<g id="cota-tronco-vapor" class="cota"><line class="d" x1="30" y1="540" x2="30" y2="560" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="10" y="532">Ø do tronco</text></g>
<rect class="bl" x="40" y="660" width="380" height="20"/>
<text class="n" x="430" y="676">tronco de condensado</text>
<line class="r" x1="80" y1="620" x2="80" y2="660"/>
<circle class="r" cx="80" cy="636" r="7"/>
<line class="r" x1="150" y1="620" x2="150" y2="660"/>
<circle class="r" cx="150" cy="636" r="7"/>
<line class="r" x1="220" y1="620" x2="220" y2="660"/>
<circle class="r" cx="220" cy="636" r="7"/>
<line class="r" x1="290" y1="620" x2="290" y2="660"/>
<circle class="r" cx="290" cy="636" r="7"/>
<line class="r" x1="360" y1="620" x2="360" y2="660"/>
<circle class="r" cx="360" cy="636" r="7"/>
<g id="cota-tronco-condensado" class="cota"><line class="d" x1="30" y1="660" x2="30" y2="680" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="10" y="700">Ø do tronco</text></g>
<text class="n" x="460" y="610">ramais (com bloqueio no início e purgador no fim)</text>
<text class="n" x="20" y="728">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
