<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Ensaios de laboratório — fluidez, combustão, aderência, meio controlado e contração">
<title>Ensaios de laboratório — fluidez, combustão, aderência, meio controlado e contração (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Ensaios de laboratório — fluidez, combustão, aderência, meio controlado e contração</text>
<text class="n b" x="30" y="70">plastômetro de extrusão</text>
<rect class="s" x="90" y="80" width="40" height="30"/><text class="n" x="136" y="100">peso</text>
<line class="g" x1="110" y1="110" x2="110" y2="160"/>
<rect class="g" x="80" y="150" width="60" height="140"/><rect class="sl" x="88" y="170" width="44" height="110"/>
<rect class="s" x="100" y="290" width="20" height="12"/><text class="n" x="128" y="300">matriz</text>
<path class="h" d="M110,302 Q112,330 104,350"/><text class="n" x="30" y="376">extrudado (g/10 min)</text>
<text class="n b" x="250" y="70">bomba de combustão</text>
<rect class="s" x="270" y="110" width="110" height="170" rx="18"/><rect class="w" x="300" y="200" width="50" height="20"/>
<text class="n" x="250" y="306">amostra queimada sob O₂;</text><text class="n" x="250" y="324">produtos analisados</text>
<text class="n b" x="470" y="70">aderência (pull-off)</text>
<rect class="s" x="460" y="240" width="200" height="30"/><rect class="r" x="460" y="230" width="200" height="10"/>
<rect class="w" x="535" y="200" width="50" height="30"/><line class="d" x1="560" y1="200" x2="560" y2="130" marker-end="url(#a)"/>
<text class="n" x="570" y="160">tração</text><text class="n" x="470" y="296">revestimento / substrato</text><text class="n" x="590" y="214">pino (dolly)</text>
<text class="n b" x="720" y="70">corpo de prova em meio controlado</text>
<path class="g" d="M740,120 L740,290 L880,290 L880,120"/><rect class="sl" x="742" y="160" width="136" height="128"/>
<rect class="s" x="790" y="190" width="40" height="70"/><text class="n" x="720" y="316">solução / atmosfera, tempo e temperatura</text>
<text class="n b" x="1000" y="70">contração de moldagem</text>
<rect class="g" x="990" y="130" width="180" height="70"/><text class="n" x="1000" y="122">cavidade do molde</text>
<rect class="s" x="1000" y="240" width="160" height="56"/><text class="n" x="1000" y="316">peça moldada (menor)</text>
<text class="n" x="20" y="398">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
