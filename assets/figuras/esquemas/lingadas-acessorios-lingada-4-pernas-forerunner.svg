<g id="cota-beta" class="cota"><path class="d" d="M476.2,329.3 A110,110 0 0,1 380,386" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="446" y="393">β</text></g>
<g id="cota-d-perna" class="cota"><line class="d" x1="600" y1="295" x2="510" y2="348" marker-end="url(#a)"/><text x="604" y="300">Ø da perna (corrente / cabo)</text></g>
<text class="n" x="20" y="508">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
