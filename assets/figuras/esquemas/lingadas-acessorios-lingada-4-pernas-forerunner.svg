<line x1="380" y1="276" x2="120" y2="420" stroke="#666" stroke-width="4" stroke-dasharray="9 4"/>
<circle class="g" cx="120" cy="430" r="9"/>
<rect class="s" x="80" y="440" width="80" height="10"/>
<line x1="380" y1="276" x2="290" y2="450" stroke="#666" stroke-width="4" stroke-dasharray="9 4"/>
<circle class="g" cx="290" cy="460" r="9"/>
<rect class="s" x="250" y="470" width="80" height="10"/>
<line x1="380" y1="276" x2="470" y2="450" stroke="#666" stroke-width="4" stroke-dasharray="9 4"/>
<circle class="g" cx="470" cy="460" r="9"/>
<rect class="s" x="430" y="470" width="80" height="10"/>
<line x1="380" y1="276" x2="640" y2="420" stroke="#666" stroke-width="4" stroke-dasharray="9 4"/>
