<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Plásticos — índice de fluidez, contração no molde e condicionamento">
<title>Plásticos — índice de fluidez, contração no molde e condicionamento (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Plásticos — índice de fluidez, contração no molde e condicionamento</text>
<text x="180" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) índice de fluidez (plastômetro)</text>
<rect x="140" y="120" width="80" height="200" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<rect x="160" y="90" width="40" height="110" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<rect x="150" y="60" width="60" height="30" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="220" y="75" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">peso</text>
<text x="230" y="160" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pistão / cilindro aquecido</text>
<rect x="170" y="320" width="20" height="20" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="200" y="335" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">matriz</text>
<line x1="180" y1="340" x2="180" y2="390" stroke="#666" stroke-width="3" stroke-dasharray="2 3"/>
<text x="200" y="380" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">massa extrudada por tempo</text>
<text x="520" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) contração no molde</text>
<rect x="420" y="120" width="200" height="120" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="432" y="130" width="176" height="100" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="520" y="185" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">peça moldada</text>
<g id="cota-molde" class="cota"><line x1="420" y1="240" x2="420" y2="270" stroke="#666" stroke-width="1"/><line x1="620" y1="240" x2="620" y2="270" stroke="#666" stroke-width="1"/><line x1="420" y1="270" x2="620" y2="270" stroke="#666" stroke-width="1.2"/><polygon points="420.0,270.0 429.0,266.5 429.0,273.5" fill="#666"/><polygon points="620.0,270.0 611.0,273.5 611.0,266.5" fill="#666"/><text x="520.0" y="264" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">dimensão do molde</text></g>
<g id="cota-peca" class="cota"><line x1="432" y1="230" x2="432" y2="300" stroke="#666" stroke-width="1"/><line x1="608" y1="230" x2="608" y2="300" stroke="#666" stroke-width="1"/><line x1="432" y1="300" x2="608" y2="300" stroke="#666" stroke-width="1.2"/><polygon points="432.0,300.0 441.0,296.5 441.0,303.5" fill="#666"/><polygon points="608.0,300.0 599.0,303.5 599.0,296.5" fill="#666"/><text x="520.0" y="320" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">dimensão da peça</text></g>
<text x="840" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) condicionamento</text>
<rect x="730" y="100" width="220" height="180" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1.5"/>
<text x="840" y="120" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">câmara</text>
<rect x="760" y="180" width="40" height="60" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<rect x="820" y="180" width="40" height="60" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<rect x="880" y="180" width="40" height="60" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<text x="840" y="300" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">temperatura e umidade controladas</text>
<text x="12" y="412" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
