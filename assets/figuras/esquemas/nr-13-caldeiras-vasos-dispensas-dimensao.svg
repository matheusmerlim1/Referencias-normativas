<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Dispensas por dimensão (13.2.2) — vaso de pequeno diâmetro e tubo de instrumentação">
<title>Dispensas por dimensão (13.2.2) — vaso de pequeno diâmetro e tubo de instrumentação (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Dispensas por dimensão (13.2.2) — vaso de pequeno diâmetro e tubo de instrumentação</text>
<text class="b" x="40" y="70">(a) Vaso de pequeno diâmetro</text>
<rect class="s" x="80" y="150" width="300" height="70"/>
<rect class="w" x="90" y="160" width="280" height="50"/>
<g id="cota-Di-vaso" class="cota"><line class="e" x1="87" y1="160" x2="44" y2="160"/><line class="e" x1="87" y1="210" x2="44" y2="210"/><line class="d" x1="50" y1="160" x2="50" y2="210" marker-start="url(#a)" marker-end="url(#a)"/><text x="57" y="190">Ø interno</text></g>
<text class="n" x="80" y="260">fluidos B, C ou D; P·V conforme a ficha</text>
<text class="b" x="480" y="70">(b) Tubo de instrumentação</text>
<rect class="s" x="500" y="170" width="340" height="20"/>
<rect class="s" x="470" y="150" width="30" height="60"/>
<text class="n" x="470" y="140">tomada</text>
<rect class="w" x="840" y="160" width="30" height="40"/>
<text class="n" x="830" y="230">instrumento</text>
<g id="cota-DN-instr" class="cota"><line class="d" x1="650" y1="144" x2="650" y2="170" marker-end="url(#a)"/><line class="d" x1="650" y1="216" x2="650" y2="190" marker-end="url(#a)"/><line class="d" x1="650" y1="170" x2="650" y2="190"/><text x="670" y="150">DN</text></g>
<text class="n" x="500" y="260">fluidos classe A ou B</text>
<text class="n" x="20" y="388">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
