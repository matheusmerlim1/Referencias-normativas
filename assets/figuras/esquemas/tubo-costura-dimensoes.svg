<g id="cota-e" class="cota"><line class="d" x1="182" y1="490" x2="208" y2="490" marker-end="url(#a)"/><line class="d" x1="246" y1="490" x2="220" y2="490" marker-end="url(#a)"/><line class="d" x1="208" y1="490" x2="220" y2="490"/><text x="252" y="478">espessura e</text></g>
<text class="n b" x="540" y="400">seção quadrada / retangular</text>
<rect class="s" x="540" y="430" width="130" height="110" rx="14"/>
<rect class="w" x="552" y="442" width="106" height="86" rx="4"/>
<g id="cota-raio-canto" class="cota"><line class="d" x1="470" y1="420" x2="545" y2="435" marker-end="url(#a)"/><text x="330" y="425">raio externo do canto</text></g>
<g id="cota-esquadro" class="cota"><path class="d" d="M574.0,540.0 A34,34 0 0,0 540.0,506.0" marker-start="url(#a)" marker-end="url(#a)"/><text x="540" y="575">esquadro dos lados</text></g>
<text class="n b" x="820" y="405">torção (vista de topo)</text>
<rect class="h" x="825" y="430" width="110" height="110"/>
<rect class="g" x="825" y="430" width="110" height="110" transform="rotate(-6 880 485)"/>
<g id="cota-torcao" class="cota"><line class="e" x1="941" y1="534" x2="971" y2="534"/><line class="e" x1="937" y1="540" x2="971" y2="540"/><line class="d" x1="965" y1="508" x2="965" y2="534" marker-end="url(#a)"/><line class="d" x1="965" y1="566" x2="965" y2="540" marker-end="url(#a)"/><line class="d" x1="965" y1="534" x2="965" y2="540"/><text class="m" x="860" y="595">torção (desvio do canto por metro)</text></g>
<text class="n" x="20" y="628">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
