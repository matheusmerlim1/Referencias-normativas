<line class="c" x1="200.0" y1="70.0" x2="200.0" y2="400.0"/>
<g id="cota-Do" class="cota"><line class="e" x1="155.0" y1="168.0" x2="155.0" y2="92.0"/><line class="e" x1="245.0" y1="168.0" x2="245.0" y2="92.0"/><line class="d" x1="155.0" y1="98.0" x2="245.0" y2="98.0" marker-start="url(#a)" marker-end="url(#a)"/><text class="p" x="200.0" y="90.0" text-anchor="middle">Do</text></g>
<g id="cota-dh" class="cota"><line class="e" x1="174.0" y1="230.0" x2="174.0" y2="420.0"/><line class="e" x1="226.0" y1="290.0" x2="226.0" y2="420.0"/><line class="d" x1="174.0" y1="414.0" x2="226.0" y2="414.0" marker-start="url(#a)" marker-end="url(#a)"/><text class="p" x="200.0" y="434.0" text-anchor="middle">dh</text></g>
<g id="cota-d" class="cota"><line class="e" x1="180.0" y1="355.0" x2="180.0" y2="455.0"/><line class="e" x1="220.0" y1="355.0" x2="220.0" y2="455.0"/><line class="d" x1="180.0" y1="450.0" x2="220.0" y2="450.0" marker-start="url(#a)" marker-end="url(#a)"/><text class="p" x="200.0" y="470.0" text-anchor="middle">d</text></g>
