<text class="p b" x="60.0" y="346.0" text-anchor="start">F</text>
<text class="p" x="262.0" y="150.0" text-anchor="start">F = força de aperto</text>
<text class="p b" x="430.0" y="60.0" text-anchor="start">Símbolos (ISO 16047, Tabela 1)</text>
<text class="p" x="430.0" y="85.0" text-anchor="start">T  torque de aperto</text>
<text class="p" x="430.0" y="110.0" text-anchor="start">F  força de aperto</text>
<text class="p" x="430.0" y="135.0" text-anchor="start">d  Ø nominal da rosca</text>
<text class="p" x="430.0" y="160.0" text-anchor="start">d2  Ø primitivo básico</text>
<text class="p" x="430.0" y="185.0" text-anchor="start">P  passo</text>
<text class="p" x="430.0" y="210.0" text-anchor="start">Do  Ø externo do assento (cabeça/porca)</text>
<text class="p" x="430.0" y="235.0" text-anchor="start">dh  Ø do furo (arruela/peça de apoio)</text>
<text class="p" x="430.0" y="260.0" text-anchor="start">Db = (Do + dh)/2  Ø médio do assento</text>
<text class="p" x="430.0" y="285.0" text-anchor="start">µth  atrito na rosca; µb  atrito no assento</text>
<text class="p" x="430.0" y="310.0" text-anchor="start">Tth  torque na rosca; Tb  torque no assento</text>
<text class="n" x="20" y="574">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores e fórmulas estão na ficha</text>
</svg>
