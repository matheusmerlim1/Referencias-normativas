<g id="cota-T" class="cota"><path class="d" d="M140,62 A70,22 0 0,0 260,62"/><path class="d" d="M248,68 L260,62" marker-end="url(#a)"/><text class="p b" x="268.0" y="58.0" text-anchor="start">T (torque)</text></g>
<g id="cota-F" class="cota"><line class="d" x1="95.0" y1="130.0" x2="95.0" y2="168.0" marker-end="url(#a)"/><text class="p b" x="60.0" y="126.0" text-anchor="start">F</text></g>
<line class="d" x1="305.0" y1="130.0" x2="305.0" y2="168.0" marker-end="url(#a)"/>
