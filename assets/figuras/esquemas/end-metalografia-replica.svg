<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Metalografia de campo — preparo, área polida e réplica">
<title>Metalografia de campo — preparo, área polida e réplica (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Metalografia de campo — preparo, área polida e réplica</text>
<text class="b" x="30" y="62">(a) Sequência de preparo no campo</text>
<rect class="sl" x="40" y="110" width="140" height="90"/>
<text class="m n" x="110" y="225">desbaste</text>
<rect class="sl" x="210" y="110" width="140" height="90"/>
<text class="m n" x="280" y="225">lixamento</text>
<rect class="sl" x="380" y="110" width="140" height="90"/>
<text class="m n" x="450" y="225">polimento</text>
<rect class="sl" x="550" y="110" width="140" height="90"/>
<text class="m n" x="620" y="225">ataque</text>
<rect class="sl" x="720" y="110" width="140" height="90"/>
<text class="m n" x="790" y="225">réplica / microscópio</text>
<line class="e" x1="220" y1="125" x2="340" y2="125"/>
<line class="e" x1="220" y1="140" x2="340" y2="140"/>
<line class="e" x1="220" y1="155" x2="340" y2="155"/>
<line class="e" x1="220" y1="170" x2="340" y2="170"/>
<line class="e" x1="220" y1="185" x2="340" y2="185"/>
<line class="e" x1="400" y1="118" x2="400" y2="192"/>
<line class="e" x1="425" y1="118" x2="425" y2="192"/>
<line class="e" x1="450" y1="118" x2="450" y2="192"/>
<line class="e" x1="475" y1="118" x2="475" y2="192"/>
<line class="e" x1="500" y1="118" x2="500" y2="192"/>
<g id="cota-rotacao-lixamento" class="cota"><path class="d" d="M345,175 A30,30 0 0,0 375,145" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="360" y="260">giro entre etapas</text></g>
<rect class="y" x="720" y="125" width="80" height="60"/>
<text class="b" x="30" y="330">(b) Área preparada no equipamento</text>
<path class="s" d="M60,380 L520,380 L520,480 L60,480 z"/>
<rect class="w" x="240" y="400" width="70" height="55"/>
<g id="cota-area-preparada" class="cota"><line class="e" x1="240" y1="455" x2="240" y2="516"/><line class="e" x1="310" y1="455" x2="310" y2="516"/><line class="d" x1="240" y1="510" x2="310" y2="510" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="275.0" y="503">área polida</text></g>
<text class="n" x="600" y="400">réplica: filme aplicado sobre a área atacada,</text>
<text class="n" x="600" y="420">removido e analisado em bancada</text>
<text class="n" x="600" y="450">microscópio de campo: observar logo</text>
<text class="n" x="600" y="470">após o ataque (evita oxidação)</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
