<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="Mangote marítimo — içamento com balança, apoio em estrados e suportes, empilhamento">
<title>Mangote marítimo — içamento com balança, apoio em estrados e suportes, empilhamento (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Mangote marítimo — içamento com balança, apoio em estrados e suportes, empilhamento</text>
