<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Planicidade da alma entre enrijecedores, folga do enrijecedor e contraflecha de viga">
<title>Planicidade da alma entre enrijecedores, folga do enrijecedor e contraflecha de viga (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Planicidade da alma entre enrijecedores, folga do enrijecedor e contraflecha de viga</text>
<text class="b" x="40" y="70">(a) Painel da alma — régua sobre a alma</text>
<rect class="s" x="60" y="100" width="380" height="14"/>
<rect class="s" x="60" y="330" width="380" height="14"/>
<rect class="s" x="60" y="114" width="12" height="216"/>
<rect class="s" x="428" y="114" width="12" height="216"/>
<text class="n" x="450" y="230">enrijecedores</text>
<g id="cota-d-painel" class="cota"><line class="d" x1="73" y1="114" x2="73" y2="330" marker-start="url(#a)" marker-end="url(#a)"/><text x="82" y="220">d — menor dimensão do painel</text></g>
<text class="n" x="40" y="400">corte do painel:</text>
<path class="g" d="M60,450 Q250,480 440,450"/>
<line class="d" x1="60" y1="450" x2="440" y2="450"/>
<g id="cota-desvio-alma" class="cota"><line class="d" x1="250" y1="424" x2="250" y2="450" marker-end="url(#a)"/><line class="d" x1="250" y1="491" x2="250" y2="465" marker-end="url(#a)"/><line class="d" x1="250" y1="450" x2="250" y2="465"/><text x="270" y="500">desvio de planicidade</text></g>
<g id="cota-folga-enrijecedor" class="cota"><line class="d" x1="301" y1="88" x2="301" y2="114" marker-end="url(#a)"/><line class="d" x1="301" y1="150" x2="301" y2="124" marker-end="url(#a)"/><line class="d" x1="301" y1="114" x2="301" y2="124"/><text class="en" x="250" y="160">folga enrijecedor × mesa</text></g>
<rect class="sl" x="296" y="124" width="10" height="206"/>
<text class="b" x="500" y="70">(b) Contraflecha (camber)</text>
<path class="g" d="M500,330 Q680,250 860,330"/>
<path class="h" d="M500,330 Q680,280 860,330"/>
<line class="c" x1="500" y1="330" x2="860" y2="330"/>
<g id="cota-contraflecha" class="cota"><line class="d" x1="680" y1="356" x2="680" y2="330" marker-end="url(#a)"/><line class="d" x1="680" y1="264" x2="680" y2="290" marker-end="url(#a)"/><line class="d" x1="680" y1="330" x2="680" y2="290"/><text class="en" x="860" y="262">contraflecha no meio do vão</text></g>
<text class="n" x="560" y="360">tracejado = forma de contraflecha especificada</text>
<g id="cota-vao" class="cota"><line class="e" x1="500" y1="333" x2="500" y2="381"/><line class="e" x1="860" y1="333" x2="860" y2="381"/><line class="d" x1="500" y1="375" x2="860" y2="375" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="680" y="393">vão</text></g>
<text class="n" x="20" y="548">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
