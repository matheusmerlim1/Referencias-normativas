<path d="M300,300 q12,-14 24,0 q14,-12 24,4 q16,4 6,20 q12,14 -6,22 q-6,16 -24,8 q-14,12 -26,-2 q-16,0 -10,-18 q-12,-14 12,-34 z" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1.6" stroke-dasharray="5 2"/>
<text x="330" y="385" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">"nuvem" marca o trecho alterado</text>
<rect x="250" y="440" width="170" height="45" rx="0" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="335" y="458" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">REV · descrição e/ou folhas</text>
<text x="335" y="474" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">atingidas · finalidade</text>
<text x="160" y="470" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">marcas antigas retiradas</text>
<text x="740" y="235" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) folha / documento cancelado</text>
<rect x="590" y="255" width="300" height="240" rx="0" fill="#666" fill-opacity="0.03" stroke="#666" stroke-width="1.5"/>
<g transform="rotate(-32 740 375)"><rect x="600" y="350" width="280" height="50" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/><text x="740" y="383" text-anchor="middle" font-size="26" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333">CANCELADO</text></g>
<text x="740" y="515" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">faixa transversal na área útil, proporcional à página; só a 1ª folha é mantida</text>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
