<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Olhal de içamento de chapa com anéis de reforço e manilha</text>
<text class="b" x="20" y="58">(a) Elevação do olhal</text>
<path class="sl" d="M80,460 L80,300 A170,170 0 0,1 420,300 L420,460 z"/><circle class="y" cx="250" cy="300" r="95"/><circle class="w" cx="250" cy="300" r="42"/><circle class="wd" cx="250" cy="300" r="36"/>
<rect class="s" x="40" y="460" width="420" height="20"/><line class="c" x1="250" y1="110" x2="250" y2="500"/><line class="c" x1="60" y1="300" x2="440" y2="300"/>
<text class="n" x="270" y="250">pino</text>
<text class="n" x="320" y="405">anel de reforço</text>
<text class="n" x="50" y="500">estrutura içada</text>
<g id="cota-d-furo" class="cota"><line class="d" x1="300" y1="258" x2="300" y2="342" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="306" y="305">Ø furo</text></g>
