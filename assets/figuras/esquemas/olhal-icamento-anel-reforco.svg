<text class="b" x="740" y="58">(c) Manilha no olhal (folgas)</text>
<path class="g" d="M820,350 L820,170 A80,80 0 0,1 980,170 L980,350"/><rect class="w" x="800" y="350" width="200" height="22" rx="10"/><rect class="sl" x="880" y="230" width="40" height="230"/><circle class="w" cx="900" cy="361" r="11"/>
<path class="v" d="M900,120 Q860,140 900,160"/>
