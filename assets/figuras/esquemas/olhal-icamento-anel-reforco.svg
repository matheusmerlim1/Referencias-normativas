<g id="cota-d-anel" class="cota"><line class="d" x1="420" y1="220" x2="337" y2="262" marker-end="url(#a)"/><text class="" x="400" y="210">Ø externo do anel</text></g>
<g id="cota-base" class="cota"><line class="e" x1="80" y1="480" x2="80" y2="524"/><line class="e" x1="420" y1="480" x2="420" y2="524"/><line class="d" x1="80" y1="520" x2="420" y2="520" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="250.0" y="513">base de apoio</text></g>
