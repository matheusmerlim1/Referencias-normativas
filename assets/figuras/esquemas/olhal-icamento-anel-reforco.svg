<g id="cota-t-anel" class="cota"><line class="e" x1="630" y1="200" x2="630" y2="176"/><line class="e" x1="644" y1="200" x2="644" y2="176"/><line class="d" x1="630" y1="180" x2="644" y2="180" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="660" y="172">t anel</text></g>
<g id="cota-T" class="cota"><line class="e" x1="586" y1="420" x2="586" y2="474"/><line class="e" x1="644" y1="420" x2="644" y2="474"/><line class="d" x1="586" y1="470" x2="644" y2="470" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="615.0" y="463">T total</text></g>
