<g id="cota-folga-abertura" class="cota"><line class="d" x1="920" y1="300" x2="980" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="950.0" y="292">folga lateral</text></g>
<g id="cota-folga-cabo" class="cota"><line class="e" x1="920" y1="90" x2="1014" y2="90"/><line class="e" x1="920" y1="230" x2="1014" y2="230"/><line class="d" x1="1010" y1="90" x2="1010" y2="230" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="1016" y="160">folga para o cabo</text></g>
<g id="cota-fora-plano" class="cota"><line class="d" x1="1060" y1="520" x2="960" y2="440" marker-end="url(#a)"/><text class="" x="900" y="540">componente fora do plano</text></g>
<text class="n" x="20" y="628">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
