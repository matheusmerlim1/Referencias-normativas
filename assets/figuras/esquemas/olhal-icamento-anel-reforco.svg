<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="Olhal de içamento de chapa com anéis de reforço e manilha">
<title>Olhal de içamento de chapa com anéis de reforço e manilha (esquema ilustrativo)</title>
<style>
