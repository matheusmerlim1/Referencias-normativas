<g id="cota-arrancamento" class="cota"><path class="d" d="M127.8,344.5 A130,130 0 0,0 205.5,422.2" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="60" y="130">seção de arrancamento (γ)</text></g>
<text class="b" x="500" y="58">(b) Corte A-A (espessuras)</text>
