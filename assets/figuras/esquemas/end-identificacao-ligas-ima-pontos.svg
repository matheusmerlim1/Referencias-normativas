<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Identificação de metais e ligas — ímã, teste por pontos e polarização">
<title>Identificação de metais e ligas — ímã, teste por pontos e polarização (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Identificação de metais e ligas — ímã, teste por pontos e polarização</text>
<text class="b" x="30" y="62">(a) Teste do ímã</text>
<rect class="s" x="60" y="260" width="240" height="40"/>
<path class="r" d="M150,180 L150,250 L170,250 L170,200 L200,200 L200,250 L220,250 L220,180 z"/>
<text class="m n" x="185" y="170">ímã</text>
<text class="n" x="60" y="330">resposta magnética: forte,</text>
<text class="n" x="60" y="350">fraca ou nula</text>
<text class="b" x="330" y="62">(b) Teste por pontos (ataque químico)</text>
<rect class="s" x="340" y="260" width="240" height="40"/>
<path class="b2" d="M450,170 q-14,25 0,35 q14,-10 0,-35 z"/>
<ellipse class="y" cx="460" cy="258" rx="26" ry="6"/>
<text class="m n" x="460" y="160">gota de reagente</text>
<text class="n" x="340" y="330">cor da mancha × padrão certificado</text>
<text class="b" x="620" y="62">(c) Polarização eletroquímica</text>
<rect class="s" x="620" y="260" width="240" height="40"/>
<rect class="w" x="690" y="120" width="60" height="40"/>
<text class="m" x="720" y="145">+ −</text>
<path class="d" d="M700,160 L700,230 M740,160 L760,160 L760,300"/>
<rect class="b2" x="685" y="230" width="30" height="28"/>
<text class="n" x="620" y="330">corrente acelera a reação no papel</text>
<text class="n" x="620" y="350">umedecido com eletrólito</text>
<text class="n" x="60" y="430">Só para material recozido ou normalizado — têmpera, tratamento superficial e alterações de serviço</text>
<text class="n" x="60" y="450">(carbonetação, descarbonetação, difusão) podem falsear o resultado.</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
