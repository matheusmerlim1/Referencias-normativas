<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Solda de filete em junta T — tamanho (perna), garganta e espessuras T1 / T2">
<title>Solda de filete em junta T — tamanho (perna), garganta e espessuras T1 / T2 (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Solda de filete em junta T — tamanho (perna), garganta e espessuras T1 / T2</text>
<rect class="s" x="60" y="300" width="460" height="60"/>
<rect class="s" x="270" y="90" width="40" height="210"/>
<path class="r" d="M270,300 L200,300 L270,230 z"/>
<path class="r" d="M310,300 L380,300 L310,230 z"/>
<g id="cota-T1" class="cota"><line class="e" x1="270" y1="87" x2="270" y2="59"/><line class="e" x1="310" y1="87" x2="310" y2="59"/><line class="d" x1="244" y1="65" x2="270" y2="65" marker-end="url(#a)"/><line class="d" x1="336" y1="65" x2="310" y2="65" marker-end="url(#a)"/><line class="d" x1="270" y1="65" x2="310" y2="65"/><text x="330" y="72">T1 — peça mais fina</text></g>
<g id="cota-T2" class="cota"><line class="e" x1="523" y1="300" x2="556" y2="300"/><line class="e" x1="523" y1="360" x2="556" y2="360"/><line class="d" x1="550" y1="300" x2="550" y2="360" marker-start="url(#a)" marker-end="url(#a)"/><text x="560" y="335">T2 — peça mais grossa</text></g>
<g id="cota-perna" class="cota"><line class="e" x1="310" y1="303" x2="310" y2="346"/><line class="e" x1="380" y1="303" x2="380" y2="346"/><line class="d" x1="310" y1="340" x2="380" y2="340" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="345" y="375">perna (tamanho do filete)</text></g>
<g id="cota-perna2" class="cota"><line class="d" x1="311" y1="230" x2="311" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text x="316" y="250">perna</text></g>
<g id="cota-garganta" class="cota"><line class="d" x1="270" y1="300" x2="235" y2="265" marker-start="url(#a)" marker-end="url(#a)"/><text x="110" y="220">garganta teórica</text></g>
<line class="d" x1="175" y1="225" x2="241" y2="271" marker-end="url(#a)"/>
<text class="n" x="560" y="120">Tamanho do filete = perna do maior triângulo</text>
<text class="n" x="560" y="140">retângulo inscrito na seção da solda.</text>
<text class="n" x="560" y="170">T (Tabela 7.7) = espessura do metal de base:</text>
<text class="n" x="560" y="190">T1 ou T2 conforme o processo (ver ficha).</text>
<text class="n" x="560" y="220">Filete côncavo: garganta efetiva medida</text>
<text class="n" x="560" y="240">pela face côncava.</text>
<text class="n" x="20" y="508">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
