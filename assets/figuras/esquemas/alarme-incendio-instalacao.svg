<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 640" width="1320" height="640" role="img" aria-label="Detecção e alarme de incêndio — alturas, distâncias e área de cobertura">
<title>Detecção e alarme de incêndio — alturas, distâncias e área de cobertura (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Detecção e alarme de incêndio — alturas, distâncias e área de cobertura</text>
<text class="n b" x="60" y="80">elevação da parede</text>
<line class="g" x1="40" y1="500" x2="720" y2="500"/>
<rect x="40" y="500" width="680" height="10" fill="url(#hach)" stroke="none"/>
<line class="g" x1="40" y1="110" x2="720" y2="110"/>
<line class="g" x1="700" y1="110" x2="700" y2="500"/>
<rect class="sl" x="100" y="260" width="80" height="100"/>
<text class="n m" x="140" y="250">central</text>
<g id="cota-central" class="cota"><line class="e" x1="182" y1="310" x2="206" y2="310"/><line class="d" x1="200" y1="310" x2="200" y2="500" marker-start="url(#a)" marker-end="url(#a)"/><text x="210" y="420">interface da central</text></g>
<rect class="s" x="300" y="320" width="30" height="40"/>
<text class="n m" x="315" y="310">acionador</text>
<g id="cota-acionador" class="cota"><line class="e" x1="332" y1="340" x2="351" y2="340"/><line class="d" x1="345" y1="340" x2="345" y2="500" marker-start="url(#a)" marker-end="url(#a)"/><text x="355" y="440">acionador manual</text></g>
<rect class="s" x="420" y="170" width="40" height="30"/>
<text class="n m" x="440" y="160">avisador</text>
<g id="cota-avisador" class="cota"><line class="e" x1="462" y1="185" x2="486" y2="185"/><line class="d" x1="480" y1="185" x2="480" y2="500" marker-start="url(#a)" marker-end="url(#a)"/><text x="490" y="300">avisador</text></g>
<rect class="s" x="620" y="110" width="40" height="12"/>
<g id="cota-detector-parede" class="cota"><line class="d" x1="660" y1="140" x2="700" y2="140" marker-start="url(#a)" marker-end="url(#a)"/><text x="500" y="150">detector – parede/viga</text></g>
<line class="g" x1="560" y1="220" x2="560" y2="480"/>
<line class="g" x1="600" y1="220" x2="600" y2="480"/>
<g id="cota-separacao" class="cota"><line class="d" x1="560" y1="400" x2="600" y2="400" marker-start="url(#a)" marker-end="url(#a)"/><text x="520" y="380">separação (classe A)</text></g>
<text class="n b" x="780" y="80">planta (teto)</text>
<rect class="h" x="820" y="130" width="240" height="240"/>
<circle cx="940" cy="250" r="170" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3 4"/>
<circle class="s" cx="940" cy="250" r="6"/>
<g id="cota-cobertura" class="cota"><line class="d" x1="940" y1="250" x2="1060" y2="130" marker-start="url(#a)" marker-end="url(#a)"/><line class="d" x1="820" y1="400" x2="1060" y2="400" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="820" y1="372" x2="820" y2="406"/><line class="e" x1="1060" y1="372" x2="1060" y2="406"/><text x="740" y="430">cobertura (quadrado / raio)</text></g>
<text class="n" x="990" y="200">raio</text>
<path class="h" d="M800,560 L880,560 L880,500 L1100,500"/>
<rect class="s" x="1100" y="488" width="24" height="24"/>
<g id="cota-caminhamento" class="cota"><line class="d" x1="1050" y1="500" x2="1098" y2="500" marker-end="url(#a)"/><text x="780" y="600">caminhamento até o acionador</text></g>
<text class="n" x="20" y="628">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
