<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Vasos na sucção e na descarga de máquinas (amortecedores de pulsação, separadores)">
<title>Vasos na sucção e na descarga de máquinas (amortecedores de pulsação, separadores) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Vasos na sucção e na descarga de máquinas (amortecedores de pulsação, separadores)</text>
<rect class="s" x="360" y="160" width="180" height="100"/>
<text class="n m" x="450" y="215">compressor / bomba</text>
<rect class="sl" x="130" y="120" width="90" height="160"/>
<text class="n m" x="175" y="110">separador / vaso</text>
<text class="n m" x="175" y="300">sucção</text>
<rect class="sl" x="680" y="120" width="90" height="160"/>
<text class="n m" x="725" y="110">amortecedor</text>
<text class="n m" x="725" y="300">descarga</text>
<line class="g" x1="220" y1="200" x2="360" y2="200"/>
<line class="g" x1="540" y1="200" x2="680" y2="200"/>
<line class="g" x1="40" y1="200" x2="130" y2="200"/>
<line class="g" x1="770" y1="200" x2="860" y2="200"/>
<text class="n" x="40" y="335">Vasos separados da máquina: enquadrados pela NR-13 se atenderem 13.2.1. Câmaras internas da máquina não são vasos.</text>
<text class="n" x="20" y="348">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
