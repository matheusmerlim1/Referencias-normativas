<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="Imperfeições de solda (ASME B31.3) — reforço, mordedura, concavidade, penetração incompleta, falta de fusão">
