<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-label="Ensaios — aderência de revestimento, pites/frestas e trincamento sob tensão em meio agressivo">
<title>Ensaios — aderência de revestimento, pites/frestas e trincamento sob tensão em meio agressivo (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ensaios — aderência de revestimento, pites/frestas e trincamento sob tensão em meio agressivo</text>
<text x="160" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) aderência pull-off</text>
<rect x="40" y="220" width="240" height="30" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<rect x="40" y="210" width="240" height="10" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/>
<text x="160" y="270" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">substrato + revestimento</text>
<rect x="130" y="190" width="60" height="20" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="200" y="185" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">dolly colado</text>
<line x1="160" y1="190" x2="160" y2="110" stroke="#666" stroke-width="3"/>
<rect x="120" y="90" width="80" height="25" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="160" y="80" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">aderímetro (tração normal)</text>
<text x="500" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) pites e frestas (imersão)</text>
<path d="M400,110 L400,280 L600,280 L600,110" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1.5"/>
<rect x="402" y="150" width="196" height="128" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="500" y="140" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">solução de ensaio</text>
<rect x="470" y="180" width="60" height="70" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<rect x="485" y="200" width="30" height="10" fill="#666" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<text x="540" y="230" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cupom + fresta</text>
<text x="500" y="310" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">perda de massa e profundidade de pite</text>
<text x="830" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) corpo de prova tensionado</text>
<rect x="700" y="110" width="260" height="170" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1.5"/>
<text x="830" y="130" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">meio agressivo (H2S / vapor)</text>
<path d="M740,240 Q830,170 920,240" fill="none" stroke="#666" stroke-width="8"/>
<line x1="740" y1="240" x2="920" y2="240" stroke="#666" stroke-width="2"/>
<text x="830" y="265" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">CP flexionado / em tração constante</text>
<text x="830" y="310" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">aprovado se não trincar no tempo do ensaio</text>
<text x="12" y="342" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
