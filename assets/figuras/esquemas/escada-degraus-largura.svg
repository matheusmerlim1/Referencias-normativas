<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="Escada de degraus — largura útil (corte transversal)">
<title>Escada de degraus — largura útil (corte transversal)</title>
<defs><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Escada de degraus — largura útil (corte transversal)</text>
<rect x="80" y="260" width="16" height="70" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<rect x="380" y="260" width="16" height="70" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<rect x="96" y="270" width="284" height="12" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<line x1="88" y1="260" x2="88" y2="70" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="88" cy="64" r="7" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
<line x1="76" y1="160" x2="100" y2="160" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
<line x1="388" y1="260" x2="388" y2="70" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="388" cy="64" r="7" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
<line x1="376" y1="160" x2="400" y2="160" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
<line x1="96" y1="330" x2="96" y2="366" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="380" y1="330" x2="380" y2="366" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="96" y1="360" x2="380" y2="360" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="380.0,360.0 371.0,363.5 371.0,356.5" fill="#666"/>
<polygon points="96.0,360.0 105.0,356.5 105.0,363.5" fill="#666"/>
<text x="238.0" y="376" text-anchor="middle" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">w = largura útil / livre</text>
<text x="238" y="250" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">degrau</text>
<text x="88" y="348" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">longarina</text>
<text x="388" y="348" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">longarina</text>
<text x="238" y="55" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">corrimão / guarda-corpo dos dois lados</text>
<text x="450" y="60" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">w mínima (largura útil da escada):</text>
<text x="450" y="78" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NR-12: ≥ 0,60 m (lance único &lt; 1,50 m de altura: 0,50 m)</text>
<text x="450" y="96" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NR-18 e NR-34 (uso coletivo / provisória): ≥ 0,80 m</text>
<text x="450" y="114" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ISO 14122-3: ≥ 600 mm; de preferência 800 mm;</text>
<text x="450" y="132" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      1000 mm com cruzamento de várias pessoas</text>
<text x="450" y="150" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ABS: ≥ 700 mm (sentido único); ≥ 900 mm (dois sentidos)</text>
<text x="450" y="168" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ASTM F1166 (Tab. 24), mín. / preferida:</text>
<text x="450" y="186" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      manutenção 559 / 610 mm; com carga 710 / 864 mm;</text>
<text x="450" y="204" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      duas pessoas 965 / 1067 mm; primária 1219 / 1370 mm</text>
<text x="450" y="222" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">FPSO Peregrino: ≥ 1000 mm (1–2 níveis);</text>
<text x="450" y="240" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      ≥ 1200 mm (3 ou mais níveis); maca 2200 × 650 mm</text>
<text x="450" y="258" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Step ladder (ISO 14122-3):</text>
<text x="450" y="276" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      450 a 800 mm, de preferência 600 mm</text>
<text x="12" y="422" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo, sem escala — não é desenho da norma. Valores transcritos dos requisitos da ficha.</text>
</svg>