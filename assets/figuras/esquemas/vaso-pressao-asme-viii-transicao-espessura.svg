<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Ligação tampo × casco e chapas de espessuras diferentes — saia, rampa ℓ e diferença y">
<title>Ligação tampo × casco e chapas de espessuras diferentes — saia, rampa ℓ e diferença y (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Ligação tampo × casco e chapas de espessuras diferentes — saia, rampa ℓ e diferença y</text>
<text class="b" x="40" y="70">(a) Tampo conformado com saia reta</text>
<path class="s" d="M60,300 L260,300 Q330,300 360,240 L376,248 Q344,316 260,316 L60,316 z"/>
<rect class="s" x="60" y="316" width="200" height="14"/>
<g id="cota-saia" class="cota"><line class="e" x1="60" y1="297" x2="60" y2="264"/><line class="e" x1="260" y1="297" x2="260" y2="264"/><line class="d" x1="60" y1="270" x2="260" y2="270" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="160" y="263">saia reta (comprimento)</text></g>
<g id="cota-th" class="cota"><line class="d" x1="270" y1="274" x2="270" y2="300" marker-end="url(#a)"/><line class="d" x1="270" y1="342" x2="270" y2="316" marker-end="url(#a)"/><line class="d" x1="270" y1="300" x2="270" y2="316"/><text x="290" y="345">th</text></g>
<g id="cota-ts" class="cota"><line class="d" x1="80" y1="290" x2="80" y2="316" marker-end="url(#a)"/><line class="d" x1="80" y1="356" x2="80" y2="330" marker-end="url(#a)"/><line class="d" x1="80" y1="316" x2="80" y2="330"/><text class="en" x="60" y="360">ts</text></g>
<text class="b" x="480" y="70">(b) Topo de chapas de espessuras diferentes</text>
<path class="s" d="M480,220 L640,220 L720,245 L720,275 L480,275 z"/>
<rect class="s" x="725" y="245" width="150" height="30"/>
<line class="e" x1="640" y1="220" x2="640" y2="300"/>
<g id="cota-rampa" class="cota"><line class="e" x1="640" y1="217" x2="640" y2="179"/><line class="e" x1="720" y1="217" x2="720" y2="179"/><line class="d" x1="640" y1="185" x2="720" y2="185" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="680" y="178">ℓ — comprimento da rampa</text></g>
<g id="cota-y" class="cota"><line class="e" x1="723" y1="220" x2="756" y2="220"/><line class="e" x1="723" y1="245" x2="756" y2="245"/><line class="d" x1="750" y1="220" x2="750" y2="245" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="880" y="205">y — diferença de espessura</text></g>
<text class="n" x="480" y="360">ℓ relaciona-se a y pela inclinação (ver ficha);</text>
<text class="n" x="480" y="380">a rampa pode ficar no lado interno, externo ou em ambos.</text>
<text class="n" x="20" y="548">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
