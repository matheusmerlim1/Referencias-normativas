<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="ISO 9013 — peça cortada para montagem (afastamentos) e sobremetal de usinagem Bz">
<title>ISO 9013 — peça cortada para montagem (afastamentos) e sobremetal de usinagem Bz (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">ISO 9013 — peça cortada para montagem (afastamentos) e sobremetal de usinagem Bz</text>
<text class="b" x="40" y="70">(a) Peça cortada sem acabamento</text>
<rect class="s" x="80" y="140" width="300" height="140"/>
<rect class="h" x="76" y="136" width="308" height="148"/>
<g id="cota-A" class="cota"><line class="e" x1="80" y1="137" x2="80" y2="94"/><line class="e" x1="380" y1="137" x2="380" y2="94"/><line class="d" x1="80" y1="100" x2="380" y2="100" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="230" y="93">A — cota de montagem</text></g>
<g id="cota-dimensao-nominal" class="cota"><line class="e" x1="80" y1="283" x2="80" y2="326"/><line class="e" x1="380" y1="283" x2="380" y2="326"/><line class="d" x1="80" y1="320" x2="380" y2="320" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="230" y="338">dimensão nominal</text></g>
<g id="cota-afastamento" class="cota"><line class="d" x1="354" y1="135" x2="380" y2="135" marker-end="url(#a)"/><line class="d" x1="410" y1="135" x2="384" y2="135" marker-end="url(#a)"/><line class="d" x1="380" y1="135" x2="384" y2="135"/><text x="400" y="125">afastamento ±</text></g>
<text class="n" x="40" y="380">dimensão real = maior em cotas externas, menor em internas</text>
<text class="b" x="500" y="70">(b) Peça cortada com acabamento</text>
<rect class="sl" x="540" y="140" width="280" height="140"/>
<rect class="s" x="560" y="160" width="240" height="100"/>
<g id="cota-Bz" class="cota"><line class="d" x1="774" y1="209" x2="800" y2="209" marker-end="url(#a)"/><line class="d" x1="846" y1="209" x2="820" y2="209" marker-end="url(#a)"/><line class="d" x1="800" y1="209" x2="820" y2="209"/><text class="en" x="880" y="125">Bz — sobremetal</text></g>
<g id="cota-a" class="cota"><line class="e" x1="537" y1="140" x2="504" y2="140"/><line class="e" x1="537" y1="280" x2="504" y2="280"/><line class="d" x1="510" y1="140" x2="510" y2="280" marker-start="url(#a)" marker-end="url(#a)"/><text x="517" y="215">a</text></g>
<text class="n" x="540" y="320">contorno externo = corte; interno = após usinagem</text>
<text class="n" x="20" y="448">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
