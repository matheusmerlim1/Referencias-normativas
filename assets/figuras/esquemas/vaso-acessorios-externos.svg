<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Vaso de pressão — acessórios externos (saia, ancoragem, colunas, sela, olhal, orelhas)">
<title>Vaso de pressão — acessórios externos (saia, ancoragem, colunas, sela, olhal, orelhas) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .cc{fill:#bbb;fill-opacity:.5;stroke:#777;stroke-width:1.4}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .hc{fill:url(#hach);stroke:#666;stroke-width:1.2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Vaso de pressão — acessórios externos (saia, ancoragem, colunas, sela, olhal, orelhas)</text>
<text class="b" x="20" y="58">(a) Abertura reforçada na saia</text>
<rect class="s" x="60" y="80" width="16" height="200"/><rect class="w" x="40" y="160" width="60" height="40"/><rect class="sl" x="76" y="150" width="14" height="60"/>
<text class="n" x="30" y="300">parede da saia</text>
<g id="cota-solda-reforco-saia" class="cota"><line class="d" x1="150" y1="120" x2="92" y2="150" marker-end="url(#a)"/><text class="" x="110" y="112">solda S do reforço</text></g>
<g id="cota-reforco-saia" class="cota"><line class="d" x1="150" y1="240" x2="90" y2="205" marker-end="url(#a)"/><text class="" x="110" y="258">espessura n do reforço</text></g>
<text class="b" x="330" y="58">(b) Anel de ancoragem</text>
<rect class="s" x="360" y="80" width="12" height="160"/><rect class="s" x="340" y="240" width="140" height="14"/><rect class="s" x="420" y="190" width="40" height="12"/><rect class="sl" x="400" y="160" width="8" height="80"/><rect class="sl" x="470" y="160" width="8" height="80"/><line class="g" x1="440" y1="150" x2="440" y2="290"/><rect class="w" x="428" y="176" width="24" height="14"/><rect class="cc" x="320" y="254" width="200" height="30"/>
<text class="n" x="330" y="300">chumbador + chapa/arruela superior</text>
<g id="cota-arruela" class="cota"><line class="d" x1="490" y1="190" x2="490" y2="202" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="496" y="200">arruela de chapa</text></g>
<g id="cota-chumbador" class="cota"><line class="d" x1="540" y1="140" x2="446" y2="165" marker-end="url(#a)"/><text class="" x="470" y="132">Ø e quantidade do chumbador (no desenho do vaso)</text></g>
<text class="b" x="700" y="58">(c) Colunas de suporte</text>
<rect class="sl" x="770" y="90" width="120" height="110" rx="20"/><line class="g" x1="780" y1="190" x2="780" y2="300"/><line class="g" x1="880" y1="190" x2="880" y2="300"/><path class="h" d="M780,200 L880,300 M880,200 L780,300"/><line class="g" x1="740" y1="300" x2="920" y2="300"/>
<g id="cota-comprimento-coluna" class="cota"><line class="d" x1="900" y1="200" x2="900" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="906" y="250">coluna</text></g>
<g id="cota-altura-total" class="cota"><line class="d" x1="950" y1="90" x2="950" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="946" y="86">altura total</text></g>
<text class="b" x="20" y="370">(d) Sela de vaso horizontal</text>
<circle class="sl" cx="150" cy="480" r="65"/><path class="s" d="M93,512 A65,65 0 0,0 207,512 L215,580 L85,580 z"/><circle class="w" cx="150" cy="560" r="4"/><line class="g" x1="60" y1="580" x2="240" y2="580"/><line class="e" x1="150" y1="480" x2="93" y2="512"/><line class="e" x1="150" y1="480" x2="207" y2="512"/>
<g id="cota-angulo-sela" class="cota"><path class="d" d="M124.0,495.0 A30,30 0 0,0 176.0,495.0" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="150" y="440">ângulo da sela</text></g>
<g id="cota-furo-sela" class="cota"><line class="d" x1="260" y1="620" x2="154" y2="563" marker-end="url(#a)"/><text class="" x="170" y="640">furo de respiro da sela</text></g>
<g id="cota-ptfe" class="cota"><line class="d" x1="40" y1="650" x2="100" y2="582" marker-end="url(#a)"/><text class="" x="20" y="665">placa de PTFE (berço móvel)</text></g>
<text class="b" x="330" y="370">(e) Olhal de içamento no tampo</text>
<path class="g" d="M340,600 L340,520 A110,70 0 0,1 560,520 L560,600"/><path class="s" d="M430,452 L470,452 L470,410 A20,20 0 0,0 430,410 z"/><circle class="w" cx="450" cy="412" r="8"/><line class="v" x1="450" y1="404" x2="462" y2="390"/><line class="h" x1="450" y1="404" x2="450" y2="388"/>
<g id="cota-angulo-cabo" class="cota"><path class="d" d="M458.0,366.7 A46,46 0 0,0 450.0,366.0" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="500" y="405">ângulo cabo–vertical</text></g>
<g id="cota-chanfro-olhal" class="cota"><line class="d" x1="530" y1="470" x2="471" y2="452" marker-end="url(#a)"/><text class="" x="490" y="490">cantos chanfrados</text></g>
<text class="b" x="700" y="370">(f) Orelhas para escada e plataforma</text>
<rect class="sl" x="720" y="390" width="40" height="250"/><rect class="s" x="760" y="420" width="18" height="10"/><rect class="s" x="760" y="560" width="18" height="10"/><line class="g" x1="800" y1="400" x2="800" y2="640"/><line class="g" x1="830" y1="400" x2="830" y2="640"/><line class="g" x1="778" y1="425" x2="800" y2="425"/><line class="g" x1="778" y1="565" x2="800" y2="565"/><rect class="s" x="760" y="470" width="30" height="12"/>
<g id="cota-espacamento-orelhas" class="cota"><line class="e" x1="800" y1="425" x2="864" y2="425"/><line class="e" x1="800" y1="565" x2="864" y2="565"/><line class="d" x1="860" y1="425" x2="860" y2="565" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="866" y="500">espaçamento</text></g>
<text class="n" x="20" y="688">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
