<rect x="130" y="190" width="50" height="30" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="125" y="205" text-anchor="end" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">posicionador</text>
<text x="720" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) montagem de ensaio de vazão / ruído</text>
<line x1="470" y1="280" x2="970" y2="280" stroke="#666" stroke-width="6"/>
<path d="M698,264.6 L742,295.4 L742,264.6 L698,295.4 Z" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
