<rect x="350" y="270" width="30" height="50" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<rect x="215" y="270" width="30" height="40" fill="#666" fill-opacity="0.45" stroke="#666" stroke-width="1.5"/>
