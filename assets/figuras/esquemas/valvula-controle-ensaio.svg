<text x="230" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) válvula de controle</text>
<path d="M110,330 L110,260 L350,260 L350,330 Z" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/>
