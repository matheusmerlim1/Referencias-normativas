<g id="cota-montante" class="cota"><line x1="620" y1="286" x2="620" y2="320" stroke="#666" stroke-width="1"/><line x1="698" y1="286" x2="698" y2="320" stroke="#666" stroke-width="1"/><line x1="620" y1="320" x2="698" y2="320" stroke="#666" stroke-width="1.2"/><polygon points="620.0,320.0 629.0,316.5 629.0,323.5" fill="#666"/><polygon points="698.0,320.0 689.0,323.5 689.0,316.5" fill="#666"/><text x="659.0" y="314" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">2D</text></g>
<g id="cota-jusante" class="cota"><line x1="742" y1="286" x2="742" y2="320" stroke="#666" stroke-width="1"/><line x1="800" y1="286" x2="800" y2="320" stroke="#666" stroke-width="1"/><line x1="742" y1="320" x2="800" y2="320" stroke="#666" stroke-width="1.2"/><polygon points="742.0,320.0 751.0,316.5 751.0,323.5" fill="#666"/><polygon points="800.0,320.0 791.0,323.5 791.0,316.5" fill="#666"/><text x="771.0" y="314" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">6D</text></g>
<text x="520" y="270" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">vazão medida →</text>
<text x="900" y="240" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">microfone (ruído)</text>
<circle cx="900" cy="255" r="6" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="720" y="370" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Cv / Kv a partir de vazão e ΔP; cavitação quando ΔP se aproxima do limite</text>
<text x="12" y="402" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
