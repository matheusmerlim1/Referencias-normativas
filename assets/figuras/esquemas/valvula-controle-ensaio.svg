<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Válvula de controle — partes e montagem de ensaio (tomadas de pressão)">
<title>Válvula de controle — partes e montagem de ensaio (tomadas de pressão) (esquema ilustrativo)</title>
