<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-label="Cotagem em projeto de arquitetura — algarismos, linhas de chamada e entrelinhas">
<title>Cotagem em projeto de arquitetura — algarismos, linhas de chamada e entrelinhas (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Cotagem em projeto de arquitetura — algarismos, linhas de chamada e entrelinhas</text>
<rect class="sl" x="80" y="160" width="360" height="120"/>
<line class="e" x1="80" y1="286" x2="80" y2="386"/>
<line class="e" x1="440" y1="286" x2="440" y2="386"/>
<line class="d" x1="80" y1="380" x2="440" y2="380" marker-start="url(#a)" marker-end="url(#a)"/>
<rect class="s" x="230" y="352" width="60" height="20"/>
<g id="cota-algarismos" class="cota"><line class="e" x1="300" y1="352" x2="330" y2="352"/><line class="e" x1="300" y1="372" x2="330" y2="372"/><line class="d" x1="322" y1="330" x2="322" y2="352" marker-end="url(#a)"/><line class="d" x1="322" y1="394" x2="322" y2="372" marker-end="url(#a)"/><line class="d" x1="322" y1="352" x2="322" y2="372"/><text x="100" y="430">algarismos (altura e afastamento da linha de cota)</text></g>
<g id="cota-folga" class="cota"><line class="e" x1="442" y1="280" x2="476" y2="280"/><line class="e" x1="442" y1="286" x2="476" y2="286"/><line class="d" x1="470" y1="254" x2="470" y2="280" marker-end="url(#a)"/><line class="d" x1="470" y1="312" x2="470" y2="286" marker-end="url(#a)"/><line class="d" x1="470" y1="280" x2="470" y2="286"/><text x="480" y="290">folga da linha de chamada</text></g>
<text class="n b" x="640" y="120">textos e coordenadas</text>
<rect class="s" x="640" y="150" width="220" height="16"/>
<rect class="s" x="640" y="176" width="180" height="16"/>
<rect class="s" x="640" y="202" width="200" height="16"/>
<g id="cota-entrelinhas" class="cota"><line class="e" x1="638" y1="166" x2="609" y2="166"/><line class="e" x1="638" y1="176" x2="609" y2="176"/><line class="d" x1="615" y1="140" x2="615" y2="166" marker-end="url(#a)"/><line class="d" x1="615" y1="202" x2="615" y2="176" marker-end="url(#a)"/><line class="d" x1="615" y1="166" x2="615" y2="176"/><text x="640" y="250">entrelinhas / altura das letras</text></g>
<text class="n" x="20" y="468">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
