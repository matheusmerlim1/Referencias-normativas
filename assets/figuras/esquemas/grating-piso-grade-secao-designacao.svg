<text x="470" y="186" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      espaçamento das vigas de ligação (l)</text>
<text x="470" y="204" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Exemplo da norma: Grade de piso, ABNT NBR 15708-3,</text>
<text x="470" y="222" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      38 mm x 25 mm x 150 mm</text>
<text x="470" y="240" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Vigas de ligação: transversais, chavetadas e</text>
<text x="470" y="258" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      coladas, mantêm as portantes em posição</text>
<text x="470" y="276" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Superfície: áspera e antiderrapante</text>
<text x="12" y="462" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo, sem escala — não é desenho da norma. Valores transcritos dos requisitos da ficha.</text>
