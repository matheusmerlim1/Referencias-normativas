<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" width="1000" height="445" role="img" aria-label="Instalação de produção offshore — arranjo por áreas de risco">
<title>Instalação de produção offshore — arranjo por áreas de risco (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Instalação de produção offshore — arranjo por áreas de risco</text>
<rect x="60" y="80" width="880" height="300" fill="#666" fill-opacity="0.04" stroke="#666" stroke-width="1.5"/>
<rect x="80" y="140" width="160" height="160" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/><text x="160.0" y="217.0" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">poços / cabeças</text><text x="160.0" y="231.0" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">de poço</text>
<rect x="260" y="140" width="260" height="160" fill="#666" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/><text x="390.0" y="217.0" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">processo</text><text x="390.0" y="231.0" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(separação, compressão)</text>
<rect x="540" y="140" width="180" height="160" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/><text x="630.0" y="217.0" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">utilidades</text><text x="630.0" y="231.0" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(geração, água)</text>
<rect x="740" y="140" width="180" height="160" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1.5"/><text x="830.0" y="217.0" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">acomodação</text><text x="830.0" y="231.0" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">e rota de fuga</text>
<line x1="80" y1="330" x2="920" y2="330" stroke="#666" stroke-width="1"/>
<text x="500" y="350" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">afastamento crescente do risco →</text>
<line x1="390" y1="360" x2="820" y2="360" stroke="#666" stroke-width="1.5"/><polygon points="820.0,360.0 811.0,363.5 811.0,356.5" fill="#666"/>
<path d="M300,140 Q380,60 470,110 Q540,60 600,120" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="470" y="70" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">nuvem de gás (dispersão)</text>
<line x1="100" y1="140" x2="60" y2="40" stroke="#666" stroke-width="3"/>
<text x="56" y="36" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">flare</text>
<rect x="800" y="110" width="60" height="20" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="830" y="104" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">baleeiras</text>
<text x="500" y="410" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">parede corta-fogo entre processo e acomodação; detecção de gás e chama; ventilação</text>
<text x="12" y="437" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
