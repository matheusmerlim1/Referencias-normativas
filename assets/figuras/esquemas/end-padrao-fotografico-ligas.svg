<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Identificação de ligas por testes químicos (QS) e eletroquímicos (PE) — ficha do padrão fotográfico">
<title>Identificação de ligas por testes químicos (QS) e eletroquímicos (PE) — ficha do padrão fotográfico (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Identificação de ligas por testes químicos (QS) e eletroquímicos (PE) — ficha do padrão fotográfico</text>
<text x="260" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) ficha de um padrão fotográfico</text>
<rect x="60" y="80" width="400" height="200" fill="#666" fill-opacity="0.04" stroke="#666" stroke-width="1.5"/>
<rect x="90" y="110" width="180" height="120" fill="#c96" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<circle cx="180" cy="170" r="30" fill="#6a6" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="180" y="175" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">mancha</text>
<g id="cota-foto-largura" class="cota"><line x1="90" y1="230" x2="90" y2="250" stroke="#666" stroke-width="1"/><line x1="270" y1="230" x2="270" y2="250" stroke="#666" stroke-width="1"/><line x1="90" y1="250" x2="270" y2="250" stroke="#666" stroke-width="1.2"/><polygon points="90.0,250.0 99.0,253.5 99.0,246.5" fill="#666"/><polygon points="270.0,250.0 261.0,246.5 261.0,253.5" fill="#666"/><text x="180" y="268" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">largura da foto</text></g>
<g id="cota-foto-altura" class="cota"><line x1="90" y1="110" x2="70" y2="110" stroke="#666" stroke-width="1"/><line x1="90" y1="230" x2="70" y2="230" stroke="#666" stroke-width="1"/><line x1="70" y1="110" x2="70" y2="230" stroke="#666" stroke-width="1.2"/><polygon points="70.0,110.0 66.5,119.0 73.5,119.0" fill="#666"/><polygon points="70.0,230.0 73.5,221.0 66.5,221.0" fill="#666"/><text x="64" y="150" text-anchor="end" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura</text></g>
<text x="290" y="130" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">FOTO nº (sequencial)</text>
<text x="290" y="160" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">TESTE (QS-xx / PE-xx)</text>
<text x="290" y="190" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">MATERIAL</text>
<text x="290" y="220" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">DESCRIÇÃO (cor/reação)</text>
<text x="700" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) teste por pontos (QS) e por polarização (PE)</text>
<rect x="560" y="200" width="300" height="30" fill="#999" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="710" y="250" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">superfície metálica limpa</text>
<path d="M620,200 Q640,186 660,200 Z" fill="#6a6" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="640" y="175" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">gota de reagente</text>
<line x1="640" y1="150" x2="640" y2="182" stroke="#666" stroke-width="1"/>
<rect x="760" y="150" width="40" height="50" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1.5"/>
<text x="780" y="140" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">papel/eletrólito + fonte (PE)</text>
<line x1="780" y1="200" x2="780" y2="205" stroke="#666" stroke-width="2"/>
<line x1="800" y1="150" x2="850" y2="120" stroke="#666" stroke-width="1.2"/>
<text x="855" y="118" text-anchor="start" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">+</text>
<text x="710" y="300" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cor da reação comparada à foto padrão</text>
<text x="710" y="320" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(ímã + pontos: identificação de liga)</text>
<text x="12" y="372" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
