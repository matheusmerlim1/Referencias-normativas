</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Desaerador — componentes e pontos de dano típicos</text>
<text class="b" x="30" y="62">Desaerador sobre vaso de armazenamento</text>
<rect class="sl" x="380" y="100" width="120" height="220" rx="40"/>
<line class="g" x1="395" y1="170" x2="485" y2="170"/>
<line class="g" x1="395" y1="195" x2="485" y2="195"/>
<line class="g" x1="395" y1="220" x2="485" y2="220"/>
<line class="g" x1="395" y1="245" x2="485" y2="245"/>
<line class="g" x1="395" y1="270" x2="485" y2="270"/>
<text class="n" x="510" y="180">bandejas</text>
<circle class="r" cx="440" cy="130" r="8"/><circle class="r" cx="420" cy="140" r="6"/><circle class="r" cx="460" cy="140" r="6"/>
<text class="n" x="510" y="130">válvulas de spray</text>
