<text class="n" x="530" y="300">x–x: eixo de maior inércia (Ix, Wx, ix)</text>
<text class="n" x="530" y="320">y–y: eixo de menor inércia (Iy, Wy, iy)</text>
<text class="n" x="530" y="350">A = área da seção; massa por metro</text>
<text class="n" x="530" y="370">e superfície (pintura) por metro</text>
<text class="n" x="530" y="400">Mesas de faces paralelas;</text>
<text class="n" x="530" y="420">r = raio de concordância alma–mesa</text>
<text class="n" x="20" y="588">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
