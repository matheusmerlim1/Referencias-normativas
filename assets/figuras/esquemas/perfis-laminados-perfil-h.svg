</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Perfil H de mesas paralelas (HEA / HEB, DIN 1025-2 e -3) — h, b, s, t, r</text>
<path class="s" d="M150,110 L450,110 L450,142 L332,142 A22,22 0 0 0 310,164 L310,416 A22,22 0 0 0 332,438 L450,438 L450,470 L150,470 L150,438 L268,438 A22,22 0 0 0 290,416 L290,164 A22,22 0 0 0 268,142 L150,142 z"/>
<line class="c" x1="110" y1="290" x2="490" y2="290"/>
<line class="c" x1="300" y1="70" x2="300" y2="510"/>
