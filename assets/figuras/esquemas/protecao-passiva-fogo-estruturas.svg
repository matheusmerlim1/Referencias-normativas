<title>Proteção passiva contra fogo — área sujeita a incêndio e extensão do revestimento nas estruturas (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Proteção passiva contra fogo — área sujeita a incêndio e extensão do revestimento nas estruturas</text>
<text x="250" y="48" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) planta — área sujeita a incêndio</text>
<circle cx="250" cy="250" r="50" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<text x="250" y="254" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">equipamento</text>
<circle cx="250" cy="250" r="150" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1.5" stroke-dasharray="6 3"/>
