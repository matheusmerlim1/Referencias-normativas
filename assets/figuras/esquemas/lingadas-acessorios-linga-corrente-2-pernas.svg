<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-label="Linga de corrente de 2 pernas — componentes e comprimento da perna">
<title>Linga de corrente de 2 pernas — componentes e comprimento da perna (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
