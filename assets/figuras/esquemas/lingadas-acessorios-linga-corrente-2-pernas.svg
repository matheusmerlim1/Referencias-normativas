<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Linga de corrente de 2 pernas — componentes e comprimento da perna</text>
<ellipse cx="380" cy="80" rx="22" ry="36" transform="rotate(0 380 80)" fill="none" stroke="#666" stroke-width="6"/>
<text class="n" x="410" y="75">anel de carga principal</text>
<rect class="s" x="342" y="116" width="16" height="22"/>
<line x1="350" y1="138" x2="180" y2="380" stroke="#666" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 4"/>
