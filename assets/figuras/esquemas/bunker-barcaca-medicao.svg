<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Fornecimento de bunker por barcaça — medição de tanque, calado, trim/banda, mangote e fluxômetro">
<title>Fornecimento de bunker por barcaça — medição de tanque, calado, trim/banda, mangote e fluxômetro (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Fornecimento de bunker por barcaça — medição de tanque, calado, trim/banda, mangote e fluxômetro</text>
