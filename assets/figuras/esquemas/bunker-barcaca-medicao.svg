<g id="cota-sondagem" class="cota"><line x1="292" y1="420" x2="322" y2="420" stroke="#666" stroke-width="1"/><line x1="292" y1="380" x2="322" y2="380" stroke="#666" stroke-width="1"/><line x1="322" y1="420" x2="322" y2="380" stroke="#666" stroke-width="1.2"/><polygon points="322.0,420.0 325.5,411.0 318.5,411.0" fill="#666"/><polygon points="322.0,380.0 318.5,389.0 325.5,389.0" fill="#666"/><text x="328" y="398" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">nível (sondagem)</text></g>
