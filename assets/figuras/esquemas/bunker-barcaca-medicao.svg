<line x1="820" y1="490" x2="940" y2="490" stroke="#666" stroke-width="1" stroke-dasharray="3 3"/>
<g id="cota-banda" class="cota"><path d="M910.0,490.0 A90,90 0 0 0 909.1,477.5" fill="none" stroke="#666" stroke-width="1.2"/><text x="830" y="520" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">banda (adernamento)</text></g>
<text x="12" y="592" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
