<g id="cota-calado" class="cota"><line x1="70" y1="400" x2="70" y2="450" stroke="#666" stroke-width="1.2"/><polygon points="70.0,400.0 66.5,409.0 73.5,409.0" fill="#666"/><polygon points="70.0,450.0 73.5,441.0 66.5,441.0" fill="#666"/><text x="76" y="440" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">calado</text></g>
<g id="cota-trim" class="cota"><line x1="60" y1="470" x2="60" y2="510" stroke="#666" stroke-width="1"/><line x1="480" y1="470" x2="480" y2="510" stroke="#666" stroke-width="1"/><line x1="60" y1="510" x2="480" y2="510" stroke="#666" stroke-width="1.2"/><polygon points="60.0,510.0 69.0,513.5 69.0,506.5" fill="#666"/><polygon points="480.0,510.0 471.0,506.5 471.0,513.5" fill="#666"/><text x="270" y="505" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">trim = calado AR − AV (águas parelhas: zero)</text></g>
<text x="880" y="455" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">seção transversal</text>
