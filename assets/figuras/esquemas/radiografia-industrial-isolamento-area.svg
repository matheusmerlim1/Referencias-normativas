<text x="760" y="484" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(chave controlada)</text>
<rect x="690" y="410" width="140" height="110" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1" stroke-dasharray="6 3"/>
<g id="cota-isolamento-armazem" class="cota"><line x1="830" y1="410" x2="860" y2="410" stroke="#666" stroke-width="1"/><line x1="860" y1="410" x2="860" y2="520" stroke="#666" stroke-width="1.2"/><polygon points="860.0,410.0 856.5,419.0 863.5,419.0" fill="#666"/><polygon points="860.0,520.0 863.5,511.0 856.5,511.0" fill="#666"/><text x="866" y="469.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">limite do isolamento</text></g>
<text x="700" y="560" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">placa com símbolo de radiação, empresa,</text>
<text x="700" y="574" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">endereço e telefone; sem outros perigosos</text>
<text x="12" y="682" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
