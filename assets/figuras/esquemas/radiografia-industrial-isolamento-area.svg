<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="Radiografia industrial — isolamento da área, colimação e verificação do irradiador">
<title>Radiografia industrial — isolamento da área, colimação e verificação do irradiador (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Radiografia industrial — isolamento da área, colimação e verificação do irradiador</text>
<text x="300" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) planta — raio de balizamento</text>
<circle cx="300" cy="360" r="250" fill="#666" fill-opacity="0.04" stroke="#666" stroke-width="1.5" stroke-dasharray="8 4"/>
<circle cx="300" cy="360" r="140" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
