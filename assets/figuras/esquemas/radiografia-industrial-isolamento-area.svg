<rect x="260" y="350" width="80" height="20" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="300" y="394" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">peça / solda</text>
<circle cx="300" cy="330" r="7" fill="#666" fill-opacity="0.8" stroke="#666" stroke-width="1"/>
<text x="312" y="326" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">fonte</text>
<path d="M300,330 L240,250 L360,250 Z" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
