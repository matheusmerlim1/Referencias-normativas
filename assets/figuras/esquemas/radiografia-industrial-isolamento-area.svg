<g id="cota-raio-colimado" class="cota"><line x1="300" y1="360" x2="160" y2="360" stroke="#666" stroke-width="1.2"/><polygon points="160.0,360.0 169.0,363.5 169.0,356.5" fill="#666"/><text x="165" y="352" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">d reduzida com colimador</text></g>
<text x="130" y="560" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">limite: taxa do público</text>
