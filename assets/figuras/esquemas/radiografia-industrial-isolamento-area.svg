<g id="cota-irradiador-1m" class="cota"><line x1="820" y1="200" x2="820" y2="240" stroke="#666" stroke-width="1"/><line x1="926" y1="174" x2="926" y2="240" stroke="#666" stroke-width="1"/><line x1="820" y1="240" x2="926" y2="240" stroke="#666" stroke-width="1.2"/><polygon points="820.0,240.0 829.0,243.5 829.0,236.5" fill="#666"/><polygon points="926.0,240.0 917.0,236.5 917.0,243.5" fill="#666"/><text x="873.0" y="234" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">distância de medição</text></g>
<g id="cota-superficie" class="cota"><line x1="700" y1="110" x2="660" y2="90" stroke="#666" stroke-width="1.2"/><polygon points="660.0,90.0 666.5,97.2 669.6,90.9" fill="#666"/><text x="600" y="82" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">superfície da carcaça</text></g>
<line x1="820" y1="160" x2="860" y2="160" stroke="#666" stroke-width="3"/>
<path d="M860,150 Q900,120 940,160" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
<text x="760" y="290" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cabo de comando e engates conferidos</text>
<text x="760" y="304" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">com gabarito antes do início</text>
<text x="790" y="380" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) armazenamento temporário</text>
<rect x="700" y="420" width="120" height="90" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
