<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Juntas planas (ASME B16.21) e juntas encamisada / ranhurada (B16.20) — diâmetros e espessuras">
<title>Juntas planas (ASME B16.21) e juntas encamisada / ranhurada (B16.20) — diâmetros e espessuras (esquema ilustrativo)</title>
<style>
