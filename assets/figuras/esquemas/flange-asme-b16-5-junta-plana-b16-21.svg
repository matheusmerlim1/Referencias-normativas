<g id="cota-OD" class="cota"><line class="e" x1="70" y1="233" x2="70" y2="346"/><line class="e" x1="250" y1="233" x2="250" y2="346"/><line class="d" x1="70" y1="340" x2="250" y2="340" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="160" y="358">Ø ext.</text></g>
<line class="e" x1="70" y1="230" x2="70" y2="345"/>
