<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Caldeira em ambiente aberto — afastamentos e saídas (13.4.2.3 / 13.4.2.4)">
<title>Caldeira em ambiente aberto — afastamentos e saídas (13.4.2.3 / 13.4.2.4) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Caldeira em ambiente aberto — afastamentos e saídas (13.4.2.3 / 13.4.2.4)</text>
<rect class="s" x="330" y="170" width="220" height="120"/>
<text class="b m" x="440" y="235">CALDEIRA</text>
<rect class="h" x="230" y="110" width="420" height="240"/>
<text class="n" x="240" y="105">limite do afastamento mínimo</text>
<rect class="sl" x="40" y="170" width="120" height="120"/>
<text class="n m" x="100" y="160">outras instalações</text>
<rect class="sl" x="720" y="170" width="140" height="120"/>
<text class="n m" x="790" y="160">depósito de combustível</text>
<line class="g" x1="40" y1="420" x2="860" y2="420"/>
<text class="n m" x="440" y="445">limite de terceiros / via pública</text>
<g id="cota-afastamento" class="cota"><line class="d" x1="160" y1="230" x2="330" y2="230" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="245" y="222">afastamento</text></g>
<g id="cota-afastamento2" class="cota"><line class="d" x1="550" y1="230" x2="720" y2="230" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="635" y="222">afastamento</text></g>
<g id="cota-afastamento3" class="cota"><line class="d" x1="440" y1="290" x2="440" y2="420" marker-start="url(#a)" marker-end="url(#a)"/><text x="450" y="370">afastamento</text></g>
<text class="n" x="340" y="140">saída 1</text>
<line class="d" x1="360" y1="145" x2="360" y2="168" marker-end="url(#a)"/>
<text class="n" x="520" y="320">saída 2</text>
<line class="d" x1="540" y1="308" x2="540" y2="292" marker-end="url(#a)"/>
<text class="n" x="40" y="464"></text>
<text class="n" x="20" y="468">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
