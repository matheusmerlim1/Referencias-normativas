<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Laboratório — frasco de amostra, titulação potenciométrica e coluna de percolação">
<!--P7A-->
<title>Laboratório — frasco de amostra, titulação potenciométrica e coluna de percolação (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Laboratório — frasco de amostra, titulação potenciométrica e coluna de percolação</text>
<text x="160" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) frasco de amostra</text>
<path d="M110,140 h100 v300 h-100 z" fill="#666" fill-opacity="0.05" stroke="#666" stroke-width="2"/>
<rect x="140" y="110" width="40" height="30" rx="0" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<rect x="112" y="165" width="96" height="273" rx="0" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<g id="cota-frasco-folga" class="cota"><line x1="230" y1="140" x2="230" y2="165" stroke="#666" stroke-width="1.2"/><polygon points="230.0,140.0 226.5,149.0 233.5,149.0" fill="#666"/><polygon points="230.0,165.0 233.5,156.0 226.5,156.0" fill="#666"/><text x="236" y="158" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espaço livre sob a borda</text></g>
<text x="160" y="470" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">boca estreita, batoque e tampa</text>
<text x="480" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) titulação potenciométrica</text>
<path d="M400,260 v150 h150 v-150" fill="#666" fill-opacity="0.05" stroke="#666" stroke-width="2"/>
<rect x="402" y="320" width="146" height="88" rx="0" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<line x1="440" y1="120" x2="440" y2="360" stroke="#666" stroke-width="3"/>
<text x="445" y="130" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eletrodo de prata</text>
<line x1="510" y1="120" x2="510" y2="360" stroke="#666" stroke-width="3"/>
<text x="515" y="150" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eletrodo de referência</text>
<rect x="495" y="80" width="30" height="40" rx="0" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="530" y="95" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bureta (titulante)</text>
<rect x="450" y="395" width="50" height="8" rx="0" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="475" y="430" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">agitador magnético</text>
<text x="475" y="460" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">curva potencial × volume: degraus = H2S, RSH</text>
<text x="800" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) coluna de percolação</text>
<rect x="770" y="90" width="60" height="360" rx="0" fill="#666" fill-opacity="0.05" stroke="#666" stroke-width="2"/>
<rect x="772" y="200" width="56" height="248" rx="0" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<text x="845" y="330" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">adsorvente</text>
<rect x="772" y="150" width="56" height="50" rx="0" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/>
<g id="cota-coluna-diametro" class="cota"><line x1="770" y1="450" x2="770" y2="480" stroke="#666" stroke-width="1"/><line x1="830" y1="450" x2="830" y2="480" stroke="#666" stroke-width="1"/><line x1="770" y1="480" x2="830" y2="480" stroke="#666" stroke-width="1.2"/><polygon points="770.0,480.0 779.0,483.5 779.0,476.5" fill="#666"/><polygon points="830.0,480.0 821.0,476.5 821.0,483.5" fill="#666"/><text x="800.0" y="474.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø da coluna</text></g>
<g id="cota-coluna-comprimento" class="cota"><line x1="740" y1="90" x2="740" y2="450" stroke="#666" stroke-width="1.2"/><polygon points="740.0,90.0 736.5,99.0 743.5,99.0" fill="#666"/><polygon points="740.0,450.0 743.5,441.0 736.5,441.0" fill="#666"/><text x="734" y="270" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">comprimento</text></g>
<g id="cota-nivel-acima" class="cota"><line x1="880" y1="150" x2="880" y2="200" stroke="#666" stroke-width="1.2"/><polygon points="880.0,150.0 876.5,159.0 883.5,159.0" fill="#666"/><polygon points="880.0,200.0 883.5,191.0 876.5,191.0" fill="#666"/><text x="886" y="180" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">líquido acima do leito</text></g>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
