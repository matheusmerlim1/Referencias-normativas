<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Teste de pressão em serviço — manômetro, espessura e raio de isolamento">
<title>Teste de pressão em serviço — manômetro, espessura e raio de isolamento (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Teste de pressão em serviço — manômetro, espessura e raio de isolamento</text>
<text class="b" x="30" y="62">(a) Vaso em teste e isolamento da área (planta/elevação)</text>
<circle class="h" cx="260" cy="300" r="190"/>
<rect class="sl" x="150" y="250" width="220" height="100" rx="50"/>
<rect class="w" x="250" y="210" width="20" height="40"/><circle class="w" cx="260" cy="195" r="18"/>
<text class="n" x="300" y="190">manômetro</text>
<g id="cota-manometro" class="cota"><path class="d" d="M248,188 A14,14 0 1,1 272,188" marker-end="url(#a)"/><text class="m" x="260" y="165">fundo de escala</text></g>
<g id="cota-raio-isolamento" class="cota"><line class="d" x1="260" y1="520" x2="450" y2="520" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="355" y="512">raio de isolamento r</text></g>
<line class="e" x1="260" y1="300" x2="260" y2="526"/><line class="e" x1="450" y1="300" x2="450" y2="526"/>
<g id="cota-espessura-parede" class="cota"><line class="e" x1="370" y1="250" x2="401" y2="250"/><line class="e" x1="370" y1="266" x2="401" y2="266"/><line class="d" x1="395" y1="250" x2="395" y2="266" marker-start="url(#a)" marker-end="url(#a)"/><text x="403" y="262">espessura da parede</text></g>
<text class="b" x="540" y="62">(b) Sequência de pressurização (esquema)</text>
<path class="g" d="M560,480 L860,480 M560,480 L560,120"/>
<path class="v" d="M560,480 L600,400 L630,400 L660,330 L690,330 L720,250 L760,250 L790,180 L830,180 L850,480"/>
<text class="n" x="565" y="115">pressão (% da de teste)</text>
<text class="n" x="780" y="500">tempo</text>
<text class="n" x="560" y="530">taxas e patamares dependem do grupo de risco</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
