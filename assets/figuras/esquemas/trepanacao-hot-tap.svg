<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 660" width="910" height="660" role="img" aria-label="Soldagem e trepanação em operação — distâncias e faixas">
<title>Soldagem e trepanação em operação — distâncias e faixas (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Soldagem e trepanação em operação — distâncias e faixas</text>
<text class="b" x="20" y="62">(a) Conexão soldada em linha em operação (elevação)</text>
<rect class="sl" x="40" y="200" width="820" height="60"/>
<text class="n" x="90" y="250">tubo em operação (fluxo →)</text>
<rect class="wd" x="60" y="180" width="14" height="100"/>
<text class="n" x="40" y="170">flange</text>
<rect class="wd" x="760" y="196" width="6" height="68"/>
<text class="n" x="740" y="186">solda existente</text>
<rect class="r" x="380" y="186" width="200" height="88" fill-opacity=".18"/>
<text class="n m" x="480" y="240">dupla-calha</text>
<rect class="s" x="455" y="110" width="50" height="76"/>
<rect class="wd" x="440" y="98" width="80" height="12"/>
<rect class="sl" x="445" y="60" width="70" height="38"/>
<text class="n" x="530" y="80">válvula + máquina de trepanação</text>
<g id="cota-dist-flange" class="cota"><line class="e" x1="74" y1="280" x2="74" y2="330"/><line class="e" x1="380" y1="280" x2="380" y2="330"/><line class="d" x1="74" y1="322" x2="380" y2="322" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="160" y="344">distância ao flange</text></g>
<g id="cota-dist-solda" class="cota"><line class="e" x1="580" y1="280" x2="580" y2="330"/><line class="e" x1="763" y1="264" x2="763" y2="330"/><line class="d" x1="580" y1="322" x2="763" y2="322" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="610" y="344">distância à solda</text></g>
<g id="cota-faixa-ut" class="cota"><rect class="h" x="330" y="192" width="300" height="76" fill="none"/><line class="d" x1="330" y1="180" x2="480" y2="180" marker-start="url(#a)" marker-end="url(#a)"/><line class="d" x1="630" y1="180" x2="480" y2="180" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="330" y="172">faixa inspecionada por US</text></g>
<g id="cota-reforco-removido" class="cota"><line class="d" x1="580" y1="140" x2="620" y2="140" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="620" y1="140" x2="620" y2="196"/><text class="n b" x="590" y="132">reforço removido além</text></g>
<g id="cota-mata-junta" class="cota"><line class="e" x1="380" y1="280" x2="360" y2="300"/><text class="n b" x="250" y="312">mata-junta além da extremidade</text></g>
<text class="b" x="20" y="400">(b) Parede, eletrodo e abertura da junta</text>
<rect class="sl" x="40" y="470" width="300" height="40"/>
<text class="n" x="50" y="530">parede do tubo</text>
<g id="cota-espessura" class="cota"><line class="d" x1="350" y1="470" x2="350" y2="510" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="340" y1="470" x2="356" y2="470"/><line class="e" x1="340" y1="510" x2="356" y2="510"/><text class="n b" x="360" y="496">espessura t</text></g>
<line class="g" x1="180" y1="470" x2="230" y2="420"/>
<rect class="s" x="226" y="408" width="10" height="16"/>
<g id="cota-eletrodo" class="cota"><line class="e" x1="205" y1="445" x2="150" y2="430"/><text class="n b" x="40" y="428">Ø do eletrodo</text></g>
<rect class="r" x="120" y="450" width="80" height="20" fill-opacity=".3"/>
<g id="cota-abertura-calha" class="cota"><line class="d" x1="196" y1="458" x2="206" y2="458" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="230" y="456">abertura da calha</text></g>
<g id="cota-cavaco" class="cota"><line class="v" x1="80" y1="470" x2="80" y2="490"/><text class="n" x="40" y="560">amostra de cavaco abaixo da superfície</text></g>
<g id="cota-laminacao" class="cota"><line class="h" x1="60" y1="492" x2="320" y2="492"/><text class="n" x="40" y="580">dupla laminação: afastar a solda</text></g>
<text class="b" x="500" y="400">(c) Área livre e nível do tanque</text>
<rect class="sl" x="520" y="440" width="140" height="160"/>
<rect class="bl" x="520" y="500" width="140" height="100"/>
<text class="n" x="530" y="592">produto</text>
<rect class="r" x="658" y="470" width="10" height="20"/>
<text class="n" x="672" y="470">ponto de solda</text>
<g id="cota-nivel-tanque" class="cota"><line class="d" x1="690" y1="480" x2="690" y2="500" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="660" y1="500" x2="700" y2="500"/><text class="n b" x="704" y="500">nível acima do serviço</text></g>
<g id="cota-regiao-livre" class="cota"><circle class="h" cx="770" cy="585" r="30"/><line class="d" x1="770" y1="585" x2="800" y2="585" marker-end="url(#a)"/><text class="n b" x="700" y="628">região livre em volta</text></g>
<g id="cota-marcas-giz" class="cota"><circle class="w" cx="560" cy="470" r="6"/><circle class="w" cx="600" cy="470" r="6"/><text class="n" x="530" y="430">marcas de giz (teste de fluxo)</text></g>
<g id="cota-furo-cego" class="cota"><rect class="sl" x="862" y="440" width="30" height="60"/><rect class="w" x="870" y="440" width="6" height="20"/><line class="d" x1="884" y1="440" x2="884" y2="460" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="800" y="530">furo cego</text></g>
<g id="cota-faixa-limpeza" class="cota"><line class="e" x1="260" y1="118" x2="260" y2="200"/><line class="e" x1="380" y1="118" x2="380" y2="186"/><line class="d" x1="260" y1="124" x2="380" y2="124" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="200" y="116">faixa limpa de cada lado</text></g>
<text class="n" x="20" y="648">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
