<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Viga / coluna soldada — empeno da mesa, desvio alma × mesa, altura, retilineidade e sweep">
<title>Viga / coluna soldada — empeno da mesa, desvio alma × mesa, altura, retilineidade e sweep (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Viga / coluna soldada — empeno da mesa, desvio alma × mesa, altura, retilineidade e sweep</text>
<text class="b" x="70" y="70">Seção transversal (exagerada)</text>
<path class="s" d="M80,135 L330,115 L330,135 L80,155 z"/>
<rect class="s" x="222" y="145" width="14" height="245"/>
<rect class="s" x="80" y="390" width="250" height="22"/>
<line class="c" x1="205" y1="100" x2="205" y2="440"/>
<line class="c" x1="229" y1="100" x2="229" y2="440"/>
<line class="h" x1="80" y1="135" x2="360" y2="135"/>
<g id="cota-empeno" class="cota"><line class="d" x1="346" y1="89" x2="346" y2="115" marker-end="url(#a)"/><line class="d" x1="346" y1="161" x2="346" y2="135" marker-end="url(#a)"/><line class="d" x1="346" y1="115" x2="346" y2="135"/><text x="360" y="100">Δ empeno + inclinação da mesa</text></g>
<g id="cota-b" class="cota"><line class="e" x1="80" y1="158" x2="80" y2="186"/><line class="e" x1="330" y1="158" x2="330" y2="186"/><line class="d" x1="80" y1="180" x2="330" y2="180" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="205" y="198">b — largura da mesa</text></g>
<g id="cota-altura" class="cota"><line class="e" x1="77" y1="135" x2="44" y2="135"/><line class="e" x1="77" y1="412" x2="44" y2="412"/><line class="d" x1="50" y1="135" x2="50" y2="412" marker-start="url(#a)" marker-end="url(#a)"/><text x="57" y="278.5">d — altura</text></g>
<g id="cota-desvio-alma-mesa" class="cota"><line class="d" x1="179" y1="440" x2="205" y2="440" marker-end="url(#a)"/><line class="d" x1="255" y1="440" x2="229" y2="440" marker-end="url(#a)"/><line class="d" x1="205" y1="440" x2="229" y2="440"/><text class="m" x="217" y="470">desvio alma × mesa</text></g>
<text class="b" x="480" y="270">Elevação (plano da alma)</text>
<path class="g" d="M480,350 Q670,320 860,350"/>
<line class="c" x1="480" y1="350" x2="860" y2="350"/>
<g id="cota-flecha" class="cota"><line class="d" x1="670" y1="376" x2="670" y2="350" marker-end="url(#a)"/><line class="d" x1="670" y1="309" x2="670" y2="335" marker-end="url(#a)"/><line class="d" x1="670" y1="350" x2="670" y2="335"/><text x="690" y="320">flecha (retilineidade)</text></g>
<g id="cota-L" class="cota"><line class="e" x1="480" y1="353" x2="480" y2="391"/><line class="e" x1="860" y1="353" x2="860" y2="391"/><line class="d" x1="480" y1="385" x2="860" y2="385" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="670" y="403">L — comprimento</text></g>
<text class="b" x="480" y="440">Planta (desvio lateral = sweep)</text>
<path class="g" d="M480,500 Q670,476 860,500"/>
<line class="c" x1="480" y1="500" x2="860" y2="500"/>
<g id="cota-sweep" class="cota"><line class="d" x1="670" y1="526" x2="670" y2="500" marker-end="url(#a)"/><line class="d" x1="670" y1="462" x2="670" y2="488" marker-end="url(#a)"/><line class="d" x1="670" y1="500" x2="670" y2="488"/><text x="690" y="476">sweep (no meio do vão)</text></g>
<text class="n" x="20" y="548">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
