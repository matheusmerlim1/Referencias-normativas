<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Monovia (viga-trilho) — vão, balanço e flecha vertical">
<title>Monovia (viga-trilho) — vão, balanço e flecha vertical (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>


<text class="t" x="20" y="28">Monovia (viga-trilho) — vão, balanço e flecha vertical</text>
<rect class="s" x="150" y="132" width="610" height="16"/>
<polygon class="w" points="150,148 135,175 165,175"/>
<polygon class="w" points="600,148 585,175 615,175"/>
<rect x="120" y="175" width="60" height="10" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<rect x="570" y="175" width="60" height="10" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<path class="h" d="M150,140 Q375,200 600,140 Q690,150 760,175"/>
<text class="n" x="470" y="182">deformada (tracejado)</text>
<rect class="s" x="250" y="148" width="40" height="14"/>
<line class="g" x1="270" y1="162" x2="270" y2="230"/>
<rect class="s" x="250" y="230" width="40" height="30"/>
<text class="n m" x="270" y="280">talha / carga</text>
<line class="e" x1="150" y1="128" x2="150" y2="85"/>
<line class="e" x1="600" y1="128" x2="600" y2="85"/>
<line class="e" x1="760" y1="128" x2="760" y2="85"/>
<g id="cota-vao" class="cota"><line class="d" x1="150" y1="95" x2="600" y2="95" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="375" y="87">vão L</text></g>
<g id="cota-balanco" class="cota"><line class="d" x1="600" y1="95" x2="760" y2="95" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="680" y="87">balanço L</text></g>
<g id="cota-flecha-vao" class="cota"><line class="d" x1="420" y1="110" x2="420" y2="140" marker-end="url(#a)"/><line class="d" x1="420" y1="210" x2="420" y2="168" marker-end="url(#a)"/><line class="e" x1="400" y1="168" x2="440" y2="168"/><text x="428" y="230">flecha no vão</text></g>
<g id="cota-flecha-balanco" class="cota"><line class="d" x1="785" y1="110" x2="785" y2="140" marker-end="url(#a)"/><line class="d" x1="785" y1="205" x2="785" y2="175" marker-end="url(#a)"/><line class="e" x1="760" y1="175" x2="800" y2="175"/><line class="e" x1="760" y1="140" x2="800" y2="140"/><text x="740" y="225">flecha no balanço</text></g>
<text class="n" x="20" y="348">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
