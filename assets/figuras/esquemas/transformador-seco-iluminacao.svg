<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Transformador seco de iluminação ou instrumentação — caixas de buchas e ligações">
<title>Transformador seco de iluminação ou instrumentação — caixas de buchas e ligações (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Transformador seco de iluminação ou instrumentação — caixas de buchas e ligações</text>
<text x="300" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) invólucro e caixas de proteção das buchas</text>
<rect x="160" y="140" width="280" height="260" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/>
<text x="300" y="280" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">invólucro metálico</text>
<text x="300" y="298" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(enrolamentos encapsulados</text>
<text x="300" y="312" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ou imersos em isolante)</text>
<rect x="80" y="170" width="80" height="110" fill="#666" fill-opacity="0.22" stroke="#666" stroke-width="1.5"/>
<text x="120" y="160" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">caixa primário</text>
<rect x="440" y="170" width="80" height="110" fill="#666" fill-opacity="0.22" stroke="#666" stroke-width="1.5"/>
<text x="480" y="160" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">caixa secundário</text>
<line x1="80" y1="170" x2="160" y2="170" stroke="#666" stroke-width="3"/>
<line x1="440" y1="170" x2="520" y2="170" stroke="#666" stroke-width="3"/>
<text x="300" y="132" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tampas flangeadas com junta de elastômero</text>
<rect x="98" y="280" width="14" height="16" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<rect x="128" y="280" width="14" height="16" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<rect x="453" y="280" width="14" height="16" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<rect x="478" y="280" width="14" height="16" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="120" y="314" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">luvas NPT (parte inferior)</text>
<circle cx="500" cy="220" r="8" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="530" y="224" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bucha de neutro</text>
<rect x="503" y="280" width="14" height="16" fill="#666" fill-opacity="0.85" stroke="#666" stroke-width="1.5"/>
<g id="cota-luva-neutro" class="cota"><line x1="510" y1="296" x2="540" y2="315" stroke="#666" stroke-width="1.2"/><text x="545" y="320" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">luva do cabo terra</text></g>
<rect x="436" y="330" width="10" height="14" fill="#666" fill-opacity="0.7" stroke="#666" stroke-width="1.5"/>
<line x1="446" y1="337" x2="470" y2="337" stroke="#666" stroke-width="1"/>
<text x="475" y="372" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">conector de aterramento do invólucro (face lateral)</text>
<rect x="170" y="400" width="260" height="10" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="300" y="426" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">base de apoio / suportes de parede (se pedidos)</text>
<rect x="250" y="190" width="100" height="40" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1.5"/>
<text x="300" y="214" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">placa de identificação</text>
<text x="820" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) ligações usuais</text>
<text x="820" y="90" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">trifásico: primário em triângulo, secundário em estrela</text>
<text x="820" y="106" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">com neutro (Dyn1, estrela atrasada)</text>
<path d="M700,190 L740,130 L780,190 Z" fill="none" stroke="#666" stroke-width="1.8"/>
<line x1="880" y1="160" x2="880" y2="125" stroke="#666" stroke-width="1.8"/>
