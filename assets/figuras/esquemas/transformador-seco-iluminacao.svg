<text x="740" y="210" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">D (primário)</text>
<text x="880" y="210" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">yn (secundário)</text>
<text x="820" y="260" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">monofásico 3 fios: secundário com derivação central</text>
<line x1="720" y1="290" x2="720" y2="370" stroke="#666" stroke-width="2"/>
<text x="710" y="335" text-anchor="end" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">V1</text>
<circle cx="760" cy="330" r="1" fill="#666" fill-opacity="0" stroke="#666" stroke-width="1.5"/>
<path d="M745,290 C770,300 770,320 745,330 C770,340 770,360 745,370" fill="none" stroke="#666" stroke-width="1.8"/>
<path d="M800,290 C775,300 775,320 800,330 C775,340 775,360 800,370" fill="none" stroke="#666" stroke-width="1.8"/>
<line x1="800" y1="290" x2="860" y2="290" stroke="#666" stroke-width="1.5"/>
<line x1="800" y1="330" x2="860" y2="330" stroke="#666" stroke-width="1.5"/>
<line x1="800" y1="370" x2="860" y2="370" stroke="#666" stroke-width="1.5"/>
<text x="870" y="314" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">V2/2</text>
<text x="870" y="354" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">V2/2</text>
<text x="870" y="294" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">fase</text>
<text x="870" y="334" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">neutro</text>
<text x="820" y="410" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">derivações de tensão no primário</text>
<text x="12" y="452" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
