<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Guarda-corpo — desnível (D) a partir do qual é obrigatório">
<title>Guarda-corpo — desnível (D) a partir do qual é obrigatório</title>
<defs><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Guarda-corpo — desnível (D) a partir do qual é obrigatório</text>
<rect x="40" y="170" width="260" height="14" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<rect x="40" y="184" width="30" height="186" rx="0" fill="url(#hz)" stroke="#666" stroke-width="1.2"/>
<rect x="40" y="370" width="430" height="10" rx="0" fill="url(#hz)" stroke="#666" stroke-width="1.2"/>
<line x1="40" y1="370" x2="470" y2="370" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="300" y1="170" x2="300" y2="90" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="6 4"/>
<text x="300" y="84" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">guarda-corpo</text>
<line x1="300" y1="170" x2="346" y2="170" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="300" y1="370" x2="346" y2="370" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="340" y1="170" x2="340" y2="370" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="340.0,370.0 336.5,361.0 343.5,361.0" fill="#666"/>
<polygon points="340.0,170.0 343.5,179.0 336.5,179.0" fill="#666"/>
<text x="346" y="274.0" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">D</text>
<line x1="300" y1="230" x2="390" y2="230" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="390.0,230.0 381.0,233.5 381.0,226.5" fill="#666"/>
<polygon points="300.0,230.0 309.0,226.5 309.0,233.5" fill="#666"/>
<text x="345" y="222" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">vão lateral</text>
<line x1="390" y1="190" x2="390" y2="370" stroke="#666" stroke-width="1.2" fill="none"/>
<text x="392" y="362" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">estrutura / máquina</text>
<text x="500" y="60" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">D — queda que exige guarda-corpo:</text>
<text x="500" y="78" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ISO 14122-2 (passarelas de máquinas): ≥ 500 mm</text>
<text x="500" y="96" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ISO 14122-3: &gt; 500 mm</text>
<text x="500" y="114" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ABS: ≥ 600 mm (lado exposto)</text>
<text x="500" y="132" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ASTM F1166: ≥ 610 mm (lado aberto = folga</text>
<text x="500" y="150" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      ≥ 76 mm até a estrutura adjacente)</text>
<text x="500" y="168" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NBR 14718 (edificação): D &gt; 1,0 m</text>
<text x="500" y="186" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NR-35: trabalho em altura = desnível &gt; 2,0 m</text>
<text x="500" y="204" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Vão lateral (ISO 14122-3):</text>
<text x="500" y="222" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">&gt; 200 mm entre plataforma e máquina/parede:</text>
<text x="500" y="240" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      guarda-corpo; rodapé quando &gt; 30 mm</text>
<text x="12" y="422" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo, sem escala — não é desenho da norma. Valores transcritos dos requisitos da ficha.</text>
</svg>