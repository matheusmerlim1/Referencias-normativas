<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Dobragem de folha para o formato A4 — dobras verticais e horizontais">
<title>Dobragem de folha para o formato A4 — dobras verticais e horizontais (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Dobragem de folha para o formato A4 — dobras verticais e horizontais</text>
<rect class="sl" x="60" y="90" width="840" height="280"/>
<rect class="w" x="720" y="300" width="180" height="70"/>
<text class="n m" x="810" y="340">legenda</text>
<line class="h" x1="780" y1="90" x2="780" y2="370"/>
<line class="h" x1="660" y1="90" x2="660" y2="370"/>
<line class="h" x1="360" y1="90" x2="360" y2="370"/>
<line class="h" x1="60" y1="180" x2="900" y2="180"/>
<g id="cota-dobra-vertical" class="cota"><line class="d" x1="780" y1="70" x2="900" y2="70" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="620" y="62">dobras verticais (a partir da direita)</text></g>
<g id="cota-dobra-horizontal" class="cota"><line class="e" x1="902" y1="180" x2="936" y2="180"/><line class="e" x1="902" y1="370" x2="936" y2="370"/><line class="d" x1="930" y1="180" x2="930" y2="370" marker-start="url(#a)" marker-end="url(#a)"/><text x="940" y="280">dobras horizontais</text></g>
<text class="n" x="70" y="400">a parte final restante é dobrada ao meio (linha central tracejada)</text>
<text class="n" x="20" y="428">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
