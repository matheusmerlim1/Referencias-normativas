<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Medição e tolerância do diâmetro do cabo de aço">
<title>Medição e tolerância do diâmetro do cabo de aço</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Medição e tolerância do diâmetro do cabo de aço</text>
<circle class="x" cx="190.0" cy="215.0" r="90" />
<circle class="f" cx="190.0" cy="215.0" r="30" />
<circle class="w" cx="250.0" cy="215.0" r="30" />
<circle class="w" cx="220.0" cy="267.0" r="30" />
<circle class="w" cx="160.0" cy="267.0" r="30" />
<circle class="w" cx="130.0" cy="215.0" r="30" />
<circle class="w" cx="160.0" cy="163.0" r="30" />
<circle class="w" cx="220.0" cy="163.0" r="30" />
<line class="k" x1="100.0" y1="215.0" x2="100.0" y2="90.0" />
<line class="k" x1="280.0" y1="215.0" x2="280.0" y2="90.0" />
<line class="k" x1="88.0" y1="90.0" x2="300.0" y2="90.0" />
<g id="cota-d" class="cota"><line class="t" x1="100.0" y1="215.0" x2="100.0" y2="338.0" /><line class="t" x1="280.0" y1="215.0" x2="280.0" y2="338.0" /><line class="dim" x1="100.0" y1="330.0" x2="280.0" y2="330.0" /><text x="190.0" y="323.0" text-anchor="middle" font-size="13px">d no círculo circunscrito</text></g>
<text class="s" x="190.0" y="76.0" text-anchor="middle">paquímetro sobre as coroas das pernas</text>
<text class="b" x="350.0" y="80.0" text-anchor="start" font-size="13px">NBR 6327 4.4.1.2 (d ≥ 8 mm):</text>
<text x="350.0" y="101.0" text-anchor="start" font-size="13px">• +5 % / 0 — pernas só de arame ou alma de polímero</text>
<text x="350.0" y="122.0" text-anchor="start" font-size="13px">• +7 % / 0 — pernas com alma de fibra</text>
<text x="350.0" y="143.0" text-anchor="start" font-size="13px"></text>
<text class="b" x="350.0" y="164.0" text-anchor="start" font-size="13px">API 9A 5.4 (edição 1995):</text>
<text x="350.0" y="185.0" text-anchor="start" font-size="13px">• Ø nominal em polegadas: −0 % a +5 %</text>
<text x="350.0" y="206.0" text-anchor="start" font-size="13px">• Ø nominal em mm: −1 % a +4 %</text>
<text x="350.0" y="227.0" text-anchor="start" font-size="13px">• medir a ≥ 1,52 m (5 ft) da ponta amarrada</text>
<text x="350.0" y="248.0" text-anchor="start" font-size="13px">• dúvida: medir sob tração de 10 % a 20 %</text>
<text x="350.0" y="269.0" text-anchor="start" font-size="13px">  da resistência nominal</text>
<text class="n" x="790" y="392" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
