<path d="M190,150 C176,200 178,260 180,300 C176,350 182,400 190,412 L210,412 C218,380 224,330 222,300 C224,250 222,200 210,150 Z" fill="#a52" fill-opacity="0.45" stroke="#666" stroke-width="1.5"/>
<g id="cota-avanco-entalhe" class="cota"><line x1="200" y1="330" x2="200" y2="330" stroke="#666" stroke-width="1"/><line x1="222" y1="330" x2="222" y2="330" stroke="#666" stroke-width="1"/><line x1="200" y1="330" x2="222" y2="330" stroke="#666" stroke-width="1.2"/><polygon points="200.0,330.0 209.0,333.5 209.0,326.5" fill="#666"/><polygon points="222.0,330.0 213.0,326.5 213.0,333.5" fill="#666"/><text x="320" y="326" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">penetração a partir do entalhe</text></g>
<line x1="222" y1="330" x2="318" y2="322" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
