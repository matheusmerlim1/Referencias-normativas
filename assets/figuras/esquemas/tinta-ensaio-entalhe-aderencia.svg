<rect x="650" y="476" width="18" height="20" fill="#8a8" fill-opacity="0.5" stroke="#666" stroke-width="0.8"/>
<rect x="680" y="476" width="18" height="23" fill="#8a8" fill-opacity="0.5" stroke="#666" stroke-width="0.8"/>
<rect x="710" y="476" width="18" height="26" fill="#8a8" fill-opacity="0.5" stroke="#666" stroke-width="0.8"/>
<rect x="740" y="476" width="18" height="29" fill="#8a8" fill-opacity="0.5" stroke="#666" stroke-width="0.8"/>
