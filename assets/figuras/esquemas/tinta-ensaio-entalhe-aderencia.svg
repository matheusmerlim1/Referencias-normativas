<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="Recebimento de tinta — entalhe, aderência por tração, descaimento e poder de cobertura">
<title>Recebimento de tinta — entalhe, aderência por tração, descaimento e poder de cobertura (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Recebimento de tinta — entalhe, aderência por tração, descaimento e poder de cobertura</text>
<text x="200" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) painel após névoa salina</text>
