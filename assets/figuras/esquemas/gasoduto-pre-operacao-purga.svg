<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Gasoduto — gaseificação (purga com selo inerte e pig) e aumento de pressão em degraus">
<title>Gasoduto — gaseificação (purga com selo inerte e pig) e aumento de pressão em degraus (esquema ilustrativo)</title>
