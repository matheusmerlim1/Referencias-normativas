<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 495" width="760" height="495" role="img" aria-label="Olhal de cinta plana no gancho (NBR 15637-1 A.1.3.2)">
<title>Olhal de cinta plana no gancho (NBR 15637-1 A.1.3.2)</title>
<style>
