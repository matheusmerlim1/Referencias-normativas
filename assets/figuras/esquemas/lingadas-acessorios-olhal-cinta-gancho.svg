<text class="ti" x="12.0" y="24.0" text-anchor="start">Olhal de cinta plana no gancho (NBR 15637-1 A.1.3.2)</text>
<circle class="h" cx="300.0" cy="120.0" r="32" />
<line class="k" x1="268.0" y1="120.0" x2="300.0" y2="410.0" />
<line class="k" x1="332.0" y1="120.0" x2="300.0" y2="410.0" />
<path class="k" d="M268,120 A32,32 0 0,1 332,120" />
<rect class="f" x="286" y="410" width="28" height="40" />
<g id="cota-e" class="cota"><line class="t" x1="268.0" y1="120.0" x2="268.0" y2="78.0" /><line class="t" x1="332.0" y1="120.0" x2="332.0" y2="78.0" /><line class="dim" x1="268.0" y1="86.0" x2="332.0" y2="86.0" /><text x="300.0" y="79.0" text-anchor="middle" font-size="13px">e = espessura máx. do gancho</text></g>
<g id="cota-comprimento-olhal" class="cota"><line class="t" x1="332.0" y1="120.0" x2="400.0" y2="120.0" /><line class="t" x1="300.0" y1="410.0" x2="400.0" y2="410.0" /><line class="dim" x1="392.0" y1="120.0" x2="392.0" y2="410.0" /><text x="405.0" y="270.0" text-anchor="start" font-size="13px">comprimento do olhal</text></g>
