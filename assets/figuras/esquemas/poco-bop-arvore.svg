<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Poço — BOP, cabeça de poço e árvore de natal">
<title>Poço — BOP, cabeça de poço e árvore de natal (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Poço — BOP, cabeça de poço e árvore de natal</text>
<text class="n b" x="60" y="70">BOP sobre a cabeça de poço</text>
<rect class="s" x="110" y="90" width="120" height="50" rx="16"/><text class="n" x="240" y="120">BOP anular</text>
<rect class="s" x="100" y="145" width="140" height="40"/><text class="n" x="250" y="170">gaveta (ram)</text>
<rect class="s" x="100" y="190" width="140" height="40"/><text class="n" x="250" y="215">gaveta cega / cisalhante</text>
<line class="g" x1="240" y1="250" x2="300" y2="250"/><text class="n" x="306" y="254">linha de choke / kill</text>
<rect class="s" x="100" y="235" width="140" height="30"/>
<rect class="s" x="90" y="270" width="160" height="34"/><text class="n" x="260" y="292">cabeça de poço</text>
<line class="g" x1="140" y1="304" x2="140" y2="400"/><line class="g" x1="200" y1="304" x2="200" y2="400"/>
<line class="g" x1="155" y1="80" x2="155" y2="400"/><line class="g" x1="185" y1="80" x2="185" y2="400"/>
<text class="n" x="210" y="350">revestimento (casing)</text><text class="n" x="20" y="380">coluna (tubos)</text>
<line class="e" x1="110" y1="376" x2="153" y2="360"/>
<text class="n b" x="560" y="70">árvore de natal (superfície)</text>
<rect class="s" x="600" y="320" width="160" height="34"/><text class="n" x="770" y="342">cabeça de produção</text>
<rect class="s" x="650" y="270" width="60" height="50"/><text class="n" x="560" y="300">mestra</text>
<rect class="s" x="650" y="200" width="60" height="70"/>
<rect class="s" x="650" y="130" width="60" height="50"/><text class="n" x="560" y="160">pistoneio</text>
<line class="g" x1="680" y1="180" x2="680" y2="200"/>
<line class="g" x1="710" y1="235" x2="820" y2="235"/><rect class="s" x="740" y="215" width="40" height="40"/><text class="n" x="740" y="208">lateral (wing)</text>
<polygon class="s" points="820,220 850,235 820,250"/><text class="n" x="858" y="240">choke</text>
<line class="g" x1="670" y1="354" x2="670" y2="400"/><line class="g" x1="690" y1="354" x2="690" y2="400"/>
<text class="n" x="20" y="418">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
