<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" width="820" height="540" role="img" aria-label="Banda (heel/list) e trim de projeto — guindaste em embarcação">
<title>Banda (heel/list) e trim de projeto — guindaste em embarcação</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Banda (heel/list) e trim de projeto — guindaste em embarcação</text>
<line class="c" x1="40.0" y1="230.0" x2="400.0" y2="230.0" />
<text class="s" x="400.0" y="222.0" text-anchor="end">linha d'água</text>
<g transform="rotate(-10 200 210)"><path class="f" d="M90,150 L310,150 L300,260 Q200,300 100,260 Z"/><line class="o" x1="200" y1="90" x2="200" y2="150" style="stroke-width:5"/></g>
<line class="c" x1="200.0" y1="210.0" x2="200.0" y2="70.0" />
<g id="cota-banda" class="cota"><path class="dim" d="M200.0,85.0 A125,125 0 0,0 178.3,86.9" /><text x="172.0" y="80.0" text-anchor="end">banda</text></g>
<text class="b" x="200.0" y="330.0" text-anchor="middle">Seção transversal</text>
<line class="c" x1="420.0" y1="230.0" x2="790.0" y2="230.0" />
<g transform="rotate(-4 600 210)"><path class="f" d="M430,160 L780,160 L760,250 L450,250 Z"/><line class="o" x1="520" y1="100" x2="520" y2="160" style="stroke-width:5"/></g>
<g id="cota-trim" class="cota"><line class="t" x1="430.0" y1="140.0" x2="790.0" y2="140.0" /><line class="t" x1="430.0" y1="140.0" x2="790.0" y2="114.8" /><text x="700.0" y="110.0" text-anchor="start">trim</text></g>
<text class="b" x="605.0" y="330.0" text-anchor="middle">Perfil longitudinal</text>
<text class="n" x="410.0" y="352.0" text-anchor="middle">(ângulos exagerados no desenho)</text>
<text class="b" x="20.0" y="385.0" text-anchor="start" font-size="13px">DNV 2.22 Table 2-1 (águas paradas, banda/trim mínimos): navio 5°/2°; barcaça (L &lt; 4B) e catamarã 3°/2°;</text>
<text x="20.0" y="406.0" text-anchor="start" font-size="13px">  semissubmersível 3°/3°; submersível e jack-up 1°/1°.  Caso II (com vento): mínimo 1.5 vez esses valores.</text>
<text class="b" x="20.0" y="427.0" text-anchor="start" font-size="13px">ABS Table 5A (em serviço): navio/barcaça em águas calmas 5°/2°; plataforma fixa/TLP/Spar 0.5°/0.5°;</text>
<text x="20.0" y="448.0" text-anchor="start" font-size="13px">  semissubmersível 1.5°/1.5°; navio-sonda/FPSO 2.5°/1°.</text>
<text class="b" x="20.0" y="469.0" text-anchor="start" font-size="13px">ABS Table 5B (lança no descanso): navios 15° banda e 5° trim simultâneos; colunas estabilizadas 15° em</text>
<text x="20.0" y="490.0" text-anchor="start" font-size="13px">  qualquer direção; autoelevatórias 10° em qualquer direção.</text>
<text class="n" x="810" y="532" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
