<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img" aria-label="Filtros temporário e gaveta para tubulação">
<title>Filtros temporário e gaveta para tubulação (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Filtros temporário e gaveta para tubulação</text>
<text class="b" x="20" y="62">(a) Filtro temporário cônico entre flanges</text>
<g transform="translate(0,30)">
<rect class="sl" x="40" y="150" width="140" height="60"/>
<rect class="wd" x="180" y="120" width="18" height="120"/>
<rect class="wd" x="204" y="120" width="18" height="120"/>
<rect class="sl" x="222" y="150" width="180" height="60"/>
<text class="n" x="60" y="140">fluxo →</text>
<polygon class="r" points="198,152 198,208 330,180"/>
<circle class="w" cx="230" cy="180" r="3"/>
<circle class="w" cx="260" cy="180" r="3"/>
<circle class="w" cx="290" cy="180" r="3"/>
<rect class="s" x="197" y="60" width="6" height="62"/>
<text class="n" x="210" y="76">orelha (fica para fora)</text>
<g id="cota-orelha" class="cota"><line class="e" x1="203" y1="90" x2="250" y2="100"/><text class="n b" x="254" y="104">marcação: NPS, classe e tipo</text></g>
<g id="cota-cone-comprimento" class="cota"><line class="e" x1="200" y1="210" x2="200" y2="262"/><line class="e" x1="330" y1="180" x2="330" y2="262"/><line class="d" x1="200" y1="254" x2="330" y2="254" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="205" y="280">B — comprimento do cone</text></g>
<g id="cota-furo" class="cota"><line class="e" x1="260" y1="183" x2="300" y2="300"/><text class="n b" x="280" y="316">Ø do furo da chapa perfurada</text></g>
<text class="n" x="40" y="250">A — Ø da base do cone</text>
</g>
<text class="b" x="500" y="62">(b) Filtro gaveta (tee strainer)</text>
<rect class="sl" x="520" y="170" width="300" height="50"/>
<rect class="sl" x="640" y="90" width="60" height="80"/>
<rect class="wd" x="630" y="82" width="80" height="10"/>
<rect class="wd" x="510" y="160" width="10" height="70"/>
<rect class="wd" x="820" y="160" width="10" height="70"/>
<rect class="r" x="650" y="95" width="40" height="120"/>
<text class="n" x="712" y="120">elemento filtrante removível</text>
<g id="cota-gaveta-W" class="cota"><line class="e" x1="510" y1="240" x2="510" y2="272"/><line class="e" x1="830" y1="240" x2="830" y2="272"/><line class="d" x1="510" y1="262" x2="830" y2="262" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="650" y="284">W (Tabela A.1)</text></g>
<text class="n" x="520" y="310">também tabelados: Ø X do ferro, Y e comprimento total</text>
<text class="b" x="500" y="360">(c) Elemento filtrante</text>
<rect class="r" x="560" y="400" width="60" height="140"/>
<rect class="sl" x="620" y="400" width="30" height="140"/>
<g id="cota-elemento" class="cota"><line class="d" x1="540" y1="400" x2="540" y2="540" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="476" y="476">J</text><line class="d" x1="560" y1="560" x2="620" y2="560" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="580" y="580">K</text><line class="d" x1="620" y1="390" x2="650" y2="390" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="624" y="382">L</text></g>
<text class="n" x="670" y="470">J comprimento; K largura; L altura</text>
<text class="n" x="20" y="608">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
