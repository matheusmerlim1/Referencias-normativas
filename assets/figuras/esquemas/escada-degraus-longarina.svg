<g id="cota-vao" class="cota"><line x1="100" y1="210" x2="100" y2="255" stroke="#666" stroke-width="1"/><line x1="700" y1="210" x2="700" y2="255" stroke="#666" stroke-width="1"/><line x1="100" y1="250" x2="700" y2="250" stroke="#666" stroke-width="1.2"/><polygon points="100,250 109,246.5 109,253.5" fill="#666"/><polygon points="700,250 691,253.5 691,246.5" fill="#666"/><text x="400" y="266" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">S (vão)</text></g>
