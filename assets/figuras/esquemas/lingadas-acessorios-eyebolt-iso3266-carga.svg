<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Olhal roscado — carga axial Fa e par de olhais com carga inclinada Fβ</text>
<circle cx="130" cy="280" r="22" fill="none" stroke="#666" stroke-width="8"/>
<rect class="s" x="108" y="302" width="44" height="10"/>
<rect x="40" y="320" width="180" height="40" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<line class="d" x1="130" y1="258" x2="130" y2="140" marker-end="url(#a)"/>
<text class="b" x="145" y="160">Fa</text>
<rect x="330" y="320" width="380" height="40" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<circle cx="400" cy="280" r="22" fill="none" stroke="#666" stroke-width="8"/>
<rect class="s" x="378" y="302" width="44" height="10"/>
<circle cx="640" cy="280" r="22" fill="none" stroke="#666" stroke-width="8"/>
<rect class="s" x="618" y="302" width="44" height="10"/>
<line x1="400" y1="258" x2="520" y2="110" stroke="#666" stroke-width="4" stroke-linecap="round"/>
<line x1="640" y1="258" x2="520" y2="110" stroke="#666" stroke-width="4" stroke-linecap="round"/>
<circle class="g" cx="520" cy="100" r="10"/>
<line class="c" x1="400" y1="258" x2="400" y2="110"/>
<g id="cota-beta" class="cota"><path class="d" d="M400,158 A100,100 0 0,1 463,180.3" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="440.1" y="149.9">β</text></g>
<text class="b" x="470" y="200">Fβ</text>
<text class="n m" x="520" y="395">par de olhais com os olhos no plano da linga</text>
<text class="n" x="20" y="408">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
