<g id="cota-emenda-lencol" class="cota"><line class="e" x1="810" y1="128" x2="810" y2="154"/><line class="e" x1="870" y1="128" x2="870" y2="154"/><line class="d" x1="810" y1="150" x2="870" y2="150" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="840.0" y="143">sobreposição</text></g>
<g id="cota-adocamento" class="cota"><line class="d" x1="930" y1="190" x2="950" y2="128" marker-end="url(#a)"/><text class="" x="840" y="200">extremidade adoçada</text></g>
<path class="wd" d="M720,300 L840,300 L860,330 L720,330 z"/><path class="wd" d="M870,300 L990,300 L990,330 L890,330 z"/><line class="h" x1="760" y1="315" x2="950" y2="315"/>
<g id="cota-emenda-perfil" class="cota"><path class="d" d="M862.4,333.2 A40,40 0 0,0 880.0,300.0" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="860" y="360">corte a 45°</text></g>
<g id="cota-barra-reforco" class="cota"><line class="d" x1="760" y1="400" x2="800" y2="317" marker-end="url(#a)"/><text class="" x="700" y="420">barras de reforço</text></g>
<text class="b" x="700" y="470">(c) Chapa-mola de fechamento</text>
