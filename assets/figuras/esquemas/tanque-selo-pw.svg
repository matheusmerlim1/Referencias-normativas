<g id="cota-largura-chapa-mola" class="cota"><line class="e" x1="720" y1="560" x2="720" y2="589"/><line class="e" x1="880" y1="560" x2="880" y2="589"/><line class="d" x1="720" y1="585" x2="880" y2="585" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="800.0" y="578">largura da chapa</text></g>
<text class="n" x="20" y="608">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
