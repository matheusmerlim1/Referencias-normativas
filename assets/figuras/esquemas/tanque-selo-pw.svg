<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Teto flutuante — selo periférico com chapa-mola (tipo PW)">
<title>Teto flutuante — selo periférico com chapa-mola (tipo PW) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
