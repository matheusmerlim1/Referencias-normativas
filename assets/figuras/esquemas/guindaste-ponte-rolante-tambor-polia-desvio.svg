<text class="b" x="650.0" y="585.0" text-anchor="middle">Ranhura (detalhe)</text>
<text class="b" x="20.0" y="615.0" text-anchor="start" font-size="12px">Flange: ≥ 2.5 × Ø do cabo (DNV: do centro da camada superior à borda; ABS: acima da camada externa). Camadas ≤ 3 (DNV).</text>
<text class="b" x="20.0" y="635.0" text-anchor="start" font-size="12px">Dp/d: tambor ≥ 18 (DNV, ABS; ABS ≥ 20 em compensação de movimento); polias ≥ 18; polias que não giram ≥ 10 (DNV).</text>
<text class="b" x="20.0" y="655.0" text-anchor="start" font-size="12px">Ranhura: raio recomendado 0.53 d (0.52d a 0.57d) — DNV; polia: Ø interno da ranhura 6 % a 8 % maior que o cabo (aço) — ABS.</text>
<text class="b" x="20.0" y="675.0" text-anchor="start" font-size="12px">Desvio: máximo 3,5° (NBR 8400 6.7.2.2); α1, α2 ≤ 4° (DNV); guia de enrolamento se &gt; 4° (1 camada) ou &gt; 2° (várias) — ABS.</text>
<text class="b" x="20.0" y="695.0" text-anchor="start" font-size="12px">Voltas mínimas: não menos de 3 com o gancho na posição mais baixa (DNV); ≥ 5 voltas completas (ABS).</text>
<text class="n" x="850" y="732" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
