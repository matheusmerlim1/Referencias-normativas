<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="END — inspeção automatizada de tubos de perfuração e produção">
<title>END — inspeção automatizada de tubos de perfuração e produção (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">END — inspeção automatizada de tubos de perfuração e produção</text>
<text class="b" x="20" y="62">(a) Tubo passando pelo cabeçote de inspeção</text>
<rect class="sl" x="40" y="150" width="820" height="50"/>
<text class="n" x="60" y="226">tubo (avança pela linha)</text>
<rect class="bl" x="380" y="120" width="120" height="110" fill-opacity=".25"/>
<text class="n" x="386" y="112">cabeçote: sapatas / bobinas</text>
<rect class="wd" x="390" y="140" width="10" height="10"/>
<rect class="wd" x="390" y="200" width="10" height="10"/>
<rect class="wd" x="420" y="140" width="10" height="10"/>
<rect class="wd" x="420" y="200" width="10" height="10"/>
<rect class="wd" x="450" y="140" width="10" height="10"/>
<rect class="wd" x="450" y="200" width="10" height="10"/>
<rect class="wd" x="480" y="140" width="10" height="10"/>
<rect class="wd" x="480" y="200" width="10" height="10"/>
<g id="cota-zona-morta" class="cota"><rect class="r" x="40" y="150" width="60" height="50" fill-opacity=".25"/><rect class="r" x="800" y="150" width="60" height="50" fill-opacity=".25"/><line class="d" x1="40" y1="250" x2="100" y2="250" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="40" y="272">zona morta (inspeção manual com sobreposição)</text></g>
<text class="b" x="20" y="330">(b) Padrão de calibração</text>
<rect class="sl" x="40" y="380" width="500" height="60"/>
<line class="v" x1="150" y1="380" x2="230" y2="380"/>
<text class="n" x="130" y="372">entalhe longitudinal</text>
<line class="v" x1="320" y1="375" x2="320" y2="395"/>
<text class="n" x="300" y="368">entalhe transversal</text>
<g id="cota-furo-padrao" class="cota"><circle class="w" cx="430" cy="410" r="5"/><line class="e" x1="430" y1="410" x2="470" y2="470"/><text class="n b" x="440" y="486">furo passante (Ø)</text></g>
<rect class="sl" x="600" y="380" width="120" height="30"/>
<rect class="s" x="600" y="410" width="120" height="30"/>
<g id="cota-espessura-padrao" class="cota"><line class="d" x1="740" y1="380" x2="740" y2="410" marker-start="url(#a)" marker-end="url(#a)"/><line class="d" x1="760" y1="380" x2="760" y2="440" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="600" y="470">padrão com duas espessuras</text></g>
<text class="n" x="20" y="528">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
