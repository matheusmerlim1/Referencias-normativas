</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Categorias de junta A, B, C e D (UW-3) — localização típica</text>
<path class="sl" d="M200,140 L640,140 Q760,140 760,240 Q760,340 640,340 L200,340 Q80,340 80,240 Q80,140 200,140 z"/>
<line class="v" x1="200" y1="140" x2="200" y2="340"/>
<line class="v" x1="640" y1="140" x2="640" y2="340"/>
<line class="v" x1="420" y1="140" x2="420" y2="340"/>
<line class="v" x1="300" y1="140" x2="540" y2="140"/>
<rect class="s" x="500" y="100" width="40" height="40"/>
<rect class="s" x="300" y="340" width="60" height="30"/>
<rect class="s" x="100" y="360" width="40" height="40"/>
<text class="n m" x="420" y="120">A — longitudinal do casco</text>
<line class="d" x1="420" y1="125" x2="420" y2="138" marker-end="url(#a)"/>
<text class="n m" x="420" y="380">B — circunferencial casco × casco</text>
