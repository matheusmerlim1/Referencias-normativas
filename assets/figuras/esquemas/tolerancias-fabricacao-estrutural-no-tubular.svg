<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" role="img" aria-label="Nó tubular — joint can, brace stub, gap, overlap, excentricidade e soldas longitudinais">
<title>Nó tubular — joint can, brace stub, gap, overlap, excentricidade e soldas longitudinais (esquema ilustrativo)</title>
<style>
