<path class="c" d="M1190.0,160.0 A360,360 0 0,0 830.0,520.0"/>
<g id="cota-raio" class="cota"><line class="d" x1="1190" y1="520" x2="935.442" y2="265.442" marker-start="url(#a)" marker-end="url(#a)"/><text x="750" y="470">raio de curvamento do tubo</text></g>
<g id="cota-sobrelargura" class="cota"><line class="d" x1="817.609" y1="305" x2="852.25" y2="325" marker-end="url(#a)"/><line class="d" x1="860.91" y1="330" x2="834.93" y2="315" marker-end="url(#a)"/><text x="700" y="200">sobrelargura na curva</text></g>
<text class="n" x="20" y="678">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
