<rect x="180" y="420" width="320" height="40" fill="url(#hach)" stroke="none" opacity=".6"/>
<text class="n" x="510" y="450">rocha</text>
<g id="cota-berco" class="cota"><line class="e" x1="462" y1="390" x2="506" y2="390"/><line class="e" x1="462" y1="420" x2="506" y2="420"/><line class="d" x1="500" y1="390" x2="500" y2="420" marker-start="url(#a)" marker-end="url(#a)"/><text x="510" y="410">berço de material fino</text></g>
<g id="cota-cobertura" class="cota"><line class="e" x1="472" y1="290" x2="506" y2="290"/><line class="e" x1="342" y1="330" x2="506" y2="330"/><line class="d" x1="500" y1="290" x2="500" y2="330" marker-start="url(#a)" marker-end="url(#a)"/><text x="510" y="316">1ª camada acima da geratriz superior</text></g>
<g id="cota-rocha" class="cota"><line class="e" x1="110" y1="476" x2="186" y2="410"/><line class="e" x1="312" y1="390" x2="184" y2="390"/><line class="d" x1="190" y1="390" x2="190" y2="420" marker-start="url(#a)" marker-end="url(#a)"/><text x="40" y="490">abaixo do duto, em rocha</text></g>
<text class="n b" x="40" y="540">apoios provisórios (vista lateral)</text>
