<text class="n b" x="680" y="80">planta da curva</text>
<path class="g" d="M1190.0,190.0 A330,330 0 0,0 860.0,520.0"/>
<path class="h" d="M1190.0,130.0 A390,390 0 0,0 800.0,520.0"/>
