<g id="cota-perna-real" class="cota"><line class="e" x1="150" y1="333" x2="150" y2="381"/><line class="e" x1="220" y1="333" x2="220" y2="381"/><line class="d" x1="150" y1="375" x2="220" y2="375" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="185" y="393">perna real</text></g>
