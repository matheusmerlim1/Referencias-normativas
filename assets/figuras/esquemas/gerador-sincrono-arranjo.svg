<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Gerador síncrono — carcaça, eixo, caixa de terminais, aterramento, boroscopia e placa de advertência">
<!--P7A-->
<title>Gerador síncrono — carcaça, eixo, caixa de terminais, aterramento, boroscopia e placa de advertência (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Gerador síncrono — carcaça, eixo, caixa de terminais, aterramento, boroscopia e placa de advertência</text>
<line x1="40" y1="440" x2="700" y2="440" stroke="#666" stroke-width="1.5"/>
<rect x="160" y="180" width="360" height="240" rx="20" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="340" y="300" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">estator / rotor</text>
<rect x="140" y="420" width="400" height="20" rx="0" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<line x1="40" y1="300" x2="160" y2="300" stroke="#666" stroke-width="10"/>
<text x="90" y="285" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eixo (lado acoplado)</text>
<g id="cota-altura-eixo" class="cota"><line x1="600" y1="440" x2="600" y2="300" stroke="#666" stroke-width="1.2"/><polygon points="600.0,440.0 603.5,431.0 596.5,431.0" fill="#666"/><polygon points="600.0,300.0 596.5,309.0 603.5,309.0" fill="#666"/><text x="606" y="370" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura de eixo</text></g>
<line x1="520" y1="300" x2="610" y2="300" stroke="#666" stroke-width="0.8" stroke-dasharray="8 3 2 3"/>
<rect x="380" y="120" width="110" height="60" rx="0" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="435" y="112" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">caixa de terminais de força</text>
<circle cx="175" cy="410" r="6" fill="#666" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<circle cx="505" cy="410" r="6" fill="#666" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<text x="340" y="470" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">terminais de aterramento em extremidades opostas (conforme a tensão)</text>
<rect x="230" y="190" width="30" height="20" rx="0" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="245" y="232" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tampa de boroscopia</text>
<text x="850" y="90" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">placa de advertência</text>
<rect x="760" y="120" width="180" height="70" rx="4" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/>
<text x="850" y="150" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">PERIGO: ALTA TENSÃO</text>
<text x="850" y="175" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ATENÇÃO …</text>
<g id="cota-letra-aviso" class="cota"><line x1="950" y1="138" x2="950" y2="154" stroke="#666" stroke-width="1.2"/><polygon points="950.0,138.0 946.5,147.0 953.5,147.0" fill="#666"/><polygon points="950.0,154.0 953.5,145.0 946.5,145.0" fill="#666"/><text x="955" y="210" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura das letras</text></g>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
