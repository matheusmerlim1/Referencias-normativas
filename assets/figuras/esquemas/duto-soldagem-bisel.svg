<path class="w" d="M396,176 L400,190 L404,176"/>
<g id="cota-goivagem" class="cota"><line class="d" x1="430" y1="98" x2="400" y2="186" marker-end="url(#a)"/><text x="420" y="95">remoção após goivagem (profundidade)</text></g>
<line class="g" x1="720" y1="175" x2="720" y2="285"/>
