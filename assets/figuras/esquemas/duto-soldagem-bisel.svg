<g id="cota-faixa-limpa" class="cota"><line class="e" x1="695" y1="282" x2="695" y2="376"/><line class="e" x1="720" y1="282" x2="720" y2="376"/><line class="d" x1="669" y1="370" x2="695" y2="370" marker-end="url(#a)"/><line class="d" x1="746" y1="370" x2="720" y2="370" marker-end="url(#a)"/><line class="d" x1="695" y1="370" x2="720" y2="370"/><text x="520" y="395">faixa limpa de cada lado da junta</text></g>
