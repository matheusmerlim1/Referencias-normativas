<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="Ângulo de carga com a horizontal e ângulo incluído entre pernas">
<title>Ângulo de carga com a horizontal e ângulo incluído entre pernas (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
