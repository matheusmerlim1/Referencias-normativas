<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Bombas de deslocamento positivo — dosadora alternativa e rotativa">
<title>Bombas de deslocamento positivo — dosadora alternativa e rotativa (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .cc{fill:#bbb;fill-opacity:.5;stroke:#777;stroke-width:1.4}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .hc{fill:url(#hach);stroke:#666;stroke-width:1.2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Bombas de deslocamento positivo — dosadora alternativa e rotativa</text>
<text class="b" x="20" y="58">(a) Bomba dosadora alternativa (êmbolo)</text>
<rect class="sl" x="60" y="200" width="200" height="70"/><rect class="w" x="260" y="215" width="120" height="40"/><rect class="s" x="380" y="190" width="70" height="90"/><path class="g" d="M415,190 L415,120 L500,120"/><path class="g" d="M415,280 L415,350 L500,350"/>
<circle class="w" cx="415" cy="160" r="8"/><circle class="w" cx="415" cy="310" r="8"/>
<text class="n" x="70" y="190">acionamento e ajuste de curso</text>
<text class="n" x="455" y="185">cabeçote</text>
<text class="n" x="505" y="124">descarga</text>
<text class="n" x="505" y="354">sucção</text>
<g id="cota-diametro-embolo" class="cota"><line class="d" x1="245" y1="215" x2="245" y2="255" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="238" y="240">Ø êmbolo</text></g>
<g id="cota-curso" class="cota"><line class="e" x1="260" y1="255" x2="260" y2="304"/><line class="e" x1="330" y1="255" x2="330" y2="304"/><line class="d" x1="260" y1="300" x2="330" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="295.0" y="318">curso</text></g>
<g id="cota-tubulacao-succao" class="cota"><line class="d" x1="560" y1="400" x2="470" y2="352" marker-end="url(#a)"/><text class="" x="480" y="420">Ø e comprimento das linhas</text></g>
<g id="cota-solidos" class="cota"><line class="d" x1="150" y1="420" x2="400" y2="240" marker-end="url(#a)"/><text class="" x="60" y="440">tamanho máx. de sólidos</text></g>
<text class="b" x="560" y="58">(b) Bomba rotativa (engrenagens ou parafusos)</text>
<rect class="sl" x="600" y="140" width="260" height="160" rx="30"/><circle class="w" cx="690" cy="220" r="55"/><circle class="w" cx="780" cy="220" r="55"/><line class="g" x1="690" y1="220" x2="560" y2="220"/>
<g id="cota-rotor" class="cota"><line class="d" x1="650" y1="165" x2="650" y2="275" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="606" y="330">Ø do rotor</text></g>
<g id="cota-folgas" class="cota"><line class="d" x1="900" y1="180" x2="832" y2="212" marker-end="url(#a)"/><text class="" x="860" y="170">folgas rotor–carcaça</text></g>
<g id="cota-eixo-rotativa" class="cota"><line class="d" x1="580" y1="260" x2="600" y2="222" marker-end="url(#a)"/><text class="" x="560" y="280">Ø do eixo / selo</text></g>
<text class="n" x="20" y="548">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
