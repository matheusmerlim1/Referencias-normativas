<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Junta de topo — desalinhamento (UW-33) e reforço da solda (UW-35)">
<title>Junta de topo — desalinhamento (UW-33) e reforço da solda (UW-35) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Junta de topo — desalinhamento (UW-33) e reforço da solda (UW-35)</text>
<rect class="s" x="80" y="170" width="330" height="60"/>
<rect class="s" x="450" y="185" width="330" height="60"/>
<path class="r" d="M400,170 Q430,140 460,185 L450,245 L410,230 z"/>
<path class="r" d="M410,230 Q430,262 450,245"/>
<line class="h" x1="400" y1="170" x2="520" y2="170"/>
<g id="cota-offset" class="cota"><line class="d" x1="521" y1="144" x2="521" y2="170" marker-end="url(#a)"/><line class="d" x1="521" y1="211" x2="521" y2="185" marker-end="url(#a)"/><line class="d" x1="521" y1="170" x2="521" y2="185"/><text x="540" y="150">desalinhamento</text></g>
<g id="cota-t" class="cota"><line class="e" x1="77" y1="170" x2="44" y2="170"/><line class="e" x1="77" y1="230" x2="44" y2="230"/><line class="d" x1="50" y1="170" x2="50" y2="230" marker-start="url(#a)" marker-end="url(#a)"/><text x="70" y="290">t — espessura nominal (mais fina)</text></g>
<g id="cota-reforco" class="cota"><line class="d" x1="301" y1="126" x2="301" y2="152" marker-end="url(#a)"/><line class="d" x1="301" y1="196" x2="301" y2="170" marker-end="url(#a)"/><line class="d" x1="301" y1="152" x2="301" y2="170"/><text x="120" y="130">reforço (acima da superfície)</text></g>
<line class="d" x1="290" y1="133" x2="425" y2="152" marker-end="url(#a)"/>
<path d="M461,245 L468,238 L475,245 z" fill="#fff" stroke="none"/><path class="g" d="M461,245 L468,238 L475,245"/>
<g id="cota-reducao" class="cota"><line class="d" x1="520" y1="282" x2="469" y2="242" marker-end="url(#a)"/><text x="490" y="298">redução da espessura junto à solda</text></g>
<text class="n" x="560" y="62">detalhe: solda concordando o desalinhamento</text>
<rect class="s" x="560" y="72" width="130" height="20"/>
<rect class="s" x="740" y="82" width="130" height="20"/>
<path class="r" d="M690,72 L740,82 L740,102 L705,99 L690,92 z"/>
