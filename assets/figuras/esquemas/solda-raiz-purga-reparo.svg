<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Soldagem — encaixe, purga, oscilação do passe e reparo com ligamento">
<title>Soldagem — encaixe, purga, oscilação do passe e reparo com ligamento (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Soldagem — encaixe, purga, oscilação do passe e reparo com ligamento</text>
<text class="b" x="30" y="62">(a) Solda de encaixe (socket)</text>
<path class="s" d="M60,110 L260,110 L260,130 L120,130 L120,210 L260,210 L260,230 L60,230 z"/>
<rect class="sl" x="150" y="140" width="180" height="60"/>
<path class="r" d="M260,130 l0,10 l14,0 z"/><path class="r" d="M260,210 l0,-10 l14,0 z"/>
<g id="cota-folga-encaixe" class="cota"><line class="e" x1="120" y1="200" x2="120" y2="261"/><line class="e" x1="150" y1="200" x2="150" y2="261"/><line class="d" x1="120" y1="255" x2="150" y2="255" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="135" y="275">folga no fundo</text></g>
<text class="m n" x="205" y="175">tubo</text>
<text class="n" x="80" y="100">conexão</text>
<text class="b" x="480" y="62">(b) Purga pelo lado interno</text>
<path class="s" d="M480,120 L640,120 L660,175 L660,190 L480,190 z"/>
<path class="s" d="M860,120 L700,120 L680,175 L680,190 L860,190 z"/>
<path class="r" d="M660,175 L680,175 L680,190 L660,190 z"/>
<path class="sl" d="M655,160 L685,160 L680,175 L660,175 z"/>
<path class="h" d="M645,130 L695,130"/>
<g id="cota-purga-deposito" class="cota"><line class="e" x1="690" y1="160" x2="726" y2="160"/><line class="e" x1="690" y1="190" x2="726" y2="190"/><line class="d" x1="720" y1="160" x2="720" y2="190" marker-start="url(#a)" marker-end="url(#a)"/><text x="728" y="165">depósito protegido</text></g>
<line class="d" x1="560" y1="225" x2="760" y2="225" marker-end="url(#a)"/>
<text class="n" x="560" y="245">gás de purga (argônio) pelo lado interno</text>
<text class="b" x="30" y="330">(c) Oscilação do passe (vista de topo)</text>
<path class="d" d="M60,400 l20,-25 l20,50 l20,-50 l20,50 l20,-50 l20,50 l20,-50 l20,50 l20,-50 l20,50 l20,-25"/>
<path class="h" d="M50,375 L330,375 M50,425 L330,425"/>
<g id="cota-oscilacao" class="cota"><line class="e" x1="330" y1="375" x2="356" y2="375"/><line class="e" x1="330" y1="425" x2="356" y2="425"/><line class="d" x1="350" y1="375" x2="350" y2="425" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="200" y="452">largura de oscilação</text></g>
<text class="b" x="480" y="330">(d) Escavação de reparo (corte da parede)</text>
<rect class="s" x="480" y="380" width="380" height="80"/>
<path class="w" d="M610,380 L635,430 L705,430 L730,380 z"/>
<g id="cota-reparo-profundidade" class="cota"><line class="e" x1="610" y1="380" x2="584" y2="380"/><line class="e" x1="610" y1="430" x2="584" y2="430"/><line class="d" x1="590" y1="380" x2="590" y2="430" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="582" y="410">profundidade</text></g>
<g id="cota-ligamento" class="cota"><line class="e" x1="705" y1="430" x2="766" y2="430"/><line class="e" x1="705" y1="460" x2="766" y2="460"/><line class="d" x1="760" y1="430" x2="760" y2="460" marker-start="url(#a)" marker-end="url(#a)"/><text x="768" y="450">ligamento</text></g>
<text class="n" x="500" y="372">face externa</text>
<text class="n" x="500" y="482">superfície interna</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
