<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-label="Anel (rolamento) de giro — medidas a, b, c, e, diâmetro da pista e parafusos">
<title>Anel (rolamento) de giro — medidas a, b, c, e, diâmetro da pista e parafusos (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
