<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Botoeiras de alarme no corredor e faixas de identificação de tubulação">
<title>Botoeiras de alarme no corredor e faixas de identificação de tubulação (esquema ilustrativo)</title>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Botoeiras de alarme no corredor e faixas de identificação de tubulação</text>
<text x="260" y="60" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">corredor (planta)</text>
<line x1="40" y1="110" x2="480" y2="110" stroke="#666" stroke-width="3" stroke-linecap="round"/>
<line x1="40" y1="230" x2="480" y2="230" stroke="#666" stroke-width="3" stroke-linecap="round"/>
<rect x="60" y="140" width="30" height="30" rx="0" fill="none" stroke="#666" stroke-width="1.5"/>
<text x="75" y="192" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">posto</text>
<rect x="292" y="112" width="16" height="12" rx="0" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1"/>
<rect x="452" y="112" width="16" height="12" rx="0" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1"/>
<text x="380" y="140" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">botoeiras</text>
<path d="M90,155 L200,155 L200,185 L300,185 L300,130" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
<g id="cota-botoeira-percurso" class="cota"><line x1="140.0" y1="290.0" x2="200.0" y2="186.0" stroke="#666" stroke-width="1.2"/><polygon points="200.0,186.0 198.5,195.5 192.5,192.0" fill="#666"/><text x="144.0" y="294.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">distância a percorrer até a botoeira</text></g>
<g id="cota-sinal-espacamento" class="cota"><line x1="300.0" y1="112.0" x2="300.0" y2="85.0" stroke="#666" stroke-width="1"/><line x1="460.0" y1="112.0" x2="460.0" y2="85.0" stroke="#666" stroke-width="1"/><line x1="300.0" y1="90.0" x2="460.0" y2="90.0" stroke="#666" stroke-width="1.2"/><polygon points="300.0,90.0 309.0,86.5 309.0,93.5" fill="#666"/><polygon points="460.0,90.0 451.0,93.5 451.0,86.5" fill="#666"/><text x="380.0" y="84.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sinalização a cada</text></g>
<text x="760" y="60" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tubulação (elevação)</text>
<line x1="560" y1="220" x2="960" y2="220" stroke="#666" stroke-width="14" stroke-linecap="round"/>
<rect x="600" y="206" width="26" height="28" rx="0" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<rect x="820" y="206" width="26" height="28" rx="0" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<g id="cota-faixa-espacamento" class="cota"><line x1="613.0" y1="206.0" x2="613.0" y2="175.0" stroke="#666" stroke-width="1"/><line x1="833.0" y1="206.0" x2="833.0" y2="175.0" stroke="#666" stroke-width="1"/><line x1="613.0" y1="180.0" x2="833.0" y2="180.0" stroke="#666" stroke-width="1.2"/><polygon points="613.0,180.0 622.0,176.5 622.0,183.5" fill="#666"/><polygon points="833.0,180.0 824.0,183.5 824.0,176.5" fill="#666"/><text x="723.0" y="174.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espaçamento entre faixas</text></g>
<text x="12" y="352" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
