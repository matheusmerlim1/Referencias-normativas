<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Ultrassom computadorizado — phased array, ToFD e bloco de calibração">
<title>Ultrassom computadorizado — phased array, ToFD e bloco de calibração (esquema ilustrativo)</title>
<style>
