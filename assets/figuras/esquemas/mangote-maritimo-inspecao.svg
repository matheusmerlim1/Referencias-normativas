<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Mangote marítimo — alongamento, alvéolos no flange e continuidade">
<title>Mangote marítimo — alongamento, alvéolos no flange e continuidade (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Mangote marítimo — alongamento, alvéolos no flange e continuidade</text>
<text class="b" x="30" y="62">(a) Ensaio de pressão — alongamento do mangote</text>
<rect class="sl" x="80" y="130" width="600" height="50" rx="10"/>
<rect class="s" x="60" y="115" width="20" height="80"/><rect class="s" x="680" y="115" width="20" height="80"/>
<rect class="h" x="700" y="115" width="40" height="80"/>
<g id="cota-alongamento" class="cota"><line class="e" x1="70" y1="195" x2="70" y2="236"/><line class="e" x1="690" y1="195" x2="690" y2="236"/><line class="d" x1="70" y1="230" x2="690" y2="230" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="380.0" y="223">L1 (0,7 bar) → L2 (pressão de ensaio) → L3 (0,7 bar)</text></g>
<text class="b" x="30" y="300">(b) Flange / niple e capa</text>
<rect class="s" x="80" y="330" width="30" height="140"/>
<path class="w" d="M80,380 q8,10 0,20 z"/>
<g id="cota-alveolo-flange" class="cota"><line class="e" x1="70" y1="470" x2="70" y2="501"/><line class="e" x1="82" y1="470" x2="82" y2="501"/><line class="d" x1="70" y1="495" x2="82" y2="495" marker-start="url(#a)" marker-end="url(#a)"/><text x="90" y="515">alvéolo no flange (prof.)</text></g>
<rect class="sl" x="110" y="350" width="400" height="100"/>
<path class="w" d="M300,350 l10,18 l20,0 l10,-18 z"/>
<g id="cota-dano-capa" class="cota"><line class="e" x1="340" y1="350" x2="366" y2="350"/><line class="e" x1="340" y1="368" x2="366" y2="368"/><line class="d" x1="360" y1="350" x2="360" y2="368" marker-start="url(#a)" marker-end="url(#a)"/><text x="368" y="364">dano (prof.)</text></g>
<text class="b" x="540" y="300">(c) Continuidade elétrica</text>
<rect class="sl" x="560" y="360" width="280" height="30" rx="8"/>
<path class="d" d="M560,375 L540,375 L540,460 L860,460 L860,375 L840,375"/>
<rect class="w" x="680" y="445" width="40" height="30"/>
<text class="m n" x="700" y="495">ohmímetro</text>
<g id="cota-extensao-continuidade" class="cota"><line class="e" x1="540" y1="460" x2="540" y2="536"/><line class="e" x1="860" y1="460" x2="860" y2="536"/><line class="d" x1="540" y1="530" x2="860" y2="530" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="700.0" y="523">extensão de cabo</text></g>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
