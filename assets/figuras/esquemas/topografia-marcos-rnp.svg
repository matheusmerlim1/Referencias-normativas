<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Levantamento topográfico — marco de concreto, referência de nível profunda (RNP), piquete e estaca">
<!--P7A-->
<title>Levantamento topográfico — marco de concreto, referência de nível profunda (RNP), piquete e estaca (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Levantamento topográfico — marco de concreto, referência de nível profunda (RNP), piquete e estaca</text>
<text x="170" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) marco de concreto enterrado</text>
<line x1="40" y1="200" x2="320" y2="200" stroke="#666" stroke-width="1.2"/>
<text x="45" y="194" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">nível do terreno</text>
<polygon points="130,220 210,220 230,350 110,350" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<rect x="155" y="214" width="30" height="6" rx="0" fill="#666" fill-opacity="0.7" stroke="#666" stroke-width="1.5"/>
<text x="250" y="230" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">placa de bronze / inox</text>
<g id="cota-marco-enterrado" class="cota"><line x1="90" y1="200" x2="90" y2="220" stroke="#666" stroke-width="1.2"/><polygon points="90.0,200.0 86.5,209.0 93.5,209.0" fill="#666"/><polygon points="90.0,220.0 93.5,211.0 86.5,211.0" fill="#666"/><text x="40" y="234" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">enterrado</text></g>
<g id="cota-marco-altura" class="cota"><line x1="250" y1="220" x2="250" y2="350" stroke="#666" stroke-width="1.2"/><polygon points="250.0,220.0 246.5,229.0 253.5,229.0" fill="#666"/><polygon points="250.0,350.0 253.5,341.0 246.5,341.0" fill="#666"/><text x="256" y="290" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura do marco</text></g>
<g id="cota-marco-topo" class="cota"><line x1="130" y1="350" x2="130" y2="365" stroke="#666" stroke-width="1"/><line x1="210" y1="350" x2="210" y2="365" stroke="#666" stroke-width="1"/><line x1="130" y1="365" x2="210" y2="365" stroke="#666" stroke-width="1.2"/><polygon points="130.0,365.0 139.0,368.5 139.0,361.5" fill="#666"/><polygon points="210.0,365.0 201.0,361.5 201.0,368.5" fill="#666"/><text x="170.0" y="359.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">lado do topo</text></g>
<text x="170" y="405" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">três mourões amarelos sinalizam o marco</text>
<text x="520" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) RNP (benchmark)</text>
<line x1="400" y1="200" x2="640" y2="200" stroke="#666" stroke-width="1.2"/>
<rect x="480" y="190" width="80" height="40" rx="0" fill="#666" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<text x="600" y="186" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">caixa de proteção da cabeça</text>
<rect x="508" y="200" width="24" height="350" rx="0" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<rect x="515" y="196" width="10" height="450" rx="0" fill="#666" fill-opacity="0.45" stroke="#666" stroke-width="1.5"/>
<circle cx="520" cy="194" r="4" fill="#666" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<ellipse cx="520" cy="655" rx="22" ry="12" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.2"/>
<text x="550" y="662" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">base alargada (calda de cimento)</text>
<text x="540" y="320" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">graxa no espaço anelar</text>
<g id="cota-revestimento-folga" class="cota"><line x1="470" y1="550" x2="470" y2="646" stroke="#666" stroke-width="1.2"/><polygon points="470.0,550.0 466.5,559.0 473.5,559.0" fill="#666"/><polygon points="470.0,646.0 473.5,637.0 466.5,637.0" fill="#666"/><text x="464" y="600" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">revestimento termina acima do assentamento</text></g>
<g id="cota-rnp-diametros" class="cota"><line x1="600" y1="450" x2="532" y2="450" stroke="#666" stroke-width="1.2"/><polygon points="532.0,450.0 541.0,453.5 541.0,446.5" fill="#666"/><text x="604" y="454" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø revestimento / Ø haste</text></g>
<text x="520" y="685" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">assentamento no impenetrável à percussão</text>
<text x="830" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) piquete, estaca e bandeirola</text>
<line x1="700" y1="200" x2="980" y2="200" stroke="#666" stroke-width="1.2"/>
<polygon points="740,180 752,180 752,230 746,242 740,230" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<g id="cota-piquete-comprimento" class="cota"><line x1="720" y1="180" x2="720" y2="242" stroke="#666" stroke-width="1.2"/><polygon points="720.0,180.0 716.5,189.0 723.5,189.0" fill="#666"/><polygon points="720.0,242.0 723.5,233.0 716.5,233.0" fill="#666"/><text x="714" y="220" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">comprimento</text></g>
<g id="cota-piquete-secao" class="cota"><line x1="740" y1="166" x2="752" y2="166" stroke="#666" stroke-width="1.2"/><polygon points="740.0,166.0 749.0,169.5 749.0,162.5" fill="#666"/><polygon points="752.0,166.0 743.0,162.5 743.0,169.5" fill="#666"/><text x="746" y="160" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">seção</text></g>
<rect x="800" y="90" width="8" height="150" rx="0" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="812" y="120" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">estaca testemunha</text>
<g id="cota-estaca-altura" class="cota"><line x1="830" y1="200" x2="830" y2="90" stroke="#666" stroke-width="1.2"/><polygon points="830.0,200.0 833.5,191.0 826.5,191.0" fill="#666"/><polygon points="830.0,90.0 826.5,99.0 833.5,99.0" fill="#666"/><text x="836" y="150" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura (alagados)</text></g>
<line x1="920" y1="230" x2="920" y2="50" stroke="#666" stroke-width="2"/>
<polygon points="920,50 960,60 920,70" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<g id="cota-bandeirola" class="cota"><line x1="950" y1="200" x2="950" y2="50" stroke="#666" stroke-width="1.2"/><polygon points="950.0,200.0 953.5,191.0 946.5,191.0" fill="#666"/><polygon points="950.0,50.0 946.5,59.0 953.5,59.0" fill="#666"/><text x="955" y="30" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura da vara</text></g>
<circle cx="920" cy="205" r="30" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="920" y="252" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">área roçada com cal</text>
<g id="cota-rocado" class="cota"><line x1="890" y1="265" x2="950" y2="265" stroke="#666" stroke-width="1.2"/><polygon points="890.0,265.0 899.0,268.5 899.0,261.5" fill="#666"/><polygon points="950.0,265.0 941.0,261.5 941.0,268.5" fill="#666"/><text x="920.0" y="259.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø</text></g>
<text x="12" y="692" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
