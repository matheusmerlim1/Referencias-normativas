<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img" aria-label="Arruelas endurecidas (ASME B18.2.6) — circular / recortada (I.D., O.D., T, E) e chanfrada quadrada (A, inclinação)">
<title>Arruelas endurecidas (ASME B18.2.6) — circular / recortada (I.D., O.D., T, E) e chanfrada quadrada (A, inclinação) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Arruelas endurecidas (ASME B18.2.6) — circular / recortada (I.D., O.D., T, E) e chanfrada quadrada (A, inclinação)</text>
<path class="s" d="M120,112 A124,124 0 1,0 240,112 z"/>
<circle class="w" cx="180" cy="220" r="45"/>
<g id="cota-ID" class="cota"><line class="d" x1="135" y1="220" x2="225" y2="220" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="180" y="212">I.D.</text></g>
<g id="cota-OD" class="cota"><line class="e" x1="56" y1="223" x2="56" y2="376"/><line class="e" x1="304" y1="223" x2="304" y2="376"/><line class="d" x1="56" y1="370" x2="304" y2="370" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="180" y="388">O.D.</text></g>
<line class="e" x1="56" y1="220" x2="56" y2="375"/>
<line class="e" x1="304" y1="220" x2="304" y2="375"/>
<g id="cota-E" class="cota"><line class="e" x1="177" y1="220" x2="24" y2="220"/><line class="e" x1="177" y1="112" x2="24" y2="112"/><line class="d" x1="30" y1="220" x2="30" y2="112" marker-start="url(#a)" marker-end="url(#a)"/><text x="340" y="160">E (borda recortada)</text></g>
<line class="e" x1="180" y1="112" x2="340" y2="112"/>
<text class="n" x="60" y="420">circular recortada (corte reto na borda)</text>
<rect class="s" x="510" y="110" width="220" height="220"/>
<circle class="w" cx="620" cy="220" r="45"/>
<g id="cota-A" class="cota"><line class="e" x1="510" y1="333" x2="510" y2="366"/><line class="e" x1="730" y1="333" x2="730" y2="366"/><line class="d" x1="510" y1="360" x2="730" y2="360" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="620" y="378">A — lado</text></g>
<g id="cota-ID-q" class="cota"><line class="d" x1="575" y1="220" x2="665" y2="220" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="620" y="212">I.D.</text></g>
<path class="w" d="M800,150 L900,150 L900,300 L800,300 z"/>
<path class="s" d="M800,160 L900,150 L900,300 L800,300 z"/>
<g id="cota-T" class="cota"><line class="e" x1="903" y1="150" x2="926" y2="150"/><line class="e" x1="903" y1="300" x2="926" y2="300"/><line class="d" x1="920" y1="150" x2="920" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text x="927" y="230">T</text></g>
<g id="cota-inclinacao" class="cota"><line class="d" x1="780" y1="125" x2="840" y2="156" marker-end="url(#a)"/><text class="m" x="780" y="130">inclinação da face</text></g>
<g id="cota-planicidade" class="cota"><text x="520" y="420">planicidade / rebarbas / batimento: ver ficha</text></g>
<path class="g" d="M812,300 L816,309 L820,300"/>
<g id="cota-rebarba" class="cota"><line class="d" x1="840" y1="345" x2="817" y2="310" marker-end="url(#a)"/><text x="790" y="362">rebarba (altura)</text></g>
<text class="n" x="20" y="448">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
