<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-label="Instalação de instrumento ao processo — tomada, linha de impulso, manifold e suporte">
<title>Instalação de instrumento ao processo — tomada, linha de impulso, manifold e suporte (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Instalação de instrumento ao processo — tomada, linha de impulso, manifold e suporte</text>
