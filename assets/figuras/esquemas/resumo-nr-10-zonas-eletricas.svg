<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Zonas de risco, controlada e livre em torno de parte energizada — cotas">
<title>Zonas de risco, controlada e livre — cotas</title>
<g font-family="Arial, Helvetica, sans-serif" fill="#333">
<text x="12" y="22" font-size="15" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">Zonas em torno de parte energizada (planta)</text>
<circle cx="260" cy="230" r="170" fill="#999" fill-opacity="0.08" stroke="#666" stroke-width="1.5" stroke-dasharray="8 5"/>
<circle cx="260" cy="230" r="70" fill="#999" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<circle cx="260" cy="230" r="8" fill="#666"/>
<text x="260" y="256" text-anchor="middle" font-size="12" stroke="#fff" stroke-width="3" paint-order="stroke">PE</text>
<text x="260" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">ZR</text>
<text x="260" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">ZC</text>
<text x="470" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">ZL</text>
<g id="cota-rr" class="cota"><line x1="260" y1="230" x2="329" y2="230" stroke="#666" stroke-width="1.2"/><polygon points="330,230 321,233.5 321,226.5" fill="#666"/><text x="296" y="224" text-anchor="middle" font-size="12.5" stroke="#fff" stroke-width="3" paint-order="stroke">Rr</text></g>
<g id="cota-rc" class="cota"><line x1="260" y1="230" x2="140" y2="350" stroke="#666" stroke-width="1.2"/><polygon points="139.8,350.2 143.6,341.3 148.6,346.3" fill="#666"/><text x="186" y="304" text-anchor="end" font-size="12.5" stroke="#fff" stroke-width="3" paint-order="stroke">Rc</text></g>
<text x="470" y="150" font-size="12" stroke="#fff" stroke-width="3" paint-order="stroke">PE — ponto energizado</text>
<text x="470" y="172" font-size="12" stroke="#fff" stroke-width="3" paint-order="stroke">ZR — zona de risco (até Rr)</text>
<text x="470" y="194" font-size="12" stroke="#fff" stroke-width="3" paint-order="stroke">ZC — zona controlada (de Rr a Rc)</text>
<text x="470" y="216" font-size="12" stroke="#fff" stroke-width="3" paint-order="stroke">ZL — zona livre (além de Rc)</text>
<text x="470" y="250" font-size="11.5" stroke="#fff" stroke-width="3" paint-order="stroke">Distâncias medidas no ar, radialmente,</text>
<text x="470" y="268" font-size="11.5" stroke="#fff" stroke-width="3" paint-order="stroke">a partir da parte energizada;</text>
<text x="470" y="286" font-size="11.5" stroke="#fff" stroke-width="3" paint-order="stroke">dependem da tensão nominal.</text>
<text x="12" y="430" font-size="11.5" stroke="#fff" stroke-width="3" paint-order="stroke">Esquema ilustrativo (não é desenho da norma), sem escala.</text>
</g>
<g id="cota-rr-rc" class="cota"><line x1="260" y1="230" x2="329" y2="230" stroke="#666" stroke-width="1.2"/><polygon points="330,230 321,233.5 321,226.5" fill="#666"/><text x="296" y="224" text-anchor="middle" font-size="12.5" stroke="#fff" stroke-width="3" paint-order="stroke">Rr</text><line x1="260" y1="230" x2="140" y2="350" stroke="#666" stroke-width="1.2"/><polygon points="139.8,350.2 143.6,341.3 148.6,346.3" fill="#666"/><text x="186" y="304" text-anchor="end" font-size="12.5" stroke="#fff" stroke-width="3" paint-order="stroke">Rc</text></g>
</svg>
