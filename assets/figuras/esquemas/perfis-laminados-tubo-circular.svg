<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Tubo circular — HSS e Pipe (AISC) — OD, ID, t">
<title>Tubo circular — HSS e Pipe (AISC) — OD, ID, t (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Tubo circular — HSS e Pipe (AISC) — OD, ID, t</text>
<circle class="s" cx="300" cy="290" r="170"/>
<circle class="w" cx="300" cy="290" r="146"/>
<line class="c" x1="100" y1="290" x2="500" y2="290"/><line class="c" x1="300" y1="90" x2="300" y2="490"/>
<g id="cota-OD" class="cota"><line class="e" x1="300" y1="120" x2="104" y2="120"/><line class="e" x1="300" y1="460" x2="104" y2="460"/><line class="d" x1="110" y1="120" x2="110" y2="460" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="103" y="296">OD</text></g>
<g id="cota-ID" class="cota"><line class="d" x1="370" y1="144" x2="370" y2="436" marker-start="url(#a)" marker-end="url(#a)"/><text x="378" y="250">ID</text></g>
<g id="cota-t" class="cota"><line class="d" x1="420" y1="290" x2="446" y2="290" marker-end="url(#a)"/><line class="d" x1="496" y1="290" x2="470" y2="290" marker-end="url(#a)"/><line class="d" x1="446" y1="290" x2="470" y2="290"/><text x="500" y="284">t</text></g>
<text class="n" x="530" y="380">HSS: Ø externo × parede</text>
<text class="n" x="530" y="398">Pipe: Ø nominal + STD / XS / XXS</text>
<text class="n" x="530" y="422">I = Ix = Iy (seção simétrica)</text>
<text class="n" x="20" y="588">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
