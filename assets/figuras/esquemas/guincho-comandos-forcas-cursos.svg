<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Forças e cursos nos comandos do guincho (ASME B30.7 7-1.2.7)">
<title>Forças e cursos nos comandos do guincho (ASME B30.7 7-1.2.7)</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Forças e cursos nos comandos do guincho (ASME B30.7 7-1.2.7)</text>
<circle class="f" cx="170.0" cy="340.0" r="8" />
<line class="k" x1="170.0" y1="340.0" x2="170.0" y2="150.0" />
<circle class="f" cx="170.0" cy="150.0" r="10" />
<line class="x" x1="170.0" y1="340.0" x2="70.3" y2="126.1" />
<line class="x" x1="170.0" y1="340.0" x2="269.7" y2="126.1" />
<g id="cota-curso-alavanca" class="cota"><path class="dim" d="M68.6,122.5 A240,240 0 0,1 271.4,122.5" /><text class="s" x="170.0" y="86.0" text-anchor="middle">curso a partir do neutro</text></g>
<g id="cota-forca-alavanca" class="cota"><line class="ar" x1="262.0" y1="150.0" x2="186.0" y2="150.0" /><text x="268.0" y="155.0" text-anchor="start">força na alavanca</text></g>
<text class="b" x="170.0" y="380.0" text-anchor="middle">Alavanca manual</text>
<circle class="f" cx="480.0" cy="340.0" r="8" />
<line class="k" x1="480.0" y1="340.0" x2="650.0" y2="280.0" />
<line class="x" x1="480.0" y1="340.0" x2="650.0" y2="345.0" />
<g id="cota-forca-pedal" class="cota"><line class="ar" x1="620.0" y1="222.0" x2="620.0" y2="287.0" /><text x="612.0" y="212.0" text-anchor="middle">força no pedal</text></g>
<g id="cota-curso-pedal" class="cota"><line class="t" x1="650.0" y1="280.0" x2="700.0" y2="280.0" /><line class="t" x1="650.0" y1="345.0" x2="700.0" y2="345.0" /><line class="dim" x1="692.0" y1="280.0" x2="692.0" y2="345.0" /><text x="704.0" y="318.0" text-anchor="start" font-size="12px">curso do pedal</text></g>
<text class="b" x="565.0" y="380.0" text-anchor="middle">Pedal</text>
<text class="b" x="30.0" y="415.0" text-anchor="start" font-size="13px">Curso da alavanca: ≤ 356 mm (14 in) do neutro (dupla ação) e ≤ 610 mm (24 in) (simples ação)</text>
<text x="30.0" y="436.0" text-anchor="start" font-size="13px">Freio (7-1.2.3): segura ≥ 125 % da carga nominal.  Proteções (7-1.2.4): suportam uma pessoa de 90 kg (200 lb).</text>
<text class="n" x="890" y="462" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
