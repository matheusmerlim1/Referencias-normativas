<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 330" width="1150" height="330" role="img" aria-label="Chapa, chapa cladeada e forjado — espessura e seção">
<title>Chapa, chapa cladeada e forjado — espessura e seção (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Chapa, chapa cladeada e forjado — espessura e seção</text>
<text class="n b" x="60" y="110">chapa (corte)</text>
<rect class="s" x="60" y="150" width="240" height="50"/>
<g id="cota-t" class="cota"><line class="e" x1="302" y1="150" x2="328" y2="150"/><line class="e" x1="302" y1="200" x2="328" y2="200"/><line class="d" x1="322" y1="150" x2="322" y2="200" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="332" y="181">t (espessura)</text></g>
<text class="n b" x="430" y="84">chapa cladeada (corte)</text>
<rect class="r" x="430" y="145" width="220" height="15"/>
<rect class="s" x="430" y="160" width="220" height="45"/>
<text class="n" x="440" y="232">metal de base</text>
<g id="cota-revestimento" class="cota"><line class="e" x1="428" y1="145" x2="400" y2="145"/><line class="e" x1="428" y1="160" x2="400" y2="160"/><line class="d" x1="406" y1="121" x2="406" y2="145" marker-end="url(#a)"/><line class="d" x1="406" y1="184" x2="406" y2="160" marker-end="url(#a)"/><text class="m" x="406" y="114">revestimento</text></g>
<g id="cota-t-total" class="cota"><line class="e" x1="652" y1="145" x2="678" y2="145"/><line class="e" x1="652" y1="205" x2="678" y2="205"/><line class="d" x1="672" y1="145" x2="672" y2="205" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="684" y="180">espessura total</text></g>
<text class="n b" x="870" y="100">forjado / barra (seção)</text>
<rect x="870" y="130" width="190" height="90" fill="url(#hach)" stroke="#666" stroke-width="2"/>
<g id="cota-secao" class="cota"><line class="e" x1="870" y1="224" x2="870" y2="256"/><line class="e" x1="1060" y1="224" x2="1060" y2="256"/><line class="d" x1="870" y1="250" x2="1060" y2="250" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="965" y="272">maior seção (espessura)</text></g>
<text class="n" x="20" y="318">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
