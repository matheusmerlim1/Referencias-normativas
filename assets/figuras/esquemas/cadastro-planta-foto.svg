<text x="330" y="470" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">quadro de vértices (coordenadas UTM) e quadro-resumo das FCs na própria prancha</text>
<text x="820" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) foto do cadastro</text>
