<g id="cota-quadro-foto" class="cota"><line x1="960" y1="215" x2="960" y2="250" stroke="#666" stroke-width="1.2"/><polygon points="960.0,215.0 956.5,224.0 963.5,224.0" fill="#666"/><polygon points="960.0,250.0 963.5,241.0 956.5,241.0" fill="#666"/><text x="955" y="300" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">quadro ≤ fração da área</text></g>
<text x="12" y="592" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
