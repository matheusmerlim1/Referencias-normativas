<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Abreviaturas em desenho de tubulação — onde cada uma se aplica">
<!--P7A-->
<title>Abreviaturas em desenho de tubulação — onde cada uma se aplica (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Abreviaturas em desenho de tubulação — onde cada uma se aplica</text>
<text x="250" y="55" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) seção do tubo</text>
<circle cx="250" cy="200" r="100" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<circle cx="250" cy="200" r="82" fill="#fff" fill-opacity="0" stroke="#666" stroke-width="1.5"/>
<circle cx="250" cy="200" r="82" fill="#fff" stroke="#666" stroke-width="1.5"/>
<g id="cota-de" class="cota"><line x1="150" y1="200" x2="150" y2="330" stroke="#666" stroke-width="1"/><line x1="350" y1="200" x2="350" y2="330" stroke="#666" stroke-width="1"/><line x1="150" y1="330" x2="350" y2="330" stroke="#666" stroke-width="1.2"/><polygon points="150.0,330.0 159.0,333.5 159.0,326.5" fill="#666"/><polygon points="350.0,330.0 341.0,326.5 341.0,333.5" fill="#666"/><text x="250.0" y="324.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">DE — diâmetro externo</text></g>
<g id="cota-di" class="cota"><line x1="168" y1="200" x2="332" y2="200" stroke="#666" stroke-width="1.2"/><polygon points="168.0,200.0 177.0,203.5 177.0,196.5" fill="#666"/><polygon points="332.0,200.0 323.0,196.5 323.0,203.5" fill="#666"/><text x="250.0" y="194.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">DI — diâmetro interno</text></g>
<g id="cota-esp" class="cota"><line x1="332" y1="200" x2="332" y2="120" stroke="#666" stroke-width="1"/><line x1="350" y1="200" x2="350" y2="120" stroke="#666" stroke-width="1"/><line x1="332" y1="120" x2="350" y2="120" stroke="#666" stroke-width="1.2"/><polygon points="332.0,120.0 341.0,123.5 341.0,116.5" fill="#666"/><polygon points="350.0,120.0 341.0,116.5 341.0,123.5" fill="#666"/><text x="360" y="116" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ESP — espessura</text></g>
<text x="250" y="370" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">DN / NPS — diâmetro nominal; SCH — schedule</text>
<text x="720" y="55" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) tubo em elevação</text>
<rect x="520" y="170" width="400" height="60" rx="0" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<line x1="500" y1="200" x2="940" y2="200" stroke="#666" stroke-width="1" stroke-dasharray="10 3 2 3"/>
<text x="945" y="204" text-anchor="start" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">LC</text>
<line x1="500" y1="300" x2="940" y2="300" stroke="#666" stroke-width="1"/>
<text x="505" y="295" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">referência de nível</text>
<g id="cota-el" class="cota"><line x1="880" y1="300" x2="880" y2="200" stroke="#666" stroke-width="1.2"/><polygon points="880.0,300.0 883.5,291.0 876.5,291.0" fill="#666"/><polygon points="880.0,200.0 876.5,209.0 883.5,209.0" fill="#666"/><text x="870" y="260" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">EL — elevação da LC</text></g>
<g id="cota-bop" class="cota"><line x1="620" y1="300" x2="620" y2="230" stroke="#666" stroke-width="1.2"/><polygon points="620.0,300.0 623.5,291.0 616.5,291.0" fill="#666"/><polygon points="620.0,230.0 616.5,239.0 623.5,239.0" fill="#666"/><text x="630" y="270" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">BOP — geratriz inferior</text></g>
<text x="720" y="150" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">LC — linha de centro · FIT — face inferior do tubo</text>
<text x="720" y="360" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) extremidades e flanges</text>
<text x="720" y="395" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">EXC / EXP / EXR — extremidade chanfrada / plana / roscada</text>
<text x="720" y="415" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">AEC / AEP / AER — ambas as extremidades …</text>
<text x="720" y="435" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">FF / RF — face plana / face com ressalto; FCE — flange cego</text>
<text x="720" y="455" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">CRL / CRC — curva de raio longo / curto; CONC / ECC</text>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
