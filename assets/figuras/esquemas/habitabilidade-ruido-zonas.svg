<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Exposição ao ruído — zonas por nível e duração (esquema qualitativo)">
<title>Exposição ao ruído — zonas por nível e duração (esquema qualitativo)</title>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Exposição ao ruído — zonas por nível e duração (esquema qualitativo)</text>
<line x1="90" y1="400" x2="700" y2="400" stroke="#666" stroke-width="2" stroke-linecap="round"/>
<line x1="90" y1="400" x2="90" y2="60" stroke="#666" stroke-width="2" stroke-linecap="round"/>
<text x="400" y="435" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">duração da exposição →</text>
<text transform="rotate(-90 30 230)" x="30" y="230" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">nível sonoro →</text>
<polyline points="90,80 700,80" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="90,110 300,137 700,200" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="90,200 300,230 700,300" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="400" y="72" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">zona A — ninguém exposto</text>
<text x="520" y="150" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">zona B</text>
<text x="520" y="240" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">zona C / D (com protetor)</text>
<text x="400" y="360" text-anchor="middle" font-size="12" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">zona E — sem protetor</text>
<text x="12" y="452" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo, sem escala — não é desenho da norma.</text>
</svg>
