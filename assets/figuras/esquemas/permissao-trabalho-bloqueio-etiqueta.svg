<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Permissão para trabalho — fluxo, isolamento de energias e etiquetas de advertência">
<!--P7A-->
<title>Permissão para trabalho — fluxo, isolamento de energias e etiquetas de advertência (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Permissão para trabalho — fluxo, isolamento de energias e etiquetas de advertência</text>
<text x="500" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) fluxo da intervenção</text>
<rect x="30" y="70" width="175" height="50" rx="6" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/>
<text x="117" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">autorização da intervenção</text>
<line x1="205" y1="95" x2="222" y2="95" stroke="#666" stroke-width="1.5"/>
<rect x="222" y="70" width="175" height="50" rx="6" fill="#666" fill-opacity="0.14" stroke="#666" stroke-width="1.5"/>
<text x="309" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">planejamento</text>
<text x="309" y="108" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(análise de risco)</text>
<line x1="397" y1="95" x2="414" y2="95" stroke="#666" stroke-width="1.5"/>
<rect x="414" y="70" width="175" height="50" rx="6" fill="#666" fill-opacity="0.18" stroke="#666" stroke-width="1.5"/>
<text x="501" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">emissão da PT</text>
<text x="501" y="108" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(verificação no local)</text>
<line x1="589" y1="95" x2="606" y2="95" stroke="#666" stroke-width="1.5"/>
<rect x="606" y="70" width="175" height="50" rx="6" fill="#666" fill-opacity="0.22" stroke="#666" stroke-width="1.5"/>
<text x="693" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">execução</text>
<text x="693" y="108" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(PT afixada)</text>
<line x1="781" y1="95" x2="798" y2="95" stroke="#666" stroke-width="1.5"/>
<rect x="798" y="70" width="175" height="50" rx="6" fill="#666" fill-opacity="0.26" stroke="#666" stroke-width="1.5"/>
<text x="885" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">encerramento</text>
<text x="885" y="108" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(retira bloqueios)</text>
<text x="500" y="145" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">suspensão: recomendação não atendida, risco novo, demora/interrupção acima do previsto, emergência próxima — cancelamento exige nova PT</text>
<text x="250" y="190" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) isolamento, travamento e advertência</text>
<line x1="60" y1="300" x2="400" y2="300" stroke="#999" stroke-width="8"/>
<polygon points="200,280 200,320 240,280 240,320" fill="#666" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<line x1="220" y1="300" x2="220" y2="250" stroke="#666" stroke-width="2"/>
<line x1="195" y1="250" x2="245" y2="250" stroke="#666" stroke-width="4"/>
<rect x="240" y="230" width="20" height="22" rx="3" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<path d="M244,230 v-8 a6,6 0 0 1 12,0 v8" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="2"/>
<text x="270" y="232" text-anchor="start" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cadeado / trava</text>
<rect x="150" y="320" width="30" height="50" rx="0" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<text x="165" y="388" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">amarela</text>
<text x="165" y="401" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(emitente)</text>
<rect x="255" y="320" width="30" height="50" rx="0" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="270" y="388" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">azul</text>
<text x="270" y="401" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(executante)</text>
<line x1="165" y1="320" x2="215" y2="302" stroke="#666" stroke-width="1"/>
<line x1="270" y1="320" x2="228" y2="302" stroke="#666" stroke-width="1"/>
<rect x="330" y="286" width="14" height="28" rx="0" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="337" y="340" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">raquete / figura 8</text>
<text x="230" y="440" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">plano de isolamento: fontes de energia, manobras, travas,</text>
<text x="230" y="455" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">raquetes, dissipação de energia residual e pontos das etiquetas</text>
<text x="740" y="190" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) etiqueta de advertência (frente)</text>
<rect x="690" y="220" width="100" height="200" rx="6" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="2"/>
<circle cx="740" cy="240" r="7" fill="#666" fill-opacity="0" stroke="#666" stroke-width="1.5"/>
<ellipse cx="740" cy="330" rx="40" ry="28" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<text x="740" y="335" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">PERIGO</text>
<text x="740" y="385" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">veja o outro lado</text>
<g id="cota-etiqueta-largura" class="cota"><line x1="690" y1="420" x2="690" y2="445" stroke="#666" stroke-width="1"/><line x1="790" y1="420" x2="790" y2="445" stroke="#666" stroke-width="1"/><line x1="690" y1="445" x2="790" y2="445" stroke="#666" stroke-width="1.2"/><polygon points="690.0,445.0 699.0,448.5 699.0,441.5" fill="#666"/><polygon points="790.0,445.0 781.0,441.5 781.0,448.5" fill="#666"/><text x="740.0" y="439.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">largura</text></g>
<g id="cota-etiqueta-altura" class="cota"><line x1="815" y1="220" x2="815" y2="420" stroke="#666" stroke-width="1.2"/><polygon points="815.0,220.0 811.5,229.0 818.5,229.0" fill="#666"/><polygon points="815.0,420.0 818.5,411.0 811.5,411.0" fill="#666"/><text x="821" y="325" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura</text></g>
<g id="cota-etiqueta-furo" class="cota"><line x1="650" y1="225" x2="733" y2="238" stroke="#666" stroke-width="1.2"/><polygon points="733.0,238.0 724.6,233.1 723.6,240.1" fill="#666"/><text x="646" y="224" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">furo</text></g>
<text x="740" y="482" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">verso: dados da PT / matriz de isolamento,</text>
<text x="740" y="496" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">quem pode retirar a etiqueta</text>
<text x="500" y="600" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Cores pela N-1219: fundo amarelo-segurança (emitente) ou azul-segurança (executante), palavra de perigo em vermelho.</text>
<text x="12" y="632" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
