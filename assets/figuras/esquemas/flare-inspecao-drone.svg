<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Flare — inspeção com drone: alturas e afastamentos">
<title>Flare — inspeção com drone: alturas e afastamentos (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Flare — inspeção com drone: alturas e afastamentos</text>
<text class="b" x="30" y="62">Inspeção do flare com drone (RPA)</text>
<line class="g" x1="40" y1="520" x2="880" y2="520"/>
<rect class="s" x="200" y="140" width="16" height="380"/>
<path class="r" d="M196,140 l12,-30 l12,30 z"/>
<text class="n" x="230" y="120">tip</text>
<rect class="w" x="300" y="150" width="30" height="10"/><line class="g" x1="295" y1="150" x2="335" y2="150"/>
<g id="cota-afastamento-tip" class="cota"><line class="d" x1="216" y1="175" x2="300" y2="175" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="258" y="195">ao tip</text></g>
<g id="cota-altura-voo" class="cota"><line class="e" x1="200" y1="150" x2="114" y2="150"/><line class="e" x1="200" y1="520" x2="114" y2="520"/><line class="d" x1="120" y1="150" x2="120" y2="520" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="112" y="340.0"></text></g><text class="m" x="108" y="335" transform="rotate(-90 108 335)">altura máx. de voo</text>
<g id="cota-afastamento-objeto" class="cota"><line class="d" x1="216" y1="300" x2="315" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="265" y="292">ao objeto</text></g>
<line class="e" x1="315" y1="160" x2="315" y2="306"/>
<circle class="w" cx="760" cy="500" r="10"/><line class="g" x1="760" y1="510" x2="760" y2="520"/>
<text class="m n" x="760" y="485">piloto</text>
<g id="cota-distancia-piloto" class="cota"><line class="e" x1="315" y1="520" x2="315" y2="566"/><line class="e" x1="760" y1="520" x2="760" y2="566"/><line class="d" x1="315" y1="560" x2="760" y2="560" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="537.5" y="553">distância horizontal ao piloto</text></g>
<rect class="y" x="470" y="440" width="120" height="80" fill-opacity=".25"/>
<text class="m n" x="530" y="430">área classificada</text>
<g id="cota-afastamento-areas" class="cota"><line class="d" x1="330" y1="420" x2="470" y2="420" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="400" y="412">afastamento</text></g>
<line class="e" x1="330" y1="160" x2="330" y2="426"/>
<rect class="w" x="640" y="120" width="80" height="50" rx="6"/><circle class="w" cx="680" cy="145" r="16"/>
<g id="cota-camera" class="cota"><line class="d" x1="664" y1="180" x2="696" y2="180" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="680" y="200">sensor / focal</text></g>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
