<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" role="img" aria-label="Tanque séptico — distâncias mínimas, profundidade útil, dimensões internas e inspeção">
<title>Tanque séptico — distâncias mínimas, profundidade útil, dimensões internas e inspeção (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Tanque séptico — distâncias mínimas, profundidade útil, dimensões internas e inspeção</text>
<text class="n b" x="60" y="70">corte</text>
<line class="g" x1="40" y1="180" x2="620" y2="180"/>
<rect x="40" y="180" width="580" height="10" fill="url(#hach)" stroke="none"/>
<rect class="s" x="290" y="200" width="240" height="280"/>
<rect class="w" x="310" y="215" width="200" height="255"/>
<rect x="400" y="198" width="60" height="19" fill="#fff" stroke="none"/>
<rect class="sl" x="390" y="188" width="80" height="10"/>
<line class="h" x1="310" y1="260" x2="510" y2="260"/>
<text class="n" x="465" y="278">N.A.</text>
<path class="g" d="M200,240 L330,240 M320,225 L320,300 M490,250 L620,250 M500,225 L500,300"/>
<g id="cota-profundidade" class="cota"><line class="e" x1="512" y1="260" x2="566" y2="260"/><line class="e" x1="512" y1="470" x2="566" y2="470"/><line class="d" x1="560" y1="260" x2="560" y2="470" marker-start="url(#a)" marker-end="url(#a)"/><text x="570" y="370">profundidade útil</text></g>
<g id="cota-diametro" class="cota"><line class="e" x1="310" y1="472" x2="310" y2="511"/><line class="e" x1="510" y1="472" x2="510" y2="511"/><line class="d" x1="310" y1="505" x2="510" y2="505" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="410" y="530">Ø interno / largura interna</text></g>
<g id="cota-folga-laje" class="cota"><line class="e" x1="322" y1="215" x2="351" y2="215"/><line class="e" x1="322" y1="225" x2="351" y2="225"/><line class="d" x1="345" y1="189" x2="345" y2="215" marker-end="url(#a)"/><line class="d" x1="345" y1="251" x2="345" y2="225" marker-end="url(#a)"/><line class="d" x1="345" y1="215" x2="345" y2="225"/><text x="350" y="330">folga dispositivos – laje</text></g>
<g id="cota-abertura" class="cota"><line class="d" x1="400" y1="165" x2="460" y2="165" marker-start="url(#a)" marker-end="url(#a)"/><text x="300" y="145">abertura de inspeção (menor dimensão)</text></g>
<text class="n b" x="660" y="70">planta (lote)</text>
<rect class="h" x="660" y="90" width="480" height="500"/>
<rect class="sl" x="700" y="110" width="140" height="100"/>
<text class="n m" x="770" y="165">construção</text>
<rect class="s" x="900" y="260" width="110" height="60"/>
<text class="n m" x="955" y="295">tanque</text>
<circle class="w" cx="1080" cy="140" r="25"/>
<text class="n m" x="1080" y="105">árvore</text>
<circle class="w" cx="1070" cy="520" r="18"/>
<text class="n m" x="1070" y="560">poço</text>
<circle class="w" cx="760" cy="500" r="25"/>
<text class="n m" x="760" y="545">sumidouro</text>
<g id="cota-dist-construcao" class="cota"><line class="e" x1="840" y1="210" x2="931" y2="210"/><line class="d" x1="925" y1="210" x2="925" y2="260" marker-start="url(#a)" marker-end="url(#a)"/><text x="935" y="240">construções, divisas, sumidouro</text></g>
<g id="cota-dist-arvore" class="cota"><line class="d" x1="1010" y1="260" x2="1062" y2="158" marker-start="url(#a)" marker-end="url(#a)"/><text x="1030" y="200">árvores, rede de água</text></g>
<g id="cota-dist-poco" class="cota"><line class="d" x1="1010" y1="320" x2="1058" y2="506" marker-start="url(#a)" marker-end="url(#a)"/><text x="1045" y="420">poços, corpos d'água</text></g>
<g id="cota-largura" class="cota"><line class="d" x1="885" y1="260" x2="885" y2="320" marker-start="url(#a)" marker-end="url(#a)"/><text x="840" y="345">largura interna (prismático)</text></g>
<text class="n" x="20" y="628">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
