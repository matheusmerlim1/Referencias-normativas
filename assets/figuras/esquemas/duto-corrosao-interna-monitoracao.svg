<g id="cota-perda-espessura" class="cota"><line x1="720" y1="300" x2="750" y2="300" stroke="#666" stroke-width="1.2"/><polygon points="720,300 729,303.5 729,296.5" fill="#666"/><polygon points="750,300 741,296.5 741,303.5" fill="#666"/><text x="758" y="304" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">perda (corrosão)</text></g>
<text x="12" y="452" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
