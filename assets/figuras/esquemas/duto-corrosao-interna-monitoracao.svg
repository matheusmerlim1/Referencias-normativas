<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Duto — monitoração da corrosão interna (tomadas de cupom e sonda, espessuras)">
<title>Duto — monitoração da corrosão interna (tomadas de cupom e sonda, espessuras) (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Duto — monitoração da corrosão interna (tomadas de cupom e sonda, espessuras)</text>
