<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Par de engrenagens — distância entre eixos, folga e capacidade de carga">
<title>Par de engrenagens — distância entre eixos, folga e capacidade de carga (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Par de engrenagens — distância entre eixos, folga e capacidade de carga</text>
<circle cx="330" cy="230" r="150" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1.5"/>
<circle cx="330" cy="230" r="135" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1.5" stroke-dasharray="10 4 2 4"/>
<circle cx="330" cy="230" r="8" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<circle cx="610" cy="230" r="110" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1.5"/>
<circle cx="610" cy="230" r="95" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1.5" stroke-dasharray="10 4 2 4"/>
<circle cx="610" cy="230" r="8" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="330" y="250" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pinhão / coroa 1</text>
<text x="610" y="250" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">roda 2</text>
<g id="cota-a" class="cota"><line x1="330" y1="238" x2="330" y2="420" stroke="#666" stroke-width="1"/><line x1="610" y1="238" x2="610" y2="420" stroke="#666" stroke-width="1"/><line x1="330" y1="420" x2="610" y2="420" stroke="#666" stroke-width="1.2"/><polygon points="330.0,420.0 339.0,416.5 339.0,423.5" fill="#666"/><polygon points="610.0,420.0 601.0,423.5 601.0,416.5" fill="#666"/><text x="470.0" y="414" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">a (distância entre eixos)</text></g>
<g id="cota-folga" class="cota"><line x1="490" y1="150" x2="470" y2="200" stroke="#666" stroke-width="1.2"/><polygon points="470.0,200.0 470.1,190.3 476.6,192.9" fill="#666"/><text x="495" y="140" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">folga entre flancos</text></g>
<text x="330" y="70" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">círculo de referência (traço-ponto)</text>
<text x="820" y="150" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">carga no dente:</text>
<text x="820" y="168" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">flexão no pé</text>
<text x="820" y="186" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pressão no flanco (pite)</text>
<text x="820" y="204" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">scuffing / micropite</text>
<text x="12" y="462" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
