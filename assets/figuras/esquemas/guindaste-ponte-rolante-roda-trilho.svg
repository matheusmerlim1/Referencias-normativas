<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Roda sobre trilho — largura do boleto, raio, folgas e largura útil">
<title>Roda sobre trilho — largura do boleto, raio, folgas e largura útil (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Roda sobre trilho — largura do boleto, raio, folgas e largura útil</text>
<path class="sl" d="M190,90 L410,90 L410,200 L380,200 L380,230 L220,230 L220,200 L190,200 Z"/>
<path class="s" d="M240,240 L360,240 L360,280 L320,280 L320,360 L380,370 L380,390 L220,390 L220,370 L280,360 L280,280 L240,280 Z"/>
<g id="cota-l" class="cota"><line class="e" x1="240" y1="283" x2="240" y2="346"/><line class="e" x1="360" y1="283" x2="360" y2="346"/><line class="d" x1="240" y1="340" x2="360" y2="340" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="180" y="345">ℓ (boleto)</text></g>
<g id="cota-r" class="cota"><line class="d" x1="450" y1="265" x2="358" y2="242" marker-end="url(#a)"/><text x="454" y="270">r</text></g>
<g id="cota-f" class="cota"><line class="e" x1="360" y1="227" x2="360" y2="209"/><line class="e" x1="380" y1="227" x2="380" y2="209"/><line class="d" x1="334" y1="215" x2="360" y2="215" marker-end="url(#a)"/><line class="d" x1="406" y1="215" x2="380" y2="215" marker-end="url(#a)"/><line class="d" x1="360" y1="215" x2="380" y2="215"/><text class="m" x="370" y="208">f/2</text></g>
<g id="cota-b" class="cota"><line class="e" x1="255" y1="237" x2="255" y2="164"/><line class="e" x1="345" y1="237" x2="345" y2="164"/><line class="d" x1="255" y1="170" x2="345" y2="170" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="300" y="163">b (largura útil)</text></g>
<g id="cota-Dr" class="cota"><line class="d" x1="500" y1="90" x2="500" y2="230" marker-start="url(#a)" marker-end="url(#a)"/><text x="510" y="165">Dr (Ø da roda)</text></g>
<text class="n m" x="300" y="70">roda (corte)</text>
<text class="n m" x="300" y="420">trilho</text>
<text class="n" x="20" y="428">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
