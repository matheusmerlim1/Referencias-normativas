<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="Folha de desenho — formato, margens, quadro, legenda e escala de referência">
<title>Folha de desenho — formato, margens, quadro, legenda e escala de referência (esquema ilustrativo)</title>
<style>
