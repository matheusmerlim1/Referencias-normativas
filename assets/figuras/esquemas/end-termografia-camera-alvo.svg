<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Termografia — câmera, FOV, distância e ângulo de visada">
<title>Termografia — câmera, FOV, distância e ângulo de visada (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Termografia — câmera, FOV, distância e ângulo de visada</text>
<text class="b" x="30" y="62">Câmera termográfica, campo de visão e ângulo de visada</text>
<rect class="w" x="60" y="250" width="80" height="50" rx="6"/><rect class="w" x="140" y="262" width="20" height="26"/>
<text class="m n" x="100" y="320">câmera (FPA)</text>
<path class="h" d="M160,275 L640,140 M160,275 L700,420"/>
<g id="cota-fov" class="cota"><path class="d" d="M260,247 A105,105 0 0,1 262,305" marker-start="url(#a)" marker-end="url(#a)"/><text x="275" y="240">FOV da lente</text></g>
<path class="r" d="M650,120 L720,440" stroke-width="3"/>
<path class="s" d="M650,120 L720,440 L760,440 L690,120 z"/>
<text class="n" x="770" y="200">superfície do</text>
<text class="n" x="770" y="218">equipamento</text>
<line class="c" x1="672" y1="220" x2="540" y2="249"/>
<g id="cota-angulo-normal" class="cota"><path class="d" d="M600,236 A75,75 0 0,1 593,265" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="560" y="300">ângulo × normal</text></g>
<g id="cota-distancia" class="cota"><line class="e" x1="160" y1="300" x2="160" y2="486"/><line class="e" x1="672" y1="300" x2="672" y2="486"/><line class="d" x1="160" y1="480" x2="672" y2="480" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="416.0" y="473">distância câmera–alvo</text></g>
<g id="cota-objeto-minimo" class="cota"><line class="d" x1="690" y1="250" x2="700" y2="295" marker-start="url(#a)" marker-end="url(#a)"/><text x="735" y="290">menor alvo medido</text></g>
<text class="n" x="60" y="540">MIFOV ≈ resolução espacial × 2 a 5: define o menor objeto cuja temperatura pode ser medida àquela distância</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
