<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-label="Plaqueta de identificação da lingada — octogonal (corrente) e redonda (cabo)">
<title>Plaqueta de identificação da lingada — octogonal (corrente) e redonda (cabo) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
