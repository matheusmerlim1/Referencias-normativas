<g id="cota-caracteres" class="cota"><line class="e" x1="298" y1="118" x2="326" y2="118"/><line class="e" x1="298" y1="130" x2="326" y2="130"/><line class="d" x1="320" y1="92" x2="320" y2="118" marker-end="url(#a)"/><line class="d" x1="320" y1="156" x2="320" y2="130" marker-end="url(#a)"/><line class="d" x1="320" y1="118" x2="320" y2="130"/><text x="340" y="90">altura dos caracteres</text></g>
<circle class="w" cx="560" cy="200" r="120"/>
<text class="n m" x="560" y="205">mesmos campos (cabo de aço)</text>
<text class="b m" x="200" y="360">corrente: octogonal</text>
<text class="b m" x="560" y="360">cabo de aço: redonda</text>
<text class="n" x="20" y="398">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
