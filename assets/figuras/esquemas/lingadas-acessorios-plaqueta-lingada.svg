<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Plaqueta de identificação da lingada — octogonal (corrente) e redonda (cabo)</text>
<path class="w" d="M320.1,249.7 L249.7,320.1 L150.3,320.1 L79.9,249.7 L79.9,150.3 L150.3,79.9 L249.7,79.9 L320.1,150.3 z"/>
<text class="n m" x="200" y="130">nº do certificado / lingada</text>
<text class="n m" x="200" y="158">marca e norma</text>
<text class="n m" x="200" y="186">nº de pernas e Ø</text>
<text class="n m" x="200" y="214">ângulo da lingada</text>
