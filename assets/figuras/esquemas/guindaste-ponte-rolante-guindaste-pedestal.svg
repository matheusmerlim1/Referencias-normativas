<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Guindaste de pedestal — componentes, raio, espessura de membro e marcação">
<title>Guindaste de pedestal — componentes, raio, espessura de membro e marcação (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Guindaste de pedestal — componentes, raio, espessura de membro e marcação</text>
<rect class="s" x="160" y="330" width="60" height="110"/>
<text class="n" x="230" y="400">pedestal</text>
<rect class="sl" x="140" y="310" width="100" height="20"/>
<text class="n" x="250" y="325">conjunto de giro</text>
<rect class="sl" x="150" y="250" width="80" height="60"/>
<text class="n en" x="140" y="245">cabine</text>
<line x1="200" y1="300" x2="640" y2="90" stroke="#8c8c8c" stroke-width="12" stroke-linecap="round"/>
<text class="b" x="420" y="175">SWL</text>
<g id="cota-caracteres" class="cota"><line class="e" x1="413" y1="160" x2="441" y2="160"/><line class="e" x1="413" y1="178" x2="441" y2="178"/><line class="d" x1="435" y1="134" x2="435" y2="160" marker-end="url(#a)"/><line class="d" x1="435" y1="204" x2="435" y2="178" marker-end="url(#a)"/><line class="d" x1="435" y1="160" x2="435" y2="178"/><text x="440" y="210">altura da marcação</text></g>
<line x1="640" y1="90" x2="640" y2="330" stroke="#666" stroke-width="2" stroke-linecap="round"/>
<circle class="g" cx="640" cy="345" r="12"/>
<text class="n" x="655" y="350">moitão / gancho</text>
<line class="c" x1="190" y1="300" x2="190" y2="460"/>
<g id="cota-raio" class="cota"><line class="d" x1="190" y1="440" x2="640" y2="440" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="415" y="432">raio</text></g>
<rect class="w" x="720" y="120" width="120" height="80"/>
<rect class="w" x="735" y="135" width="90" height="50"/>
<g id="cota-t-membro" class="cota"><line class="d" x1="694" y1="160" x2="720" y2="160" marker-end="url(#a)"/><line class="d" x1="761" y1="160" x2="735" y2="160" marker-end="url(#a)"/><line class="d" x1="720" y1="160" x2="735" y2="160"/><text class="m" x="780" y="225">t</text></g>
<text class="n m" x="780" y="110">seção do membro</text>
<text class="n" x="20" y="488">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
