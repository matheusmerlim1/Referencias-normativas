<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Tanque atmosférico em serviço — rodapé, barriga, pontos de medição e faixas">
<title>Tanque atmosférico em serviço — rodapé, barriga, pontos de medição e faixas (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Tanque atmosférico em serviço — rodapé, barriga, pontos de medição e faixas</text>
<text class="b" x="30" y="62">(a) Elevação do tanque</text>
<rect class="sl" x="80" y="140" width="360" height="300"/>
<path class="g" d="M70,140 L260,110 L450,140"/>
<line class="g" x1="40" y1="440" x2="480" y2="440"/>
<rect class="y" x="80" y="410" width="360" height="30" fill-opacity=".25"/>
<g id="cota-rodape" class="cota"><line class="e" x1="440" y1="410" x2="476" y2="410"/><line class="e" x1="440" y1="440" x2="476" y2="440"/><line class="d" x1="470" y1="410" x2="470" y2="440" marker-start="url(#a)" marker-end="url(#a)"/><text x="478" y="430">rodapé</text></g>
<path class="r" d="M80,260 q-22,30 0,60" fill="none"/>
<g id="cota-barriga" class="cota"><line class="d" x1="40" y1="290" x2="62" y2="290" marker-end="url(#a)"/><text x="36" y="260">barriga</text></g>
<g id="cota-diametro-teto" class="cota"><line class="e" x1="80" y1="140" x2="80" y2="89"/><line class="e" x1="440" y1="140" x2="440" y2="89"/><line class="d" x1="80" y1="95" x2="440" y2="95" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="260.0" y="88">D</text></g>
<path class="r" d="M260,440 l0,0"/><rect class="r" x="80" y="436" width="40" height="8"/>
<g id="cota-solda-fundo-costado" class="cota"><line class="e" x1="80" y1="444" x2="80" y2="476"/><line class="e" x1="120" y1="444" x2="120" y2="476"/><line class="d" x1="80" y1="470" x2="120" y2="470" marker-start="url(#a)" marker-end="url(#a)"/><text x="100" y="490">trecho da solda fundo-costado</text></g>
<g id="cota-espessura" class="cota"><line class="e" x1="80" y1="200" x2="126" y2="200"/><line class="e" x1="80" y1="212" x2="126" y2="212"/><line class="d" x1="120" y1="200" x2="120" y2="212" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="112" y="211.0"></text></g>
<text class="n" x="128" y="210">espessura medida (Ep, Ea)</text>
<text class="b" x="520" y="62">(b) Planta — pontos e faixas</text>
<circle class="sl" cx="700" cy="300" r="150"/>
<circle class="r" cx="850" cy="300" r="5"/>
<circle class="r" cx="830" cy="375" r="5"/>
<circle class="r" cx="775" cy="430" r="5"/>
<circle class="r" cx="700" cy="450" r="5"/>
<circle class="r" cx="625" cy="430" r="5"/>
<circle class="r" cx="570" cy="375" r="5"/>
<circle class="r" cx="550" cy="300" r="5"/>
<circle class="r" cx="570" cy="225" r="5"/>
<circle class="r" cx="625" cy="170" r="5"/>
<circle class="r" cx="700" cy="150" r="5"/>
<circle class="r" cx="775" cy="170" r="5"/>
<circle class="r" cx="830" cy="225" r="5"/>
<g id="cota-pontos-perimetro" class="cota"><path class="d" d="M860,300 A160,160 0 0,1 838.6,380.0" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="870" y="400">N = D/3 pontos</text></g>
<rect class="y" x="700" y="288" width="150" height="24"/><rect class="y" x="688" y="150" width="24" height="150"/>
<g id="cota-faixa-isolamento" class="cota"><line class="e" x1="850" y1="288" x2="876" y2="288"/><line class="e" x1="850" y1="312" x2="876" y2="312"/><line class="d" x1="870" y1="288" x2="870" y2="312" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="862" y="305.0"></text></g>
<text class="en n" x="860" y="270">faixas de isolamento</text>
<text class="en n" x="860" y="254">a 90° (1 m × raio)</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
