<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Ensaio de ruptura do cabo — comprimento livre e zona junto à garra">
<title>Ensaio de ruptura do cabo — comprimento livre e zona junto à garra (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>


<text class="t" x="20" y="28">Ensaio de ruptura do cabo — comprimento livre e zona junto à garra</text>
<rect x="80" y="115" width="100" height="70" fill="url(#hach)" stroke="#666" stroke-width="1.5"/>
<rect x="720" y="115" width="100" height="70" fill="url(#hach)" stroke="#666" stroke-width="1.5"/>
<text class="n m" x="130" y="205">garra / terminal</text>
<text class="n m" x="770" y="205">garra / terminal</text>
<line x1="100" y1="150" x2="800" y2="150" stroke="#666" stroke-width="12"/>
<line x1="180" y1="150" x2="720" y2="150" stroke="#8c8c8c" stroke-width="8" stroke-dasharray="14 6"/>
<g id="cota-comprimento-livre" class="cota"><line class="e" x1="180" y1="112" x2="180" y2="80"/><line class="e" x1="720" y1="112" x2="720" y2="80"/><line class="d" x1="180" y1="90" x2="720" y2="90" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="450" y="80">comprimento livre (entre garras)</text></g>
<g id="cota-zona-garra" class="cota"><line class="e" x1="180" y1="188" x2="180" y2="235"/><line class="e" x1="260" y1="160" x2="260" y2="235"/><line class="d" x1="180" y1="228" x2="260" y2="228" marker-start="url(#a)" marker-end="url(#a)"/><text x="190" y="250">zona junto à garra (ruptura aqui: ensaio desconsiderado)</text></g>
<g id="cota-d" class="cota"><line class="d" x1="450" y1="118" x2="450" y2="144" marker-end="url(#a)"/><line class="d" x1="450" y1="182" x2="450" y2="156" marker-end="url(#a)"/><text x="458" y="128">d</text></g>
<text class="n" x="20" y="288">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
