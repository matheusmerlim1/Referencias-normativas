<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="Guarda-corpo — ancoragem no concreto (NBR 14718, 4.4.3.3)">
<title>Guarda-corpo — ancoragem no concreto (NBR 14718, 4.4.3.3)</title>
<defs><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Guarda-corpo — ancoragem no concreto (NBR 14718, 4.4.3.3)</text>
<rect x="60" y="150" width="360" height="110" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<text x="200" y="245" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">concreto (elemento estrutural)</text>
<rect x="60" y="128" width="360" height="22" rx="0" fill="url(#hz)" stroke="#666" stroke-width="1.2"/>
<text x="240" y="122" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">contrapiso / revestimento</text>
<rect x="315" y="118" width="50" height="10" rx="0" fill="#666" stroke="none"/>
<line x1="340" y1="118" x2="340" y2="40" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="340" y1="128" x2="340" y2="215" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
<line x1="295" y1="150" x2="295" y2="215" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="295.0,215.0 291.5,206.0 298.5,206.0" fill="#666"/>
<polygon points="295.0,150.0 298.5,159.0 291.5,159.0" fill="#666"/>
<text x="289" y="186.5" text-anchor="end" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">≥ 70 mm</text>
<line x1="340" y1="262" x2="340" y2="291" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="420" y1="262" x2="420" y2="291" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="340" y1="285" x2="420" y2="285" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="420.0,285.0 411.0,288.5 411.0,281.5" fill="#666"/>
<polygon points="340.0,285.0 349.0,281.5 349.0,288.5" fill="#666"/>
<text x="380.0" y="301" text-anchor="middle" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">≥ 70 mm</text>
<text x="424" y="205" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">borda</text>
<text x="470" y="70" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ancoragem química ou mecânica:</text>
<text x="470" y="88" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">profundidade mínima de 70 mm no concreto,</text>
<text x="470" y="106" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      desconsiderando contrapiso e revestimento</text>
<text x="470" y="124" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">furo a no mínimo 70 mm das bordas verticais</text>
<text x="470" y="142" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      ou horizontais</text>
<text x="470" y="160" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">mureta de alvenaria não é parte estrutural</text>
<text x="470" y="178" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      (4.4.3.2)</text>
<text x="12" y="352" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo, sem escala — não é desenho da norma. Valores transcritos dos requisitos da ficha.</text>
</svg>