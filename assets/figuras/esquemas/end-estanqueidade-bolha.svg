<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Estanqueidade — caixa de vácuo e furo de ensaio com niple">
<title>Estanqueidade — caixa de vácuo e furo de ensaio com niple (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Estanqueidade — caixa de vácuo e furo de ensaio com niple</text>
<text class="b" x="30" y="62">(a) Caixa de vácuo sobre a solda (vista de topo)</text>
<rect class="sl" x="60" y="110" width="780" height="120"/>
<rect class="r" x="60" y="160" width="780" height="14"/>
<rect class="g" x="120" y="125" width="330" height="90" rx="8"/>
<rect class="h" x="380" y="135" width="330" height="70" rx="8"/>
<text class="m n" x="250" y="150">posição 1</text>
<text class="m n" x="600" y="150">posição 2</text>
<g id="cota-sobreposicao-caixa" class="cota"><line class="e" x1="380" y1="215" x2="380" y2="261"/><line class="e" x1="450" y1="215" x2="450" y2="261"/><line class="d" x1="380" y1="255" x2="450" y2="255" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="415.0" y="248">sobreposição</text></g>
<text class="n" x="60" y="300">solução formadora de bolhas sobre a solda; vácuo dentro da caixa; bolha = vazamento passante</text>
<text class="b" x="30" y="350">(b) Pressão positiva — furo de ensaio em chapa de reforço (corte)</text>
<rect class="s" x="60" y="470" width="420" height="30"/>
<rect class="s" x="60" y="420" width="420" height="40"/>
<rect class="w" x="240" y="420" width="24" height="40"/>
<rect class="b2" x="236" y="380" width="32" height="64"/>
<path class="d" d="M236,420 l32,0 M236,428 l32,0 M236,436 l32,0 M236,444 l32,0"/>
<text class="n" x="275" y="375">niple</text>
<g id="cota-rosca-niple" class="cota"><line class="e" x1="236" y1="420" x2="219" y2="420"/><line class="e" x1="236" y1="444" x2="219" y2="444"/><line class="d" x1="225" y1="420" x2="225" y2="444" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="215" y="440">rosca</text></g>
<g id="cota-espessura-peca" class="cota"><line class="e" x1="264" y1="420" x2="306" y2="420"/><line class="e" x1="264" y1="460" x2="306" y2="460"/><line class="d" x1="300" y1="420" x2="300" y2="460" marker-start="url(#a)" marker-end="url(#a)"/><text x="310" y="446">espessura da chapa</text></g>
<text class="n" x="60" y="520">casco</text>
<text class="n" x="560" y="420">entalhe na ponta do niple ou rosca curta:</text>
<text class="n" x="560" y="440">o gás não pode ficar bloqueado se o niple</text>
<text class="n" x="560" y="460">encostar na chapa oposta.</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
