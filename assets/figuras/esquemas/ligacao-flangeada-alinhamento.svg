<circle class="h" cx="735.0" cy="102.3" r="7"/>
<circle class="w" cx="700.866" cy="103.806" r="7"/>
<circle class="h" cx="696.9" cy="105.6" r="7"/>
<circle class="w" cx="673.806" cy="130.866" r="7"/>
<circle class="h" cx="672.3" cy="135.0" r="7"/>
<circle class="w" cx="673.806" cy="169.134" r="7"/>
<circle class="h" cx="675.6" cy="173.1" r="7"/>
<circle class="w" cx="700.866" cy="196.194" r="7"/>
<circle class="h" cx="705.0" cy="197.7" r="7"/>
<circle class="w" cx="739.134" cy="196.194" r="7"/>
<circle class="h" cx="743.1" cy="194.4" r="7"/>
<circle class="w" cx="766.194" cy="169.134" r="7"/>
<circle class="h" cx="767.7" cy="165.0" r="7"/>
<g id="cota-furos" class="cota"><line class="d" x1="774.194" y1="130.866" x2="772.351" y2="125.913" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="778" y1="126" x2="830" y2="110"/><text x="810" y="104">desvio entre furos</text></g>
<text class="n" x="610" y="250">tracejado = furos do flange oposto</text>
<text class="b" x="20" y="290">(d) Folga excessiva entre faces</text>
<rect class="s" x="40" y="360" width="70" height="40"/>
<rect class="s" x="110" y="330" width="22" height="100"/>
<rect class="s" x="190" y="330" width="22" height="100"/>
<rect class="s" x="212" y="360" width="70" height="40"/>
<rect class="bl" x="132" y="350" width="10" height="60"/>
<text class="n" x="100" y="320">junta não comprimida</text>
<g id="cota-folga" class="cota"><line class="d" x1="132" y1="450" x2="190" y2="450" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="132" y1="430" x2="132" y2="458"/><line class="e" x1="190" y1="430" x2="190" y2="458"/><text x="80" y="478">afastamento entre faces (comparar com a espessura da junta)</text></g>
<text class="b" x="520" y="290">(e) Aperto em cruz (referência)</text>
<circle class="s" cx="640" cy="400" r="70"/>
<circle class="w" cx="640" cy="400" r="30"/>
<circle class="w" cx="640" cy="350" r="9"/>
<circle class="w" cx="675.355" cy="364.645" r="9"/>
<circle class="w" cx="690" cy="400" r="9"/>
<circle class="w" cx="675.355" cy="435.355" r="9"/>
<circle class="w" cx="640" cy="450" r="9"/>
<circle class="w" cx="604.645" cy="435.355" r="9"/>
<circle class="w" cx="590" cy="400" r="9"/>
<circle class="w" cx="604.645" cy="364.645" r="9"/>
<text class="n" x="730" y="390">estágios crescentes de torque</text>
<text class="n" x="730" y="410">em cruz, até a passada final</text>
<text class="n" x="20" y="518">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
