<g id="cota-runout" class="cota"><line class="d" x1="60" y1="320" x2="100" y2="245" marker-end="url(#a)"/><text class="" x="20" y="335">runout elétrico + mecânico</text></g>
<g id="cota-niple" class="cota"><line class="d" x1="510" y1="320" x2="510" y2="360" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="516" y="345">niple</text></g>
