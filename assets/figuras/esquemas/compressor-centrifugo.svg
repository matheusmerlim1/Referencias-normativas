<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="Compressor centrífugo — rotor, mancais, sondas, conexões e versão com engrenagem integral">
<title>Compressor centrífugo — rotor, mancais, sondas, conexões e versão com engrenagem integral (esquema ilustrativo)</title>
<style>
