<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Reparo de duto terrestre — bacalhau (patch), dupla calha e esmerilhamento">
<title>Reparo de duto terrestre — bacalhau (patch), dupla calha e esmerilhamento (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Reparo de duto terrestre — bacalhau (patch), dupla calha e esmerilhamento</text>
<text x="250" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) bacalhau — planta</text>
<rect x="40" y="110" width="420" height="120" fill="#a33" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<rect x="150" y="130" width="200" height="80" rx="24" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<rect x="225" y="160" width="50" height="20" fill="#333" fill-opacity="0.5" stroke="#666" stroke-width="0.5"/>
<text x="250" y="198" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">defeito</text>
<g id="cota-bacalhau-solda-defeito" class="cota"><line x1="275" y1="170" x2="275" y2="170" stroke="#666" stroke-width="1"/><line x1="350" y1="170" x2="350" y2="170" stroke="#666" stroke-width="1"/><line x1="275" y1="170" x2="350" y2="170" stroke="#666" stroke-width="1.2"/><polygon points="275.0,170.0 284.0,173.5 284.0,166.5" fill="#666"/><polygon points="350.0,170.0 341.0,166.5 341.0,173.5" fill="#666"/><text x="312" y="164" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">defeito ↔ solda</text></g>
<g id="cota-bacalhau-raio-canto" class="cota"><line x1="158" y1="138" x2="250" y2="266" stroke="#666" stroke-width="1"/><circle cx="158" cy="138" r="3" fill="#666"/><text x="250" y="270" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cantos arredondados (raio mínimo)</text></g>
<text x="750" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) bacalhau — corte</text>
<circle cx="750" cy="180" r="70" fill="#a33" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<path d="M680,180 A70,70 0 0 1 820,180" fill="none" fill-opacity="0.12" stroke="#666" stroke-width="8"/>
<g id="cota-bacalhau-angulo" class="cota"><path d="M790.0,180.0 A40,40 0 0 0 710.0,180.0" fill="none" stroke="#666" stroke-width="1.2"/><text x="720" y="128" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">abertura máxima</text></g>
<text x="250" y="330" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) dupla calha</text>
<rect x="40" y="380" width="420" height="60" fill="#a33" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<rect x="130" y="370" width="240" height="80" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<rect x="230" y="398" width="40" height="24" fill="#333" fill-opacity="0.5" stroke="#666" stroke-width="0.5"/>
<g id="cota-dupla-calha-margem" class="cota"><line x1="130" y1="450" x2="130" y2="474" stroke="#666" stroke-width="1"/><line x1="230" y1="450" x2="230" y2="474" stroke="#666" stroke-width="1"/><line x1="130" y1="474" x2="230" y2="474" stroke="#666" stroke-width="1.2"/><polygon points="130.0,474.0 139.0,477.5 139.0,470.5" fill="#666"/><polygon points="230.0,474.0 221.0,470.5 221.0,477.5" fill="#666"/><text x="180" y="492" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">margem</text></g>
<text x="250" y="360" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">solda longitudinal de topo com mata-junta</text>
<text x="750" y="330" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(d) esmerilhamento</text>
<rect x="560" y="390" width="380" height="50" fill="#a33" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<path d="M700,390 Q750,415 800,390" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1.5"/>
<g id="cota-esmerilhamento-prof" class="cota"><line x1="820" y1="390" x2="850" y2="390" stroke="#666" stroke-width="1"/><line x1="820" y1="404" x2="850" y2="404" stroke="#666" stroke-width="1"/><line x1="850" y1="390" x2="850" y2="404" stroke="#666" stroke-width="1.2"/><polygon points="850.0,390.0 846.5,399.0 853.5,399.0" fill="#666"/><polygon points="850.0,404.0 853.5,395.0 846.5,395.0" fill="#666"/><text x="856" y="400" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">profundidade</text></g>
<g id="cota-espessura-duto" class="cota"><line x1="560" y1="390" x2="544" y2="390" stroke="#666" stroke-width="1"/><line x1="560" y1="440" x2="544" y2="440" stroke="#666" stroke-width="1"/><line x1="544" y1="390" x2="544" y2="440" stroke="#666" stroke-width="1.2"/><polygon points="544.0,390.0 540.5,399.0 547.5,399.0" fill="#666"/><polygon points="544.0,440.0 547.5,431.0 540.5,431.0" fill="#666"/><text x="534" y="420" text-anchor="end" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">t</text></g>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
