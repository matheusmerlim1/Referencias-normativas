<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Tubo — bisel, corpo de prova de achatamento e dobramento</text>
<text class="n b" x="60" y="120">bisel (corte da parede)</text>
<path class="s" d="M80,200 L357,200 L380,240 L380,260 L80,260 z"/>
<line class="h" x1="380" y1="150" x2="380" y2="280"/>
<g id="cota-angulo-bisel" class="cota"><path class="d" d="M380.0,170.0 A70,70 0 0,0 345.0,179.4" marker-start="url(#a)" marker-end="url(#a)"/><text x="250" y="165">ângulo do bisel</text></g>
<g id="cota-face-raiz" class="cota"><line class="e" x1="382" y1="240" x2="416" y2="240"/><line class="e" x1="382" y1="260" x2="416" y2="260"/><line class="d" x1="410" y1="214" x2="410" y2="240" marker-end="url(#a)"/><line class="d" x1="410" y1="286" x2="410" y2="260" marker-end="url(#a)"/><line class="d" x1="410" y1="240" x2="410" y2="260"/><text x="420" y="256">face da raiz</text></g>
<text class="n" x="80" y="290">lado interno do tubo</text>
<text class="n b" x="500" y="120">achatamento</text>
<rect class="s" x="520" y="200" width="180" height="60"/>
<rect class="sl" x="500" y="186" width="220" height="14"/>
<rect class="sl" x="500" y="260" width="220" height="14"/>
<line class="d" x1="610" y1="140" x2="610" y2="184"/>
<line class="d" x1="610" y1="140" x2="610" y2="184" marker-end="url(#a)"/>
<text class="b" x="618" y="160">F</text>
<g id="cota-cp-achatamento" class="cota"><line class="e" x1="520" y1="276" x2="520" y2="326"/><line class="e" x1="700" y1="276" x2="700" y2="326"/><line class="d" x1="520" y1="320" x2="700" y2="320" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="610" y="313">comprimento do corpo de prova</text></g>
