<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 520" width="1150" height="520" role="img" aria-label="Tubo — bisel, corpo de prova de achatamento e dobramento">
<title>Tubo — bisel, corpo de prova de achatamento e dobramento (esquema ilustrativo)</title>
<style>
