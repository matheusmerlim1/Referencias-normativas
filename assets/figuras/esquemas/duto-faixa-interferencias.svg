<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Faixa de dutos — interferências, cobertura e unidade de classe">
<title>Faixa de dutos — interferências, cobertura e unidade de classe (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Faixa de dutos — interferências, cobertura e unidade de classe</text>
<text class="b" x="30" y="62">(a) Planta da faixa e cruzamento de linhas elétricas</text>
<rect class="y" x="40" y="160" width="520" height="120" fill-opacity=".2"/>
<line class="c" x1="40" y1="220" x2="560" y2="220"/>
<line class="r" x1="40" y1="220" x2="560" y2="220" stroke-width="3"/>
<text class="n" x="45" y="150">limite da faixa</text>
<line class="g" x1="300" y1="80" x2="300" y2="360" stroke-dasharray="3 3"/>
<g id="cota-angulo-cruzamento" class="cota"><path class="d" d="M340,220 A40,40 0 0,0 300,180" marker-start="url(#a)" marker-end="url(#a)"/><text x="345" y="195">ângulo</text></g>
<rect class="s" x="292" y="300" width="16" height="16"/>
<g id="cota-poste-faixa" class="cota"><line class="e" x1="300" y1="280" x2="326" y2="280"/><line class="e" x1="300" y1="300" x2="326" y2="300"/><line class="d" x1="320" y1="280" x2="320" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text x="328" y="296">poste</text></g>
<path class="g" d="M450,330 l-15,40 l30,0 z"/>
<g id="cota-torre-faixa" class="cota"><line class="e" x1="450" y1="280" x2="486" y2="280"/><line class="e" x1="450" y1="330" x2="486" y2="330"/><line class="d" x1="480" y1="280" x2="480" y2="330" marker-start="url(#a)" marker-end="url(#a)"/><text x="488" y="312">torre</text></g>
<circle class="w" cx="100" cy="220" r="4"/>
<circle class="w" cx="140" cy="220" r="4"/>
<circle class="w" cx="180" cy="220" r="4"/>
<circle class="w" cx="220" cy="220" r="4"/>
<g id="cota-sondagem" class="cota"><line class="e" x1="100" y1="224" x2="100" y2="256"/><line class="e" x1="140" y1="224" x2="140" y2="256"/><line class="d" x1="100" y1="250" x2="140" y2="250" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="120" y="268">sondagens</text></g>
<rect class="w" x="480" y="100" width="20" height="20"/>
<g id="cota-edificacao-eixo" class="cota"><line class="e" x1="500" y1="120" x2="526" y2="120"/><line class="e" x1="500" y1="220" x2="526" y2="220"/><line class="d" x1="520" y1="120" x2="520" y2="220" marker-start="url(#a)" marker-end="url(#a)"/><text x="528" y="160">edificação</text></g>
<g id="cota-unidade-classe" class="cota"><line class="d" x1="40" y1="400" x2="560" y2="400" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="300.0" y="393">unidade de classe de locação (comprimento × largura)</text></g>
<g id="cota-largura-mapeamento" class="cota"><line class="d" x1="40" y1="440" x2="560" y2="440" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="300.0" y="433">largura do mapeamento</text></g>
<text class="b" x="600" y="62">(b) Corte</text>
<line class="g" x1="600" y1="300" x2="880" y2="300"/>
<circle class="r" cx="740" cy="400" r="20"/>
<g id="cota-cobertura" class="cota"><line class="e" x1="760" y1="300" x2="786" y2="300"/><line class="e" x1="760" y1="380" x2="786" y2="380"/><line class="d" x1="780" y1="300" x2="780" y2="380" marker-start="url(#a)" marker-end="url(#a)"/><text x="788" y="345">cobertura</text></g>
<line class="g" x1="660" y1="300" x2="660" y2="110"/><line class="d" x1="660" y1="120" x2="880" y2="120"/>
<g id="cota-altura-linha" class="cota"><line class="e" x1="880" y1="120" x2="854" y2="120"/><line class="e" x1="880" y1="300" x2="854" y2="300"/><line class="d" x1="860" y1="120" x2="860" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="852" y="210">altura do fio</text></g>
<g id="cota-precisao-posicao" class="cota"><circle class="d" cx="740" cy="400" r="30" stroke-dasharray="4 3"/><text class="m" x="740" y="460">precisão da posição</text></g>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
