<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Laço de cabo de aço — dobra sobre canto arredondado e canto vivo">
<title>Laço de cabo de aço — dobra sobre canto arredondado e canto vivo (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>


<text class="t" x="20" y="28">Laço de cabo de aço — dobra sobre canto arredondado e canto vivo</text>
<path d="M150,200 L330,200 A70,70 0 0,1 400,270 L400,340 L150,340 Z" fill="url(#hach)" stroke="#666" stroke-width="1.5"/>
<path d="M100,192 L330,192 A78,78 0 0,1 408,270 L408,360" fill="none" stroke="#666" stroke-width="16"/>
<g id="cota-raio" class="cota"><circle cx="330" cy="270" r="3" fill="#666"/><line class="d" x1="330" y1="270" x2="379.5" y2="220.5" marker-end="url(#a)"/><line class="e" x1="379.5" y1="220.5" x2="445" y2="160"/><text x="450" y="158">raio de curvatura</text></g>
<g id="cota-d" class="cota"><line class="d" x1="200" y1="150" x2="200" y2="184" marker-end="url(#a)"/><line class="d" x1="200" y1="228" x2="200" y2="200" marker-end="url(#a)"/><text x="208" y="160">d</text></g>
<path d="M560,200 L700,200 L700,340 L560,340 Z" fill="url(#hach)" stroke="#666" stroke-width="1.5"/>
<path d="M530,192 L708,192 L708,360" fill="none" stroke="#666" stroke-width="16" stroke-linejoin="miter"/>
<text class="n m" x="275" y="385">a) canto arredondado (calha / protetor)</text>
<text class="n m" x="630" y="385">b) canto vivo: evitar</text>
<text class="n" x="20" y="408">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
