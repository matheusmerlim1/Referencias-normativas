<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-label="Interface olhal × manilha × lingada — folgas e alinhamento">
<title>Interface olhal × manilha × lingada — folgas e alinhamento (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
