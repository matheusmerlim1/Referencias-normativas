<g id="cota-d2" class="cota"><line class="e" x1="100" y1="203" x2="100" y2="346"/><line class="e" x1="340" y1="203" x2="340" y2="346"/><line class="d" x1="100" y1="340" x2="340" y2="340" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="220" y="333">d2</text></g>
