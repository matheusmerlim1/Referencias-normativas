<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Arruela lisa (ISO 7089 / 7091 / 7093-1) — d1, d2, h">
<title>Arruela lisa (ISO 7089 / 7091 / 7093-1) — d1, d2, h (esquema ilustrativo)</title>
