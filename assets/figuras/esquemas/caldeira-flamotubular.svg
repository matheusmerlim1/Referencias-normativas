<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" role="img" aria-label="Caldeira flamotubular — corpo, chaminé e caixa de ar">
<title>Caldeira flamotubular — corpo, chaminé e caixa de ar (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Caldeira flamotubular — corpo, chaminé e caixa de ar</text>
<text class="b" x="20" y="62">(a) Caldeira flamotubular — corte longitudinal</text>
<rect class="sl" x="80" y="160" width="460" height="180"/>
<rect class="bl" x="70" y="150" width="480" height="10"/>
<rect class="bl" x="70" y="340" width="480" height="10"/>
<text class="n" x="560" y="150">isolamento + chapa de acabamento</text>
<rect class="s" x="80" y="230" width="300" height="60"/>
<text class="n" x="150" y="265">fornalha</text>
<line class="g" x1="120" y1="180" x2="520" y2="180"/>
<line class="g" x1="120" y1="200" x2="520" y2="200"/>
<line class="g" x1="120" y1="310" x2="520" y2="310"/>
<line class="g" x1="120" y1="320" x2="520" y2="320"/>
<text class="n" x="390" y="198">tubos de gases</text>
<rect class="wd" x="76" y="160" width="8" height="180"/>
<rect class="wd" x="536" y="160" width="8" height="180"/>
<rect class="r" x="30" y="240" width="50" height="40"/>
<text class="n" x="20" y="300">queimador</text>
<rect class="e" x="0" y="0" width="0" height="0"/>
<g id="cota-costado-di" class="cota"><line class="d" x1="600" y1="160" x2="600" y2="340" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="608" y="250">Ø interno do costado</text></g>
<g id="cota-acabamento" class="cota"><line class="e" x1="550" y1="148" x2="590" y2="120"/><text class="n b" x="560" y="112">espessura da chapa de acabamento</text></g>
<rect class="s" x="470" y="60" width="30" height="90"/>
<text class="n" x="504" y="84">duto/chaminé</text>
<text class="b" x="20" y="420">(b) Chaminé e caixa de ar</text>
<line class="g" x1="40" y1="760" x2="520" y2="760"/>
<rect x="40" y="760" width="480" height="10" fill="url(#hach)"/>
<rect class="sl" x="80" y="680" width="200" height="80"/>
<text class="n" x="110" y="724">caldeira (skid)</text>
<rect class="s" x="240" y="470" width="30" height="210"/>
<polygon class="s" points="230,470 280,470 255,450"/>
<g id="cota-chamine-altura" class="cota"><line class="d" x1="320" y1="450" x2="320" y2="760" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="270" y1="450" x2="326" y2="450"/><text class="n b" x="328" y="600">altura acima do chão</text></g>
<g id="cota-chapa-chamine" class="cota"><line class="e" x1="270" y1="560" x2="300" y2="540"/><text class="n b" x="304" y="536">espessura da chapa (+ corrosão)</text></g>
<rect class="bl" x="60" y="640" width="60" height="40"/>
<text class="n" x="20" y="630">caixa de ar</text>
<g id="cota-caixa-ar" class="cota"><line class="e" x1="60" y1="660" x2="30" y2="690"/><text class="n b" x="20" y="706">espessura da chapa</text></g>
<text class="n" x="20" y="798">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
