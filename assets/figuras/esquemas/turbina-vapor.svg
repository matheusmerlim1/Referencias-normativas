<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Turbina a vapor — rotor, mancais, sondas, isolamento e trem de acionamento">
<title>Turbina a vapor — rotor, mancais, sondas, isolamento e trem de acionamento (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .cc{fill:#bbb;fill-opacity:.5;stroke:#777;stroke-width:1.4}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .hc{fill:url(#hach);stroke:#666;stroke-width:1.2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Turbina a vapor — rotor, mancais, sondas, isolamento e trem de acionamento</text>
<path class="sl" d="M200,140 L560,100 L560,360 L200,320 z"/><line class="c" x1="60" y1="230" x2="760" y2="230"/>
<rect class="wd" x="240" y="190" width="14" height="80"/>
<rect class="wd" x="290" y="178" width="14" height="104"/>
<rect class="wd" x="340" y="166" width="14" height="128"/>
<rect class="wd" x="390" y="154" width="14" height="152"/>
<rect class="wd" x="440" y="142" width="14" height="176"/>
<rect class="wd" x="490" y="130" width="14" height="200"/>
<rect class="w" x="130" y="205" width="60" height="50"/><rect class="w" x="570" y="205" width="60" height="50"/><rect class="y" x="190" y="215" width="12" height="30"/><rect class="y" x="558" y="215" width="12" height="30"/>
<rect class="w" x="260" y="60" width="50" height="60"/><rect class="w" x="460" y="360" width="70" height="60"/><rect class="y" x="196" y="96" width="370" height="10" transform="rotate(-6 380 100)"/>
<rect class="sl" x="680" y="200" width="40" height="60"/><rect class="sl" x="760" y="170" width="200" height="120" rx="8"/>
<text class="n" x="255" y="52">admissão de vapor e válvulas</text>
<text class="n" x="470" y="440">exaustão</text>
<text class="n" x="130" y="280">mancal</text>
<text class="n" x="680" y="190">acoplamento</text>
<text class="n" x="780" y="165">equipamento acionado</text>
<text class="n" x="400" y="92">isolamento</text>
<rect class="w" x="155" y="171" width="10" height="26"/>
<g id="cota-sonda" class="cota"><line class="d" x1="30" y1="154" x2="160" y2="197" marker-end="url(#a)"/><text class="" x="30" y="150">sondas X-Y de vibração</text></g>
<g id="cota-runout" class="cota"><line class="d" x1="40" y1="330" x2="150" y2="255" marker-end="url(#a)"/><text class="" x="20" y="345">runout medido em blocos V</text></g>
<g id="cota-contato-mancal" class="cota"><line class="d" x1="120" y1="420" x2="150" y2="256" marker-end="url(#a)"/><text class="" x="20" y="440">contato mancal–munhão (azul da Prússia)</text></g>
<g id="cota-isolamento" class="cota"><line class="d" x1="620" y1="90" x2="560" y2="104" marker-end="url(#a)"/><text class="" x="580" y="80">superfície do isolamento</text></g>
<g id="cota-roda" class="cota"><line class="d" x1="540" y1="130" x2="540" y2="330" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="600" y="330">Ø da roda/palhetas</text></g>
<text class="n" x="20" y="548">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
