<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Ensaios de superfície — penetrante, partículas magnéticas, ACFM e espessura de película">
<title>Ensaios de superfície — penetrante, partículas magnéticas, ACFM e espessura de película (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ensaios de superfície — penetrante, partículas magnéticas, ACFM e espessura de película</text>
<text x="250" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) líquido penetrante — etapas</text>
<rect x="30" y="80" width="82" height="50" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/><text x="71.0" y="109.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">limpeza</text>
<rect x="122" y="80" width="82" height="50" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/><text x="163.0" y="102.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">penetrante</text><text x="163.0" y="116.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(tempo)</text>
<rect x="214" y="80" width="82" height="50" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/><text x="255.0" y="102.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">remoção do</text><text x="255.0" y="116.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">excesso</text>
<rect x="306" y="80" width="82" height="50" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/><text x="347.0" y="109.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">revelador</text>
<rect x="398" y="80" width="82" height="50" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/><text x="439.0" y="109.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">inspeção</text>
<rect x="80" y="180" width="340" height="40" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<path d="M200,180 L210,200 L220,180" fill="none" stroke="#c33" stroke-width="2"/>
<text x="250" y="240" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">indicação sangra do defeito para o revelador</text>
<text x="720" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) partículas magnéticas — yoke</text>
<rect x="560" y="200" width="340" height="40" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<path d="M620,200 L620,110 L840,110 L840,200" fill="none" stroke="#666" stroke-width="4"/>
<text x="730" y="100" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">yoke (campo entre os polos)</text>
<path d="M700,200 L715,215 L728,200" fill="none" stroke="#c33" stroke-width="2"/>
<text x="730" y="260" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">trinca transversal ao campo acumula partículas</text>
<text x="250" y="300" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) ACFM — sonda sobre a solda</text>
<rect x="80" y="360" width="340" height="40" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<rect x="200" y="320" width="60" height="40" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="270" y="340" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sonda (campo AC induzido)</text>
<line x1="80" y1="380" x2="420" y2="380" stroke="#666" stroke-width="2" stroke-dasharray="2 3"/>
<text x="250" y="420" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">perturbação do campo → comprimento e profundidade da trinca</text>
<text x="720" y="300" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(d) espessura de película seca</text>
<rect x="560" y="380" width="340" height="30" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<rect x="560" y="365" width="340" height="15" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/>
<text x="910" y="377" text-anchor="end" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">película</text>
<rect x="700" y="320" width="40" height="45" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="750" y="340" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">medidor magnético</text>
<g id="cota-pelicula" class="cota"><line x1="545" y1="365" x2="545" y2="380" stroke="#666" stroke-width="1.2"/><polygon points="545.0,365.0 548.5,374.0 541.5,374.0" fill="#666"/><polygon points="545.0,380.0 541.5,371.0 548.5,371.0" fill="#666"/><text x="540" y="376.5" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espessura</text></g>
<text x="12" y="442" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
