<circle class="sl" cx="480" cy="240" r="45"/>
<line class="g" x1="450" y1="274" x2="440" y2="300"/>
<line class="g" x1="510" y1="274" x2="520" y2="300"/>
<line class="g" x1="480" y1="135" x2="435" y2="195"/>
<line class="g" x1="480" y1="135" x2="525" y2="195"/>
<circle class="g" cx="480" cy="129" r="6"/>
