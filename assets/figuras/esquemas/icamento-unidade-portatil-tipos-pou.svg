<rect class="s" x="600" y="190" width="110" height="100"/>
<rect class="w" x="640" y="230" width="30" height="60"/>
<line class="g" x1="655" y1="130" x2="610" y2="190"/>
<line class="g" x1="655" y1="130" x2="700" y2="190"/>
<circle class="g" cx="655" cy="124" r="6"/>
<text class="n m" x="655" y="316">D — caixa / cabine</text>
<rect class="s" x="790" y="170" width="24" height="120"/>
<circle class="g" cx="802" cy="160" r="12"/>
<line class="g" x1="802" y1="148" x2="802" y2="110"/>
<text class="n m" x="802" y="316">E — demais</text>
<text class="n" x="20" y="368">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
