<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="Solda de nó tubular feita de um lado só — ângulo diedro Ψ, chanfro b, abertura de raiz G e garganta T">
