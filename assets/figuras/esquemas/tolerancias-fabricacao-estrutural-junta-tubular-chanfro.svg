<g id="cota-G" class="cota"><line class="d" x1="261" y1="342" x2="261" y2="368" marker-end="url(#a)"/><line class="d" x1="261" y1="406" x2="261" y2="380" marker-end="url(#a)"/><line class="d" x1="261" y1="368" x2="261" y2="380"/><text class="en" x="220" y="420">G — abertura de raiz</text></g>
<g id="cota-angulo-chanfro" class="cota"><path class="d" d="M287.5,320.4 A55,55 0 0,1 309.1,343.3" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="314.5" y="321.5">b — chanfro</text></g>
