<g id="cota-tb" class="cota"><line class="d" x1="360" y1="194.8" x2="399.8" y2="217.8" marker-start="url(#a)" marker-end="url(#a)"/><text x="419.8" y="222.8">t (brace)</text></g>
<g id="cota-desvio-perfil" class="cota"><line class="d" x1="620" y1="225" x2="411.4" y2="361.2" marker-end="url(#a)"/><text x="620" y="230">desvio do perfil da solda (disco)</text></g>
<text class="b" x="620" y="330">Solda de selagem (faying surfaces):</text>
