<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Retificador de proteção catódica — gabinete, circuito em ponte, proteções, medição e ligações">
<title>Retificador de proteção catódica — gabinete, circuito em ponte, proteções, medição e ligações (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Retificador de proteção catódica — gabinete, circuito em ponte, proteções, medição e ligações</text>
<text x="230" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) frente do gabinete</text>
<rect x="90" y="70" width="280" height="380" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="2"/>
<text x="230" y="470" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">gabinete (poste, parede ou autossustentado)</text>
<circle cx="150" cy="120" r="22" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1.5"/>
<text x="150" y="124" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">V</text>
<circle cx="230" cy="120" r="22" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1.5"/>
<text x="230" y="124" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">A</text>
<rect x="280" y="104" width="70" height="30" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1.5"/>
<text x="315" y="124" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">00000 h</text>
<text x="315" y="148" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">horímetro</text>
<circle cx="150" cy="190" r="8" fill="#e33" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<text x="165" y="194" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">equipamento energizado</text>
<rect x="120" y="230" width="60" height="40" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="150" y="288" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">disjuntor</text>
<rect x="210" y="230" width="60" height="40" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="240" y="288" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">taps / ajuste</text>
<rect x="300" y="230" width="40" height="40" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="320" y="288" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tomada</text>
<rect x="120" y="320" width="220" height="60" fill="#ffc" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="230" y="355" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">escaninho com esquemas elétricos</text>
<g id="cota-placa-identificacao" class="cota"><line x1="230" y1="400" x2="230" y2="421" stroke="#666" stroke-width="1"/><circle cx="230" cy="400" r="3" fill="#666"/><text x="230" y="425" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">placa de identificação (inox/acrílico)</text></g>
<g id="cota-grau-protecao" class="cota"><line x1="370" y1="110" x2="470" y2="86" stroke="#666" stroke-width="1"/><circle cx="370" cy="110" r="3" fill="#666"/><text x="470" y="90" text-anchor="start" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">grau de proteção IP (abrigado / ao tempo)</text></g>
<text x="700" y="190" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) circuito</text>
<rect x="470" y="230" width="70" height="60" fill="#666" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<text x="505" y="265" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">trafo seco</text>
<text x="505" y="222" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">rede CA → disj. + NH + DPS</text>
<polygon points="600,230 660,260 600,290" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="630" y="310" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ponte onda completa</text>
<text x="630" y="222" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(RC por componente)</text>
<line x1="540" y1="260" x2="600" y2="260" stroke="#666" stroke-width="1.5"/>
<line x1="660" y1="245" x2="760" y2="245" stroke="#666" stroke-width="1.5"/>
<line x1="660" y1="275" x2="760" y2="275" stroke="#666" stroke-width="1.5"/>
<rect x="700" y="268" width="30" height="14" fill="#999" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="715" y="300" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">shunt</text>
<text x="770" y="240" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">+ → leito de anodos</text>
<text x="770" y="280" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">− → estrutura protegida</text>
<rect x="760" y="320" width="170" height="30" fill="#666" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<text x="845" y="340" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">barramento de equipotencialização</text>
<text x="700" y="400" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">automático: controla o potencial estrutura-eletrólito</text>
<text x="700" y="416" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">a partir de eletrodo de referência e valor ajustado</text>
<text x="700" y="440" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">telemetria: I, V, potencial, presença de CA, porta</text>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
