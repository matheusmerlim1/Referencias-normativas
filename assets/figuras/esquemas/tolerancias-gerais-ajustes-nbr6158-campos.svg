<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="NBR 6158 — afastamentos superior/inferior e posição dos campos em relação à linha zero">
<title>NBR 6158 — afastamentos superior/inferior e posição dos campos em relação à linha zero (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">NBR 6158 — afastamentos superior/inferior e posição dos campos em relação à linha zero</text>
<line class="g" x1="40" y1="260" x2="900" y2="260"/>
<text class="n" x="40" y="280">linha zero (dimensão nominal)</text>
<text class="b" x="60" y="70">(a) Furo</text>
<rect class="s" x="120" y="150" width="90" height="60"/>
<text class="n m" x="165" y="186">furo</text>
<g id="cota-ES" class="cota"><line class="d" x1="100" y1="260" x2="100" y2="150" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="94" y="200">ES</text></g>
<g id="cota-EI" class="cota"><line class="d" x1="270" y1="260" x2="270" y2="210" marker-start="url(#a)" marker-end="url(#a)"/><text x="276" y="240">EI</text></g>
<g id="cota-IT" class="cota"><line class="e" x1="213" y1="150" x2="234" y2="150"/><line class="e" x1="213" y1="210" x2="234" y2="210"/><line class="d" x1="228" y1="150" x2="228" y2="210" marker-start="url(#a)" marker-end="url(#a)"/><text x="234" y="185">IT</text></g>
<text class="b" x="340" y="70">(b) Eixo</text>
<rect class="r" x="380" y="280" width="90" height="60"/>
<text class="n m" x="425" y="316">eixo</text>
<g id="cota-es" class="cota"><line class="d" x1="360" y1="234" x2="360" y2="260" marker-end="url(#a)"/><line class="d" x1="360" y1="306" x2="360" y2="280" marker-end="url(#a)"/><line class="d" x1="360" y1="260" x2="360" y2="280"/><text class="en" x="354" y="275">es</text></g>
<g id="cota-ei" class="cota"><line class="d" x1="490" y1="260" x2="490" y2="340" marker-start="url(#a)" marker-end="url(#a)"/><text x="496" y="310">ei</text></g>
<text class="b" x="600" y="70">(c) Posições (letras)</text>
<rect class="s" x="600" y="120" width="45" height="50"/>
<text class="n m" x="622" y="114">A…G</text>
<rect class="s" x="680" y="230" width="45" height="30"/>
<text class="n m" x="702" y="224">H</text>
<rect class="s" x="760" y="245" width="45" height="30"/>
<text class="n m" x="782" y="239">JS</text>
<rect class="s" x="840" y="275" width="45" height="50"/>
<text class="n m" x="862" y="269">K…ZC</text>
<g id="cota-js" class="cota"><line class="e" x1="808" y1="245" x2="826" y2="245"/><line class="e" x1="808" y1="275" x2="826" y2="275"/><line class="d" x1="820" y1="245" x2="820" y2="275" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="790" y="305">±IT/2</text></g>
<text class="n" x="600" y="360">furos: maiúsculas; eixos: minúsculas (a…zc),</text>
<text class="n" x="600" y="380">espelhados em relação à linha zero</text>
<text class="n" x="40" y="430">Furo-base: furo H (EI = 0) combinado com eixos de várias letras; o segundo afastamento sai do IT do grau.</text>
<text class="n" x="20" y="508">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
