<g transform="translate(115,435)"><line class="p" x1="-60" y1="0" x2="0" y2="0"/><path class="g" d="M0,-12 A12,12 0 0,1 0,12"/></g>
<text class="n m" x="115" y="488">tampão</text>
<rect class="e" x="210" y="380" width="150" height="120" fill="none"/>
<g transform="translate(285,435)"><line class="p" x1="-60" y1="0" x2="60" y2="0"/><line class="p" x1="0" y1="0" x2="0" y2="-40"/></g>
<text class="n m" x="285" y="488">tê</text>
<rect class="e" x="380" y="380" width="150" height="120" fill="none"/>
<g transform="translate(455,435)"><path class="p" d="M-60,20 L-20,20 A20,20 0 0,0 0,0 L0,-40"/></g>
<text class="n m" x="455" y="488">curva</text>
<rect class="e" x="550" y="380" width="150" height="120" fill="none"/>
<g transform="translate(625,435)"><line class="p" x1="-60" y1="0" x2="60" y2="0"/><line class="p" x1="0" y1="0" x2="22" y2="22"/><rect class="w" x="16" y="18" width="10" height="10"/></g>
<text class="n m" x="625" y="488">filtro Y</text>
<rect class="e" x="720" y="380" width="150" height="120" fill="none"/>
<g transform="translate(795,435)"><line class="p" x1="-60" y1="0" x2="60" y2="0"/><circle class="w" cx="0" cy="0" r="12"/><text class="n m" x="0" y="5">T</text></g>
<text class="n m" x="795" y="488">purgador</text>
<text class="n" x="20" y="568">Esquema ilustrativo (não é desenho da norma) — sem escala. Consulte a norma para o símbolo oficial.</text>
