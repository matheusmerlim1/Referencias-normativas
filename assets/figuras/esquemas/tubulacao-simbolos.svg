<g transform="translate(795,135)"><line class="p" x1="-60" y1="0" x2="60" y2="0"/><line class="g" x1="-10" y1="-14" x2="-10" y2="14"/><line class="g" x1="10" y1="-14" x2="10" y2="14"/><line class="g" x1="-10" y1="14" x2="10" y2="-14"/></g>
<text class="n m" x="795" y="188">válvula borboleta</text>
<rect class="e" x="40" y="230" width="150" height="120" fill="none"/>
<g transform="translate(115,285)"><line class="p" x1="0" y1="30" x2="0" y2="0"/><line class="p" x1="0" y1="0" x2="40" y2="0"/><polygon class="w" points="-12,14 12,14 0,0"/><polygon class="w" points="0,0 14,-12 14,12"/></g>
<text class="n m" x="115" y="338">válvula de segurança</text>
<rect class="e" x="210" y="230" width="150" height="120" fill="none"/>
<g transform="translate(285,285)"><line class="p" x1="-60" y1="0" x2="60" y2="0"/><line class="g" x1="-4" y1="-16" x2="-4" y2="16"/><line class="g" x1="4" y1="-16" x2="4" y2="16"/></g>
<text class="n m" x="285" y="338">par de flanges</text>
<rect class="e" x="380" y="230" width="150" height="120" fill="none"/>
<g transform="translate(455,285)"><line class="p" x1="-60" y1="0" x2="60" y2="0"/><line class="g" x1="0" y1="-16" x2="0" y2="16"/><circle class="w" cx="0" cy="-26" r="8"/><line class="g" x1="0" y1="-18" x2="0" y2="-16"/></g>
<text class="n m" x="455" y="338">figura 8</text>
<rect class="e" x="550" y="230" width="150" height="120" fill="none"/>
<g transform="translate(625,285)"><line class="p" x1="-60" y1="0" x2="-14" y2="0"/><polygon class="w" points="-14,-12 14,-6 14,6 -14,12"/><line class="p" x1="14" y1="0" x2="60" y2="0"/></g>
<text class="n m" x="625" y="338">redução concêntrica</text>
<rect class="e" x="720" y="230" width="150" height="120" fill="none"/>
<g transform="translate(795,285)"><line class="p" x1="-60" y1="0" x2="-14" y2="0"/><polygon class="w" points="-14,-12 14,-12 14,0 -14,12"/><line class="p" x1="14" y1="-6" x2="60" y2="-6"/></g>
<text class="n m" x="795" y="338">redução excêntrica</text>
