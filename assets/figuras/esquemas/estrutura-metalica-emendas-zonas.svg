<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="Estrutura metálica — onde não emendar perfis e espaçamento de soldas em tubos">
<title>Estrutura metálica — onde não emendar perfis e espaçamento de soldas em tubos (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Estrutura metálica — onde não emendar perfis e espaçamento de soldas em tubos</text>
