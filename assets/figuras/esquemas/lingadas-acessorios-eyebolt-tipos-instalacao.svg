<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Olhais de içamento (eyebolts) — com/sem ombro, instalação e ângulo da carga">
<title>Olhais de içamento (eyebolts) — com/sem ombro, instalação e ângulo da carga (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Olhais de içamento (eyebolts) — com/sem ombro, instalação e ângulo da carga</text>
<circle class="g" cx="120" cy="190" r="28"/>
<circle cx="120" cy="190" r="28" fill="none" stroke="#666" stroke-width="9"/>
<rect class="s" x="94" y="218" width="52" height="12"/>
<rect class="s" x="111" y="228" width="18" height="70"/>
<rect x="40" y="230" width="160" height="60" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<text class="n m" x="120" y="330">com ombro (furo cego)</text>
<circle class="g" cx="330" cy="190" r="28"/>
<circle cx="330" cy="190" r="28" fill="none" stroke="#666" stroke-width="9"/>
<rect class="s" x="321" y="218" width="18" height="80"/>
<rect x="250" y="230" width="160" height="60" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<text class="n m" x="330" y="330">sem ombro: só em linha</text>
<circle class="g" cx="540" cy="190" r="28"/>
<circle cx="540" cy="190" r="28" fill="none" stroke="#666" stroke-width="9"/>
<rect class="s" x="514" y="218" width="52" height="12"/>
<rect class="s" x="531" y="228" width="18" height="70"/>
<rect x="460" y="230" width="160" height="50" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<rect class="s" x="530" y="285" width="20" height="22"/>
<rect class="s" x="520" y="300" width="40" height="14"/>
<text class="n m" x="540" y="345">furo passante com porca</text>
<circle class="g" cx="760" cy="190" r="28"/>
<circle cx="760" cy="190" r="28" fill="none" stroke="#666" stroke-width="9"/>
<rect class="s" x="734" y="218" width="52" height="12"/>
<rect class="s" x="751" y="228" width="18" height="70"/>
<rect x="680" y="230" width="160" height="60" fill="url(#hach)" stroke="#666" stroke-width="1"/>
<line class="c" x1="760" y1="190" x2="760" y2="40"/>
<line class="d" x1="760" y1="190" x2="860" y2="60" marker-end="url(#a)"/>
<g id="cota-angulo" class="cota"><path class="d" d="M760,80 A110,110 0 0,1 827.1,102.8" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="801.9" y="71.9">ângulo com a vertical</text></g>
<text class="n m" x="760" y="345">carga angular (só com ombro)</text>
<text class="n" x="20" y="408">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
