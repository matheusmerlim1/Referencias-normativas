<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 330" width="1130" height="330" role="img" aria-label="Ensaios não destrutivos — RT, UT, PT/MT e ET">
<title>Ensaios não destrutivos — RT, UT, PT/MT e ET (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Ensaios não destrutivos — RT, UT, PT/MT e ET</text>
<text class="n b" x="40" y="70">RT — radiografia</text>
<polygon class="s" points="140,90 128,112 152,112"/><text class="n" x="160" y="104">fonte</text>
<line class="h" x1="140" y1="112" x2="70" y2="200"/><line class="h" x1="140" y1="112" x2="210" y2="200"/>
<rect class="sl" x="50" y="200" width="180" height="30"/><rect class="w" x="160" y="192" width="30" height="8"/><text class="n" x="196" y="188">IQI</text>
<rect class="s" x="50" y="240" width="180" height="8"/><text class="n" x="50" y="270">filme / detector</text><text class="n" x="60" y="220">peça</text>
<text class="n b" x="320" y="70">UT — ultrassom</text>
<rect class="sl" x="300" y="170" width="220" height="90"/>
<rect class="s" x="390" y="140" width="40" height="30"/><text class="n" x="436" y="152">cabeçote</text>
<line class="h" x1="410" y1="170" x2="410" y2="260"/><rect class="r" x="402" y="214" width="16" height="8"/>
<text class="n" x="426" y="226">refletor</text><text class="n" x="310" y="282">eco do fundo / do refletor</text>
<text class="n b" x="590" y="70">PT / MT — superfície</text>
<path class="g" d="M630,215 L630,130 L770,130 L770,215"/><rect class="s" x="620" y="215" width="20" height="10"/><rect class="s" x="760" y="215" width="20" height="10"/>
<text class="n" x="660" y="122">yoke (MT)</text>
<rect class="sl" x="590" y="225" width="220" height="40"/>
<path d="M690,225 L700,232 L708,226 L716,233" fill="none" stroke="#b03a2e" stroke-width="2.4"/>
<text class="n" x="660" y="290">trinca → indicação</text><text class="n" x="590" y="310">PT: penetrante + revelador</text>
<text class="n b" x="880" y="70">ET / RFT — tubo</text>
<rect class="s" x="870" y="150" width="240" height="12"/><rect class="s" x="870" y="238" width="240" height="12"/>
<rect class="w" x="970" y="182" width="50" height="36"/><line class="g" x1="880" y1="200" x2="970" y2="200"/>
<text class="n" x="960" y="276">sonda interna (bobina)</text>
<text class="n" x="20" y="318">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
