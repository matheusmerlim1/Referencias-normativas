<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Identificação de equipamento industrial — composição do TAG">
<!--P7A-->
<title>Identificação de equipamento industrial — composição do TAG (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Identificação de equipamento industrial — composição do TAG</text>
<text x="500" y="55" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) equipamento em geral</text>
<text x="150" y="120" text-anchor="middle" font-size="34" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">XX</text>
<line x1="128" y1="132" x2="172" y2="132" stroke="#666" stroke-width="1.2"/>
<text x="150" y="155" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">símbolo</text>
<text x="150" y="171" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">1 a 3 letras (Anexo A)</text>
<text x="255" y="120" text-anchor="middle" font-size="34" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">-</text>
<text x="255" y="155" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">traço de união</text>
<text x="255" y="171" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round"></text>
<text x="360" y="120" text-anchor="middle" font-size="34" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">AAAA</text>
<line x1="320" y1="132" x2="400" y2="132" stroke="#666" stroke-width="1.2"/>
<text x="360" y="155" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">área / unidade</text>
<text x="360" y="171" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">algarismos (N-1710)</text>
<text x="500" y="120" text-anchor="middle" font-size="34" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NNN</text>
<line x1="460" y1="132" x2="540" y2="132" stroke="#666" stroke-width="1.2"/>
<text x="500" y="155" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sequencial</text>
<text x="500" y="171" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">3 algarismos</text>
<text x="610" y="120" text-anchor="middle" font-size="34" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">L</text>
<line x1="588" y1="132" x2="632" y2="132" stroke="#666" stroke-width="1.2"/>
<text x="610" y="155" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">individual</text>
<text x="610" y="171" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">letra (iguais)</text>
<g id="cota-simbolo" class="cota"><line x1="115" y1="85" x2="185" y2="85" stroke="#666" stroke-width="1.2"/><text x="150" y="78" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">símbolo</text></g>
<g id="cota-sequencial" class="cota"><line x1="460" y1="85" x2="540" y2="85" stroke="#666" stroke-width="1.2"/><text x="500" y="78" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sequencial</text></g>
<text x="820" y="110" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">conjunto: …A/H ("/" do primeiro ao último)</text>
<text x="820" y="128" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">…A#C#F/H ("#" quando faltam intermediários)</text>
<text x="250" y="215" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) acionador e auxiliar</text>
<text x="250" y="255" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ACIONADOR - TAG DO ACIONADO</text>
<text x="250" y="278" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ex.: motor de uma bomba, turbina de um gerador</text>
<text x="250" y="318" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">AUXILIAR - TAG DO PRINCIPAL - A ou - NN</text>
<text x="250" y="341" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">letra se auxiliares idênticos; dois algarismos se diferentes</text>
<text x="750" y="215" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) subestação e unidade pacote</text>
<text x="750" y="255" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">SE - ÁREA (preponderante)</text>
<text x="750" y="278" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">equipamento da SE: símbolo - área da SE + sequencial</text>
<text x="750" y="318" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">COMPONENTE - PACOTE - sequencial</text>
<text x="750" y="341" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pacote identificado como equipamento (símbolos do Anexo A)</text>
<text x="500" y="390" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(d) aplicação no equipamento</text>
<rect x="330" y="410" width="340" height="90" rx="30" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1.5"/>
<rect x="430" y="435" width="140" height="40" rx="0" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<text x="500" y="460" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">XX-AAAANNNL</text>
<text x="500" y="520" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">identificação pintada/fixada no próprio equipamento quando possível (N-1018 e N-1278)</text>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
