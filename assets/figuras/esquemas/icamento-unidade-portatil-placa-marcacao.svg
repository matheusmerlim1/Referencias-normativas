<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Placa de informação da POU e marcações — campos e alturas de caracteres">
<title>Placa de informação da POU e marcações — campos e alturas de caracteres (esquema ilustrativo)</title>
