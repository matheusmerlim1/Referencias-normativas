<rect x="300" y="236" width="60" height="14" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
<g id="cota-muting" class="cota"><line x1="345.0" y1="280.0" x2="415.0" y2="280.0" stroke="#666" stroke-width="1"/><line x1="345.0" y1="230.0" x2="415.0" y2="230.0" stroke="#666" stroke-width="1"/><line x1="410.0" y1="230.0" x2="410.0" y2="280.0" stroke="#666" stroke-width="1.2"/><polygon points="410.0,230.0 413.5,239.0 406.5,239.0" fill="#666"/><polygon points="410.0,280.0 406.5,271.0 413.5,271.0" fill="#666"/><text x="416.0" y="259.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">distância punção–chapa</text></g>
<g id="cota-deteccao" class="cota"><line x1="300.0" y1="236.0" x2="300.0" y2="195.0" stroke="#666" stroke-width="1"/><line x1="360.0" y1="236.0" x2="360.0" y2="195.0" stroke="#666" stroke-width="1"/><line x1="300.0" y1="200.0" x2="360.0" y2="200.0" stroke="#666" stroke-width="1.2"/><polygon points="300.0,200.0 309.0,196.5 309.0,203.5" fill="#666"/><polygon points="360.0,200.0 351.0,203.5 351.0,196.5" fill="#666"/><text x="380.0" y="186.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">zona de detecção (atrás / à frente)</text></g>
<rect x="520" y="290" width="16" height="60" rx="0" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
