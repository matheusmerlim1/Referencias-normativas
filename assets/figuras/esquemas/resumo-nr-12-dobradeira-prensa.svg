<text x="820" y="60" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">dispositivo pneumático</text>
<rect x="720" y="150" width="200" height="200" rx="0" fill="none" stroke="#666" stroke-width="3"/>
<rect x="745" y="175" width="150" height="150" rx="0" fill="#fff" fill-opacity="0.25" stroke="#666" stroke-width="2" stroke-dasharray="6 3"/>
<text x="820" y="255" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">face frontal aberta</text>
<g id="cota-abertura" class="cota"><line x1="745.0" y1="325.0" x2="745.0" y2="385.0" stroke="#666" stroke-width="1"/><line x1="895.0" y1="325.0" x2="895.0" y2="385.0" stroke="#666" stroke-width="1"/><line x1="745.0" y1="380.0" x2="895.0" y2="380.0" stroke="#666" stroke-width="1.2"/><polygon points="745.0,380.0 754.0,376.5 754.0,383.5" fill="#666"/><polygon points="895.0,380.0 886.0,383.5 886.0,376.5" fill="#666"/><text x="820.0" y="374.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">abertura</text></g>
<text x="12" y="512" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
