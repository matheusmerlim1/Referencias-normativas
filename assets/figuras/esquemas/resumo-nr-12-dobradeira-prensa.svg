<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Dobradeira e dispositivo pneumático — zona de detecção, muting e encosto traseiro">
<title>Dobradeira e dispositivo pneumático — zona de detecção, muting e encosto traseiro (esquema ilustrativo)</title>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Dobradeira e dispositivo pneumático — zona de detecção, muting e encosto traseiro</text>
<text x="330" y="60" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">dobradeira (vista lateral)</text>
<polygon points="300,120 360,120 345,230 315,230" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="2" stroke-linejoin="round"/>
<text x="330" y="110" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">punção</text>
<polygon points="270,300 390,300 390,380 270,380" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="2" stroke-linejoin="round"/>
