<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Ultrassom — feixe reto (espessura) e feixe angular em tubo/solda">
<title>Ultrassom — feixe reto (espessura) e feixe angular em tubo/solda (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ultrassom — feixe reto (espessura) e feixe angular em tubo/solda</text>
<text x="250" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) feixe reto pulso-eco (espessura)</text>
<rect x="80" y="160" width="340" height="100" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<rect x="220" y="125" width="60" height="35" fill="#666" fill-opacity="0.45" stroke="#666" stroke-width="1.5"/>
<text x="290" y="140" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cabeçote</text>
<line x1="250" y1="160" x2="250" y2="260" stroke="#666" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="260" y="210" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">acoplante + feixe</text>
<g id="cota-espessura" class="cota"><line x1="420" y1="160" x2="440" y2="160" stroke="#666" stroke-width="1"/><line x1="420" y1="260" x2="440" y2="260" stroke="#666" stroke-width="1"/><line x1="440" y1="160" x2="440" y2="260" stroke="#666" stroke-width="1.2"/><polygon points="440.0,160.0 443.5,169.0 436.5,169.0" fill="#666"/><polygon points="440.0,260.0 436.5,251.0 443.5,251.0" fill="#666"/><text x="447" y="214.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espessura</text></g>
<line x1="80" y1="330" x2="440" y2="330" stroke="#666" stroke-width="1"/>
<text x="90" y="350" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tela (A-scan)</text>
<line x1="110" y1="330" x2="110" y2="280" stroke="#666" stroke-width="2"/>
<line x1="300" y1="330" x2="300" y2="295" stroke="#666" stroke-width="2"/>
<line x1="420" y1="330" x2="420" y2="310" stroke="#666" stroke-width="2"/>
<text x="110" y="272" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pulso</text>
<text x="300" y="287" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eco de fundo</text>
<text x="720" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) tubo / solda — feixe angular</text>
<rect x="560" y="170" width="380" height="60" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<path d="M730,170 L760,140 L790,170 Z" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="800" y="150" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cabeçote angular</text>
<line x1="760" y1="170" x2="820" y2="230" stroke="#666" stroke-width="1.5" stroke-dasharray="5 3"/>
<line x1="820" y1="230" x2="880" y2="170" stroke="#666" stroke-width="1.5" stroke-dasharray="5 3"/>
<rect x="870" y="222" width="10" height="8" fill="#666" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<text x="890" y="260" text-anchor="end" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">entalhe de referência</text>
<line x1="650" y1="170" x2="650" y2="230" stroke="#c33" stroke-width="3"/>
<text x="650" y="250" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">costura / solda</text>
<text x="750" y="300" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">calibração no entalhe; indicação acima do nível de referência é rejeitada</text>
<text x="12" y="372" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
