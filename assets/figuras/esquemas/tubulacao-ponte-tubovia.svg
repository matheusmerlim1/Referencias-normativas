<g id="cota-espacamento" class="cota"><line class="e" x1="160" y1="50" x2="160" y2="76"/><line class="e" x1="214" y1="50" x2="214" y2="90"/><line class="d" x1="160" y1="58" x2="214" y2="58" marker-start="url(#a)" marker-end="url(#a)"/><text x="140" y="44">espaçamento</text></g>
<rect class="h" x="120" y="250" width="280" height="190"/>
