<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" role="img" aria-label="Arranjo de tubulação — tubovias, gabaritos e acessos">
<title>Arranjo de tubulação — tubovias, gabaritos e acessos (esquema ilustrativo)</title>
