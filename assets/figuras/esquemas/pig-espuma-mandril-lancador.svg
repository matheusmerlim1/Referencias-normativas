<text x="950" y="400" text-anchor="end" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">duto</text>
<rect x="540" y="370" width="20" height="80" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="550" y="465" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tampa</text>
<path d="M620,390 L700,390 L700,430 L620,430" fill="none" fill-opacity="0.12" stroke="#666" stroke-width="2"/>
<text x="660" y="456" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cesta</text>
<line x1="700" y1="380" x2="700" y2="330" stroke="#666" stroke-width="2"/>
<text x="706" y="336" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">saída lateral (by-pass)</text>
<g id="cota-cesta-angulo" class="cota"><path d="M694.0,410.0 A34,34 0 0 0 660.0,376.0" fill="none" stroke="#666" stroke-width="1.2"/><text x="570" y="362" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">defasagem da abertura</text></g>
<text x="730" y="520" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">válvulas: duto (O), by-pass (B), dreno (D), suspiro (S); manômetros PI; indicador XIS</text>
<text x="12" y="632" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
