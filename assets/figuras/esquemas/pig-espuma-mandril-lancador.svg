<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Pigs de espuma e mandril — interferência, comprimentos, aprisionamento em curva e lançador">
<title>Pigs de espuma e mandril — interferência, comprimentos, aprisionamento em curva e lançador (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Pigs de espuma e mandril — interferência, comprimentos, aprisionamento em curva e lançador</text>
<text x="230" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) pig de espuma no duto</text>
<line x1="40" y1="90" x2="420" y2="90" stroke="#666" stroke-width="2"/>
<line x1="40" y1="190" x2="420" y2="190" stroke="#666" stroke-width="2"/>
