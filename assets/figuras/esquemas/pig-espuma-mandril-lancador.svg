<g id="cota-raio-curva" class="cota"><line x1="300" y1="560" x2="300" y2="560" stroke="#666" stroke-width="1"/><line x1="300" y1="380" x2="300" y2="380" stroke="#666" stroke-width="1"/><line x1="300" y1="560" x2="300" y2="380" stroke="#666" stroke-width="1.2"/><polygon points="300.0,560.0 303.5,551.0 296.5,551.0" fill="#666"/><polygon points="300.0,380.0 296.5,389.0 303.5,389.0" fill="#666"/><text x="306" y="520" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">raio</text></g>
<line x1="300" y1="560" x2="60" y2="560" stroke="#666" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="730" y="300" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(d) recebedor com cesta para pig de espuma</text>
<rect x="560" y="380" width="300" height="60" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
