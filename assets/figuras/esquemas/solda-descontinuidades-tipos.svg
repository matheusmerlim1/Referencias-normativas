<text class="n" x="20" y="575">Corte transversal de junta de topo em V; vermelho = metal de solda. Descontinuidade só é defeito se reprovar no critério da norma aplicável.</text>
<text class="n" x="20" y="598">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
