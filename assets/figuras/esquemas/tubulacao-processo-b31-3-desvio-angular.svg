<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Desvio angular em junta de topo e em conexão aparada">
<title>Desvio angular em junta de topo e em conexão aparada (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Desvio angular em junta de topo e em conexão aparada</text>
<text class="b" x="40" y="70">(a) Desvio angular na junta soldada</text>
<rect class="s" x="60" y="150" width="200" height="40"/>
<polygon class="s" points="256.5,150.3 433.8,119.0 440.8,158.4 263.5,189.7"/>
<line class="v" x1="260" y1="148" x2="260" y2="192"/>
<line class="c" x1="40" y1="170" x2="490" y2="170"/>
<line class="c" x1="260" y1="170" x2="477" y2="131.8"/>
<g id="cota-desvio" class="cota"><path class="d" d="M460,170 A200,200 0 0,0 457,135.3" marker-start="url(#a)" marker-end="url(#a)"/><text x="330" y="235">desvio angular entre eixos</text><line class="d" x1="430" y1="222" x2="458" y2="158" marker-end="url(#a)"/></g>
<text class="n" x="60" y="215">solda</text><line class="e" x1="95" y1="210" x2="257" y2="185"/>
<text class="b" x="560" y="70">(b) Conexão aparada (corte oblíquo)</text>
<polygon class="s" points="600,150 790,150 770,190 600,190"/>
<line class="c" x1="580" y1="170" x2="840" y2="170"/>
<line class="h" x1="780" y1="84" x2="780" y2="220"/>
<line class="h" x1="790" y1="150" x2="818" y2="94"/>
<text class="n" x="790" y="235">face sem apara</text>
<g id="cota-apara" class="cota"><path class="d" d="M780,100 A70,70 0 0,1 811.3,107.4" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="772" y="110">desvio por apara</text></g>
<text class="n" x="20" y="318">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
