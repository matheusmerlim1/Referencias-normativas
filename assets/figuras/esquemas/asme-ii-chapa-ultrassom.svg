  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6;stroke-dasharray:6 4}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .k{fill:none;stroke:#8c8c8c;stroke-opacity:.6;stroke-width:16;stroke-linecap:butt}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker></defs>

<text class="t" x="20" y="28">Chapa — ultrassom: malha de varredura, círculo-limite e refletores de calibração</text>
<text class="n b" x="40" y="62">chapa (vista de cima)</text>
<rect class="sl" x="60" y="110" width="440" height="300"/>
<line class="h" x1="140" y1="110" x2="140" y2="410"/><line class="h" x1="220" y1="110" x2="220" y2="410"/><line class="h" x1="300" y1="110" x2="300" y2="410"/><line class="h" x1="380" y1="110" x2="380" y2="410"/><line class="h" x1="460" y1="110" x2="460" y2="410"/>
<line class="h" x1="60" y1="190" x2="500" y2="190"/><line class="h" x1="60" y1="270" x2="500" y2="270"/><line class="h" x1="60" y1="350" x2="500" y2="350"/>
<g id="cota-malha" class="cota"><line class="e" x1="140" y1="108" x2="140" y2="88"/><line class="e" x1="220" y1="108" x2="220" y2="88"/><line class="d" x1="140" y1="96" x2="220" y2="96" marker-start="url(#a)" marker-end="url(#a)"/><text x="230" y="100">espaçamento da malha</text></g>
<path class="r" d="M305,290 Q330,270 352,292 Q366,312 340,318 Q312,322 305,290 Z"/>
<circle class="v" cx="333" cy="300" r="56"/>
