<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 490" width="1150" height="490" role="img" aria-label="Chapa — ultrassom: malha de varredura, círculo-limite e refletores de calibração">
<title>Chapa — ultrassom: malha de varredura, círculo-limite e refletores de calibração (esquema ilustrativo)</title>
<style>
