<text class="n" x="70" y="432">vermelho = área de indicação (perda do eco de fundo)</text>

<text class="n b" x="620" y="62">bloco de calibração (corte)</text>
<rect class="sl" x="770" y="112" width="40" height="36"/><text class="n" x="818" y="132">cabeçote</text>
<rect class="s" x="640" y="150" width="440" height="120"/>
