<g id="cota-entalhe-profundidade" class="cota"><line class="e" x1="857" y1="246" x2="892" y2="246"/><line class="e" x1="857" y1="270" x2="892" y2="270"/><line class="d" x1="886" y1="222" x2="886" y2="246" marker-end="url(#a)"/><line class="d" x1="886" y1="294" x2="886" y2="270" marker-end="url(#a)"/><text x="896" y="262">profundidade do entalhe</text></g>
<g id="cota-furo-referencia" class="cota"><line class="e" x1="700" y1="272" x2="700" y2="300"/><line class="e" x1="716" y1="272" x2="716" y2="300"/><line class="d" x1="676" y1="294" x2="700" y2="294" marker-end="url(#a)"/><line class="d" x1="740" y1="294" x2="716" y2="294" marker-end="url(#a)"/><text x="646" y="320">Ø do furo de referência</text></g>
<text class="n b" x="900" y="326">vista por baixo</text>
<rect class="sl" x="640" y="340" width="440" height="60"/>
<rect class="w" x="800" y="366" width="90" height="8"/>
<circle class="w" cx="708" cy="370" r="8"/>
<g id="cota-entalhe-comprimento" class="cota"><line class="e" x1="800" y1="376" x2="800" y2="430"/><line class="e" x1="890" y1="376" x2="890" y2="430"/><line class="d" x1="800" y1="424" x2="890" y2="424" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="845" y="446">comprimento do entalhe</text></g>
<text class="n" x="20" y="478">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
