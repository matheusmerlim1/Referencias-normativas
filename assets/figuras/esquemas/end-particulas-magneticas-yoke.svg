<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Partículas magnéticas — yoke, espaçamento entre polos e bloco de levantamento">
<title>Partículas magnéticas — yoke, espaçamento entre polos e bloco de levantamento (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Partículas magnéticas — yoke, espaçamento entre polos e bloco de levantamento</text>
<text class="b" x="30" y="62">(a) Yoke de corrente alternada sobre a peça</text>
<rect class="s" x="60" y="300" width="420" height="40"/>
<path class="w" d="M140,300 L140,170 L400,170 L400,300 L370,300 L370,200 L170,200 L170,300 z"/>
<text class="m n" x="270" y="160">yoke</text>
<path class="h" d="M170,306 Q270,330 370,306"/>
<path class="h" d="M170,316 Q270,344 370,316"/>
<path class="h" d="M170,326 Q270,358 370,326"/>
<path class="r" d="M265,302 l6,30 l4,-30 z"/>
<text class="n" x="310" y="365">descontinuidade ⟂ ao fluxo</text>
<g id="cota-espacamento-polos" class="cota"><line class="e" x1="170" y1="200" x2="170" y2="246"/><line class="e" x1="370" y1="200" x2="370" y2="246"/><line class="d" x1="170" y1="240" x2="370" y2="240" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="270.0" y="233">espaçamento entre polos</text></g>
<text class="b" x="530" y="62">(b) Teste de levantamento</text>
<path class="w" d="M580,110 L580,200 L610,200 L610,140 L780,140 L780,200 L810,200 L810,110 z"/>
<rect class="s" x="570" y="200" width="250" height="60"/>
<text class="m n" x="695" y="236">bloco-padrão</text>
<g id="cota-face-bloco" class="cota"><line class="e" x1="570" y1="260" x2="570" y2="296"/><line class="e" x1="820" y1="260" x2="820" y2="296"/><line class="d" x1="570" y1="290" x2="820" y2="290" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="695.0" y="283">face de contato (comprimento × largura)</text></g>
<text class="n" x="530" y="340">massa mínima levantada com o maior</text>
<text class="n" x="530" y="360">espaçamento entre polos a ser usado</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
