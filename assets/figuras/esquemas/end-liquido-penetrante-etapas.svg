<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Líquido penetrante — etapas e bloco comparador">
<title>Líquido penetrante — etapas e bloco comparador (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Líquido penetrante — etapas e bloco comparador</text>
<text class="b" x="30" y="62">(a) Etapas do ensaio</text>
<rect class="s" x="40" y="150" width="190" height="40"/>
<path class="w" d="M130,150 l5,30 l5,-30 z"/>
<text class="m n" x="135" y="120">1 limpeza</text>
<rect class="s" x="255" y="150" width="190" height="40"/>
<path class="w" d="M345,150 l5,30 l5,-30 z"/>
<rect class="r" x="255" y="140" width="190" height="10"/><path class="r" d="M345,150 l5,30 l5,-30 z"/>
<text class="m n" x="350" y="120">2 penetrante (tempo)</text>
<rect class="s" x="470" y="150" width="190" height="40"/>
<path class="w" d="M560,150 l5,30 l5,-30 z"/>
<path class="r" d="M560,150 l5,30 l5,-30 z"/>
<text class="m n" x="565" y="120">3 remoção do excesso</text>
<rect class="s" x="685" y="150" width="190" height="40"/>
<path class="w" d="M775,150 l5,30 l5,-30 z"/>
<rect class="sl" x="685" y="140" width="190" height="10"/><path class="r" d="M775,150 l5,30 l5,-30 z"/><ellipse class="r" cx="780" cy="140" rx="22" ry="6"/>
<text class="m n" x="780" y="120">4 revelador → indicação</text>
<text class="b" x="30" y="290">(b) Bloco comparador (verificação de sensibilidade)</text>
<rect class="sl" x="80" y="330" width="420" height="120"/>
<path class="r" d="M140,340 l4,40 l4,-40 l4,40 l4,-40 M260,340 l3,50 l3,-50 l3,50 M380,345 l2,45 l2,-45 l2,45"/>
<g id="cota-trinca-comparador" class="cota"><line class="e" x1="383" y1="340" x2="383" y2="300"/><line class="e" x1="387" y1="340" x2="387" y2="300"/><line class="d" x1="360" y1="310" x2="383" y2="310" marker-end="url(#a)"/><line class="d" x1="410" y1="310" x2="387" y2="310" marker-end="url(#a)"/><text x="420" y="305">trincas de referência (μm)</text></g>
<text class="n" x="560" y="360">fluorescente: bloco mais fino</text>
<text class="n" x="560" y="380">colorido: bloco mais grosso</text>
<text class="n" x="560" y="400">100 % das indicações reveladas</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
