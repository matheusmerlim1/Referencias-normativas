<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Zona de transição (splash zone) — empilhamento dos níveis acima e abaixo do Nre">
<title>Zona de transição (splash zone) — empilhamento dos níveis acima e abaixo do Nre (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Zona de transição (splash zone) — empilhamento dos níveis acima e abaixo do Nre</text>
<rect x="150" y="60" width="60" height="600" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="180" y="678" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">perna / casco</text>
<line x1="100" y1="90" x2="560" y2="90" stroke="#666" stroke-width="2"/>
<text x="570" y="94" text-anchor="start" font-size="10.5" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">LSZDT — limite superior</text>
<line x1="100" y1="175" x2="560" y2="175" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="570" y="179" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NMaxSub (+ subsidência)</text>
<line x1="100" y1="220" x2="560" y2="220" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="570" y="224" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NMaxRec (+ recalque)</text>
<line x1="100" y1="265" x2="560" y2="265" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="570" y="269" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NMax (+ maré atmosférica máx.)</text>
<line x1="100" y1="310" x2="560" y2="310" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="570" y="314" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NMaxMast (+ MHWS)</text>
<line x1="100" y1="355" x2="560" y2="355" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="570" y="359" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NreMax (+ erro positivo LDA)</text>
<line x1="100" y1="390" x2="560" y2="390" stroke="#666" stroke-width="1.2"/>
<text x="570" y="394" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Nre — nível de referência (NR)</text>
<line x1="100" y1="425" x2="560" y2="425" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="570" y="429" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NreMin (− erro negativo LDA)</text>
<line x1="100" y1="470" x2="560" y2="470" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="570" y="474" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NMinMast (− MLWS)</text>
<line x1="100" y1="515" x2="560" y2="515" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="570" y="519" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NMin (− maré atmosférica mín.)</text>
<line x1="100" y1="600" x2="560" y2="600" stroke="#666" stroke-width="2"/>
<text x="570" y="604" text-anchor="start" font-size="10.5" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">LIZDT — limite inferior</text>
<rect x="212" y="90" width="330" height="510" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
<text x="380" y="640" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">zona de transição (ZDT)</text>
<g id="cota-sup-onda" class="cota"><line x1="260" y1="90" x2="260" y2="175" stroke="#666" stroke-width="1.2"/><polygon points="260.0,90.0 256.5,99.0 263.5,99.0" fill="#666"/><polygon points="260.0,175.0 263.5,166.0 256.5,166.0" fill="#666"/><text x="266" y="136.5" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">2/3 Hs10</text></g>
<g id="cota-inf-onda" class="cota"><line x1="260" y1="515" x2="260" y2="600" stroke="#666" stroke-width="1.2"/><polygon points="260.0,515.0 256.5,524.0 263.5,524.0" fill="#666"/><polygon points="260.0,600.0 263.5,591.0 256.5,591.0" fill="#666"/><text x="266" y="561.5" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">1/3 Hs10</text></g>
<g id="cota-erro-lda" class="cota"><line x1="330" y1="355" x2="330" y2="425" stroke="#666" stroke-width="1.2"/><polygon points="330.0,355.0 326.5,364.0 333.5,364.0" fill="#666"/><polygon points="330.0,425.0 333.5,416.0 326.5,416.0" fill="#666"/><text x="336" y="394.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">erro de medição LDA (±)</text></g>
<g id="cota-mhws" class="cota"><line x1="440" y1="310" x2="440" y2="355" stroke="#666" stroke-width="1.2"/><polygon points="440.0,310.0 436.5,319.0 443.5,319.0" fill="#666"/><polygon points="440.0,355.0 443.5,346.0 436.5,346.0" fill="#666"/><text x="446" y="336.5" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">MHWS</text></g>
<g id="cota-mlws" class="cota"><line x1="440" y1="425" x2="440" y2="470" stroke="#666" stroke-width="1.2"/><polygon points="440.0,425.0 436.5,434.0 443.5,434.0" fill="#666"/><polygon points="440.0,470.0 443.5,461.0 436.5,461.0" fill="#666"/><text x="446" y="451.5" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">MLWS</text></g>
<g id="cota-zdt" class="cota"><line x1="80" y1="90" x2="80" y2="600" stroke="#666" stroke-width="1.2"/><polygon points="80.0,90.0 76.5,99.0 83.5,99.0" fill="#666"/><polygon points="80.0,600.0 83.5,591.0 76.5,591.0" fill="#666"/><text x="74" y="349.0" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ZDT</text></g>
<g id="cota-recalque-subsidencia" class="cota"><line x1="380" y1="175" x2="380" y2="265" stroke="#666" stroke-width="1.2"/><polygon points="380.0,175.0 376.5,184.0 383.5,184.0" fill="#666"/><polygon points="380.0,265.0 383.5,256.0 376.5,256.0" fill="#666"/><text x="386" y="224.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">recalque + subsidência</text></g>
<text x="820" y="150" text-anchor="start" font-size="10.5" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">flutuantes e complacentes:</text>
<text x="820" y="166" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">+ calado máx. e movimento</text>
<text x="820" y="180" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">vertical máx. (acima);</text>
<text x="820" y="194" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">− calado mín. e movimento</text>
<text x="820" y="208" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">vertical mín. (abaixo)</text>
<text x="12" y="692" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
