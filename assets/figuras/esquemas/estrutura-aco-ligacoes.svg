<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 520" width="1300" height="520" role="img" aria-label="Estrutura de aço — filete mínimo e ligação parafusada (furos, espaçamentos e bordas)">
<title>Estrutura de aço — filete mínimo e ligação parafusada (furos, espaçamentos e bordas) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Estrutura de aço — filete mínimo e ligação parafusada (furos, espaçamentos e bordas)</text>
<text class="n b" x="60" y="75">solda de filete (junta em T)</text>
<rect class="s" x="60" y="330" width="320" height="40"/>
<rect class="s" x="200" y="140" width="30" height="190"/>
<path class="r" d="M230,330 L285,330 L230,275 z"/>
<path class="r" d="M200,330 L145,330 L200,275 z"/>
<g id="cota-perna" class="cota"><line class="e" x1="230" y1="370" x2="230" y2="406"/><line class="e" x1="285" y1="370" x2="285" y2="406"/><line class="d" x1="230" y1="400" x2="285" y2="400" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="257" y="430">perna mínima do filete</text></g>
<text class="n" x="60" y="470">espessura do metal-base define a perna mínima</text>
<text class="n b" x="480" y="75">ligação parafusada (vista da chapa)</text>
<rect class="sl" x="480" y="120" width="440" height="200"/>
<circle class="w" cx="560" cy="180" r="12"/>
<circle class="w" cx="560" cy="260" r="12"/>
<circle class="w" cx="680" cy="180" r="12"/>
<circle class="w" cx="680" cy="260" r="12"/>
<circle class="w" cx="800" cy="180" r="12"/>
<circle class="w" cx="800" cy="260" r="12"/>
<g id="cota-furo" class="cota"><line class="d" x1="600" y1="108" x2="568" y2="171" marker-end="url(#a)"/><text x="590" y="105">furo-padrão (db + folga)</text></g>
<g id="cota-espacamento" class="cota"><line class="e" x1="680" y1="272" x2="680" y2="302"/><line class="e" x1="800" y1="272" x2="800" y2="302"/><line class="d" x1="680" y1="296" x2="800" y2="296" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="740" y="340">espaçamento entre furos</text></g>
<g id="cota-borda-min" class="cota"><line class="e" x1="800" y1="168" x2="800" y2="134"/><line class="d" x1="800" y1="140" x2="920" y2="140" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="860" y="134">distância à borda (mín.)</text></g>
<g id="cota-borda-max" class="cota"><line class="e" x1="812" y1="260" x2="956" y2="260"/><line class="e" x1="920" y1="320" x2="956" y2="320"/><line class="d" x1="950" y1="260" x2="950" y2="320" marker-start="url(#a)" marker-end="url(#a)"/><text x="955" y="295">distância à borda (máx.)</text></g>
<line class="g" x1="920" y1="120" x2="920" y2="320"/>
<text class="n" x="480" y="390">t = espessura da parte menos espessa (limites do espaçamento máximo)</text>
<text class="n" x="20" y="508">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
