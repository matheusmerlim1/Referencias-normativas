<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 495" width="780" height="495" role="img" aria-label="Inclinação do cabo do guindaste e carga fora do plano (DNV-ST-E273 3.5.6)">
<title>Inclinação do cabo do guindaste e carga fora do plano (DNV-ST-E273 3.5.6)</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Inclinação do cabo do guindaste e carga fora do plano (DNV-ST-E273 3.5.6)</text>
<rect class="f" x="200" y="290" width="300" height="80" />
<line class="c" x1="350.0" y1="40.0" x2="350.0" y2="150.0" />
<line class="k" x1="350.0" y1="150.0" x2="400.0" y2="40.0" />
<ellipse class="o" cx="350" cy="165" rx="11" ry="17"/>
<line class="k" x1="350.0" y1="182.0" x2="215.0" y2="290.0" />
<line class="k" x1="350.0" y1="182.0" x2="485.0" y2="290.0" />
<g id="cota-inclinacao" class="cota"><path class="dim" d="M383.1,77.2 A80,80 0 0,0 350.0,70.0" /><text x="400.0" y="72.0" text-anchor="start">inclinação do cabo com a vertical</text></g>
<g id="cota-fora-plano" class="cota"><line class="ar" x1="485.0" y1="290.0" x2="565.0" y2="258.0" /><text x="570.0" y="252.0" text-anchor="start">carga fora do plano</text><text x="570.0" y="269.0" text-anchor="start">(na manilha)</text></g>
<text class="b" x="30.0" y="400.0" text-anchor="start" font-size="12.5px">Inclinação mínima do cabo do guindaste a considerar (3.5.6 C): R60: 20°; R45: 15°; R30: 10°; R00: 5°</text>
<text class="b" x="30.0" y="421.0" text-anchor="start" font-size="12.5px">Tolerâncias de fabricação (3.5.6 B): 3 % de carga fora do plano no ponto de ação da lingada (manilha)</text>
<text x="30.0" y="442.0" text-anchor="start" font-size="12.5px">Se C) é incluído, B) (3 %) pode ser desprezado; C) pode ser desprezada p/ lingadas de 3 e 4 pernas sem pernas frouxas.</text>
<text class="n" x="770" y="487" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
