<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Estruturas de madeira — seção mínima, camada de desgaste e espraiamento da carga">
<title>Estruturas de madeira — seção mínima, camada de desgaste e espraiamento da carga (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Estruturas de madeira — seção mínima, camada de desgaste e espraiamento da carga</text>
<text class="n b" x="80" y="110">peça isolada</text>
<rect class="s" x="100" y="160" width="240" height="90"/>
<rect x="100" y="160" width="240" height="90" fill="url(#hach)" stroke="none" opacity=".5"/>
<g id="cota-secao" class="cota"><line class="e" x1="342" y1="160" x2="386" y2="160"/><line class="e" x1="342" y1="250" x2="386" y2="250"/><line class="d" x1="380" y1="160" x2="380" y2="250" marker-start="url(#a)" marker-end="url(#a)"/><text x="390" y="210">espessura</text><line class="d" x1="150" y1="300" x2="200" y2="240" marker-end="url(#a)"/><text x="80" y="320">seção (área e espessura mínimas)</text></g>
<text class="n b" x="80" y="380">peça múltipla: cada elemento</text>
<rect class="s" x="100" y="400" width="240" height="30"/>
<rect class="s" x="100" y="450" width="240" height="30"/>
<text class="n b" x="560" y="110">tabuleiro sem revestimento</text>
<rect class="sl" x="560" y="160" width="360" height="20"/>
<rect class="s" x="560" y="180" width="360" height="60"/>
<g id="cota-desgaste" class="cota"><line class="e" x1="922" y1="160" x2="946" y2="160"/><line class="e" x1="922" y1="180" x2="946" y2="180"/><line class="d" x1="940" y1="134" x2="940" y2="160" marker-end="url(#a)"/><line class="d" x1="940" y1="206" x2="940" y2="180" marker-end="url(#a)"/><line class="d" x1="940" y1="160" x2="940" y2="180"/><text x="950" y="176">camada de desgaste</text></g>
<text class="n b" x="560" y="330">carga em área reduzida</text>
<rect class="sl" x="560" y="350" width="360" height="90"/>
<rect class="s" x="720" y="338" width="40" height="12"/>
<line class="c" x1="560" y1="395" x2="920" y2="395"/>
<line class="h" x1="720" y1="350" x2="675" y2="395"/>
<line class="h" x1="760" y1="350" x2="805" y2="395"/>
<g id="cota-45" class="cota"><line class="e" x1="760" y1="350" x2="760" y2="395"/><path class="d" d="M760.0,384.0 A34,34 0 0,0 784.0,374.0" marker-start="url(#a)" marker-end="url(#a)"/><text x="560" y="480">ângulo de espraiamento até o eixo</text></g>
<text class="n" x="20" y="508">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
