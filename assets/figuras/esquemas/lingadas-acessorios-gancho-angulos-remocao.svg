<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-label="Gancho — ângulo das pernas e critérios de remoção (ASME B30.10)">
<title>Gancho — ângulo das pernas e critérios de remoção (ASME B30.10)</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Gancho — ângulo das pernas e critérios de remoção (ASME B30.10)</text>
<circle class="o" cx="200.0" cy="62.0" r="18" />
<path class="o" d="M200,80 L200,175 A60,60 0 0,0 320,175 L320,140" style="stroke-width:14"/>
<line class="c" x1="260.0" y1="40.0" x2="260.0" y2="440.0" />
<line class="k" x1="260.0" y1="238.0" x2="120.0" y2="420.0" />
<line class="k" x1="260.0" y1="238.0" x2="400.0" y2="420.0" />
<g id="cota-angulo-incluido" class="cota"><path class="dim" d="M339.3,341.0 A130,130 0 0,1 180.7,341.0" /><text x="260.0" y="390.0" text-anchor="middle">ângulo incluído</text></g>
<g id="cota-angulo-perna" class="cota"><path class="dim" d="M305.7,297.4 A75,75 0 0,1 260.0,313.0" /><text x="296.0" y="336.0" text-anchor="start">perna × eixo</text></g>
<g id="cota-abertura-garganta" class="cota"><line class="dim" x1="209.0" y1="135.0" x2="311.0" y2="135.0" /><text class="s" x="258.0" y="126.0" text-anchor="middle">abertura da garganta</text></g>
<text class="b" x="440.0" y="75.0" text-anchor="start" font-size="13px">Várias pernas no assento (10-1.11.1):</text>
<text x="440.0" y="96.0" text-anchor="start" font-size="13px">• ângulo incluído ≤ 90° (ou conforme fabricante)</text>
<text x="440.0" y="117.0" text-anchor="start" font-size="13px">• perna ≤ 45° com o eixo do gancho</text>
<text x="440.0" y="138.0" text-anchor="start" font-size="13px">• acima de 2 pernas ou &gt; 45°: usar anel</text>
<text x="440.0" y="159.0" text-anchor="start" font-size="13px">  coletor (elo ou manilha)</text>
<text x="440.0" y="180.0" text-anchor="start" font-size="13px">• proibido carga lateral, traseira ou na ponta</text>
<text x="440.0" y="201.0" text-anchor="start" font-size="13px"></text>
<text class="b" x="440.0" y="222.0" text-anchor="start" font-size="13px">Remoção (10-1.10.5):</text>
<text x="440.0" y="243.0" text-anchor="start" font-size="13px">• aumento da abertura da garganta de 5 %</text>
<text x="440.0" y="264.0" text-anchor="start" font-size="13px">  (máx. 1/4 in = 6 mm)</text>
<text x="440.0" y="285.0" text-anchor="start" font-size="13px">• desgaste &gt; 10 % da seção original</text>
<text x="440.0" y="306.0" text-anchor="start" font-size="13px">• flexão/torção visível fora do plano</text>
<text x="440.0" y="327.0" text-anchor="start" font-size="13px"></text>
<text class="b" x="440.0" y="348.0" text-anchor="start" font-size="13px">ASME B30.26: várias lingas no corpo da</text>
<text x="440.0" y="369.0" text-anchor="start" font-size="13px">manilha ou num elo/anel: incluído ≤ 120°</text>
<text class="n" x="810" y="472" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
