<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Linga de corrente — trechos que recebem a carga de prova (PL1 a PL4)">
<title>Linga de corrente — trechos que recebem a carga de prova (PL1 a PL4) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Linga de corrente — trechos que recebem a carga de prova (PL1 a PL4)</text>
<ellipse cx="70" cy="140" rx="40" ry="22" transform="rotate(0 70 140)" fill="none" stroke="#666" stroke-width="5"/>
<rect class="s" x="112" y="132" width="16" height="16"/>
<line x1="128" y1="140" x2="360" y2="140" stroke="#666" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 4"/>
<path class="g" d="M375,149 L375,170 A9.8,9.8 0 1 1 356.8,165.8" style="stroke-width:5"/>
<g id="cota-PL1" class="cota"><line class="e" x1="112" y1="137" x2="112" y2="94"/><line class="e" x1="375" y1="137" x2="375" y2="94"/><line class="d" x1="112" y1="100" x2="375" y2="100" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="243.5" y="93">PL1</text></g>
<text class="b m" x="200" y="200">1 perna</text>
<ellipse cx="510" cy="140" rx="40" ry="22" transform="rotate(0 510 140)" fill="none" stroke="#666" stroke-width="5"/>
<rect class="s" x="552" y="132" width="16" height="16"/>
<line x1="568" y1="140" x2="800" y2="140" stroke="#666" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 4"/>
<path class="g" d="M815,149 L815,170 A9.8,9.8 0 1 1 796.8,165.8" style="stroke-width:5"/>
<g id="cota-PL2" class="cota"><line class="e" x1="470" y1="137" x2="470" y2="94"/><line class="e" x1="552" y1="137" x2="552" y2="94"/><line class="d" x1="470" y1="100" x2="552" y2="100" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="511" y="93">PL2</text></g>
<text class="b m" x="640" y="200">2 pernas</text>
<ellipse cx="70" cy="320" rx="40" ry="22" transform="rotate(0 70 320)" fill="none" stroke="#666" stroke-width="5"/>
<ellipse cx="125" cy="320" rx="18" ry="12" transform="rotate(0 125 320)" fill="none" stroke="#666" stroke-width="4"/>
<rect class="s" x="145" y="312" width="16" height="16"/>
<line x1="161" y1="320" x2="360" y2="320" stroke="#666" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 4"/>
<path class="g" d="M375,329 L375,350 A9.8,9.8 0 1 1 356.8,345.8" style="stroke-width:5"/>
<g id="cota-PL4" class="cota"><line class="e" x1="30" y1="317" x2="30" y2="274"/><line class="e" x1="110" y1="317" x2="110" y2="274"/><line class="d" x1="30" y1="280" x2="110" y2="280" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="70" y="273">PL4</text></g>
<g id="cota-PL3" class="cota"><line class="e" x1="110" y1="317" x2="110" y2="274"/><line class="e" x1="145" y1="317" x2="145" y2="274"/><line class="d" x1="84" y1="280" x2="110" y2="280" marker-end="url(#a)"/><line class="d" x1="171" y1="280" x2="145" y2="280" marker-end="url(#a)"/><line class="d" x1="110" y1="280" x2="145" y2="280"/><text class="m" x="127.5" y="273">PL3</text></g>
<text class="b m" x="200" y="380">3 e 4 pernas (com elos intermediários)</text>
<text class="n" x="470" y="300">PL1 = cada perna, do dispositivo de ligação ao terminal inferior</text>
<text class="n" x="470" y="320">PL2 = anel principal (linga de 2 pernas)</text>
<text class="n" x="470" y="340">PL3 = elo intermediário; PL4 = anel principal (3 e 4 pernas)</text>
<text class="n" x="20" y="408">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
