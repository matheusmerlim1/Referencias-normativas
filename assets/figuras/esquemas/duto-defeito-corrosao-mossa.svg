<line x1="250" y1="128" x2="360" y2="128" stroke="#666" stroke-width="0.8" stroke-dasharray="3 3"/>
<g id="cota-espessura-nominal" class="cota"><line x1="40" y1="100" x2="26" y2="100" stroke="#666" stroke-width="1"/><line x1="40" y1="160" x2="26" y2="160" stroke="#666" stroke-width="1"/><line x1="26" y1="100" x2="26" y2="160" stroke="#666" stroke-width="1.2"/><polygon points="26.0,100.0 22.5,109.0 29.5,109.0" fill="#666"/><polygon points="26.0,160.0 29.5,151.0 22.5,151.0" fill="#666"/><text x="20" y="134" text-anchor="end" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tn</text></g>
<g id="cota-espessura-remanescente" class="cota"><line x1="250" y1="140" x2="250" y2="196" stroke="#666" stroke-width="1"/><circle cx="250" cy="140" r="3" fill="#666"/><text x="250" y="200" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espessura remanescente (parede fina: atenção)</text></g>
<text x="750" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) região corroída (planta)</text>
