<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Avaliação de defeitos em dutos — geometria da corrosão, mossa, enrugamento e dupla laminação">
<title>Avaliação de defeitos em dutos — geometria da corrosão, mossa, enrugamento e dupla laminação (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Avaliação de defeitos em dutos — geometria da corrosão, mossa, enrugamento e dupla laminação</text>
<text x="250" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) região corroída (corte longitudinal)</text>
<rect x="40" y="100" width="420" height="60" fill="#a33" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<path d="M150,100 L170,120 L250,128 L320,116 L340,100 Z" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1.5"/>
