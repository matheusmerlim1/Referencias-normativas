<line x1="620" y1="525" x2="780" y2="525" stroke="#333" stroke-width="2"/>
<rect x="840" y="500" width="14" height="50" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="847" y="568" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">solda</text>
<g id="cota-laminacao-solda" class="cota"><line x1="780" y1="525" x2="780" y2="525" stroke="#666" stroke-width="1"/><line x1="840" y1="525" x2="840" y2="525" stroke="#666" stroke-width="1"/><line x1="780" y1="525" x2="840" y2="525" stroke="#666" stroke-width="1.2"/><polygon points="780.0,525.0 789.0,528.5 789.0,521.5" fill="#666"/><polygon points="840.0,525.0 831.0,521.5 831.0,528.5" fill="#666"/><text x="810" y="518" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">dist. à solda</text></g>
<text x="12" y="612" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
