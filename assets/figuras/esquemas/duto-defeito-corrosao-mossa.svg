<g id="cota-diametro-externo" class="cota"><line x1="160" y1="380" x2="160" y2="380" stroke="#666" stroke-width="1"/><line x1="340" y1="380" x2="340" y2="380" stroke="#666" stroke-width="1"/><line x1="160" y1="380" x2="340" y2="380" stroke="#666" stroke-width="1.2"/><polygon points="160.0,380.0 169.0,383.5 169.0,376.5" fill="#666"/><polygon points="340.0,380.0 331.0,376.5 331.0,383.5" fill="#666"/><text x="250" y="400" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">D</text></g>
<text x="750" y="260" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(d) mossas vizinhas e enrugamento</text>
