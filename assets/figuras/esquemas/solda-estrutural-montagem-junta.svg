<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Montagem de juntas — chanfro, face de raiz, abertura de raiz, desalinhamento e folga de filete">
<title>Montagem de juntas — chanfro, face de raiz, abertura de raiz, desalinhamento e folga de filete (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Montagem de juntas — chanfro, face de raiz, abertura de raiz, desalinhamento e folga de filete</text>
<text class="b" x="40" y="70">(a) Junta de topo com chanfro em V</text>
<path class="s" d="M40,130 L210,130 L250,200 L250,220 L40,220 z"/>
<path class="s" d="M420,130 L300,130 L270,200 L270,220 L420,220 z"/>
<g id="cota-abertura" class="cota"><line class="e" x1="250" y1="223" x2="250" y2="256"/><line class="e" x1="270" y1="223" x2="270" y2="256"/><line class="d" x1="224" y1="250" x2="250" y2="250" marker-end="url(#a)"/><line class="d" x1="296" y1="250" x2="270" y2="250" marker-end="url(#a)"/><line class="d" x1="250" y1="250" x2="270" y2="250"/><text class="m" x="260" y="272">abertura de raiz</text></g>
<g id="cota-face-raiz" class="cota"><line class="d" x1="249" y1="174" x2="249" y2="200" marker-end="url(#a)"/><line class="d" x1="249" y1="246" x2="249" y2="220" marker-end="url(#a)"/><line class="d" x1="249" y1="200" x2="249" y2="220"/><text class="m" x="150" y="250">face de raiz</text></g>
<line class="e" x1="210" y1="130" x2="250" y2="70"/>
<line class="e" x1="250" y1="200" x2="250" y2="70"/>
<g id="cota-angulo-chanfro" class="cota"><path class="d" d="M212.7,123.6 A85,85 0 0,1 250,115" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="227.5" y="107.6">ângulo do chanfro</text></g>
<text class="b" x="500" y="70">(b) Desalinhamento (offset) de topo</text>
<rect class="s" x="500" y="140" width="170" height="50"/>
<rect class="s" x="680" y="160" width="180" height="70"/>
<line class="c" x1="480" y1="165" x2="880" y2="165"/>
<g id="cota-offset" class="cota"><line class="d" x1="670" y1="114" x2="670" y2="140" marker-end="url(#a)"/><line class="d" x1="670" y1="186" x2="670" y2="160" marker-end="url(#a)"/><line class="d" x1="670" y1="140" x2="670" y2="160"/><text class="en" x="640" y="120">desalinhamento</text></g>
<g id="cota-t-fina" class="cota"><line class="e" x1="497" y1="140" x2="454" y2="140"/><line class="e" x1="497" y1="190" x2="454" y2="190"/><line class="d" x1="460" y1="140" x2="460" y2="190" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="462" y="128">t (mais fina)</text></g>
<text class="b" x="40" y="330">(c) Correção de desalinhamento — rampa na peça deslocada</text>
<path class="s" d="M40,380 L230,380 L330,400 L330,450 L40,450 z"/>
<rect class="s" x="340" y="400" width="160" height="70"/>
<g id="cota-rampa" class="cota"><line class="e" x1="230" y1="377" x2="230" y2="344"/><line class="e" x1="330" y1="377" x2="330" y2="344"/><line class="d" x1="230" y1="350" x2="330" y2="350" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="280" y="360">rampa (inclinação)</text></g>
<text class="b" x="540" y="330">(d) Folga de raiz em filete / cobre-junta</text>
<rect class="s" x="540" y="470" width="320" height="30"/>
<rect class="s" x="650" y="360" width="30" height="98"/>
<path class="r" d="M650,458 L620,458 L650,428 z"/>
<path class="r" d="M680,458 L710,458 L680,428 z"/>
<g id="cota-folga-filete" class="cota"><line class="d" x1="666" y1="432" x2="666" y2="458" marker-end="url(#a)"/><line class="d" x1="666" y1="496" x2="666" y2="470" marker-end="url(#a)"/><line class="d" x1="666" y1="458" x2="666" y2="470"/><text x="720" y="430">folga de raiz (filete)</text></g>
<g id="cota-folga-cobre-junta" class="cota"><line class="d" x1="821" y1="432" x2="821" y2="458" marker-end="url(#a)"/><line class="d" x1="821" y1="496" x2="821" y2="470" marker-end="url(#a)"/><line class="d" x1="821" y1="458" x2="821" y2="470"/><text class="en" x="860" y="530">folga peça × cobre-junta / plug</text></g>
<rect class="sl" x="760" y="445" width="100" height="13"/>
<text class="n" x="20" y="588">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
