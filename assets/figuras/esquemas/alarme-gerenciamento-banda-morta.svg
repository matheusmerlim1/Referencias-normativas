<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Gerenciamento de alarmes — ajuste, banda morta, temporizador, tempo de resposta e prioridade">
<title>Gerenciamento de alarmes — ajuste, banda morta, temporizador, tempo de resposta e prioridade (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Gerenciamento de alarmes — ajuste, banda morta, temporizador, tempo de resposta e prioridade</text>
<line x1="80" y1="400" x2="80" y2="90" stroke="#666" stroke-width="1.5"/>
<line x1="80" y1="400" x2="900" y2="400" stroke="#666" stroke-width="1.5"/>
<text x="74" y="100" text-anchor="end" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">variável</text>
<text x="900" y="418" text-anchor="end" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tempo</text>
<line x1="80" y1="180" x2="780" y2="180" stroke="#a33" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="785" y="184" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ponto de ajuste do alarme</text>
<line x1="80" y1="220" x2="780" y2="220" stroke="#a33" stroke-width="1" stroke-dasharray="3 3"/>
<text x="785" y="224" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">retorno (banda morta)</text>
<line x1="80" y1="110" x2="780" y2="110" stroke="#666" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="785" y="114" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">limite de segurança / trip</text>
<path d="M80,330 C200,320 260,240 320,175 C360,140 420,130 480,150 C540,175 580,215 640,240 C700,260 800,300 900,310" fill="none" fill-opacity="0.12" stroke="#36c" stroke-width="2.5"/>
<g id="cota-banda-morta" class="cota"><line x1="200" y1="180" x2="200" y2="180" stroke="#666" stroke-width="1"/><line x1="200" y1="220" x2="200" y2="220" stroke="#666" stroke-width="1"/><line x1="200" y1="180" x2="200" y2="220" stroke="#666" stroke-width="1.2"/><polygon points="200.0,180.0 196.5,189.0 203.5,189.0" fill="#666"/><polygon points="200.0,220.0 203.5,211.0 196.5,211.0" fill="#666"/><text x="206" y="204" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">banda morta</text></g>
<g id="cota-temporizador" class="cota"><line x1="325" y1="250" x2="325" y2="250" stroke="#666" stroke-width="1"/><line x1="380" y1="250" x2="380" y2="250" stroke="#666" stroke-width="1"/><line x1="325" y1="250" x2="380" y2="250" stroke="#666" stroke-width="1.2"/><polygon points="325.0,250.0 334.0,253.5 334.0,246.5" fill="#666"/><polygon points="380.0,250.0 371.0,246.5 371.0,253.5" fill="#666"/><text x="352" y="270" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">temporizador</text></g>
<line x1="325" y1="175" x2="325" y2="255" stroke="#666" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="380" y1="145" x2="380" y2="255" stroke="#666" stroke-width="0.8" stroke-dasharray="3 3"/>
<g id="cota-trd" class="cota"><line x1="380" y1="90" x2="380" y2="90" stroke="#666" stroke-width="1"/><line x1="520" y1="90" x2="520" y2="90" stroke="#666" stroke-width="1"/><line x1="380" y1="90" x2="520" y2="90" stroke="#666" stroke-width="1.2"/><polygon points="380.0,90.0 389.0,93.5 389.0,86.5" fill="#666"/><polygon points="520.0,90.0 511.0,86.5 511.0,93.5" fill="#666"/><text x="450" y="84" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tempo de resposta disponível (TRD)</text></g>
<line x1="520" y1="90" x2="520" y2="110" stroke="#666" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="500" y="450" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Prioridade = f(severidade da consequência × TRD): baixa • média • alta • crítica</text>
<text x="500" y="475" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ciclo: filosofia → identificação → racionalização → projeto → implantação → operação → manutenção → monitoração → gestão de mudanças → auditoria</text>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
