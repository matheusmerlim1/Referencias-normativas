<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Pré-aquecimento e TTAT local (ASME B31.3) — zona aquecida, faixa de TTAT e sobreposição em forno">
<title>Pré-aquecimento e TTAT local (ASME B31.3) — zona aquecida, faixa de TTAT e sobreposição em forno (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Pré-aquecimento e TTAT local (ASME B31.3) — zona aquecida, faixa de TTAT e sobreposição em forno</text>
<rect class="sl" x="60" y="180" width="780" height="60"/>
<rect class="r" x="440" y="172" width="20" height="76"/>
<g id="cota-preaquec" class="cota"><line class="e" x1="460" y1="243" x2="460" y2="286"/><line class="e" x1="600" y1="243" x2="600" y2="286"/><line class="d" x1="460" y1="280" x2="600" y2="280" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="530" y="298">zona de pré-aquecimento (cada lado)</text></g>
<g id="cota-faixa-ttat" class="cota"><line class="e" x1="300" y1="177" x2="300" y2="134"/><line class="e" x1="600" y1="177" x2="600" y2="134"/><line class="d" x1="300" y1="140" x2="600" y2="140" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="450" y="133">faixa aquecida (TTAT local)</text></g>
<g id="cota-espessura" class="cota"><line class="e" x1="57" y1="180" x2="29" y2="180"/><line class="e" x1="57" y1="240" x2="29" y2="240"/><line class="d" x1="35" y1="180" x2="35" y2="240" marker-start="url(#a)" marker-end="url(#a)"/><text x="42" y="215">espessura de controle</text></g>
<text class="b" x="60" y="330">Forno em etapas:</text>
<rect class="sl" x="220" y="350" width="360" height="20"/>
<rect class="h" x="500" y="345" width="300" height="30"/>
<g id="cota-sobreposicao" class="cota"><line class="e" x1="500" y1="373" x2="500" y2="406"/><line class="e" x1="580" y1="373" x2="580" y2="406"/><line class="d" x1="500" y1="400" x2="580" y2="400" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="540" y="418">sobreposição</text></g>
<text class="n" x="20" y="448">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
