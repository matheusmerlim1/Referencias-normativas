<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="Painel elétrico com risco de arco — distâncias, plaqueta e ferramentas isolantes">
<title>Painel elétrico com risco de arco — distâncias, plaqueta e ferramentas isolantes (esquema ilustrativo)</title>
