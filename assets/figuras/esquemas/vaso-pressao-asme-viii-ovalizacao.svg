<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Ovalização (UG-80(a)) e desvio da forma circular (UG-80(b)) do casco">
<title>Ovalização (UG-80(a)) e desvio da forma circular (UG-80(b)) do casco (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Ovalização (UG-80(a)) e desvio da forma circular (UG-80(b)) do casco</text>
<text class="b" x="60" y="70">(a) Pressão interna</text>
<path class="g" d="M120,250 a140,110 0 1,0 280,0 a140,110 0 1,0 -280,0 z"/>
<g id="cota-Dmax" class="cota"><line class="d" x1="120" y1="250" x2="400" y2="250" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="200" y="244">Ø máx.</text></g>
<g id="cota-Dmin" class="cota"><line class="d" x1="260" y1="140" x2="260" y2="360" marker-start="url(#a)" marker-end="url(#a)"/><text x="268" y="330">Ø mín.</text></g>
<text class="b" x="500" y="70">(b) Pressão externa — gabarito de arco</text>
<path class="g" d="M520,330 Q680,140 840,330"/>
<path class="h" d="M520,330 Q690,160 840,330"/>
<text class="n" x="560" y="400">tracejado = círculo teórico (gabarito)</text>
<g id="cota-e" class="cota"><line class="d" x1="690" y1="271" x2="690" y2="245" marker-end="url(#a)"/><line class="d" x1="690" y1="209" x2="690" y2="235" marker-end="url(#a)"/><line class="d" x1="690" y1="245" x2="690" y2="235"/><text x="720" y="215">e — desvio radial</text></g>
<g id="cota-corda" class="cota"><line class="e" x1="560" y1="293" x2="560" y2="356"/><line class="e" x1="820" y1="293" x2="820" y2="356"/><line class="d" x1="560" y1="350" x2="820" y2="350" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="690" y="368">comprimento de arco do gabarito</text></g>
<text class="n" x="20" y="468">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
