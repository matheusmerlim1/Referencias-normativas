<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="1060" height="420" role="img" aria-label="Olhal com presilha prensada — sapatilho, distâncias e ensaio">
<title>Olhal com presilha prensada — sapatilho, distâncias e ensaio (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>


<text class="t" x="20" y="28">Olhal com presilha prensada — sapatilho, distâncias e ensaio</text>
<path d="M170,200 C140,160 60,150 60,200 C60,250 140,240 170,200" fill="none" stroke="#666" stroke-width="10" stroke-linejoin="round"/>
<path class="w" d="M160,200 C135,172 76,166 76,200 C76,234 135,228 160,200 Z"/>
<line x1="165" y1="194" x2="230" y2="195" stroke="#666" stroke-width="10"/>
<line x1="165" y1="206" x2="230" y2="205" stroke="#666" stroke-width="10"/>
<rect class="s" x="230" y="184" width="60" height="32" rx="4"/>
<text class="n m" x="110" y="270">sapatilho</text>
<text class="n m" x="260" y="176">presilha</text>
<line x1="290" y1="200" x2="670" y2="200" stroke="#666" stroke-width="10"/>
<rect class="s" x="670" y="184" width="60" height="32" rx="4"/>
<text class="n m" x="700" y="176">presilha</text>
<path d="M730,195 L800,170 A40,40 0 1,1 800,230 L730,205" fill="none" stroke="#666" stroke-width="10" stroke-linejoin="round"/>
<circle class="s" cx="830" cy="200" r="22"/>
<text class="n m" x="830" y="140">olhal sem sapatilho</text>
<g id="cota-presilha-sapatilho" class="cota"><line class="e" x1="170" y1="190" x2="170" y2="140"/><line class="e" x1="230" y1="180" x2="230" y2="140"/><line class="d" x1="170" y1="148" x2="230" y2="148" marker-start="url(#a)" marker-end="url(#a)"/><text x="40" y="128">presilha → base do sapatilho</text></g>
<g id="cota-entre-presilhas" class="cota"><line class="e" x1="290" y1="180" x2="290" y2="120"/><line class="e" x1="670" y1="180" x2="670" y2="120"/><line class="d" x1="290" y1="128" x2="670" y2="128" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="480" y="120">distância entre presilhas</text></g>
<g id="cota-cabo-livre" class="cota"><line class="e" x1="290" y1="220" x2="290" y2="290"/><line class="e" x1="670" y1="220" x2="670" y2="290"/><line class="d" x1="290" y1="282" x2="670" y2="282" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="480" y="305">cabo livre entre presilhas (ensaio)</text></g>
<g id="cota-d" class="cota"><line class="d" x1="480" y1="170" x2="480" y2="195" marker-end="url(#a)"/><line class="d" x1="480" y1="230" x2="480" y2="205" marker-end="url(#a)"/><text x="488" y="180">d</text></g>
<g id="cota-pino" class="cota"><line class="e" x1="830" y1="178" x2="935" y2="178"/><line class="e" x1="830" y1="222" x2="935" y2="222"/><line class="d" x1="925" y1="178" x2="925" y2="222" marker-start="url(#a)" marker-end="url(#a)"/><text x="935" y="205">Ø pino de ensaio</text></g>
<g id="cota-perimetro-olhal" class="cota"><path class="d" d="M745,245 L800,255 A62,62 0 0,0 870,248" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="870" y="290">perímetro do olhal (em passos do cabo)</text></g>
<text class="n" x="20" y="408">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
