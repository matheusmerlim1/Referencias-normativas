<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Iluminação industrial — altura de montagem, base em pátio de bombas, mastro elevado e raio das tomadas">
<!--P7A-->
<title>Iluminação industrial — altura de montagem, base em pátio de bombas, mastro elevado e raio das tomadas (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Iluminação industrial — altura de montagem, base em pátio de bombas, mastro elevado e raio das tomadas</text>
<line x1="30" y1="470" x2="970" y2="470" stroke="#666" stroke-width="1.5"/>
<text x="170" y="48" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) luminária em perfil</text>
<rect x="110" y="440" width="60" height="30" rx="0" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="140" y="486" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">base de concreto</text>
<line x1="140" y1="440" x2="140" y2="200" stroke="#666" stroke-width="4"/>
<line x1="140" y1="200" x2="190" y2="200" stroke="#666" stroke-width="3"/>
<polygon points="180,200 200,200 205,215 175,215" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<g id="cota-base-perfil" class="cota"><line x1="185" y1="470" x2="185" y2="440" stroke="#666" stroke-width="1.2"/><polygon points="185.0,470.0 188.5,461.0 181.5,461.0" fill="#666"/><polygon points="185.0,440.0 181.5,449.0 188.5,449.0" fill="#666"/><text x="240" y="462" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">elevação da base</text></g>
<g id="cota-altura-montagem" class="cota"><line x1="230" y1="470" x2="230" y2="210" stroke="#666" stroke-width="1.2"/><polygon points="230.0,470.0 233.5,461.0 226.5,461.0" fill="#666"/><polygon points="230.0,210.0 226.5,219.0 233.5,219.0" fill="#666"/><text x="236" y="330" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura de montagem (troca do tipo de lâmpada)</text></g>
<text x="500" y="48" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) mastro elevado</text>
<line x1="520" y1="470" x2="520" y2="80" stroke="#666" stroke-width="6"/>
<rect x="495" y="72" width="50" height="10" rx="0" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<g id="cota-mastro" class="cota"><line x1="570" y1="470" x2="570" y2="80" stroke="#666" stroke-width="1.2"/><polygon points="570.0,470.0 573.5,461.0 566.5,461.0" fill="#666"/><polygon points="570.0,80.0 566.5,89.0 573.5,89.0" fill="#666"/><text x="576" y="280" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura do mastro</text></g>
<text x="820" y="48" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) tomada e reator</text>
<rect x="800" y="380" width="40" height="40" rx="0" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="820" y="440" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tomada</text>
<path d="M820,400 m-140,0 a140,90 0 1,0 280,0 a140,90 0 1,0 -280,0" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
<g id="cota-raio-tomada" class="cota"><line x1="820" y1="400" x2="960" y2="400" stroke="#666" stroke-width="1.2"/><polygon points="820.0,400.0 829.0,403.5 829.0,396.5" fill="#666"/><polygon points="960.0,400.0 951.0,396.5 951.0,403.5" fill="#666"/><text x="890.0" y="394.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">raio de ação</text></g>
<rect x="760" y="140" width="60" height="25" rx="0" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<text x="790" y="130" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">reator</text>
<rect x="720" y="175" width="140" height="8" rx="0" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="790" y="200" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">superfície / objeto</text>
<g id="cota-reator-distancia" class="cota"><line x1="870" y1="165" x2="870" y2="175" stroke="#666" stroke-width="1.2"/><polygon points="870.0,165.0 866.5,174.0 873.5,174.0" fill="#666"/><polygon points="870.0,175.0 873.5,166.0 866.5,166.0" fill="#666"/><text x="876" y="174" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">afastamento</text></g>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
