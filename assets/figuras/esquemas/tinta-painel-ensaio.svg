<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Ensaio de tinta em laboratório — painel de aço, entalhe e película">
<title>Ensaio de tinta em laboratório — painel de aço, entalhe e película (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ensaio de tinta em laboratório — painel de aço, entalhe e película</text>
<text x="250" y="52" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) painel de ensaio (vista de frente)</text>
<rect x="150" y="70" width="200" height="300" fill="#47a" fill-opacity="0.18" stroke="#47a" stroke-width="1.5"/>
<rect x="162" y="82" width="176" height="276" fill="#666" fill-opacity="0" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="248" y="130" width="4" height="180" fill="#c33" fill-opacity="0.8" stroke="#c33" stroke-width="0.5"/>
<g id="cota-largura" class="cota"><line x1="150" y1="370" x2="150" y2="398" stroke="#666" stroke-width="1"/><line x1="350" y1="370" x2="350" y2="398" stroke="#666" stroke-width="1"/><line x1="150" y1="392" x2="350" y2="392" stroke="#666" stroke-width="1.2"/><polygon points="350.0,392.0 341.0,395.5 341.0,388.5" fill="#666"/><polygon points="150.0,392.0 159.0,388.5 159.0,395.5" fill="#666"/><text x="250" y="410" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">largura</text></g>
<g id="cota-comprimento" class="cota"><line x1="114" y1="70" x2="150" y2="70" stroke="#666" stroke-width="1"/><line x1="114" y1="370" x2="150" y2="370" stroke="#666" stroke-width="1"/><line x1="120" y1="70" x2="120" y2="370" stroke="#666" stroke-width="1.2"/><polygon points="120.0,370.0 116.5,361.0 123.5,361.0" fill="#666"/><polygon points="120.0,70.0 123.5,79.0 116.5,79.0" fill="#666"/><text x="114" y="224" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">comprimento</text></g>
