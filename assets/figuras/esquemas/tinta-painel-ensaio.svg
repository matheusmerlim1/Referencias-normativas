<text x="545" y="193" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">o entalhe atravessa a película até o aço</text>
<text x="850" y="75" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) painel em corte</text>
<rect x="760" y="135" width="180" height="22" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<rect x="760" y="121" width="180" height="14" fill="#47a" fill-opacity="0.3" stroke="#47a" stroke-width="1.5"/>
<g id="cota-espessura" class="cota"><line x1="940" y1="135" x2="961" y2="135" stroke="#666" stroke-width="1"/><line x1="940" y1="157" x2="961" y2="157" stroke="#666" stroke-width="1"/><line x1="955" y1="135" x2="955" y2="157" stroke="#666" stroke-width="1.2"/><polygon points="955.0,157.0 951.5,148.0 958.5,148.0" fill="#666"/><polygon points="955.0,135.0 958.5,144.0 951.5,144.0" fill="#666"/><text x="950" y="177" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espessura da chapa</text></g>
<g id="cota-pelicula" class="cota"><line x1="739" y1="121" x2="760" y2="121" stroke="#666" stroke-width="1"/><line x1="739" y1="135" x2="760" y2="135" stroke="#666" stroke-width="1"/><line x1="745" y1="121" x2="745" y2="135" stroke="#666" stroke-width="1.2"/><polygon points="745.0,135.0 741.5,126.0 748.5,126.0" fill="#666"/><polygon points="745.0,121.0 748.5,130.0 741.5,130.0" fill="#666"/><text x="750" y="108" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">película seca</text></g>
<text x="800" y="300" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">jato ao metal branco com perfil de ancoragem</text>
<text x="800" y="318" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bordas e verso protegidos durante o ensaio</text>
<text x="12" y="442" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
