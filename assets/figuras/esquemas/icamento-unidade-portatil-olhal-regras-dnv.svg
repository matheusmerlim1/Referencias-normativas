<text class="s" x="560.0" y="80.0" text-anchor="start">manilha</text>
<text class="b" x="490.0" y="418.0" text-anchor="middle">Vista lateral (manilha no olhal)</text>
<text class="b" x="30.0" y="460.0" text-anchor="start" font-size="12.5px">DNV-ST-E273 3.8.4: R ≥ DH (raio externo ≥ Ø do furo do pino); t no furo (com chapas de reforço) ≥ 75 % da largura</text>
<text x="30.0" y="481.0" text-anchor="start" font-size="12.5px">  interna da manilha; furo − pino o menor possível; com carga fora do plano &gt; 10 %: Ø pino ≥ 94 % do Ø furo (recomendado)</text>
<text class="b" x="30.0" y="502.0" text-anchor="start" font-size="12.5px">DNV-ST-E271 4.4.1 (container): folga entre pino e furo ≤ 6 % do Ø do pino; t ≥ 75 % da largura interna da manilha</text>
<text x="30.0" y="523.0" text-anchor="start" font-size="12.5px">  (se menor: chapas de reforço soldadas ou bucha/tubo de parede grossa)</text>
<text class="b" x="30.0" y="544.0" text-anchor="start" font-size="12.5px">NORSOK R-002 F.1.1: resultante da lingada no plano do olhal, ± 2°</text>
<text class="n" x="790" y="582" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
