<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-label="Radiografia — arranjo fonte, peça, filme e indicadores de qualidade de imagem (IQI)">
<title>Radiografia — arranjo fonte, peça, filme e indicadores de qualidade de imagem (IQI) (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Radiografia — arranjo fonte, peça, filme e indicadores de qualidade de imagem (IQI)</text>
<text x="250" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) arranjo radiográfico</text>
<path d="M240,80 L260,80 L250,100 Z" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
