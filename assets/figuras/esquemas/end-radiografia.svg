<line x1="725" y1="240" x2="725" y2="310" stroke="#666" stroke-width="3.5999999999999996"/>
<line x1="770" y1="240" x2="770" y2="310" stroke="#666" stroke-width="2.8"/>
<line x1="815" y1="240" x2="815" y2="310" stroke="#666" stroke-width="2.0"/>
<text x="710" y="345" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sensibilidade = menor furo / fio visível na imagem</text>
<text x="12" y="382" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
