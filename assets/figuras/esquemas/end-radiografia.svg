<g id="cota-fonte-objeto" class="cota"><line x1="40" y1="100" x2="40" y2="220" stroke="#666" stroke-width="1.2"/><polygon points="40.0,100.0 43.5,109.0 36.5,109.0" fill="#666"/><polygon points="40.0,220.0 36.5,211.0 43.5,211.0" fill="#666"/><text x="46" y="150" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">fonte–objeto</text></g>
<g id="cota-objeto-filme" class="cota"><line x1="40" y1="260" x2="40" y2="290" stroke="#666" stroke-width="1.2"/><polygon points="40.0,260.0 43.5,269.0 36.5,269.0" fill="#666"/><polygon points="40.0,290.0 36.5,281.0 43.5,281.0" fill="#666"/><text x="46" y="312" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">objeto–filme</text></g>
<text x="250" y="360" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">penumbra geométrica Ug = F × (objeto–filme) / (fonte–objeto)</text>
