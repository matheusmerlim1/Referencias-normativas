<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Proteção catódica de unidade flutuante — corrente impressa no casco, anodos, eletrodos e blindagem dielétrica">
<title>Proteção catódica de unidade flutuante — corrente impressa no casco, anodos, eletrodos e blindagem dielétrica (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Proteção catódica de unidade flutuante — corrente impressa no casco, anodos, eletrodos e blindagem dielétrica</text>
<rect x="0" y="180" width="1000" height="300" fill="#9cf" fill-opacity="0.2" stroke="#666" stroke-width="0"/>
<line x1="0" y1="180" x2="1000" y2="180" stroke="#666" stroke-width="1" stroke-dasharray="6 4"/>
<text x="990" y="174" text-anchor="end" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">calado mínimo (linha d'água)</text>
<path d="M60,100 L940,100 L940,360 Q900,420 820,420 L180,420 Q100,420 60,360 Z" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="2"/>
<text x="500" y="130" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">casco da embarcação (FPSO / navio)</text>
<g id="cota-comprimento-total" class="cota"><line x1="60" y1="90" x2="60" y2="60" stroke="#666" stroke-width="1"/><line x1="940" y1="90" x2="940" y2="60" stroke="#666" stroke-width="1"/><line x1="60" y1="60" x2="940" y2="60" stroke="#666" stroke-width="1.2"/><polygon points="60.0,60.0 69.0,63.5 69.0,56.5" fill="#666"/><polygon points="940.0,60.0 931.0,56.5 931.0,63.5" fill="#666"/><text x="500" y="54" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">comprimento total</text></g>
<rect x="220" y="294" width="60" height="12" fill="#e5c000" fill-opacity="0.8" stroke="#666" stroke-width="1"/>
<circle cx="250" cy="300" r="48" fill="none" fill-opacity="0" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="750" y="294" width="60" height="12" fill="#e5c000" fill-opacity="0.8" stroke="#666" stroke-width="1"/>
<circle cx="780" cy="300" r="48" fill="none" fill-opacity="0" stroke="#666" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="370" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">anodo inerte + blindagem</text>
<text x="780" y="370" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">anodo inerte (popa)</text>
<g id="cota-blindagem-raio" class="cota"><line x1="250" y1="300" x2="250" y2="300" stroke="#666" stroke-width="1"/><line x1="298" y1="300" x2="298" y2="300" stroke="#666" stroke-width="1"/><line x1="250" y1="300" x2="298" y2="300" stroke="#666" stroke-width="1.2"/><polygon points="250.0,300.0 259.0,303.5 259.0,296.5" fill="#666"/><polygon points="298.0,300.0 289.0,296.5 289.0,303.5" fill="#666"/><text x="274" y="292" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">blindagem</text></g>
<circle cx="520" cy="300" r="7" fill="#36c" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<text x="520" y="325" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eletrodo de referência</text>
<g id="cota-eletrodo-anodo" class="cota"><line x1="298" y1="270" x2="298" y2="270" stroke="#666" stroke-width="1"/><line x1="520" y1="270" x2="520" y2="270" stroke="#666" stroke-width="1"/><line x1="298" y1="270" x2="520" y2="270" stroke="#666" stroke-width="1.2"/><polygon points="298.0,270.0 307.0,273.5 307.0,266.5" fill="#666"/><polygon points="520.0,270.0 511.0,266.5 511.0,273.5" fill="#666"/><text x="410" y="262" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eletrodo ↔ anodo inerte</text></g>
<g id="cota-profundidade-anodo" class="cota"><line x1="780" y1="180" x2="870" y2="180" stroke="#666" stroke-width="1"/><line x1="780" y1="294" x2="870" y2="294" stroke="#666" stroke-width="1"/><line x1="870" y1="180" x2="870" y2="294" stroke="#666" stroke-width="1.2"/><polygon points="870.0,180.0 866.5,189.0 873.5,189.0" fill="#666"/><polygon points="870.0,294.0 873.5,285.0 866.5,285.0" fill="#666"/><text x="876" y="240" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">abaixo do calado mín.</text></g>
<rect x="140" y="240" width="30" height="30" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="155" y="232" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">caixa de mar</text>
<g id="cota-anodo-acessorio" class="cota"><line x1="170" y1="300" x2="170" y2="330" stroke="#666" stroke-width="1"/><line x1="220" y1="300" x2="220" y2="330" stroke="#666" stroke-width="1"/><line x1="170" y1="330" x2="220" y2="330" stroke="#666" stroke-width="1.2"/><polygon points="170.0,330.0 179.0,333.5 179.0,326.5" fill="#666"/><polygon points="220.0,330.0 211.0,326.5 211.0,333.5" fill="#666"/><text x="195" y="346" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">afast.</text></g>
<rect x="400" y="140" width="60" height="30" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="430" y="160" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">retificador</text>
<text x="500" y="530" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">potencial de proteção (Ag/AgCl ou Zn) monitorado; amarras/cabos não isolados contam na área</text>
<g id="cota-potencial" class="cota"><line x1="520" y1="300" x2="500" y2="556" stroke="#666" stroke-width="1"/><circle cx="520" cy="300" r="3" fill="#666"/><text x="500" y="560" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">faixa de potencial: ver resumo</text></g>
<text x="12" y="592" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
