<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="Plataforma de trabalho — altura da tarefa e dimensões mínimas">
<title>Plataforma de trabalho — altura da tarefa e dimensões mínimas</title>
<defs><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Plataforma de trabalho — altura da tarefa e dimensões mínimas</text>
<rect x="60" y="440" width="300" height="12" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<text x="210" y="470" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">piso da plataforma</text>
<circle cx="150" cy="190" r="16" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
<line x1="150" y1="206" x2="150" y2="320" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
<line x1="150" y1="320" x2="130" y2="440" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
