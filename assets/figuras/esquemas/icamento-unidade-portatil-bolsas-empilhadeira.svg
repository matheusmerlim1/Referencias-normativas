<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 560" width="830" height="560" role="img" aria-label="Bolsas de empilhadeira — vista lateral (DNV-ST-E273 3.9.3 / DNV-ST-E271 4.4.6)">
<title>Bolsas de empilhadeira — vista lateral (DNV-ST-E273 3.9.3 / DNV-ST-E271 4.4.6)</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Bolsas de empilhadeira — vista lateral (DNV-ST-E273 3.9.3 / DNV-ST-E271 4.4.6)</text>
<rect class="w" x="40" y="90" width="460" height="200" />
<line class="o" x1="40.0" y1="262.0" x2="500.0" y2="262.0" />
<rect class="f" x="165" y="265" width="50" height="22" />
<line class="c" x1="190.0" y1="245.0" x2="190.0" y2="330.0" />
<rect class="f" x="325" y="265" width="50" height="22" />
<line class="c" x1="350.0" y1="245.0" x2="350.0" y2="330.0" />
<g id="cota-distancia-centros" class="cota"><line class="dim" x1="190.0" y1="322.0" x2="350.0" y2="322.0" /><text x="270.0" y="315.0" text-anchor="middle" font-size="13px">distância entre centros</text></g>
<g id="cota-L" class="cota"><line class="t" x1="40.0" y1="292.0" x2="40.0" y2="360.0" /><line class="t" x1="500.0" y1="292.0" x2="500.0" y2="360.0" /><line class="dim" x1="40.0" y1="352.0" x2="500.0" y2="352.0" /><text x="270.0" y="345.0" text-anchor="middle" font-size="13px">L = comprimento da unidade</text></g>
<text class="s" x="270.0" y="185.0" text-anchor="middle">unidade (POU / container)</text>
<text class="s" x="190.0" y="252.0" text-anchor="middle">bolsa</text>
<text class="s" x="350.0" y="252.0" text-anchor="middle">bolsa</text>
<text class="b" x="640.0" y="105.0" text-anchor="middle">Abertura mínima da bolsa</text>
<rect class="f" x="560" y="150" width="160" height="72" />
<g id="cota-abertura-largura" class="cota"><line class="t" x1="560.0" y1="150.0" x2="560.0" y2="125.0" /><line class="t" x1="720.0" y1="150.0" x2="720.0" y2="125.0" /><line class="dim" x1="560.0" y1="132.0" x2="720.0" y2="132.0" /><text x="640.0" y="125.0" text-anchor="middle" font-size="13px">abertura (largura)</text></g>
<g id="cota-abertura-altura" class="cota"><line class="t" x1="720.0" y1="150.0" x2="752.0" y2="150.0" /><line class="t" x1="720.0" y1="222.0" x2="752.0" y2="222.0" /><line class="dim" x1="745.0" y1="150.0" x2="745.0" y2="222.0" /><text x="752.0" y="191.0" text-anchor="start" font-size="13px">altura</text></g>
<text class="s" x="640.0" y="248.0" text-anchor="middle">(largura × altura livres)</text>
<text class="b" x="40.0" y="400.0" text-anchor="start" font-size="13px">Distância entre centros — DNV-ST-E273 Tabela 3-6 (recomendação):</text>
<text x="40.0" y="419.0" text-anchor="start" font-size="13px">• L &lt; 6 m: 25 % de L, mín. 900 mm (carregado) ou 900 mm (vazio)</text>
<text x="40.0" y="438.0" text-anchor="start" font-size="13px">• 6 ≤ L ≤ 12 m: 25 % de L, máx. 2 050 mm (carregado) ou 15 % de L (vazio)</text>
<text x="40.0" y="457.0" text-anchor="start" font-size="13px">• 12 &lt; L ≤ 18 m: 2 050 mm (só vazio)   • L &gt; 18 m: sem bolsas</text>
<text class="b" x="40.0" y="476.0" text-anchor="start" font-size="13px">Container offshore (DNV-ST-E271 4.4.6): abertura mín. 200 mm × 90 mm;</text>
<text x="40.0" y="495.0" text-anchor="start" font-size="13px">  distância entre centros ≥ 900 mm (quando possível), não precisando passar de 2 050 mm</text>
<text class="n" x="820" y="552" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
