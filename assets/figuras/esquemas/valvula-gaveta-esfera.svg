<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Válvulas gaveta e esfera — partes, face a face e passagem">
<title>Válvulas gaveta e esfera — partes, face a face e passagem (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Válvulas gaveta e esfera — partes, face a face e passagem</text>
<text x="250" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) gaveta — castelo aparafusado</text>
<path d="M120,330 L120,250 L380,250 L380,330 Z" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/>
<rect x="90" y="260" width="30" height="60" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<rect x="380" y="260" width="30" height="60" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<rect x="230" y="220" width="40" height="110" fill="#666" fill-opacity="0.45" stroke="#666" stroke-width="1.5"/>
<text x="290" y="300" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">gaveta (cunha)</text>
<rect x="190" y="150" width="120" height="70" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1.5"/>
<text x="320" y="190" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">castelo + gaxeta</text>
<line x1="250" y1="150" x2="250" y2="70" stroke="#666" stroke-width="3"/>
<line x1="200" y1="75" x2="300" y2="75" stroke="#666" stroke-width="4"/>
<text x="310" y="80" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">volante / haste</text>
<g id="cota-face-a-face" class="cota"><line x1="90" y1="320" x2="90" y2="370" stroke="#666" stroke-width="1"/><line x1="410" y1="320" x2="410" y2="370" stroke="#666" stroke-width="1"/><line x1="90" y1="370" x2="410" y2="370" stroke="#666" stroke-width="1.2"/><polygon points="90.0,370.0 99.0,366.5 99.0,373.5" fill="#666"/><polygon points="410.0,370.0 401.0,373.5 401.0,366.5" fill="#666"/><text x="250.0" y="364" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">face a face</text></g>
<text x="720" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) esfera — passagem plena</text>
<path d="M560,330 L560,250 L880,250 L880,330 Z" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/>
<rect x="530" y="260" width="30" height="60" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<rect x="880" y="260" width="30" height="60" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<circle cx="720" cy="290" r="50" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<rect x="670" y="275" width="100" height="30" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1.5"/>
<text x="720" y="228" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">esfera com furo</text>
<rect x="650" y="265" width="10" height="50" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<rect x="780" y="265" width="10" height="50" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="800" y="240" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sedes</text>
<line x1="720" y1="240" x2="720" y2="160" stroke="#666" stroke-width="3"/>
<rect x="690" y="140" width="60" height="20" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="760" y="150" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">haste / alavanca ¼ volta</text>
<g id="cota-passagem" class="cota"><line x1="950" y1="275" x2="950" y2="305" stroke="#666" stroke-width="1.2"/><polygon points="950.0,275.0 953.5,284.0 946.5,284.0" fill="#666"/><polygon points="950.0,305.0 946.5,296.0 953.5,296.0" fill="#666"/><text x="944" y="350" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø de passagem</text></g>
<line x1="770" y1="275" x2="950" y2="275" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="770" y1="305" x2="950" y2="305" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
<text x="12" y="402" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
