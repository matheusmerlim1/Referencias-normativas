<text class="b" x="220" y="165">S = menor dos critérios</text>
<text class="n m" x="420" y="435">tubo com costura: os mesmos critérios multiplicados pelo fator de junta</text>
<text class="n" x="20" y="488">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
