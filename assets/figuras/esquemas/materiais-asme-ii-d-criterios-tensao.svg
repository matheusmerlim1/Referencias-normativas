</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Tensão admissível (Tabelas 1A/1B) — o menor dos critérios em cada temperatura</text>
<line class="g" x1="100" y1="380" x2="740" y2="380"/>
<line class="g" x1="100" y1="380" x2="100" y2="80"/>
<line class="d" x1="730" y1="380" x2="750" y2="380" marker-end="url(#a)"/>
<line class="d" x1="100" y1="90" x2="100" y2="70" marker-end="url(#a)"/>
<text class="n en" x="740" y="410">temperatura</text>
<text class="n" x="70" y="230.0" transform="rotate(-90 70 230.0)" text-anchor="middle">tensão</text>
<path class="h" d="M100,180 C350,185 500,195 740,230"/>
