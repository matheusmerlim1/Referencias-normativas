<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Duto submarino — anodo galvânico tipo braçadeira e espaçamento ao longo da linha">
<!--P7A-->
<title>Duto submarino — anodo galvânico tipo braçadeira e espaçamento ao longo da linha (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Duto submarino — anodo galvânico tipo braçadeira e espaçamento ao longo da linha</text>
<text x="260" y="48" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) seção do anodo no tubo</text>
<circle cx="260" cy="230" r="130" fill="#666" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<circle cx="260" cy="230" r="92" fill="#666" fill-opacity="0.05" stroke="#666" stroke-width="1.5"/>
<circle cx="260" cy="230" r="80" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="260" y="234" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tubo</text>
<g id="cota-anodo-di" class="cota"><line x1="168" y1="230" x2="352" y2="230" stroke="#666" stroke-width="1.2"/><polygon points="168.0,230.0 177.0,233.5 177.0,226.5" fill="#666"/><polygon points="352.0,230.0 343.0,226.5 343.0,233.5" fill="#666"/><text x="260.0" y="224.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø interno do anodo</text></g>
<g id="cota-anodo-espessura" class="cota"><line x1="352" y1="230" x2="352" y2="150" stroke="#666" stroke-width="1"/><line x1="390" y1="230" x2="390" y2="150" stroke="#666" stroke-width="1"/><line x1="352" y1="150" x2="390" y2="150" stroke="#666" stroke-width="1.2"/><polygon points="352.0,150.0 361.0,153.5 361.0,146.5" fill="#666"/><polygon points="390.0,150.0 381.0,146.5 381.0,153.5" fill="#666"/><text x="395" y="146" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espessura (inicial/final)</text></g>
<text x="260" y="390" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø interno = Ø ext. do tubo + 2 × revestimento + tolerâncias</text>
<text x="740" y="48" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) duto com anodos</text>
<line x1="520" y1="250" x2="980" y2="250" stroke="#999" stroke-width="14"/>
<rect x="545" y="238" width="30" height="24" rx="0" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<rect x="745" y="238" width="30" height="24" rx="0" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<rect x="945" y="238" width="30" height="24" rx="0" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<g id="cota-anodo-espacamento" class="cota"><line x1="560" y1="262" x2="560" y2="300" stroke="#666" stroke-width="1"/><line x1="760" y1="262" x2="760" y2="300" stroke="#666" stroke-width="1"/><line x1="560" y1="300" x2="760" y2="300" stroke="#666" stroke-width="1.2"/><polygon points="560.0,300.0 569.0,303.5 569.0,296.5" fill="#666"/><polygon points="760.0,300.0 751.0,296.5 751.0,303.5" fill="#666"/><text x="660.0" y="294.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">espaçamento máximo entre anodos</text></g>
<text x="760" y="360" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">anodo extra junto a cada ligação flangeada</text>
<text x="12" y="512" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
