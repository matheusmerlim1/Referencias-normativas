<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Escada de degraus — altura máxima do lance (H) e comprimento do patamar (l)">
<title>Escada de degraus — altura máxima do lance (H) e comprimento do patamar (l)</title>
<defs><pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>
<text x="12" y="22" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Escada de degraus — altura máxima do lance (H) e comprimento do patamar (l)</text>
<rect x="30" y="400" width="440" height="10" rx="0" fill="url(#hz)" stroke="#666" stroke-width="1.2"/>
<line x1="30" y1="400" x2="470" y2="400" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="60,400 60,378 90,378 90,356 120,356 120,334 150,334 150,312 180,312 180,290 210,290 210,268 240,268 240,246 270,246" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="270" y1="246" x2="380" y2="246" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="270" y="246" width="110" height="8" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<polyline points="380,246 380,224 410,224 410,202 440,202 440,180 470,180" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="470" y1="180" x2="510" y2="180" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="60" y1="400" x2="39" y2="400" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="60" y1="246" x2="39" y2="246" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="45" y1="400" x2="45" y2="246" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="45.0,246.0 48.5,255.0 41.5,255.0" fill="#666"/>
<polygon points="45.0,400.0 41.5,391.0 48.5,391.0" fill="#666"/>
<text x="39" y="327.0" text-anchor="end" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">H</text>
<line x1="270" y1="286" x2="380" y2="286" stroke="#666" stroke-width="1.2" fill="none"/>
<polygon points="380.0,286.0 371.0,289.5 371.0,282.5" fill="#666"/>
<polygon points="270.0,286.0 279.0,282.5 279.0,289.5" fill="#666"/>
<text x="325.0" y="302" text-anchor="middle" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">l</text>
<line x1="270" y1="254" x2="270" y2="292" stroke="#666" stroke-width="1.2" fill="none"/>
<line x1="380" y1="254" x2="380" y2="292" stroke="#666" stroke-width="1.2" fill="none"/>
<text x="325" y="236" text-anchor="middle" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">patamar</text>
<text x="530" y="60" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">H — altura máxima entre patamares:</text>
<text x="530" y="78" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NR-12: ≤ 3,00 m</text>
<text x="530" y="96" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NR-18 e NR-34: ≤ 2,90 m</text>
<text x="530" y="114" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ISO 14122-3: ≤ 3000 mm (lance único: ≤ 4000 mm)</text>
<text x="530" y="132" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ABS: ≤ 3500 mm (e em cada convés atendido)</text>
<text x="530" y="150" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ASTM F1166: em cada convés ou a cada 3,65 m</text>
<text x="530" y="168" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      (escadas com subida ≥ 6,1 m)</text>
<text x="530" y="186" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">FPSO Peregrino: 2 a 16 espelhos por lance</text>
<text x="530" y="204" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      (16 × 190 mm ≈ 3040 mm)</text>
<text x="530" y="222" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">l — comprimento mínimo do patamar:</text>
<text x="530" y="240" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ISO 14122-3: ≥ 800 mm e ≥ largura da escada</text>
<text x="530" y="258" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ABS: ≥ 915 mm (topo, base, mudança de direção);</text>
<text x="530" y="276" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      rota com maca: ≥ 1525 mm</text>
<text x="530" y="294" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ASTM F1166: ≥ 914 mm e ≥ largura (pref. 1118 mm);</text>
<text x="530" y="312" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">      junto a porta que abre para fora: 1524 mm</text>
<text x="530" y="330" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NR-18 / NR-34: comprimento ≥ largura da escada</text>
<text x="530" y="348" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Largura do patamar:</text>
<text x="530" y="366" text-anchor="start" font-size="13" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">NR-12: largura útil ≥ 0,60 m</text>
<text x="12" y="462" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo, sem escala — não é desenho da norma. Valores transcritos dos requisitos da ficha.</text>
</svg>