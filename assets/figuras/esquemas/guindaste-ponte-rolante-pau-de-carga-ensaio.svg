<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Paus de carga (derricks) — ângulo da lança no ensaio de prova (ABS 2-7/5.3.2(d))">
<title>Paus de carga (derricks) — ângulo da lança no ensaio de prova (ABS 2-7/5.3.2(d))</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Paus de carga (derricks) — ângulo da lança no ensaio de prova (ABS 2-7/5.3.2(d))</text>
<rect class="f" x="90" y="70" width="20" height="270" />
<line class="o" x1="40.0" y1="340.0" x2="680.0" y2="340.0" />
<line class="o" x1="110.0" y1="320.0" x2="525.3" y2="208.7" style="stroke-width:6"/>
<line class="x" x1="110.0" y1="320.0" x2="499.7" y2="138.3" />
<line class="c" x1="110.0" y1="320.0" x2="600.0" y2="320.0" />
<g id="cota-angulo-ensaio" class="cota"><path class="dim" d="M399.8,242.4 A300,300 0 0,1 410.0,320.0" /><text x="420.0" y="300.0" text-anchor="start">ângulo da lança (cargas menores)</text></g>
<g id="cota-angulo-ensaio-pesado" class="cota"><path class="dim" d="M309.4,227.0 A220,220 0 0,1 330.0,320.0" /><text x="290.0" y="152.0" text-anchor="start">ângulo da lança (cargas maiores)</text></g>
<text class="s" x="118.0" y="60.0" text-anchor="start">mastro</text>
<text x="30.0" y="366.0" text-anchor="start" font-size="13px">Ângulo da lança com a horizontal no ensaio: até 15° (cargas até 10 t) e 25° (acima de 10 t),</text>
<text x="30.0" y="384.0" text-anchor="start" font-size="13px">ou o menor ângulo aprovado no projeto, ou, se esses ângulos forem impraticáveis, o menor ângulo praticável.</text>
<text class="n" x="710" y="412" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
