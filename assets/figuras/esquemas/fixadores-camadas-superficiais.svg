<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Fixadores — revestimento na rosca, adesivo travante e camada cementada">
<title>Fixadores — revestimento na rosca, adesivo travante e camada cementada (esquema ilustrativo)</title>
