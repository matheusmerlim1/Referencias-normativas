<g id="cota-L" class="cota"><line class="e" x1="330" y1="197" x2="330" y2="139"/><line class="e" x1="470" y1="197" x2="470" y2="139"/><line class="d" x1="330" y1="145" x2="470" y2="145" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="400" y="138">L</text></g>
