<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Grampos de cabo — montagem (sela na parte viva, U na parte morta)">
<title>Grampos de cabo — montagem (sela na parte viva, U na parte morta) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
