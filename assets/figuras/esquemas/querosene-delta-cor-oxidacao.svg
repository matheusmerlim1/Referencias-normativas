<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Delta cor de querosene de aviação — bomba de oxidação e colorímetro Saybolt">
<title>Delta cor de querosene de aviação — bomba de oxidação e colorímetro Saybolt (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Delta cor de querosene de aviação — bomba de oxidação e colorímetro Saybolt</text>
<text x="250" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) envelhecimento: bomba de oxidação em banho</text>
<rect x="90" y="150" width="320" height="250" fill="#9cf" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<text x="250" y="390" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">banho de oxidação (temperatura controlada)</text>
<rect x="190" y="120" width="120" height="240" rx="8" fill="#999" fill-opacity="0.35" stroke="#666" stroke-width="2"/>
<text x="250" y="112" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bomba (O₂ sob pressão)</text>
<rect x="215" y="230" width="70" height="110" fill="#fff" fill-opacity="0.9" stroke="#666" stroke-width="1"/>
<rect x="215" y="280" width="70" height="60" fill="#e5c000" fill-opacity="0.5" stroke="#666" stroke-width="0.8"/>
<text x="250" y="315" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">amostra</text>
<text x="250" y="225" text-anchor="middle" font-size="8" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">recipiente de vidro c/ tampa</text>
<line x1="250" y1="120" x2="250" y2="80" stroke="#666" stroke-width="2"/>
<circle cx="250" cy="70" r="12" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1.5"/>
<text x="268" y="74" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">manômetro</text>
<line x1="250" y1="90" x2="330" y2="90" stroke="#666" stroke-width="2"/>
<text x="336" y="94" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">O₂ extra seco / válvula de agulha</text>
<g id="cota-pressao-oxigenio" class="cota"><line x1="150" y1="400" x2="100" y2="446" stroke="#666" stroke-width="1"/><circle cx="150" cy="400" r="3" fill="#666"/><text x="100" y="450" text-anchor="start" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pressão de O₂, temperatura e tempo: ver resumo</text></g>
<text x="750" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) leitura da cor Saybolt antes e depois</text>
<rect x="600" y="100" width="40" height="260" fill="#e5c000" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<rect x="600" y="200" width="40" height="160" fill="#e5c000" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="620" y="380" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">coluna</text>
<rect x="680" y="100" width="40" height="260" fill="#666" fill-opacity="0.05" stroke="#666" stroke-width="1.5"/>
<text x="700" y="380" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">padrão</text>
<circle cx="660" cy="90" r="16" fill="#666" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<text x="660" y="94" text-anchor="middle" font-size="8" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ocular</text>
<text x="820" y="150" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cor inicial (amostra original)</text>
<text x="820" y="180" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cor final (após oxidação)</text>
<text x="820" y="220" text-anchor="start" font-size="11" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Delta cor = inicial − final</text>
<text x="820" y="250" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(&gt; +30 conta +30; &lt; −16 conta −16)</text>
<g id="cota-altura-coluna" class="cota"><line x1="640" y1="220" x2="820" y2="296" stroke="#666" stroke-width="1"/><circle cx="640" cy="220" r="3" fill="#666"/><text x="820" y="300" text-anchor="start" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura da coluna ↔ número de cor</text></g>
<text x="12" y="512" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
