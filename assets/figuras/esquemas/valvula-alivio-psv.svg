<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Válvula de alívio de pressão (PSV) — partes e instalação">
<title>Válvula de alívio de pressão (PSV) — partes e instalação (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Válvula de alívio de pressão (PSV) — partes e instalação</text>
<text x="230" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) válvula de alívio de mola — corte</text>
<path d="M150,330 L150,250 L190,230 L270,230 L310,250 L310,330 Z" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/>
