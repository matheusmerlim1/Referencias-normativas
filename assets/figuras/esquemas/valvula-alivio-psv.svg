<rect x="205" y="330" width="50" height="60" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<text x="265" y="375" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">entrada (bocal)</text>
<rect x="310" y="260" width="80" height="40" fill="#666" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
<text x="400" y="285" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">saída / descarga</text>
<rect x="212" y="238" width="36" height="10" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="150" y="222" text-anchor="end" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">disco / sede</text>
<line x1="152" y1="220" x2="210" y2="240" stroke="#666" stroke-width="1"/>
<rect x="200" y="110" width="60" height="120" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1.5"/>
<text x="270" y="120" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">castelo</text>
<polyline points="230,120 212,120 248,133 212,146 248,159 212,172 248,186 212,199 248,212 212,225 230,225" fill="none" stroke="#666" stroke-width="1.5"/>
<text x="270" y="175" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">mola (ajuste da pressão de abertura)</text>
<rect x="222" y="80" width="16" height="30" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
