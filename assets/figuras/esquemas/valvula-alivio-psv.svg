<text x="720" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) instalação</text>
<rect x="560" y="230" width="150" height="140" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/>
<text x="635" y="310" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">vaso protegido</text>
<line x1="635" y1="230" x2="635" y2="170" stroke="#666" stroke-width="6"/>
<path d="M621,140.2 L649,159.8 L649,140.2 L621,159.8 Z" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="660" y="154" text-anchor="start" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">PSV</text>
<line x1="649" y1="150" x2="900" y2="150" stroke="#666" stroke-width="5"/>
<line x1="900" y1="150" x2="900" y2="110" stroke="#666" stroke-width="5"/>
<text x="905" y="105" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ao flare / atmosfera</text>
<text x="645" y="205" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tubulação de entrada</text>
<text x="760" y="140" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">descarga (contrapressão)</text>
<g id="cota-entrada" class="cota"><line x1="600" y1="170" x2="600" y2="230" stroke="#666" stroke-width="1.2"/><polygon points="600.0,170.0 603.5,179.0 596.5,179.0" fill="#666"/><polygon points="600.0,230.0 596.5,221.0 603.5,221.0" fill="#666"/><text x="594" y="204.0" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">perda na entrada</text></g>
<text x="720" y="410" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">pressão de ajuste, sobrepressão e acumulação admissíveis</text>
<text x="12" y="432" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
