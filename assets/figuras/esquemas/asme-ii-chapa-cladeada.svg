<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 420" width="1150" height="420" role="img" aria-label="Chapa cladeada — revestimento, metal de base, cisalhamento da interface e ultrassom da aderência">
<title>Chapa cladeada — revestimento, metal de base, cisalhamento da interface e ultrassom da aderência (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .k{fill:none;stroke:#8c8c8c;stroke-width:10;stroke-linejoin:round;stroke-linecap:butt}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Chapa cladeada — revestimento, metal de base, cisalhamento da interface e ultrassom da aderência</text>
<text class="n b" x="40" y="70">chapa cladeada (corte)</text>
<rect class="r" x="110" y="130" width="220" height="22"/><rect class="s" x="110" y="152" width="220" height="90"/>
<line class="e" x1="230" y1="153" x2="230" y2="262"/><text class="n m" x="230" y="278">interface (ligação metalúrgica)</text>
<g id="cota-revestimento" class="cota"><line class="e" x1="108" y1="130" x2="82" y2="130"/><line class="e" x1="108" y1="152" x2="82" y2="152"/><line class="d" x1="88" y1="106" x2="88" y2="130" marker-end="url(#a)"/><line class="d" x1="88" y1="176" x2="88" y2="152" marker-end="url(#a)"/><text class="m" x="88" y="98">revestimento</text></g>
<g id="cota-t-total" class="cota"><line class="e" x1="108" y1="130" x2="50" y2="130"/><line class="e" x1="108" y1="242" x2="50" y2="242"/><line class="d" x1="56" y1="130" x2="56" y2="242" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="42" y="186" transform="rotate(-90 42 186)">espessura total</text></g>
<g id="cota-t-base" class="cota"><line class="e" x1="332" y1="152" x2="360" y2="152"/><line class="e" x1="332" y1="242" x2="360" y2="242"/><line class="d" x1="354" y1="152" x2="354" y2="242" marker-start="url(#a)" marker-end="url(#a)"/><text class="" x="364" y="202">metal de base</text></g>
<text class="n b" x="500" y="70">ensaio de cisalhamento da interface</text>
<rect class="s" x="560" y="140" width="110" height="150"/><rect class="r" x="670" y="140" width="22" height="70"/>
<rect x="530" y="290" width="200" height="12" fill="url(#hach)" stroke="#666" stroke-width="1.6"/><text class="n m" x="630" y="322">apoio</text>
<line class="d" style="stroke-width:2" x1="681" y1="92" x2="681" y2="136" marker-end="url(#a)"/><text class="b" x="692" y="110">P</text>
<text class="n" x="700" y="180">revestimento</text><text class="n m" x="615" y="220">base</text>
<text class="n m" x="630" y="350">o revestimento é empurrado</text><text class="n m" x="630" y="368">ao longo da interface</text>
<text class="n b" x="850" y="70">ultrassom da aderência</text>
<rect class="r" x="860" y="170" width="250" height="16"/><rect class="s" x="860" y="186" width="250" height="70"/>
<rect class="sl" x="900" y="146" width="36" height="24"/><text class="n" x="944" y="162">cabeçote</text>
<rect class="w" x="1010" y="183" width="54" height="6"/><line class="e" x1="1037" y1="190" x2="1037" y2="276"/><text class="n m" x="1037" y="292">região sem aderência</text>
<text class="n" x="860" y="330">visual ou ultrassom (SA-578),</text><text class="n" x="860" y="348">conforme a espessura total</text>
<text class="n" x="20" y="406">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
