<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Guarda-corpo em PRFV — tubo-calço na fixação em aba de viga e furo para lacre">
<title>Guarda-corpo em PRFV — tubo-calço na fixação em aba de viga e furo para lacre (esquema ilustrativo)</title>
