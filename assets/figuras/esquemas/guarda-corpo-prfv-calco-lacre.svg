<text x="200" y="60" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">fixação em aba de viga (corte)</text>
<line x1="60" y1="260" x2="340" y2="260" stroke="#666" stroke-width="6" stroke-linecap="round"/>
<line x1="200" y1="260" x2="200" y2="360" stroke="#666" stroke-width="5" stroke-linecap="round"/>
