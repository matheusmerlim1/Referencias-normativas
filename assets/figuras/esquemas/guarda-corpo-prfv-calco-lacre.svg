<line x1="140" y1="200" x2="140" y2="300" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
<g id="cota-tubo-calco" class="cota"><line x1="250.0" y1="320.0" x2="152.0" y2="286.0" stroke="#666" stroke-width="1.2"/><polygon points="152.0,286.0 161.7,285.6 159.4,292.3" fill="#666"/><text x="254.0" y="324.0" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">tubo-calço (Ø)</text></g>
<text x="580" y="60" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">furo para lacre</text>
<rect x="480" y="160" width="200" height="120" rx="0" fill="#999" fill-opacity="0.25" stroke="#666" stroke-width="2"/>
<circle cx="640" cy="190" r="8" fill="#fff" fill-opacity="0.25" stroke="#666" stroke-width="1.5"/>
