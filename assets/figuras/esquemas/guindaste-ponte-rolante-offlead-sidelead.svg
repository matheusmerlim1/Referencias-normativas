<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 650" width="860" height="650" role="img" aria-label="Offlead e sidelead na ponta da lança — içamento offboard (DNV 2.22 / ABS)">
<title>Offlead e sidelead na ponta da lança — içamento offboard (DNV 2.22 / ABS)</title>
<style>
.o{stroke:#666;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.k{stroke:#666;stroke-width:3;fill:none;stroke-linecap:round}
.f{fill:#999;fill-opacity:.25;stroke:#666;stroke-width:1.6}
.w{fill:#999;fill-opacity:.08;stroke:#666;stroke-width:1.6}
.h{fill:url(#hz);stroke:#666;stroke-width:1.4}
.c{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:12 4 2 4}
.x{stroke:#666;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
.t{stroke:#666;stroke-width:1.1;fill:none}
.dim{stroke:#666;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
.ar{stroke:#666;stroke-width:2;fill:none;marker-end:url(#a)}
.r{stroke:#666;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round}
text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333;stroke:#fff;stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.s{font-size:11.5px}.b{font-weight:bold}.ti{font-size:15px;font-weight:bold}.n{font-size:11px;font-style:italic}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#666"/></marker>
<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern>
</defs>
<text class="ti" x="12.0" y="24.0" text-anchor="start">Offlead e sidelead na ponta da lança — içamento offboard (DNV 2.22 / ABS)</text>
<rect class="f" x="100" y="250" width="40" height="180" />
<line class="o" x1="40.0" y1="430.0" x2="330.0" y2="430.0" />
<text class="s" x="150.0" y="450.0" text-anchor="start">convés do guindaste</text>
<line class="o" x1="140.0" y1="250.0" x2="470.0" y2="80.0" style="stroke-width:7"/>
<circle class="f" cx="140.0" cy="250.0" r="6" />
<circle class="w" cx="470.0" cy="80.0" r="9" />
<line class="c" x1="470.0" y1="89.0" x2="470.0" y2="470.0" />
<line class="k" x1="470.0" y1="89.0" x2="515.0" y2="420.0" />
<rect class="f" x="495" y="420" width="44" height="30" />
<path class="f" d="M380,470 L620,470 L600,500 L400,500 Z" />
<text class="s" x="500.0" y="520.0" text-anchor="middle">convés do supply</text>
<text class="s" x="512.0" y="340.0" text-anchor="start">cabo inclinado: offlead</text>
<text class="s" x="512.0" y="356.0" text-anchor="start">(no plano da lança)</text>
<g id="cota-Htip" class="cota"><line class="t" x1="479.0" y1="80.0" x2="668.0" y2="80.0" /><line class="t" x1="620.0" y1="470.0" x2="668.0" y2="470.0" /><line class="dim" x1="660.0" y1="80.0" x2="660.0" y2="470.0" /><text x="654.0" y="290.0" text-anchor="end" font-size="13px">Htip</text></g>
<line class="t" x1="134.0" y1="250.0" x2="70.0" y2="250.0" />
<g id="cota-HW" class="cota"><line class="t" x1="380.0" y1="470.0" x2="60.0" y2="470.0" /><line class="t" x1="462.0" y1="80.0" x2="60.0" y2="80.0" /><line class="dim" x1="88.0" y1="250.0" x2="88.0" y2="470.0" /><text x="82.0" y="370.0" text-anchor="end" font-size="13px">HW</text></g>
<g id="cota-Lvert" class="cota"><line class="dim" x1="78.0" y1="80.0" x2="78.0" y2="250.0" /><text x="72.0" y="170.0" text-anchor="end" font-size="13px">Lvert</text></g>
<line class="c" x1="120.0" y1="250.0" x2="120.0" y2="45.0" />
<g id="cota-r" class="cota"><line class="dim" x1="120.0" y1="52.0" x2="470.0" y2="52.0" /><text x="295.0" y="45.0" text-anchor="middle" font-size="13px">r (raio)</text></g>
<text class="b" x="250.0" y="545.0" text-anchor="middle">Elevação</text>
<circle class="f" cx="770.0" cy="420.0" r="20" />
<line class="o" x1="770.0" y1="420.0" x2="770.0" y2="200.0" style="stroke-width:7"/>
<line class="ar" x1="770.0" y1="200.0" x2="770.0" y2="135.0" />
<line class="ar" x1="770.0" y1="200.0" x2="838.0" y2="200.0" />
<text class="s" x="762.0" y="150.0" text-anchor="end">offlead</text>
<text class="s" x="776.0" y="225.0" text-anchor="start">sidelead</text>
<text class="b" x="770.0" y="470.0" text-anchor="middle">Planta</text>
<text class="b" x="20.0" y="570.0" text-anchor="start" font-size="12px">DNV 2.22 Sec.6 2.3.1: side lead = (W/100)·[2.5 + 0.1·r·n + Hsign]; off lead = maior de (W/1 000)·n²·r e ψ·W·(2.5 + 1.5 Hsign)/(HW + Lvert)</text>
<text class="b" x="20.0" y="590.0" text-anchor="start" font-size="12px">ABS 2-2/9.3.2: HLSV.offlead = VDL·fSV; HLSV.side = 0.5·HLSV.offlead; fSV = (2.5 + 1.5 × Hsig)/Htip, não maior que 0.30</text>
<text class="b" x="20.0" y="610.0" text-anchor="start" font-size="12px">ABS: carga lateral mínima total na ponta da lança não menor que 0.02 × VDL</text>
<text class="n" x="850" y="642" text-anchor="end">Esquema ilustrativo, fora de escala (não é desenho da norma) — valores transcritos da ficha</text>
</svg>
