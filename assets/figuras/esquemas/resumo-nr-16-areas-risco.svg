1="200" x2="334" y2="208" stroke="#666" stroke-width="1"/><line x1="354" y1="200" x2="346" y2="208" stroke="#666" stroke-width="1"/><line x1="366" y1="200" x2="358" y2="208" stroke="#666" stroke-width="1"/><line x1="378" y1="200" x2="370" y2="208" stroke="#666" stroke-width="1"/>
