<g id="cota-faixa" class="cota"><line x1="890" y1="205" x2="890" y2="270" stroke="#666" stroke-width="1"/><line x1="940" y1="245" x2="940" y2="270" stroke="#666" stroke-width="1"/><line x1="890" y1="270" x2="940" y2="270" stroke="#666" stroke-width="1.2"/><polygon points="890.0,270.0 899.0,266.5 899.0,273.5" fill="#666"/><polygon points="940.0,270.0 931.0,273.5 931.0,266.5" fill="#666"/><text x="915.0" y="264" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">faixa</text></g>
<text x="500" y="315" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(d) operação no cais — a partir da beira do cais, ao longo da embarcação</text>
<rect x="60" y="335" width="380" height="50" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="250" y="365" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">cais</text>
<line x1="440" y1="320" x2="440" y2="400" stroke="#666" stroke-width="2"/>
<path d="M640,345 L900,345 L930,365 L900,385 L640,385 Z" fill="#666" fill-opacity="0.1" stroke="#666" stroke-width="1.5"/>
<text x="785" y="370" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">embarcação</text>
<g id="cota-cais" class="cota"><line x1="440" y1="385" x2="440" y2="415" stroke="#666" stroke-width="1"/><line x1="640" y1="385" x2="640" y2="415" stroke="#666" stroke-width="1"/><line x1="440" y1="415" x2="640" y2="415" stroke="#666" stroke-width="1.2"/><polygon points="440.0,415.0 449.0,411.5 449.0,418.5" fill="#666"/><polygon points="640.0,415.0 631.0,418.5 631.0,411.5" fill="#666"/><text x="540.0" y="409" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">faixa a partir da beira do cais</text></g>
<text x="12" y="442" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
