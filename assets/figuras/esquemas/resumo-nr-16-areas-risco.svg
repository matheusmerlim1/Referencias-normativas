<text x="530" y="55" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) círculo em volta do ponto</text>
<circle cx="530" cy="165" r="85" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="530" cy="165" r="6" fill="#666" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
