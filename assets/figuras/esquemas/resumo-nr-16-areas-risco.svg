<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Áreas de risco — explosivos e inflamáveis">
<title>Áreas de risco — explosivos e inflamáveis (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Áreas de risco — explosivos e inflamáveis</text>
<text x="190" y="55" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) explosivos — distância de segurança</text>
<rect x="60" y="150" width="70" height="50" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
