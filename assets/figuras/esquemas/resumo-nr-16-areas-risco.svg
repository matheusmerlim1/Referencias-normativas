<g id="cota-raio" class="cota"><line x1="530" y1="165" x2="590" y2="225" stroke="#666" stroke-width="1.2"/><polygon points="590.0,225.0 581.2,221.1 586.1,216.2" fill="#666"/><text x="595" y="240" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">raio</text></g>
<text x="820" y="55" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) faixa em volta da área de operação</text>
<rect x="700" y="85" width="240" height="160" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="750" y="125" width="140" height="80" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
