<text x="390" y="350" text-anchor="middle" font-size="1" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round"></text>
<rect x="90" y="170" width="120" height="150" rx="0" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="150" y="250" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">entrada /</text>
<text x="150" y="264" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">distribuição</text>
