<g id="cota-distancia-placas" class="cota"><line x1="332" y1="212" x2="358" y2="212" stroke="#666" stroke-width="1.2"/><polygon points="332.0,212.0 341.0,215.5 341.0,208.5" fill="#666"/><polygon points="358.0,212.0 349.0,208.5 349.0,215.5" fill="#666"/><text x="345" y="110" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">distância entre placas</text></g>
<line x1="345" y1="112" x2="345" y2="205" stroke="#666" stroke-width="0.8" stroke-dasharray="2 2"/>
<g id="cota-inclinacao" class="cota"><path d="M330.0,320.0 A50,50 0 0 0 302.7,275.4" fill="none" stroke="#666" stroke-width="1.2"/><text x="215" y="362" text-anchor="start" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">inclinação das placas</text></g>
<line x1="280" y1="320" x2="350" y2="320" stroke="#666" stroke-width="1"/>
<text x="870" y="140" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(planta)</text>
<rect x="830" y="160" width="90" height="180" rx="0" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="1.5"/>
<g id="cota-largura" class="cota"><line x1="830" y1="340" x2="830" y2="365" stroke="#666" stroke-width="1"/><line x1="920" y1="340" x2="920" y2="365" stroke="#666" stroke-width="1"/><line x1="830" y1="365" x2="920" y2="365" stroke="#666" stroke-width="1.2"/><polygon points="830.0,365.0 839.0,368.5 839.0,361.5" fill="#666"/><polygon points="920.0,365.0 911.0,361.5 911.0,368.5" fill="#666"/><text x="875.0" y="359.0" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">largura</text></g>
<text x="500" y="450" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">canais em paralelo; área de escoamento, tempo de residência e nº de Reynolds definidos no projeto</text>
<text x="12" y="512" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
