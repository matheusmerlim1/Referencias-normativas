<title>Separador de placas água-óleo — canais, pacote de placas inclinadas e poços (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Separador de placas água-óleo — canais, pacote de placas inclinadas e poços</text>
<rect x="60" y="120" width="700" height="220" rx="0" fill="#666" fill-opacity="0.06" stroke="#666" stroke-width="2"/>
<line x1="60" y1="170" x2="760" y2="170" stroke="#666" stroke-width="1" stroke-dasharray="6 3"/>
