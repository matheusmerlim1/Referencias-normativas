<text class="n" x="20" y="552">DN = diâmetro nominal do tubo em mm (2.2); t = faixa de espessura de parede do tubo soldado ao pescoço (A.1/A.2). Demais cotas: esquema do perfil L-005 WN.</text>
<text class="n" x="20" y="570">Esquema ilustrativo, fora de escala (não é desenho da norma) — rótulos = colunas das tabelas da ficha</text>
