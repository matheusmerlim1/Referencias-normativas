<rect class="wd" x="180" y="105" width="10" height="140"/>
<rect class="wd" x="190" y="105" width="10" height="140"/>
<text class="n" x="60" y="262">flange principal</text>
<rect class="s" x="640" y="112" width="40" height="126"/>
