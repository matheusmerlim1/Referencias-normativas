<rect class="sl" x="104" y="464" width="156" height="6"/>
<polygon class="wd" points="180,440 190,446 180,446"/>
<polygon class="wd" points="180,470 190,464 180,464"/>
<text class="n" x="196" y="436">tubo</text>
