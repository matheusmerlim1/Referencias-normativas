<text class="n" x="400" y="560">amostras de tubo removido</text>
<rect class="sl" x="400" y="570" width="50" height="12"/>
<rect class="sl" x="480" y="570" width="50" height="12"/>
<rect class="sl" x="560" y="570" width="50" height="12"/>
<g id="cota-amostra-tubo" class="cota"><line class="e" x1="400" y1="586" x2="400" y2="606"/><line class="e" x1="450" y1="586" x2="450" y2="606"/><line class="d" x1="400" y1="600" x2="450" y2="600" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="400" y="622">comprimento da amostra</text></g>
<text class="b" x="640" y="350">(d) Cabeçote flutuante — anel bipartido</text>
<path class="g" d="M700,450 A70,70 0 0,1 840,450"/>
<path class="g" d="M700,450 A70,70 0 0,0 840,450"/>
<path class="g" d="M712,450 A58,58 0 0,1 828,450"/>
<path class="g" d="M712,450 A58,58 0 0,0 828,450"/>
<rect class="r" x="690" y="442" width="36" height="16"/>
<rect class="r" x="814" y="442" width="36" height="16"/>
<g id="cota-atracacao" class="cota"><line class="e" x1="690" y1="458" x2="690" y2="560"/><line class="d" x1="670" y1="442" x2="670" y2="458" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="640" y="580">espessura da chapa de atracação</text></g>
<text class="n" x="20" y="678">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
