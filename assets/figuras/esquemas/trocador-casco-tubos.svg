<g id="cota-afastamento-expansao" class="cota"><line class="e" x1="126" y1="476" x2="126" y2="510"/><line class="e" x1="146" y1="476" x2="146" y2="510"/><line class="d" x1="126" y1="500" x2="146" y2="500" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="136" y1="510" x2="100" y2="580"/><text class="n b" x="20" y="596">afastamento da expansão</text></g>
<g id="cota-comprimento-expandido" class="cota"><line class="d" x1="146" y1="488" x2="180" y2="488" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="190" y="630">comprimento expandido</text><line class="e" x1="163" y1="490" x2="200" y2="616"/></g>
<text class="n" x="20" y="436">lado dos tubos</text>
