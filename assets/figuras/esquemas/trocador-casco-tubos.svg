<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" width="920" height="690" role="img" aria-label="Trocador casco e tubo — componentes e detalhes de projeto">
<title>Trocador casco e tubo — componentes e detalhes de projeto (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
