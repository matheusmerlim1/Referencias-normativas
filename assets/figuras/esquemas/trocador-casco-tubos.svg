<g id="cota-espessura-casco" class="cota"><line class="d" x1="610" y1="120" x2="610" y2="134" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="600" y1="134" x2="630" y2="134"/><text class="n b" x="616" y="150">espessura do casco</text></g>
<polygon class="s" points="230,230 290,230 300,280 220,280"/>
<polygon class="s" points="490,230 550,230 560,280 480,280"/>
<g id="cota-furo-sela" class="cota"><circle class="w" cx="260" cy="236" r="3"/><line class="e" x1="260" y1="236" x2="300" y2="256"/><text x="304" y="262">furo de suspiro da sela</text></g>
<line class="g" x1="80" y1="280" x2="720" y2="280"/>
</g>
<text class="b" x="20" y="350">(b) Ligação tubo-espelho</text>
