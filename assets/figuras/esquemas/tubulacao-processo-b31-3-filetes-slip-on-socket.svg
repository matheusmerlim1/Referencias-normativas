<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-label="Soldas de filete (ASME B31.3) — tamanho/garganta, flange slip-on e solda de encaixe (socket)">
<title>Soldas de filete (ASME B31.3) — tamanho/garganta, flange slip-on e solda de encaixe (socket) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Soldas de filete (ASME B31.3) — tamanho/garganta, flange slip-on e solda de encaixe (socket)</text>
<text class="b" x="40" y="70">(a) Tamanho do filete</text>
<rect class="s" x="60" y="260" width="240" height="26"/>
<rect class="s" x="60" y="120" width="26" height="140"/>
<path class="r" d="M86,260 L166,260 L86,180 z"/>
<g id="cota-perna" class="cota"><line class="e" x1="86" y1="263" x2="86" y2="316"/><line class="e" x1="166" y1="263" x2="166" y2="316"/><line class="d" x1="86" y1="310" x2="166" y2="310" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="126" y="328">perna (tamanho)</text></g>
<g id="cota-garganta" class="cota"><line class="d" x1="86" y1="260" x2="126" y2="220" marker-start="url(#a)" marker-end="url(#a)"/><text x="150" y="200">garganta</text></g>
<text class="b" x="340" y="70">(b) Flange slip-on (frente e verso)</text>
<rect class="s" x="360" y="110" width="60" height="220"/>
<rect class="sl" x="420" y="190" width="200" height="30"/>
<path class="r" d="M420,190 L450,190 L420,160 z"/>
<path class="r" d="M392,220 L392,190 L392,190 z"/>
<g id="cota-xmin" class="cota"><line class="e" x1="423" y1="160" x2="486" y2="160"/><line class="e" x1="423" y1="190" x2="486" y2="190"/><line class="d" x1="480" y1="160" x2="480" y2="190" marker-start="url(#a)" marker-end="url(#a)"/><text x="480" y="150">xmin</text></g>
<g id="cota-T-slip" class="cota"><line class="e" x1="603" y1="190" x2="631" y2="190"/><line class="e" x1="603" y1="220" x2="631" y2="220"/><line class="d" x1="625" y1="190" x2="625" y2="220" marker-start="url(#a)" marker-end="url(#a)"/><text x="632" y="210">T (parede)</text></g>
<g id="cota-folga-slip" class="cota"><line class="d" x1="334" y1="204" x2="360" y2="204" marker-end="url(#a)"/><line class="d" x1="418" y1="204" x2="392" y2="204" marker-end="url(#a)"/><line class="d" x1="360" y1="204" x2="392" y2="204"/><text class="m" x="330" y="360">recuo da face</text></g>
<text class="b" x="660" y="70">(c) Solda de encaixe (socket)</text>
<rect class="s" x="680" y="120" width="220" height="40"/>
<rect class="s" x="680" y="230" width="220" height="40"/>
<rect class="sl" x="740" y="160" width="200" height="70"/>
<path class="r" d="M740,160 L720,160 L740,140 z"/>
<g id="cota-Cx" class="cota"><line class="e" x1="720" y1="157" x2="720" y2="114"/><line class="e" x1="740" y1="157" x2="740" y2="114"/><line class="d" x1="694" y1="120" x2="720" y2="120" marker-end="url(#a)"/><line class="d" x1="766" y1="120" x2="740" y2="120" marker-end="url(#a)"/><line class="d" x1="720" y1="120" x2="740" y2="120"/><text class="en" x="700" y="110">Cx</text></g>
<g id="cota-folga-socket" class="cota"><line class="d" x1="680" y1="194" x2="740" y2="194" marker-start="url(#a)" marker-end="url(#a)"/><text x="680" y="330">folga antes de soldar</text></g>
<g id="cota-Tw" class="cota"><line class="d" x1="901" y1="160" x2="901" y2="230" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="860" y="310">T̄w (parede do tubo)</text></g>
<text class="n" x="20" y="548">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
