<path d="M760,140 L780,110 L790,140 L815,120 L805,150 L830,160 L800,170 L810,195 L785,180 L770,205 L765,175 L740,180 L755,160 Z" fill="#666" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
