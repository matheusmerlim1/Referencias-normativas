<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Passagem do cabo — tambor, polia sem inversão e polia com inversão (curva em S)">
<title>Passagem do cabo — tambor, polia sem inversão e polia com inversão (curva em S) (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Passagem do cabo — tambor, polia sem inversão e polia com inversão (curva em S)</text>
<circle class="sl" cx="120" cy="150" r="55"/>
<text class="n m" x="120" y="240">tambor</text>
<line x1="175" y1="150" x2="175" y2="330" stroke="#666" stroke-width="3" stroke-linecap="round"/>
<circle class="sl" cx="400" cy="150" r="50"/>
<line x1="350" y1="150" x2="350" y2="330" stroke="#666" stroke-width="3" stroke-linecap="round"/>
<line x1="450" y1="150" x2="450" y2="330" stroke="#666" stroke-width="3" stroke-linecap="round"/>
<path d="M350,150 A50,50 0 0 1 450,150" fill="none" stroke="#666" stroke-width="3"/>
<text class="n m" x="400" y="240">polia sem inversão</text>
<circle class="sl" cx="660" cy="130" r="40"/>
<circle class="sl" cx="740" cy="250" r="40"/>
<path d="M620,130 A40,40 0 0 1 700,130 L700,250 A40,40 0 0 0 780,250 L780,350" fill="none" stroke="#666" stroke-width="3"/>
<line x1="620" y1="130" x2="620" y2="350" stroke="#666" stroke-width="3" stroke-linecap="round"/>
<text class="n m" x="700" y="330">polia com inversão</text>
<text class="n m" x="440" y="400">cada elemento soma ao número de enrolamentos que define o coeficiente H2</text>
<text class="n" x="20" y="428">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
