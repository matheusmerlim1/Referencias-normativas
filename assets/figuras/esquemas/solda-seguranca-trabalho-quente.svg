<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Soldagem e corte — altura de cabos e raio do observador">
<title>Soldagem e corte — altura de cabos e raio do observador (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Soldagem e corte — altura de cabos e raio do observador</text>
<text class="b" x="30" y="62">(a) Cabos de solda aéreos</text>
<line class="g" x1="40" y1="460" x2="460" y2="460"/>
<rect class="w" x="60" y="400" width="60" height="60"/>
<text class="m n" x="90" y="480">máquina</text>
<path class="d" d="M120,410 L150,410 L150,250 L420,250 L420,180"/>
<path class="d" d="M150,300 L300,300" stroke-dasharray="6 4"/>
<g id="cota-cabo-pedestres" class="cota"><line class="e" x1="240" y1="300" x2="214" y2="300"/><line class="e" x1="240" y1="460" x2="214" y2="460"/><line class="d" x1="220" y1="300" x2="220" y2="460" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="212" y="390">pessoas</text></g>
<g id="cota-cabo-veiculos" class="cota"><line class="e" x1="400" y1="250" x2="374" y2="250"/><line class="e" x1="400" y1="460" x2="374" y2="460"/><line class="d" x1="380" y1="250" x2="380" y2="460" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="372" y="360">veículos</text></g>
<circle class="w" cx="260" cy="420" r="10"/><line class="g" x1="260" y1="430" x2="260" y2="460"/>
<rect class="w" x="400" y="410" width="50" height="40"/>
<text class="b" x="480" y="62">(b) Observador de trabalho a quente</text>
<circle class="h" cx="690" cy="300" r="170"/>
<path class="r" d="M680,300 l10,-20 l10,20 z"/>
<text class="m n" x="690" y="330">solda/corte</text>
<g id="cota-raio-observador" class="cota"><line class="d" x1="690" y1="300" x2="860" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="775" y="292">raio vigiado</text></g>
<rect class="w" x="560" y="160" width="20" height="60" rx="8"/><rect class="w" x="590" y="160" width="20" height="60" rx="8"/>
<text class="n" x="560" y="150">cilindros em pé e presos</text>
<text class="n" x="480" y="520">vigiar também depois do fim do trabalho</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
