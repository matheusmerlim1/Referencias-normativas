<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" role="img" aria-label="Olhal tipo 2 — trecho efetivo da solda da chapa de reforço">
<title>Olhal tipo 2 — trecho efetivo da solda da chapa de reforço (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Olhal tipo 2 — trecho efetivo da solda da chapa de reforço</text>
<circle class="s" cx="250" cy="230" r="160"/>
<circle class="sl" cx="250" cy="230" r="120"/>
<circle class="w" cx="250" cy="230" r="45"/>
<path d="M146.1,290 A120,120 0 1 1 353.9,290" fill="none" stroke="#444" stroke-width="7" stroke-opacity=".6"/>
<g id="cota-Leff" class="cota"><path class="d" d="M127,301 A142,142 0 1,1 373,301" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="250" y="53">L_eff (trecho de solda considerado)</text></g>
<g id="cota-Rb" class="cota"><line class="d" x1="280" y1="265" x2="310" y2="333.9" marker-end="url(#a)"/><text class="m" x="280" y="270">Rb</text></g>
<line class="d" x1="250" y1="280" x2="250" y2="420" marker-end="url(#a)"/>
<text class="n m" x="250" y="440">força P (direção da lingada)</text>
<text class="n" x="470" y="120">chapa principal tp + 2 chapas de reforço tc;</text>
<text class="n" x="470" y="138">a força de cada chapa de reforço passa pela</text>
<text class="n" x="470" y="156">solda de filete no contorno de raio Rb;</text>
<text class="n" x="470" y="174">só parte da circunferência conta como efetiva</text>
<text class="n" x="470" y="192">(o lado oposto à carga)</text>
<text class="n" x="20" y="488">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
