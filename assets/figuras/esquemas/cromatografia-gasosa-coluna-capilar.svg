<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Cromatografia gasosa — injetor com divisor, coluna capilar, forno programado e detector FID">
<title>Cromatografia gasosa — injetor com divisor, coluna capilar, forno programado e detector FID (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Cromatografia gasosa — injetor com divisor, coluna capilar, forno programado e detector FID</text>
<text x="330" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) cromatógrafo</text>
<rect x="220" y="90" width="260" height="220" fill="#666" fill-opacity="0.08" stroke="#666" stroke-width="2"/>
<text x="350" y="110" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">forno (rampas de temperatura)</text>
<circle cx="350" cy="210" r="40" fill="none" fill-opacity="0" stroke="#666" stroke-width="1.5"/>
<circle cx="350" cy="210" r="55" fill="none" fill-opacity="0" stroke="#666" stroke-width="1.5"/>
<circle cx="350" cy="210" r="70" fill="none" fill-opacity="0" stroke="#666" stroke-width="1.5"/>
<rect x="150" y="70" width="60" height="40" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="180" y="62" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">injetor (split)</text>
<line x1="210" y1="90" x2="280" y2="180" stroke="#666" stroke-width="1.5"/>
<line x1="180" y1="70" x2="180" y2="40" stroke="#666" stroke-width="1.5"/>
<text x="186" y="44" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">amostra (μL)</text>
<line x1="150" y1="90" x2="100" y2="90" stroke="#666" stroke-width="1.5"/>
<text x="96" y="94" text-anchor="end" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">divisor de fluxo</text>
<rect x="490" y="70" width="60" height="40" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="520" y="62" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">detector FID</text>
<line x1="420" y1="180" x2="490" y2="90" stroke="#666" stroke-width="1.5"/>
<line x1="520" y1="110" x2="520" y2="150" stroke="#666" stroke-width="1"/>
<text x="528" y="140" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">H₂ + ar + make-up</text>
<line x1="40" y1="140" x2="150" y2="95" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="40" y="160" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">gás de arraste (H₂)</text>
<rect x="220" y="330" width="120" height="40" fill="#666" fill-opacity="0.2" stroke="#666" stroke-width="1.5"/>
<text x="280" y="354" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">válvula criogênica</text>
<g id="cota-comprimento-coluna" class="cota"><line x1="350" y1="280" x2="350" y2="286" stroke="#666" stroke-width="1"/><circle cx="350" cy="280" r="3" fill="#666"/><text x="350" y="290" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">comprimento da coluna (enrolada)</text></g>
<text x="780" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) corte da coluna capilar</text>
<circle cx="780" cy="210" r="110" fill="#c96" fill-opacity="0.25" stroke="#666" stroke-width="2"/>
<circle cx="780" cy="210" r="92" fill="#8a8" fill-opacity="0.5" stroke="#666" stroke-width="1"/>
<circle cx="780" cy="210" r="84" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1"/>
<text x="780" y="195" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">gás de arraste</text>
<g id="cota-diametro-interno" class="cota"><line x1="696" y1="210" x2="696" y2="210" stroke="#666" stroke-width="1"/><line x1="864" y1="210" x2="864" y2="210" stroke="#666" stroke-width="1"/><line x1="696" y1="210" x2="864" y2="210" stroke="#666" stroke-width="1.2"/><polygon points="696.0,210.0 705.0,213.5 705.0,206.5" fill="#666"/><polygon points="864.0,210.0 855.0,206.5 855.0,213.5" fill="#666"/><text x="780" y="240" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø interno</text></g>
<g id="cota-espessura-fase" class="cota"><line x1="864" y1="170" x2="864" y2="170" stroke="#666" stroke-width="1"/><line x1="872" y1="170" x2="872" y2="170" stroke="#666" stroke-width="1"/><line x1="864" y1="170" x2="872" y2="170" stroke="#666" stroke-width="1.2"/><polygon points="864.0,170.0 873.0,173.5 873.0,166.5" fill="#666"/><polygon points="872.0,170.0 863.0,166.5 863.0,173.5" fill="#666"/><text x="902" y="150" text-anchor="start" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">filme da fase</text></g>
<line x1="872" y1="170" x2="900" y2="154" stroke="#666" stroke-width="1"/>
<text x="780" y="345" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sílica fundida com fase de metilsilicone</text>
<text x="330" y="420" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) filtro de linha dos gases comerciais</text>
<rect x="150" y="440" width="360" height="40" fill="#666" fill-opacity="0.05" stroke="#666" stroke-width="1.5"/>
<rect x="150" y="440" width="120" height="40" fill="#9cf" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="210" y="465" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">1/3 sílica-gel</text>
<rect x="270" y="440" width="240" height="40" fill="#cc9" fill-opacity="0.4" stroke="#666" stroke-width="1.5"/>
<text x="390" y="465" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">2/3 peneira molecular 5 Å</text>
<circle cx="170" cy="450" r="3" fill="#36c" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<circle cx="190" cy="450" r="3" fill="#36c" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<circle cx="230" cy="450" r="3" fill="#36c" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<circle cx="250" cy="450" r="3" fill="#36c" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<g id="cota-granulo-silica" class="cota"><line x1="160" y1="490" x2="160" y2="490" stroke="#666" stroke-width="1"/><line x1="175" y1="490" x2="175" y2="490" stroke="#666" stroke-width="1"/><line x1="160" y1="490" x2="175" y2="490" stroke="#666" stroke-width="1.2"/><polygon points="160.0,490.0 169.0,493.5 169.0,486.5" fill="#666"/><polygon points="175.0,490.0 166.0,486.5 166.0,493.5" fill="#666"/><text x="168" y="512" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">grânulo</text></g>
<text x="700" y="440" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Picos identificados pelo tempo de retenção;</text>
<text x="700" y="458" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">grupos PIANO somados por nº de carbonos</text>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
