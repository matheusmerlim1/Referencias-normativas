<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 440" width="1150" height="440" role="img" aria-label="Chapa, folha e tira — bobina, espessura, largura, abaulamento e planicidade">
<title>Chapa, folha e tira — bobina, espessura, largura, abaulamento e planicidade (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .k{fill:none;stroke:#8c8c8c;stroke-width:10;stroke-linejoin:round;stroke-linecap:butt}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Chapa, folha e tira — bobina, espessura, largura, abaulamento e planicidade</text>
<text class="n b" x="40" y="70">tira ou folha em bobina</text>
<circle class="s" cx="150" cy="200" r="80"/><circle class="e" cx="150" cy="200" r="62"/><circle class="e" cx="150" cy="200" r="46"/><circle class="w" cx="150" cy="200" r="30"/>
<rect class="s" x="150" y="270" width="200" height="10"/><text class="n m" x="250" y="305">tira desbobinada</text>
<text class="n b" x="410" y="70">abaulamento (vista de cima)</text>
<path class="s" d="M420,120 Q590,90 760,120 L760,200 Q590,170 420,200 Z"/>
<line class="h" x1="420" y1="120" x2="760" y2="120"/><text class="n" x="430" y="140">régua reta</text>
<g id="cota-abaulamento" class="cota"><line class="d" x1="600" y1="81" x2="600" y2="105" marker-end="url(#a)"/><line class="d" x1="600" y1="144" x2="600" y2="120" marker-end="url(#a)"/><text class="" x="610" y="96">abaulamento</text></g>
<text class="n b" x="410" y="250">planicidade (vista lateral sobre mesa plana)</text>
<rect x="420" y="330" width="340" height="14" fill="url(#hach)" stroke="#666" stroke-width="1.6"/><text class="n m" x="590" y="366">mesa plana</text>
<path class="g" style="stroke-width:3" d="M420,328 Q462,300 505,328 T590,328 T675,328 T760,328"/>
<g id="cota-planicidade" class="cota"><line class="e" x1="444" y1="314" x2="482" y2="314"/><line class="d" x1="462" y1="290" x2="462" y2="314" marker-end="url(#a)"/><line class="d" x1="462" y1="352" x2="462" y2="328" marker-end="url(#a)"/><text class="" x="474" y="292">desvio de planicidade</text></g>
<text class="n b" x="800" y="70">seção transversal</text>
<rect class="s" x="800" y="170" width="200" height="24"/>
<g id="cota-t" class="cota"><line class="e" x1="1002" y1="170" x2="1030" y2="170"/><line class="e" x1="1002" y1="194" x2="1030" y2="194"/><line class="d" x1="1024" y1="146" x2="1024" y2="170" marker-end="url(#a)"/><line class="d" x1="1024" y1="218" x2="1024" y2="194" marker-end="url(#a)"/><text class="" x="1034" y="187">espessura t</text></g>
<g id="cota-largura" class="cota"><line class="e" x1="800" y1="196" x2="800" y2="240"/><line class="e" x1="1000" y1="196" x2="1000" y2="240"/><line class="d" x1="800" y1="234" x2="1000" y2="234" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="900" y="256">largura</text></g>
<text class="n" x="800" y="300">folha, tira e chapa: separadas por faixas</text><text class="n" x="800" y="318">de espessura e largura definidas na norma</text>
<text class="n" x="20" y="428">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
