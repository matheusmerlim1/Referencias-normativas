<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Teste de formação — coluna, intervalo e afastamentos na superfície">
<title>Teste de formação — coluna, intervalo e afastamentos na superfície (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .b2{fill:#2e86c1;fill-opacity:.22;stroke:#2e6f9e;stroke-width:1.6}
  .y{fill:#f1c40f;fill-opacity:.35;stroke:#b7950b;stroke-width:1.6}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Teste de formação — coluna, intervalo e afastamentos na superfície</text>
<text class="b" x="30" y="62">(a) Coluna de teste no poço</text>
<rect class="sl" x="160" y="90" width="80" height="460"/>
<rect class="w" x="185" y="90" width="30" height="300"/>
<rect class="r" x="165" y="300" width="70" height="20"/>
<text class="n" x="250" y="315">obturador (packer)</text>
<g id="cota-coluna-80m" class="cota"><line class="e" x1="185" y1="220" x2="144" y2="220"/><line class="e" x1="185" y1="300" x2="144" y2="300"/><line class="d" x1="150" y1="220" x2="150" y2="300" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="142" y="262">trecho da coluna</text></g>
<rect class="w" x="190" y="320" width="20" height="120"/>
<g id="cota-cauda" class="cota"><line class="e" x1="210" y1="320" x2="276" y2="320"/><line class="e" x1="210" y1="440" x2="276" y2="440"/><line class="d" x1="270" y1="320" x2="270" y2="440" marker-start="url(#a)" marker-end="url(#a)"/><text x="278" y="385">cauda de apoio</text></g>
<rect class="y" x="160" y="460" width="80" height="60"/>
<g id="cota-intervalo" class="cota"><line class="e" x1="240" y1="460" x2="276" y2="460"/><line class="e" x1="240" y1="520" x2="276" y2="520"/><line class="d" x1="270" y1="460" x2="270" y2="520" marker-start="url(#a)" marker-end="url(#a)"/><text x="278" y="495">intervalo testado</text></g>
<g id="cota-poco-aberto" class="cota"><line class="e" x1="160" y1="400" x2="134" y2="400"/><line class="e" x1="160" y1="550" x2="134" y2="550"/><line class="d" x1="140" y1="400" x2="140" y2="550" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="132" y="480">poço aberto</text></g>
<text class="b" x="450" y="62">(b) Superfície — sonda terrestre</text>
<circle class="h" cx="600" cy="330" r="200"/>
<rect class="w" x="590" y="320" width="20" height="20"/>
<text class="m n" x="600" y="360">cabeça do poço</text>
<g id="cota-area-controlada" class="cota"><line class="d" x1="600" y1="330" x2="800" y2="330" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="700" y="322">raio da área controlada</text></g>
<path class="r" d="M600,190 l10,-25 l10,25 z"/>
<g id="cota-queimador" class="cota"><line class="e" x1="600" y1="190" x2="574" y2="190"/><line class="e" x1="600" y1="320" x2="574" y2="320"/><line class="d" x1="580" y1="190" x2="580" y2="320" marker-start="url(#a)" marker-end="url(#a)"/><text class="en" x="572" y="250">queimador × poço</text></g>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
