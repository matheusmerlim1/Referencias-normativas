<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Tubo (ASME B36.10M) — Ø externo, Ø interno e espessura de parede t">
<title>Tubo (ASME B36.10M) — Ø externo, Ø interno e espessura de parede t (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Tubo (ASME B36.10M) — Ø externo, Ø interno e espessura de parede t</text>
<circle class="s" cx="220" cy="230" r="150"/>
<circle class="w" cx="220" cy="230" r="120"/>
<line class="c" x1="50" y1="230" x2="390" y2="230"/>
<line class="c" x1="220" y1="60" x2="220" y2="400"/>
<g id="cota-OD" class="cota"><line class="e" x1="70" y1="227" x2="70" y2="49"/><line class="e" x1="370" y1="227" x2="370" y2="49"/><line class="d" x1="70" y1="55" x2="370" y2="55" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="220" y="48">Ø ext. (OD)</text></g>
<line class="e" x1="70" y1="230" x2="70" y2="50"/>
<line class="e" x1="370" y1="230" x2="370" y2="50"/>
<g id="cota-ID" class="cota"><line class="d" x1="100" y1="270" x2="340" y2="270" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="220" y="264">Ø int. = Ø ext. − 2t</text></g>
<g id="cota-t" class="cota"><line class="d" x1="314" y1="170" x2="340" y2="170" marker-end="url(#a)"/><line class="d" x1="396" y1="170" x2="370" y2="170" marker-end="url(#a)"/><line class="d" x1="340" y1="170" x2="370" y2="170"/><text x="410" y="175">t</text></g>
<text class="n" x="480" y="140">Ø ext. fixo para cada NPS (todas as espessuras);</text>
<text class="n" x="480" y="162">t varia com o schedule (5, 10, 40, 80, 160…)</text>
<text class="n" x="480" y="184">ou com a designação STD / XS / XXS.</text>
<text class="n" x="480" y="214">Massa por metro calculada com t e Ø ext.</text>
<text class="n" x="20" y="428">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
</svg>
