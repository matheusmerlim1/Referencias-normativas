<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Sistema ininterrupto de energia (UPS) industrial — ramos principal e alternativo, chave estática e bypass">
<title>Sistema ininterrupto de energia (UPS) industrial — ramos principal e alternativo, chave estática e bypass (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Sistema ininterrupto de energia (UPS) industrial — ramos principal e alternativo, chave estática e bypass</text>
<text x="20" y="150" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ramo principal</text>
<line x1="20" y1="160" x2="120" y2="160" stroke="#666" stroke-width="2"/>
<rect x="120" y="130" width="110" height="60" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="175.0" y="164.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">retificador</text>
<line x1="230" y1="160" x2="330" y2="160" stroke="#666" stroke-width="2"/>
<rect x="330" y="130" width="110" height="60" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="385.0" y="164.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">inversor (PWM)</text>
<rect x="240" y="250" width="80" height="50" fill="#e5c000" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
