<line x1="280" y1="160" x2="280" y2="250" stroke="#666" stroke-width="2"/>
<text x="286" y="230" text-anchor="start" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">CC</text>
<line x1="440" y1="160" x2="540" y2="160" stroke="#666" stroke-width="2"/>
<rect x="540" y="130" width="120" height="60" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="600.0" y="164.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">chave estática</text>
<text x="20" y="80" text-anchor="start" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ramo alternativo</text>
<line x1="20" y1="90" x2="500" y2="90" stroke="#666" stroke-width="2"/>
<rect x="380" y="70" width="110" height="40" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="435.0" y="94.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">trafo isolação</text>
<line x1="490" y1="90" x2="600" y2="90" stroke="#666" stroke-width="2"/>
<line x1="600" y1="90" x2="600" y2="130" stroke="#666" stroke-width="2"/>
<line x1="660" y1="160" x2="760" y2="160" stroke="#666" stroke-width="2"/>
<rect x="760" y="130" width="110" height="60" fill="#3a6" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="815.0" y="164.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">carga crítica</text>
<path d="M20,330 L700,330 L700,190" fill="none" fill-opacity="0.12" stroke="#666" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="360" y="322" text-anchor="middle" font-size="9.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bypass manual de manutenção (MBP)</text>
<g id="cota-transferencia" class="cota"><line x1="600" y1="190" x2="600" y2="236" stroke="#666" stroke-width="1"/><circle cx="600" cy="190" r="3" fill="#666"/><text x="600" y="240" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">transferência sem interrupção (tempo máx.)</text></g>
<g id="cota-sobrecarga" class="cota"><line x1="600" y1="192" x2="600" y2="276" stroke="#666" stroke-width="1"/><circle cx="600" cy="192" r="3" fill="#666"/><text x="600" y="280" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">sobrecarga da chave estática (% × tempo)</text></g>
<text x="500" y="400" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) redundância em paralelo: N + R unidades (compartilhamento ativo de corrente)</text>
<rect x="250" y="420" width="140" height="50" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="320.0" y="449.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">UPS 1</text>
<rect x="420" y="420" width="140" height="50" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="490.0" y="449.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">UPS 2</text>
<rect x="590" y="420" width="140" height="50" fill="#666" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="660.0" y="449.0" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">UPS reserva (R)</text>
<line x1="250" y1="500" x2="790" y2="500" stroke="#666" stroke-width="3"/>
<text x="520" y="520" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">barramento de carga</text>
<line x1="320" y1="470" x2="320" y2="500" stroke="#666" stroke-width="2"/>
<line x1="490" y1="470" x2="490" y2="500" stroke="#666" stroke-width="2"/>
<line x1="660" y1="470" x2="660" y2="500" stroke="#666" stroke-width="2"/>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
