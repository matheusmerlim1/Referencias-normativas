<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="Documento de fornecedor — carimbo e retângulo reservado ao cliente">
<title>Documento de fornecedor — carimbo e retângulo reservado ao cliente (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Documento de fornecedor — carimbo e retângulo reservado ao cliente</text>
<rect x="80" y="60" width="840" height="460" fill="#666" fill-opacity="0.02" stroke="#666" stroke-width="1.5"/>
<rect x="100" y="75" width="800" height="430" fill="#666" fill-opacity="0.0" stroke="#666" stroke-width="1.5"/>
<text x="500" y="100" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">folha do documento (formato mínimo indicado na norma)</text>
<rect x="600" y="420" width="300" height="85" fill="#666" fill-opacity="0.12" stroke="#666" stroke-width="1.5"/>
<text x="750" y="465" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">carimbo / legenda do fabricante</text>
<rect x="700" y="360" width="190" height="50" fill="#666" fill-opacity="0.3" stroke="#666" stroke-width="1.5"/>
<text x="795" y="389" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">reservado ao cliente</text>
<g id="cota-retangulo-largura" class="cota"><line x1="700" y1="358" x2="700" y2="340" stroke="#666" stroke-width="1"/><line x1="890" y1="358" x2="890" y2="340" stroke="#666" stroke-width="1"/><line x1="700" y1="340" x2="890" y2="340" stroke="#666" stroke-width="1.2"/><polygon points="700.0,340.0 709.0,336.5 709.0,343.5" fill="#666"/><polygon points="890.0,340.0 881.0,343.5 881.0,336.5" fill="#666"/><text x="795.0" y="334" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">largura</text></g>
<g id="cota-retangulo-altura" class="cota"><line x1="698" y1="360" x2="680" y2="360" stroke="#666" stroke-width="1"/><line x1="698" y1="410" x2="680" y2="410" stroke="#666" stroke-width="1"/><line x1="680" y1="360" x2="680" y2="410" stroke="#666" stroke-width="1.2"/><polygon points="680.0,360.0 683.5,369.0 676.5,369.0" fill="#666"/><polygon points="680.0,410.0 676.5,401.0 683.5,401.0" fill="#666"/><text x="672" y="390" text-anchor="end" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">altura</text></g>
<text x="300" y="200" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">identificação: órgão, unidade, equipamento,</text>
<text x="300" y="218" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">nº da requisição e do pedido de compra</text>
<g id="cota-formato" class="cota"><line x1="80" y1="522" x2="80" y2="545" stroke="#666" stroke-width="1"/><line x1="920" y1="522" x2="920" y2="545" stroke="#666" stroke-width="1"/><line x1="80" y1="545" x2="920" y2="545" stroke="#666" stroke-width="1.2"/><polygon points="80.0,545.0 89.0,541.5 89.0,548.5" fill="#666"/><polygon points="920.0,545.0 911.0,548.5 911.0,541.5" fill="#666"/><text x="500.0" y="539" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">formato da folha</text></g>
<text x="12" y="572" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
