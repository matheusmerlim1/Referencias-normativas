<g id="cota-batimento" class="cota"><line class="d" x1="546" y1="134" x2="546" y2="160" marker-end="url(#a)"/><line class="d" x1="546" y1="196" x2="546" y2="170" marker-end="url(#a)"/><line class="d" x1="546" y1="160" x2="546" y2="170"/><text x="560" y="150">batimento</text></g>
<line class="d" x1="700" y1="270" x2="760" y2="270" marker-end="url(#a)"/>
<text class="n" x="700" y="290">peça gira em torno do eixo</text>
<text class="n" x="20" y="408">Esquema ilustrativo, fora de escala (não é desenho da norma) — só rótulos; os valores estão na ficha</text>
