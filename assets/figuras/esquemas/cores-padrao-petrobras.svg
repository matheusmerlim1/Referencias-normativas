<text x="500" y="640" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Tons aproximados para tela — a referência é a notação Munsell (preferencial) / RAL da tabela da norma; não usar esta figura para conferir cor.</text>
<text x="500" y="656" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Púrpura = violeta; "marrom canalizações" = marrom; "creme canalizações" = creme.</text>
