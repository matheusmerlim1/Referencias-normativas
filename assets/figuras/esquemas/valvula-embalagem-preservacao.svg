<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Embalagem e preservação de válvulas">
<title>Embalagem e preservação de válvulas (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Embalagem e preservação de válvulas</text>
<text class="b" x="20" y="62">(a) Válvula flangeada pequena com tampões</text>
<rect class="s" x="150" y="150" width="120" height="70"/>
<rect class="wd" x="130" y="135" width="20" height="100"/>
<rect class="wd" x="270" y="135" width="20" height="100"/>
<rect class="sl" x="195" y="90" width="30" height="60"/>
<rect class="s" x="175" y="80" width="70" height="10"/>
<rect class="r" x="120" y="145" width="10" height="80"/>
<rect class="r" x="290" y="145" width="10" height="80"/>
<g id="cota-tampao" class="cota"><line class="e" x1="290" y1="145" x2="330" y2="120"/><text x="334" y="118">tampão plástico (marcado)</text></g>
<g id="cota-dn" class="cota"><line class="d" x1="150" y1="250" x2="270" y2="250" marker-start="url(#a)" marker-end="url(#a)"/><text x="170" y="272">DN da válvula</text></g>
<g id="cota-pelicula" class="cota"><line class="e" x1="150" y1="165" x2="96" y2="110"/><text x="20" y="104">graxa ou película protetora</text></g>
<text class="b" x="500" y="62">(b) Válvula grande: placa + tábuas</text>
<rect class="s" x="560" y="150" width="160" height="80"/>
<rect class="wd" x="540" y="130" width="20" height="120"/>
<rect class="wd" x="720" y="130" width="20" height="120"/>
<rect class="bl" x="534" y="130" width="6" height="120"/>
<rect class="bl" x="740" y="130" width="6" height="120"/>
<g id="cota-tabua" class="cota"><rect class="r" x="520" y="250" width="26" height="70"/><rect class="r" x="734" y="250" width="26" height="70"/><text x="560" y="345">tábuas aparafusadas aos flanges</text></g>
<text class="n" x="760" y="190">placa de borracha/filme</text>
<line class="g" x1="500" y1="320" x2="800" y2="320"/>
<text class="b" x="20" y="370">(c) Armazenamento no canteiro</text>
<path class="sl" d="M40,400 L420,400 L420,410 L40,410 Z"/>
<text class="n" x="150" y="394">cobertura</text>
<rect class="s" x="80" y="470" width="80" height="50"/>
<rect class="sl" x="74" y="520" width="92" height="12"/>
<rect class="s" x="200" y="470" width="80" height="50"/>
<rect class="sl" x="194" y="520" width="92" height="12"/>
<rect class="s" x="320" y="470" width="80" height="50"/>
<rect class="sl" x="314" y="520" width="92" height="12"/>
<line class="g" x1="30" y1="560" x2="440" y2="560"/>
<rect x="30" y="560" width="410" height="10" fill="url(#hach)"/>
<g id="cota-afastamento-piso" class="cota"><line class="d" x1="190" y1="532" x2="190" y2="560" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="180" y1="532" x2="206" y2="532"/><text class="n b" x="196" y="552">afastamento do piso</text></g>
<text class="n" x="40" y="590">piso pavimentado e drenado</text>
<text class="n" x="20" y="628">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
