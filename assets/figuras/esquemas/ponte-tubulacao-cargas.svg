<circle class="sl" cx="500" cy="600" r="12"/>
<g id="cota-diametro" class="cota"><text class="n b" x="300" y="560">linhas menores → diâmetro médio</text><text class="n" x="300" y="640">linhas grandes → cargas individuais</text></g>
<text class="n" x="20" y="698">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
