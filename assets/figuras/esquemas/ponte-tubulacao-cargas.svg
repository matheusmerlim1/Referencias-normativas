<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" role="img" aria-label="Ponte de tubulação — cargas de pré-dimensionamento">
<title>Ponte de tubulação — cargas de pré-dimensionamento (esquema ilustrativo)</title>
<style>
