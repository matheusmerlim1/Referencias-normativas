<g id="cota-elevacao" class="cota"><line class="d" x1="480" y1="164" x2="480" y2="420" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="436" y1="164" x2="486" y2="164"/><line class="e" x1="436" y1="300" x2="476" y2="300"/><text class="n b" x="300" y="300">elevação dos tubos</text><text class="n" x="300" y="318">(tubovia × ponte)</text></g>
<text class="b" x="560" y="62">(b) Vista longitudinal</text>
