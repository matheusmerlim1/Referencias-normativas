<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Apresentação de projeto de tubulação — isométrico e planta">
<title>Apresentação de projeto de tubulação — isométrico e planta (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Apresentação de projeto de tubulação — isométrico e planta</text>
<text class="b" x="20" y="62">(a) Isométrico de uma linha</text>
<line class="h" x1="120" y1="430" x2="293.205" y2="330"/>
<line class="e" x1="120" y1="430" x2="240" y2="430"/>
<g id="cota-angulo-iso" class="cota"><path class="d" d="M190.0,430.0 A70,70 0 0,0 180.6,395.0" marker-start="url(#a)" marker-end="url(#a)"/><text x="200" y="460">inclinação das horizontais</text></g>
<path class="p" d="M120,430 L293,330 L293,240 L388,185"/>
<path class="p" d="M207,380 L155,350"/>
<rect class="w" x="148.641" y="344" width="12" height="12"/>
<g id="cota-tomada" class="cota"><line class="d" x1="212.603" y1="390" x2="160.641" y2="360" marker-start="url(#a)" marker-end="url(#a)"/><line class="e" x1="176.603" y1="350" x2="146.603" y2="290"/><text class="n b" x="30" y="330">comprimento da tomada tamponada</text></g>
<text class="n" x="303.205" y="270">vertical</text>
<text class="b" x="470" y="62">(b) Representação em planta</text>
<line class="p" x1="490" y1="130" x2="700" y2="130"/>
<text class="n" x="710" y="135">tubo pequeno: traço único</text>
<line class="g" x1="490" y1="190" x2="700" y2="190"/>
<line class="g" x1="490" y1="220" x2="700" y2="220"/>
<line class="c" x1="480" y1="205" x2="710" y2="205"/>
<text class="n" x="710" y="210">tubo grande: dois traços</text>
<g id="cota-traco" class="cota"><line class="e" x1="700" y1="190" x2="730" y2="175"/><text class="n b" x="600" y="252">limite de diâmetro entre os dois modos</text></g>
<text class="b" x="470" y="300">(c) Folha de isométrico</text>
<rect class="w" x="500" y="320" width="280" height="198"/>
<rect class="sl" x="680" y="480" width="100" height="38"/>
<text class="n" x="690" y="503">legenda</text>
<g id="cota-folha" class="cota"><line class="d" x1="500" y1="540" x2="780" y2="540" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="560" y="560">largura × altura do formato</text><line class="d" x1="800" y1="320" x2="800" y2="518" marker-start="url(#a)" marker-end="url(#a)"/></g>
<text class="n" x="20" y="608">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
