<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Tinta — painel do ensaio cíclico (entalhe) e ensaio de descolamento catódico">
<title>Tinta — painel do ensaio cíclico (entalhe) e ensaio de descolamento catódico (esquema ilustrativo)</title>
<text x="12" y="22" text-anchor="start" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Tinta — painel do ensaio cíclico (entalhe) e ensaio de descolamento catódico</text>
<text x="220" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(a) painel do ensaio cíclico</text>
<rect x="60" y="90" width="320" height="220" fill="#8a8" fill-opacity="0.35" stroke="#666" stroke-width="1.5"/>
<rect x="130" y="240" width="170" height="10" fill="#a52" fill-opacity="0.8" stroke="#666" stroke-width="1.5"/>
<g id="cota-entalhe-comprimento" class="cota"><line x1="130" y1="250" x2="130" y2="220" stroke="#666" stroke-width="1"/><line x1="300" y1="250" x2="300" y2="220" stroke="#666" stroke-width="1"/><line x1="130" y1="220" x2="300" y2="220" stroke="#666" stroke-width="1.2"/><polygon points="130.0,220.0 139.0,223.5 139.0,216.5" fill="#666"/><polygon points="300.0,220.0 291.0,216.5 291.0,223.5" fill="#666"/><text x="215" y="204" text-anchor="middle" font-size="12.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">comprimento do entalhe</text></g>
<g id="cota-entalhe-largura" class="cota"><line x1="300" y1="240" x2="340" y2="240" stroke="#666" stroke-width="1"/><line x1="300" y1="250" x2="340" y2="250" stroke="#666" stroke-width="1"/><line x1="340" y1="240" x2="340" y2="250" stroke="#666" stroke-width="1.2"/><polygon points="340.0,240.0 336.5,249.0 343.5,249.0" fill="#666"/><polygon points="340.0,250.0 343.5,241.0 336.5,241.0" fill="#666"/><text x="348" y="232" text-anchor="start" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">largura</text></g>
<g id="cota-entalhe-borda-menor" class="cota"><line x1="60" y1="245" x2="60" y2="245" stroke="#666" stroke-width="1"/><line x1="130" y1="245" x2="130" y2="245" stroke="#666" stroke-width="1"/><line x1="60" y1="245" x2="130" y2="245" stroke="#666" stroke-width="1.2"/><polygon points="60.0,245.0 69.0,248.5 69.0,241.5" fill="#666"/><polygon points="130.0,245.0 121.0,241.5 121.0,248.5" fill="#666"/><text x="95" y="225" text-anchor="middle" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">≥ dist. borda menor</text></g>
<g id="cota-entalhe-borda-maior" class="cota"><line x1="280" y1="250" x2="280" y2="250" stroke="#666" stroke-width="1"/><line x1="280" y1="310" x2="280" y2="310" stroke="#666" stroke-width="1"/><line x1="280" y1="250" x2="280" y2="310" stroke="#666" stroke-width="1.2"/><polygon points="280.0,250.0 276.5,259.0 283.5,259.0" fill="#666"/><polygon points="280.0,310.0 283.5,301.0 276.5,301.0" fill="#666"/><text x="290" y="290" text-anchor="start" font-size="10.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">≥ dist. borda maior</text></g>
<g id="cota-avanco-corrosao" class="cota"><line x1="180" y1="248" x2="220" y2="126" stroke="#666" stroke-width="1"/><circle cx="180" cy="248" r="3" fill="#666"/><text x="220" y="130" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">avanço de corrosão sob o entalhe (após os ciclos)</text></g>
<text x="220" y="340" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">bordas e verso protegidos</text>
<text x="220" y="390" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(b) um ciclo semanal (repetido N vezes)</text>
<rect x="60" y="410" width="140" height="40" fill="#cc9" fill-opacity="0.7" stroke="#666" stroke-width="1.5"/>
<text x="130.0" y="435" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">UV + condensação</text>
<rect x="200" y="410" width="140" height="40" fill="#9bd" fill-opacity="0.7" stroke="#666" stroke-width="1.5"/>
<text x="270.0" y="435" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">névoa salina neutra</text>
<rect x="340" y="410" width="60" height="40" fill="#ccc" fill-opacity="0.7" stroke="#666" stroke-width="1.5"/>
<text x="370.0" y="435" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">frio</text>
<g id="cota-ciclo" class="cota"><line x1="220" y1="450" x2="220" y2="476" stroke="#666" stroke-width="1"/><circle cx="220" cy="450" r="3" fill="#666"/><text x="220" y="480" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">duração de cada etapa e nº de ciclos: ver resumo</text></g>
<text x="720" y="50" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">(c) descolamento catódico (ASTM G8)</text>
<rect x="560" y="300" width="320" height="24" fill="#999" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<rect x="560" y="286" width="320" height="14" fill="#8a8" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<rect x="714" y="286" width="12" height="14" fill="#fff" fill-opacity="1" stroke="#666" stroke-width="1"/>
<g id="cota-furo-descolamento" class="cota"><line x1="714" y1="286" x2="714" y2="246" stroke="#666" stroke-width="1"/><line x1="726" y1="286" x2="726" y2="246" stroke="#666" stroke-width="1"/><line x1="714" y1="246" x2="726" y2="246" stroke="#666" stroke-width="1.2"/><polygon points="714.0,246.0 723.0,249.5 723.0,242.5" fill="#666"/><polygon points="726.0,246.0 717.0,242.5 717.0,249.5" fill="#666"/><text x="720" y="236" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Ø do furo (holiday)</text></g>
<path d="M660,300 L660,292 Q720,282 780,292 L780,300 Z" fill="#a52" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<g id="cota-raio-descolamento" class="cota"><line x1="720" y1="330" x2="720" y2="330" stroke="#666" stroke-width="1"/><line x1="780" y1="330" x2="780" y2="330" stroke="#666" stroke-width="1"/><line x1="720" y1="330" x2="780" y2="330" stroke="#666" stroke-width="1.2"/><polygon points="720.0,330.0 729.0,333.5 729.0,326.5" fill="#666"/><polygon points="780.0,330.0 771.0,326.5 771.0,333.5" fill="#666"/><text x="760" y="352" text-anchor="middle" font-size="11" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">descolamento (raio)</text></g>
<line x1="720" y1="300" x2="720" y2="335" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="780" y1="300" x2="780" y2="335" stroke="#666" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="600" y="80" width="240" height="120" fill="#9cf" fill-opacity="0.15" stroke="#666" stroke-width="1.5"/>
<text x="720" y="100" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">eletrólito (NaCl + Na₂SO₄ + Na₂CO₃)</text>
<rect x="800" y="120" width="20" height="60" fill="#666" fill-opacity="0.5" stroke="#666" stroke-width="1.5"/>
<text x="810" y="115" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">anodo Mg / corrente impressa</text>
<circle cx="640" cy="150" r="10" fill="#c96" fill-opacity="0.6" stroke="#666" stroke-width="1.5"/>
<text x="640" y="175" text-anchor="middle" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ref. Cu/CuSO₄</text>
<text x="720" y="380" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">potencial imposto ao painel; após o ensaio mede-se o</text>
<text x="720" y="395" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">descolamento a partir da borda do furo</text>
<text x="12" y="552" text-anchor="start" font-size="11.5" font-family="Arial, Helvetica, sans-serif" fill="#333" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Esquema ilustrativo (não é desenho da norma) — sem escala.</text>
</svg>
