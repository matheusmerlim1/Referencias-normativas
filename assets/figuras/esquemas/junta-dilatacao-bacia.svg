<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Junta de dilatação em bacia de contenção de concreto">
<title>Junta de dilatação em bacia de contenção de concreto (esquema ilustrativo)</title>
<style>
  .g{fill:none;stroke:#666;stroke-width:2.2}
  .s{fill:#8c8c8c;fill-opacity:.35;stroke:#666;stroke-width:2}
  .sl{fill:#8c8c8c;fill-opacity:.18;stroke:#666;stroke-width:1.6}
  .bl{fill:#5d8fc9;fill-opacity:.25;stroke:#4a77a8;stroke-width:1.6}
  .r{fill:#c0392b;fill-opacity:.25;stroke:#b03a2e;stroke-width:2}
  .wd{fill:#555;fill-opacity:.55;stroke:#444;stroke-width:1.6}
  .d{fill:none;stroke:#666;stroke-width:1.2}
  .e{fill:none;stroke:#666;stroke-width:.9}
  .c{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:12 4 2 4}
  .h{fill:none;stroke:#666;stroke-width:1.1;stroke-dasharray:6 4}
  .v{fill:none;stroke:#b03a2e;stroke-width:1.6}
  .w{fill:#fff;stroke:#666;stroke-width:2}
  .p{fill:none;stroke:#4a77a8;stroke-width:3}
  text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333;stroke:#fff;stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
  .t{font-size:17px;font-weight:bold}
  .n{font-size:13px}
  .b{font-weight:bold}
  .m{text-anchor:middle}
  .en{text-anchor:end}
  .cota text{font-weight:bold}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#666"/></marker>
<pattern id="hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1"/></pattern></defs>

<text class="t" x="20" y="28">Junta de dilatação em bacia de contenção de concreto</text>
<text class="b" x="20" y="62">(a) Bacia de contenção (planta)</text>
<rect class="sl" x="60" y="90" width="360" height="240"/>
<rect class="w" x="80" y="110" width="320" height="200"/>
<circle class="s" cx="240" cy="210" r="70"/>
<text class="n" x="220" y="215">tanque</text>
<line class="v" x1="180" y1="84" x2="180" y2="116"/>
<line class="v" x1="300" y1="84" x2="300" y2="116"/>
<line class="v" x1="180" y1="304" x2="180" y2="316"/>
<line class="v" x1="300" y1="304" x2="300" y2="316"/>
<text class="n" x="430" y="110">juntas de dilatação no dique (posição pelo projeto)</text>
<text class="b" x="20" y="380">(b) Junta composta — corte do piso</text>
<rect class="sl" x="60" y="420" width="180" height="80"/>
<rect class="sl" x="256" y="420" width="180" height="80"/>
<rect class="r" x="240" y="420" width="16" height="10"/>
<text class="n" x="270" y="412">selante químico</text>
<rect class="wd" x="240" y="430" width="16" height="10"/>
<text class="n" x="270" y="446">selante corta-fogo</text>
<rect class="bl" x="242" y="460" width="12" height="30"/>
<text class="n" x="270" y="486">perfil de PVC / limitador</text>
<text class="b" x="480" y="380">(c) Junta com chapa de cobre — corte</text>
<rect class="sl" x="500" y="420" width="150" height="90"/>
<rect class="sl" x="670" y="420" width="150" height="90"/>
<path class="v" d="M600,470 L650,470 L650,490 Q660,505 670,490 L670,470 L720,470"/>
<g id="cota-chapa-cobre" class="cota"><line class="e" x1="600" y1="470" x2="600" y2="540"/><line class="e" x1="720" y1="470" x2="720" y2="540"/><line class="d" x1="600" y1="532" x2="720" y2="532" marker-start="url(#a)" marker-end="url(#a)"/><text class="n b" x="590" y="556">largura da chapa de cobre recozido</text></g>
<text class="n" x="680" y="412">armadura não toca a chapa</text>
<text class="n" x="20" y="588">Esquema ilustrativo (não é desenho da norma) — sem escala. Só rótulos; os valores estão na ficha.</text>
</svg>
